  /api/v1/logo:
    get:
      operationId: serveLogo
      summary: Fetch the site logo.
      description: >-
        The stored logo, a PNG no larger than 320 by 64 pixels, served with a
        five-minute public cache and a stricter Content-Security-Policy than the
        rest of the site. Public, so the sign-in page can show it before anyone
        signs in. The server ignores the v query parameter that the SPA appends for
        cache-busting. With no logo stored, the answer is a plain-text 404 with the
        body 404 page not found, not the JSON error envelope.
      tags: ['Site']
      x-ghd-handler: handleServeLogo
      security: []
      responses:
        '200':
          description: The logo image.
          headers:
            Cache-Control:
              description: public, max-age=300.
              schema:
                type: string
            Content-Security-Policy:
              description: The logo policy, stricter than the site-wide one.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: No logo is stored. Plain text body 404 page not found.
          content:
            text/plain:
              schema:
                type: string
  /api/v1/setup:
    post:
      operationId: setup
      summary: Create the first administrator account.
      description: >-
        Creates the first administrator and, if no category exists, the first
        category. The category name is taken from the optional category field and
        is called General when the field is blank or absent. Public, and permanently
        refused with 409 once any user exists. The category is created before the
        administrator, so a failure between the two can be retried. Returns the new
        user without its password hash.
      tags: ['Setup']
      x-ghd-handler: handleSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name, password]
              properties:
                email:
                  type: string
                  description: The administrator's email address.
                display_name:
                  type: string
                  description: The administrator's display name. Must not be blank.
                password:
                  type: string
                  description: The administrator's password. Between 8 and 72 bytes.
                category:
                  type: string
                  description: The name of the first category. Optional, used only when no category exists yet.
      responses:
        '201':
          description: The administrator was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Setup has already been completed (already_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/setup/status:
    get:
      operationId: setupStatus
      summary: Say whether first-run setup is still needed.
      description: Public. Answers needed true until the first user exists.
      tags: ['Setup']
      x-ghd-handler: handleSetupStatus
      security: []
      responses:
        '200':
          description: The setup state.
          content:
            application/json:
              schema:
                type: object
                required: [needed]
                properties:
                  needed: {type: boolean}
  /api/v1/site:
    get:
      operationId: getSiteConfig
      summary: Read the public site branding and version.
      description: >-
        The name, logo URL and version shown before sign-in, and whether guests may
        submit tickets. Public.
      tags: ['Site']
      x-ghd-handler: handleGetSiteConfig
      security: []
      responses:
        '200':
          description: The public site settings.
          content:
            application/json:
              schema:
                type: object
                required: [name, logo_url, version, guest_submission_enabled]
                properties:
                  name:
                    type: string
                    description: The site name. Defaults to Go Help Desk.
                  logo_url:
                    type: string
                    description: The URL of the logo, or the empty string when none is stored.
                  version:
                    type: string
                    description: The server version.
                  guest_submission_enabled:
                    type: boolean
  /health:
    get:
      operationId: health
      summary: Liveness probe.
      description: Outside /api/v1. Answers 200 whenever the process is serving requests, and does not check the database.
      tags: ['Health']
      x-ghd-handler: handleHealth
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /api/v1/admin/canned-responses:
    get:
      operationId: adminListCannedResponses
      summary: List every canned response.
      description: |
        Administrators only (second factor required).
        Returns every canned response, global and scoped alike, ordered by sort_order and then by name.
        The list is not paged.
      tags: ['Admin: Canned responses']
      x-ghd-handler: handleAdminListCannedResponses
      security:
        - sessionCookie: []
        - apiKey: ['canned_responses:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every canned response.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CannedResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The list could not be read (list_failed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      operationId: adminCreateCannedResponse
      summary: Create a canned response.
      description: |
        Administrators only (second factor required).
        Creates a reusable reply template. Its scope comes from category_id and type_id. When both are
        absent or null the response is global. A category_id alone makes it available on every ticket in
        that category. Both together make it available only on tickets of that category and type. A type_id
        without a category_id is refused with 400.
        name and body are trimmed and must not be blank. sort_order must fit in a 32-bit integer. A
        category_id or type_id that names nothing, or a type_id that does not belong to its category, is
        refused by the database and answered with 500 internal_error, not with 400 or 404.
      tags: ['Admin: Canned responses']
      x-ghd-handler: handleAdminCreateCannedResponse
      security:
        - sessionCookie: []
        - apiKey: ['canned_responses:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, body]
              properties:
                name:
                  type: string
                  description: Short label shown in the reply composer picker.
                body:
                  type: string
                  description: Text inserted verbatim into a reply.
                category_id:
                  description: Category the response is scoped to. Omit or null for a global response.
                  anyOf:
                    - {$ref: '#/components/schemas/Uuid'}
                    - {type: 'null'}
                type_id:
                  description: Type the response is scoped to. Requires category_id. Omit or null for the whole category.
                  anyOf:
                    - {$ref: '#/components/schemas/Uuid'}
                    - {type: 'null'}
                sort_order:
                  type: integer
                  default: 0
                  description: Position in the picker. Lower sorts first. Omitted means 0.
      responses:
        '201':
          description: The response as stored, including its created_at.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CannedResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The database refused the row, for example an unknown category_id or type_id (internal_error).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/canned-responses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The canned response's UUID.
        schema:
          type: string
          format: uuid
    patch:
      operationId: adminUpdateCannedResponse
      summary: Replace a canned response.
      description: |
        Administrators only (second factor required).
        Replaces every field of the response. Despite the verb this is not a merge. A field left out of the
        body takes its zero value, so an omitted category_id or type_id makes the response global and an
        omitted sort_order sets it to 0. Send the complete record.
        The same rules as create apply to name, body, scope and sort_order. An id that names no response
        answers 404 not_found, and the check happens after the body is validated.
      tags: ['Admin: Canned responses']
      x-ghd-handler: handleAdminUpdateCannedResponse
      security:
        - sessionCookie: []
        - apiKey: ['canned_responses:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, body]
              properties:
                name:
                  type: string
                  description: Short label shown in the reply composer picker.
                body:
                  type: string
                  description: Text inserted verbatim into a reply.
                category_id:
                  description: Category the response is scoped to. Omit or null for a global response.
                  anyOf:
                    - {$ref: '#/components/schemas/Uuid'}
                    - {type: 'null'}
                type_id:
                  description: Type the response is scoped to. Requires category_id. Omit or null for the whole category.
                  anyOf:
                    - {$ref: '#/components/schemas/Uuid'}
                    - {type: 'null'}
                sort_order:
                  type: integer
                  default: 0
                  description: Position in the picker. Lower sorts first. Omitted means 0.
      responses:
        '200':
          description: The response as stored after the update.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CannedResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The database refused the row, for example an unknown category_id or type_id (internal_error).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: adminDeleteCannedResponse
      summary: Delete a canned response.
      description: |
        Administrators only (second factor required).
        Hard-deletes the response. Replies that already contain its text are not affected, because the body
        was copied into the reply when it was inserted. Deleting an id that does not exist also answers 204.
      tags: ['Admin: Canned responses']
      x-ghd-handler: handleAdminDeleteCannedResponse
      security:
        - sessionCookie: []
        - apiKey: ['canned_responses:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The delete failed in storage (delete_failed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/tags:
    get:
      operationId: adminListTags
      summary: List every tag, including deactivated ones.
      description: |
        Administrators only (second factor required).
        Returns all tags, active and deactivated, ordered by name. A deactivated tag carries deleted_at.
        The list is not paged.
      tags: ['Admin: Tags']
      x-ghd-handler: handleAdminListTags
      security:
        - sessionCookie: []
        - apiKey: ['tags:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every tag.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Tag'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The list could not be read (list_failed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      operationId: adminCreateTag
      summary: Create a tag by name.
      description: |
        Administrators only (second factor required).
        The name is trimmed and lowercased. If an active tag already has that name, that tag is returned
        with 201 and nothing new is created, so a repeated name is not a conflict. If the name belongs to a
        deactivated tag, the answer is 409 tag_deleted, and the tag has to be restored instead.
      tags: ['Admin: Tags']
      x-ghd-handler: handleAdminCreateTag
      security:
        - sessionCookie: []
        - apiKey: ['tags:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Tag name. Trimmed and lowercased; must not be blank.
      responses:
        '201':
          description: The tag. Either newly created or the active tag that already had this name.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tag'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A deactivated tag with this name exists. Restore it instead (tag_deleted).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: The tag could not be created or read back (internal_error).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/tags/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The tag's UUID.
        schema:
          type: string
          format: uuid
    delete:
      operationId: adminDeleteTag
      summary: Deactivate a tag.
      description: |
        Administrators only (second factor required).
        Soft-deletes the tag. It disappears from autocomplete and stays on every ticket that already carries
        it. Deactivating an unknown or already deactivated id also answers 204.
      tags: ['Admin: Tags']
      x-ghd-handler: handleAdminDeleteTag
      security:
        - sessionCookie: []
        - apiKey: ['tags:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The deactivation failed in storage (delete_failed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/tags/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        description: The tag's UUID.
        schema:
          type: string
          format: uuid
    post:
      operationId: adminRestoreTag
      summary: Restore a deactivated tag.
      description: |
        Administrators only (second factor required).
        Clears the deactivation, so the tag is usable again. Restoring an unknown id, or a tag that is already
        active, also answers 204.
      tags: ['Admin: Tags']
      x-ghd-handler: handleAdminRestoreTag
      security:
        - sessionCookie: []
        - apiKey: ['tags:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The restore failed in storage (restore_failed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/groups:
    get:
      operationId: listGroupsForAssignment
      summary: List groups for ticket assignment.
      description: |
        Staff and administrators only (second factor required).
        Returns every group with its name and description, so a ticket can be assigned to one. Membership
        and category scopes are not included; those come from the admin group endpoints. Not paged.
      tags: ['Reference data']
      x-ghd-handler: handleListGroups
      security:
        - sessionCookie: []
        - apiKey: ['groups:read']
        - oauthClient: ['groups:read']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every group.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Group'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/guest/follow-up:
    post:
      operationId: guestFollowUp
      summary: Open a follow-up of the closed ticket the link names.
      description: |
        Creates a new ticket for the same guest, linked to the closed ticket that the token names, and
        answers with the new tracking number. The new ticket is filed under the same category as the
        original. Its type and item are not copied, and the body is ignored, so there is nothing to send.
        The link for the new ticket goes out by email and is not in the response.
        Only one follow-up can be opened from a closed ticket. Every refusal that would reveal the state of a
        link or a ticket is the same 404 not_found, including a ticket that is still open, a follow-up that
        already exists, and guest submission being switched off. An archived category answers 400 and names
        the reason. The per-client-address submission budget applies, and it is shared with POST /guest/tickets.
      tags: ['Guest']
      x-ghd-handler: handleGuestFollowUp
      security:
        - guestToken: []
      responses:
        '201':
          description: The new ticket's tracking number.
          content:
            application/json:
              schema:
                type: object
                required: [tracking_number]
                properties:
                  tracking_number: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/GuestNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/guest/replies:
    post:
      operationId: guestAddReply
      summary: Add a reply to the guest's ticket.
      description: |
        Adds the guest's reply to the ticket the token names. The body must not be blank. The reply has no
        author, is never internal, and is not mailed back to the guest. Staff see it in the thread.
        A reply to a Resolved ticket inside the reopen window reopens the ticket to the configured reopen
        status. If no valid reopen status is configured, that reply is refused with 400 bad_request. A closed
        ticket answers 404, the same as a bad token. A Resolved ticket past its reopen window answers 409
        reopen_window_closed. Answers 404 when guest submission is disabled, suspending all guest links until
        the setting is enabled again.
      tags: ['Guest']
      x-ghd-handler: handleGuestAddReply
      security:
        - guestToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  description: The reply text. Must not be blank after trimming.
      responses:
        '201':
          description: The reply as stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountGuestReply'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/GuestNotFound'
        '409':
          description: The ticket is Resolved and its reopen window has closed (reopen_window_closed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/guest/resend:
    post:
      operationId: guestResend
      summary: Ask for a fresh guest link by email.
      description: |
        Asks for a new link to a ticket, given its tracking number and the address it was submitted with.
        While guest submission is on, an empty body or any JSON body within the request budget answers 202 with an empty body,
        whether or not anything matched, so the answer does not reveal whether a tracking number or an address exists. Matching
        happens later, when the email is prepared. Both fields are needed for any work to be queued.
        On an open ticket the new link replaces the previous one. On a closed ticket it is added beside the
        existing links, and it can only read. The request is charged against a per-client-address budget. A
        per-ticket budget is charged when the email is prepared, and a request that exceeds it sends nothing.
      tags: ['Guest']
      x-ghd-handler: handleGuestResend
      security: []
      requestBody:
        required: false
        description: A JSON object, or no body at all, which counts as {}. Text that is not JSON is refused with 400 bad_request.
        content:
          application/json:
            schema:
              type: object
              properties:
                tracking_number:
                  type: string
                  description: The ticket's tracking number. Trimmed.
                email:
                  type: string
                  description: The address the ticket was submitted with. Trimmed.
      responses:
        '202':
          description: Accepted. The body is empty.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Guest submission is switched off (not_found).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/guest/ticket:
    get:
      operationId: guestGetTicket
      summary: Read the guest's ticket and its replies.
      description: |
        Returns the ticket the token names, as the guest may see it. Assignee, group, reporter and resolution
        data are not included. Only replies the guest may see are included, with their author removed.
        from_you is true for the guest's own replies.
        A closed ticket can still be read. Closing stops links being rotated but does not revoke them, so
        the last link sent reads the archive until that link expires.

        Answers 404 when guest submission is disabled, suspending all guest links until the setting is enabled again.
      tags: ['Guest']
      x-ghd-handler: handleGuestGetTicket
      security:
        - guestToken: []
      responses:
        '200':
          description: The ticket view.
          content:
            application/json:
              schema:
                type: object
                required: [tracking_number, subject, description, status, created_at, replies]
                properties:
                  tracking_number: {type: string}
                  subject: {type: string}
                  description: {type: string}
                  status:
                    type: string
                    description: The name of the ticket's current status. Empty if the status cannot be found.
                  created_at: {type: string, format: date-time}
                  replies:
                    type: array
                    items: {$ref: '#/components/schemas/AccountGuestReply'}
        '404':
          $ref: '#/components/responses/GuestNotFound'
  /api/v1/guest/tickets:
    post:
      operationId: guestCreateTicket
      summary: Submit a ticket without an account.
      description: |
        Opens a ticket for a guest. Answers 404 not_found while guest submission is switched off.
        subject is required and is limited to 500 bytes. description is limited to 50,000 bytes. category_id
        must name an active category that is open to guests. guest_email is required and must be a plain
        address without a display name. guest_name is required. guest_phone is optional. Priority is always
        medium and cannot be set by a guest.
        The response carries only the tracking number. The access link is emailed to guest_email, so a guest
        proves ownership of the address by using the link. The per-client-address budget is shared with
        POST /guest/follow-up.
      tags: ['Guest']
      x-ghd-handler: handleGuestCreateTicket
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, category_id, guest_email, guest_name]
              properties:
                subject:
                  type: string
                  description: One-line summary. Must not be blank; at most 500 bytes.
                description:
                  type: string
                  description: Free text. At most 50,000 bytes.
                category_id: {$ref: '#/components/schemas/Uuid'}
                guest_email:
                  type: string
                  description: Address to send the link to. Must be a valid address and is stored lowercased.
                guest_name:
                  type: string
                  description: The guest's name. Trimmed; must not be blank.
                guest_phone:
                  type: string
                  description: Optional phone number. Trimmed.
      responses:
        '201':
          description: The tracking number of the new ticket.
          content:
            application/json:
              schema:
                type: object
                required: [tracking_number]
                properties:
                  tracking_number: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Guest submission is switched off (not_found).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me:
    get:
      operationId: getMe
      summary: Return the caller's own account.
      description: |
        Returns the signed-in account. An API key answers with its owner's account. An OAuth client is not a
        person, so it answers with machine set to true, together with its role and its scopes. A session must
        have passed its second factor.
      tags: ['Account']
      x-ghd-handler: handleGetMe
      security:
        - sessionCookie: []
        - apiKey: []
        - oauthClient: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: The caller's account, or the identity of an OAuth client.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/User'}
                  - type: object
                    required: [machine, role, scopes]
                    properties:
                      machine: {type: boolean, enum: [true]}
                      role: {$ref: '#/components/schemas/Role'}
                      scopes:
                        type: [array, 'null']
                        items: {type: string}
                        description: The scopes the token carries. JSON null when the token has none.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/api-keys:
    get:
      operationId: listMyAPIKeys
      summary: List the caller's own API keys.
      description: |
        Staff and administrators only, in a signed-in session (second factor required).
        The caller's own keys, newest first, including ones an administrator issued for them
        (created_by says who). The token and its hash are never returned. Not gated by
        staff_can_create_api_keys: listing and revoking only ever remove access. An API key
        or OAuth client is refused with 403 session_required, because a key that could manage
        keys would outlive its own revocation. Requesters have no keys of their own to manage
        here; an administrator issues one for them with POST /admin/api-keys.
      tags: ['Account']
      x-ghd-handler: handleListMyAPIKeys
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      responses:
        '200':
          description: The caller's keys. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createMyAPIKey
      summary: Create an API key for the caller.
      description: |
        Staff and administrators only, in a signed-in session (second factor required).
        Creates a key owned by the caller, which acts as the caller. An administrator may always;
        staff only while the staff_can_create_api_keys setting is on (403 api_keys_not_allowed
        otherwise). The raw token is returned once. scopes is required and may not exceed the
        caller's role: see GET /me/api-keys/scopes (invalid_scope otherwise). expires_at is
        required unless the api_key_max_lifetime_years setting is Never (-1): 400
        expires_at_required without it, and it must be a future RFC 3339 timestamp no later
        than that many years from now (400 expires_at_too_far). user_id is refused
        (bad_request): this route always issues for the caller. Issuing is audited (entity_type
        api_key, action api_key_issued). An API key or OAuth client is refused with 403
        session_required.
      tags: ['Account']
      x-ghd-handler: handleCreateMyAPIKey
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                name:
                  type: string
                  description: A label for the key. Not validated.
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    pattern: '^[a-z_]+:(read|write)$'
                expires_at:
                  type: [string, 'null']
                  description: >-
                    RFC 3339 expiry in the future and no later than api_key_max_lifetime_years
                    from now (2 years by default; GET /me reports the figure). Required while
                    there is a limit (400 expires_at_required, 400 expires_at_too_far). Omitted,
                    null or empty means the key never expires, and is accepted only when the
                    setting is Never (-1).
      responses:
        '201':
          description: Created. The token is shown only in this response.
          content:
            application/json:
              schema:
                type: object
                required: [id, token, name, expires_at, user_id, created_by]
                properties:
                  id: {$ref: '#/components/schemas/Uuid'}
                  token:
                    type: string
                    description: The raw key, GHD_ followed by 64 hexadecimal characters. Shown once.
                  name: {type: string}
                  expires_at:
                    type: [string, 'null']
                    format: date-time
                  user_id: {$ref: '#/components/schemas/Uuid'}
                  created_by: {$ref: '#/components/schemas/Uuid'}
        '400':
          description: >-
            bad_request (a body that does not decode, or user_id present), scopes_required,
            invalid_scope (not a catalogue scope, or one the caller's role cannot use),
            invalid_expires_at, expires_at_required, expires_at_too_far (the message names
            the limit).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Two sources. The authentication middleware refuses with text/plain: forbidden (a
            requester), mfa_required, session_required (a machine credential). The handler
            refuses with application/json: api_keys_not_allowed, for staff while
            staff_can_create_api_keys is off.
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/me/api-keys/scopes:
    get:
      operationId: listMyAPIKeyScopes
      summary: List the scopes the caller's role can put on a key.
      description: |
        Staff and administrators only, in a signed-in session (second factor required).
        The scopes POST /me/api-keys accepts for this caller: the whole catalogue for an
        administrator, tickets, groups:read, audit:read and users:read (the requester lookup) for staff. A key acts at its
        owner's role, so a scope outside that role would only look like access it does not have.
      tags: ['Account']
      x-ghd-handler: handleListMyAPIKeyScopes
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      responses:
        '200':
          description: The scopes, as GET /admin/scopes lists them.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [scope, resource, action]
                  properties:
                    scope: {type: string}
                    resource: {type: string}
                    action: {type: string, enum: [read, write]}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/api-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The API key's id, as listed by GET /me/api-keys.
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteMyAPIKey
      summary: Revoke one of the caller's own API keys.
      description: |
        Staff and administrators only, in a signed-in session (second factor required).
        Deletes a key the caller owns; it stops working on the next request. Someone else's key
        answers the same 404 as an id that does not exist. Not gated by
        staff_can_create_api_keys. Audited (entity_type api_key, action api_key_revoked).
      tags: ['Account']
      x-ghd-handler: handleDeleteMyAPIKey
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/email-preferences:
    patch:
      operationId: updateEmailPreferences
      summary: Change which staff emails the caller gets.
      description: |
        Staff and administrators only, in a signed-in session (second factor required).
        Sets the caller's three staff-email switches. Each is optional and only the ones sent change, so two
        browser tabs cannot undo each other. All three are on for a new account and for every account that
        existed before they were added.
        - email_notify_assigned: a ticket is assigned to me.
        - email_notify_activity: a requester replied on a ticket assigned to me, or a ticket assigned to me
          was reopened; and, for a ticket I follow, it was assigned, replied to or reopened.
        - email_notify_group: a ticket is assigned to a group I belong to, a requester replied on a group
          ticket that nobody personally holds, or a group ticket that nobody personally holds was reopened.
        An administrator can force any of these on or off for everyone with the staff_email_*_override
        settings; that wins over what is saved here. The answer's email_notifications says which are forced. Nobody is emailed about their own action whatever the
        switches say. A requester account is never sent staff mail, and an API key or OAuth client has no inbox
        of its own, so both are refused. Answers with the account as saved.
      tags: ['Account']
      x-ghd-handler: handleUpdateEmailPreferences
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email_notify_assigned: {type: boolean}
                email_notify_activity: {type: boolean}
                email_notify_group: {type: boolean}
      responses:
        '200':
          description: The caller's account, with the switches as saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/mfa/enroll:
    post:
      operationId: mfaEnrollStart
      summary: Start TOTP enrolment.
      description: |
        Generates a TOTP secret and returns it with its otpauth URL and a QR code as a PNG data URL. The secret
        is staged in this session only. The account's authenticator does not change until
        POST /me/mfa/enroll/confirm accepts a code from it.
        This route does not require a passed second factor, so someone compelled to enrol can finish. If the
        account already has a second factor (TOTP or a passkey), the session must have proved one of them, or
        the answer is 403 mfa_required. Session only: API keys and OAuth clients are refused.
      tags: ['Account']
      x-ghd-handler: handleMFAEnrollStart
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      responses:
        '200':
          description: The staged secret and how to load it into an authenticator.
          content:
            application/json:
              schema:
                type: object
                required: [secret, qr_url, qr_data_url]
                properties:
                  secret:
                    type: string
                    description: The TOTP secret, base32 encoded.
                  qr_url: {type: string, description: The otpauth:// URL the QR code encodes.}
                  qr_data_url: {type: string, description: A data:image/png;base64 URI of the QR code.}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Two sources. The authentication middleware refuses a machine credential with session_required, as
            text/plain. mfa_required, as application/json, when the account already has a second factor (TOTP
            or a passkey) and this session has not proved one. mfa_already_enrolled, as application/json, is
            the same refusal reached by a narrow race and is rarely seen.
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/mfa/enroll/confirm:
    post:
      operationId: mfaEnrollConfirm
      summary: Confirm TOTP enrolment with a code.
      description: |
        Checks a TOTP code against the secret staged in this session by POST /me/mfa/enroll. On success the
        secret becomes the account's TOTP factor, this session counts as having passed its second factor, and
        every other session for the account ends.
        Each attempt, right or wrong, spends one of the account's TOTP attempts. Too many wrong codes lock
        the account for the lock duration, which Retry-After reports (900 seconds). Session only. As for
        POST /me/mfa/enroll, if the account already has a second factor the session must have proved one,
        or the answer is 403 mfa_required.
      tags: ['Account']
      x-ghd-handler: handleMFAEnrollConfirm
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The current code from the authenticator.
      responses:
        '204':
          description: The factor is enrolled. A new session cookie is set and the other sessions have ended.
        '400':
          description: |
            bad_request when the body is not JSON. invalid_code when the code is wrong or no enrolment is
            staged in this session, and the message says which. A storage failure while saving the factor is
            not one of these: it is 500 internal_error (before 1.3.0 it was reported as invalid_code).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Two sources. The authentication middleware refuses a machine credential with session_required, as
            text/plain. mfa_required, as application/json, when the account already has a second factor and
            this session has not proved one, including one gained while the enrolment was pending.
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/passkeys:
    get:
      operationId: listPasskeys
      summary: List the caller's passkeys.
      description: |
        Returns the passkeys registered to this account. Key material and the authenticator's credential id
        are never returned. Session only.
      tags: ['Account']
      x-ghd-handler: handleListPasskeys
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      responses:
        '503':
          description: Passkeys are unavailable on this instance (passkeys_unavailable), because BASE_URL cannot be a passkey domain. Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '200':
          description: The account's passkeys. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Passkey'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/passkeys/register/finish:
    post:
      operationId: passkeyRegisterFinish
      summary: Complete passkey registration.
      description: |
        Completes the WebAuthn registration that POST /me/passkeys/register/start began. It checks the response
        against the challenge staged in this session and stores the new key on the account. A challenge can be
        used once. A registered passkey counts as a passed second factor for this session, and every other
        session for the account ends.
        The name query parameter labels the key. A name longer than 128 bytes is cut short on a character
        boundary, not refused. Session only. If the account already has a second factor, the session must
        have proved one, or the answer is 403 mfa_required.
        The body is read by the WebAuthn library, not by the server's JSON decoder, and is capped at 64 KiB:
        413 too_large above that, before the challenge is touched. A body that is not JSON answers 400
        registration_refused once a challenge is in progress. A fault writing the session is 500
        internal_error, not no_challenge.
      tags: ['Account']
      x-ghd-handler: handlePasskeyRegisterFinish
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      parameters:
        - name: name
          in: query
          required: false
          description: Label for the new key. Optional. Truncated to 128 bytes.
          schema:
            type: string
      requestBody:
        required: true
        description: The credential returned by the browser's navigator.credentials.create() call, as JSON.
        content:
          application/json:
            schema:
              type: object
              description: |
                The W3C PublicKeyCredential attestation JSON, with binary members base64url-encoded. Not
                modelled field by field.
      responses:
        '503':
          description: Passkeys are unavailable on this instance (passkeys_unavailable), because BASE_URL cannot be a passkey domain. Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: |
            no_challenge when no registration is in progress in this session. challenge_expired when the challenge
            has timed out. registration_refused when the authenticator's response did not verify, including a
            body that is not JSON.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Two sources. The authentication middleware refuses a machine credential with session_required, as
            text/plain. mfa_required, as application/json, when the account already has a second factor and
            this session has not proved one.
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That authenticator is already registered (credential_exists).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: The body is over 64 KiB (too_large). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/me/passkeys/register/start:
    post:
      operationId: passkeyRegisterStart
      summary: Begin passkey registration.
      description: |
        Returns the WebAuthn creation options for a new passkey, and stages the challenge in this session so
        that POST /me/passkeys/register/finish can check the answer. If the account already has a second
        factor, the session must have proved one, or the answer is 403 mfa_required. Session only.
      tags: ['Account']
      x-ghd-handler: handlePasskeyRegisterStart
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      responses:
        '503':
          description: Passkeys are unavailable on this instance (passkeys_unavailable), because BASE_URL cannot be a passkey domain. Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '200':
          description: The creation options to pass to navigator.credentials.create.
          content:
            application/json:
              schema:
                type: object
                description: |
                  An object whose publicKey member is the W3C PublicKeyCredentialCreationOptions, with binary
                  members base64url-encoded. Not modelled field by field.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Two sources. The authentication middleware refuses a machine credential with session_required, as
            text/plain. mfa_required, as application/json, when the account already has a second factor and
            this session has not proved one.
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/passkeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The passkey's UUID, as listed by GET /me/passkeys.
        schema:
          type: string
          format: uuid
    delete:
      operationId: deletePasskey
      summary: Remove a passkey.
      description: |
        Removes one of the caller's passkeys. An id that belongs to another account answers the same 404 as an
        id that does not exist. A session that has only passed the password cannot remove a factor from an
        account that already has one: the answer is 403 mfa_required. Session only.
      tags: ['Account']
      x-ghd-handler: handleDeletePasskey
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Two sources. The authentication middleware refuses a machine credential with session_required, as
            text/plain. mfa_required, as application/json, when the account already has a second factor and
            this session has not proved one.
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/password:
    patch:
      operationId: changePassword
      summary: Change the caller's password.
      description: |
        Changes the password after checking the current one. The new password must be 8 to 72 bytes long.
        Every other session for the account ends, and this request's session is re-issued with a new cookie,
        so this browser stays signed in. Session only, and the second factor must have passed,
        except for a session that owed no second factor when its password was checked and owes this very
        change (login answered password_change_required with neither mfa_needed nor passkey_needed): that
        one may make it without MFA. A flagged account that has since enrolled a factor gets 403 mfa_required
        and must verify the factor first. Any other route refuses a flagged session with 403
        password_change_required until the password is changed. The change clears the requirement.
        A wrong current_password answers 401 invalid_credentials as application/json, which is distinct
        from the text/plain 401 unauthorized sent when there is no session. The old field name password is still read when new_password is absent. current_password is
        required in either case.
      tags: ['Account']
      x-ghd-handler: handleChangePassword
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password:
                  type: string
                  description: The password the account has now.
                new_password:
                  type: string
                  description: The replacement password. Required unless the deprecated password field is sent instead.
                password:
                  type: string
                  deprecated: true
                  description: The original name of new_password. Read only when new_password is absent.
      responses:
        '204':
          description: The password is changed. A new session cookie is set and the other sessions have ended.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            Either no session (unauthorized, text/plain, from the auth middleware)
            or a wrong current_password (invalid_credentials, application/json,
            from the handler).
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/staff:
    get:
      operationId: listAssignableStaff
      summary: List accounts for the assignee picker.
      description: |
        Staff and administrators only (second factor required).
        Returns every account that is not deleted, with its id, display name and an assignable flag, ordered
        by display name. The list is deliberately not limited to staff: reporting users appear too, with assignable set to false,
        so a ticket already assigned to a colleague who has since been disabled or moved to the reporting role
        can still show their name. Email, role and login state are not included. Not paged.
      tags: ['Reference data']
      x-ghd-handler: handleListAssignableStaff
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every account that is not deleted.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, display_name, assignable]
                  properties:
                    id: {$ref: '#/components/schemas/Uuid'}
                    display_name: {type: string}
                    assignable:
                      type: boolean
                      description: True for an active staff member or administrator. False for a disabled account or one in the reporting role.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/statuses:
    get:
      operationId: listStatuses
      summary: List ticket statuses with counts for the caller.
      description: |
        Returns every status, active and inactive, ordered by sort order and then name. ticket_count depends on
        who asks. An administrator sees every ticket. Staff see tickets assigned to them or to one of their
        groups. A reporting user sees tickets they reported. An OAuth client is counted as its service user:
        as staff, the tickets assigned to that user or to one of that user's groups (0 until the user is in a
        group). A count that cannot be computed fails the
        request (500 internal_error); it is never reported as 0.
      tags: ['Reference data']
      x-ghd-handler: handleListStatuses
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every status.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Status'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tags:
    get:
      operationId: listActiveTags
      summary: Search active tags for autocomplete.
      description: |
        Staff and administrators only (second factor required).
        Returns active tags only, ordered by name. With q, returns the tags whose names start with q, matched
        case-insensitively after trimming, and at most 20 of them. Without q, returns every active tag. The
        value of q is used as a LIKE prefix, and its % and _ characters are not escaped, so they match as
        wildcards.
      tags: ['Reference data']
      x-ghd-handler: handleListActiveTags
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      parameters:
        - name: q
          in: query
          required: false
          description: Name prefix to match. Optional.
          schema:
            type: string
      responses:
        '200':
          description: Matching active tags.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Tag'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The search failed in storage (list_failed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/audit:
    get:
      operationId: listAdminAudit
      summary: Search the audit log across every entity.
      description: |
        Staff and administrators only (second factor required).
        The admin-wide half of the audit trail, searchable across every
        entity type. Entries are newest first. Pages are read with limit and
        offset; has_more says whether another page exists.
        Staff are narrowed twice. entity_type is forced to ticket whatever the
        query asks for, and when ticket scope enforcement is on only entries on
        tickets inside the caller's scope are returned. The page, the offset and
        the total all come from the same filtered sequence. Administrators see
        every entity.
        Staff do not get followed and unfollowed entries unless the staff
        follow-history setting (staff_can_view_follow_audit) is on; they are left
        out of the page and the total, and asking for them by action returns
        nothing.
        The field-level before and after diff is returned to administrators
        always, and to staff only when the staff change-history setting is on.
        It is redacted by the same rule as the per-ticket feed. Every other
        caller gets no before or after.
        With the diff comes names, which gives the current name of each status
        and assignee id in it (see AuditNames); before and after still hold the
        ids exactly as stored.
        total counts the matching entries the caller may see, up to 10,000.
        When more match, total_capped is true and total is 10000, which means
        at least that many.
      tags: ['Audit']
      x-ghd-handler: handleListAdminAudit
      security:
        - sessionCookie: []
        - apiKey: ['audit:read']
        - oauthClient: ['audit:read']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: entity_type
          in: query
          required: false
          description: Only entries for this entity type (for example ticket or user). Trimmed. Forced to ticket for staff.
          schema:
            type: string
        - name: action
          in: query
          required: false
          description: Only entries with this action name. Trimmed.
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match against entity_type or action (nothing else is searched). Trimmed. Must be valid UTF-8 without NUL bytes.
          schema:
            type: string
        - name: actor_id
          in: query
          required: false
          description: Only entries by this actor.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: from
          in: query
          required: false
          description: Only entries created at or after this instant (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only entries created at or before this instant (RFC 3339).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One page of audit entries, with the total and the paging flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditPage'
        '400':
          description: |
            `bad_request`. The message names the problem: actor_id must be a UUID,
            from or to must be an RFC 3339 timestamp, or entity_type, action or q
            is not valid UTF-8 or contains a NUL byte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tickets:
    get:
      operationId: listTickets
      summary: List the tickets the caller may work with.
      description: |
        Returns the tickets the caller may see, each as a TicketView: the ticket
        plus its live SLA status and can_reopen. Which tickets come back depends
        on the caller.
        - A reporting user (role user) gets the tickets they reported. Their sla
          is always null and can_reopen is always false.
        - Staff and administrators get, by default (scope=mine), the tickets
          assigned to them or to any of their groups. With ticket scope
          enforcement on, staff get every ticket their scope admits instead,
          including unassigned tickets in a category their groups cover.
        - An OAuth client is listed as its service user. It is staff (or a
          reporting user), so its default listing is the tickets assigned to that
          user or to one of that user's groups, or, with ticket scope enforcement
          on, every ticket its groups' scope admits. A client whose user is in no
          group sees nothing then. It can list a group's tickets with
          assignee_group_id only for a group its user belongs to while
          enforcement is on, and for any group while it is off.
        Four parameters can change the listing. reporter_id (admin only) is
        checked first, then assignee_group_id, then scope=visible (staff and
        admin: every ticket the caller can see; ignored for a reporting user),
        then scope=unassigned or scope=all (admin only). The first one present wins. Any other scope
        value is ignored and the default listing is used.
        q searches by tracking number prefix, subject and description (full-text
        search). Results are newest first. With q they are ordered by relevance
        first and then newest first, except for the default listing of an
        administrator, or of staff while scope enforcement is off, which merges
        several sources and stays newest first. The
        response is a bare array with no
        total and no next link, so page with limit and offset.
      tags: ['Tickets']
      x-ghd-handler: handleListTickets
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      parameters:
        - name: q
          in: query
          required: false
          description: Search text (tracking number prefix, subject, description). Trimmed; blank means no search.
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: "mine (the default), unassigned, all or visible. unassigned and all are admin only. visible is every ticket the caller can see: every ticket for an admin, or for staff while ticket scope enforcement is off, and the staff scope with it on; a reporting user still gets only their own tickets. Other values are ignored and behave as mine."
          schema:
            type: string
        - name: reporter_id
          in: query
          required: false
          description: Only tickets this account reported. Admin only.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: assignee_group_id
          in: query
          required: false
          description: Only tickets assigned to this group. Staff must belong to the group when ticket scope enforcement is on.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: The caller's tickets, in the order described above, as a bare array (never null).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketView'
        '400':
          description: |
            `bad_request`: invalid reporter_id or invalid assignee_group_id (not a
            UUID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain): the role or MFA or scope check
            failed. Or refused by the handler (application/json, `forbidden`):
            only admins can filter by reporter; users cannot list group tickets;
            you are not a member of that group (staff, scope enforcement on);
            only admins can use this scope (scope=unassigned or scope=all).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createTicket
      summary: Open a new ticket.
      description: |
        Creates a ticket and answers 201 with the new Ticket (the bare ticket,
        not the TicketView). The tracking number uses the instance's ticket
        prefix. The ticket is then routed like any new ticket: a group whose
        category and type rules match takes it first, then the global group, then
        the round-robin users if they are configured. The response body is the
        ticket as created, before that routing and before custom fields are
        written, so assignee_user_id and assignee_group_id are absent from it
        even when routing assigned the ticket. Read the ticket again to see the
        assignee.
        What the caller may set depends on the role.
        - Staff and administrators may set every field, including item_id and
          priority.
        - A reporting user has item_id and priority ignored (priority becomes
          medium), must file into an active category, and must use an active
          type when type_id is sent.
        - Nobody, staff and administrators included, may file into an archived
          category, type or item (400 bad_request, for example "item_id is not
          an active item"). Staff could before; that exception is gone. A
          reporting user's item_id is dropped before this check, so the item
          refusal is only ever seen by staff and administrators.
        subject is required after trimming. description is optional. subject is
        limited to 500 bytes and description to 50,000 bytes. type_id must belong
        to category_id, and for staff an item_id must belong to type_id.
        custom_fields maps custom field ids to values. Empty values, and ids that
        are not fields of this ticket's classification, are skipped without an
        error. They are written after the ticket exists, so a failure there does
        not fail the request.
        An OAuth client creates the ticket as its service user, which becomes
        the reporter, and needs the tickets:write scope. Nobody is mailed for a
        service user.

        Filing for someone else (staff and administrators only). The caller is
        the requester unless reporter_user_id or reporter_email is sent; send at
        most one. reporter_user_id picks an existing account. reporter_email
        types an address: if it belongs to an account the ticket is filed for
        that account, otherwise it is filed exactly like a guest ticket, so the
        person is sent the guest link at that address. That needs guest
        submission to be on (400 otherwise, because the link would not open),
        and guest_name is required (400 without a non-blank one), as on the
        guest form; guest_phone is kept and optional. An address that belongs to
        an account needs no name. An account that is filed for (picked, or
        matched by its typed address) is sent the ordinary "We have received
        your ticket" email with a link to the ticket, through the notification
        outbox, unless it is the caller. Either way the caller, not the requester, is the
        actor in the ticket's history, its created audit entry and the created
        event. A reporting user who sends either field gets 403 forbidden; the
        field is never ignored. GET /users/lookup finds an account to pick.

        Mail limit: each reporter_email with no account mails a stranger, so
        one member of staff can file at most 40 such tickets an hour, then 429
        rate_limited with Retry-After and nothing is created. Only tickets
        that are filed count: a request that is refused or fails validation
        does not. A picked reporter_user_id, and a reporter_email that belongs
        to an account, do not count either. The count is per user, not per address of the
        request: a machine credential counts against the user it acts as, and
        another member of staff is unaffected. It is kept in memory, so it
        resets when the server restarts and each replica of a multi-instance
        deployment counts separately. Its window is fixed, not sliding.
      tags: ['Tickets']
      x-ghd-handler: handleCreateTicket
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, category_id]
              properties:
                subject:
                  type: string
                  description: Required after trimming. At most 500 bytes.
                description:
                  type: string
                  description: Optional. At most 50,000 bytes.
                category_id:
                  $ref: '#/components/schemas/Uuid'
                type_id:
                  description: Must belong to category_id. A reporting user may only use an active type.
                  $ref: '#/components/schemas/Uuid'
                item_id:
                  description: Ignored for a reporting user. Must belong to type_id.
                  $ref: '#/components/schemas/Uuid'
                priority:
                  description: Ignored for a reporting user, who always gets medium. Defaults to medium when absent.
                  $ref: '#/components/schemas/Priority'
                custom_fields:
                  description: Field id to value. Values are strings. Unknown or empty entries are skipped.
                  type: object
                  additionalProperties:
                    type: string
                reporter_user_id:
                  description: Staff and administrators only. The existing account the ticket is for. Not with reporter_email. An id that is not a live account is 400.
                  $ref: '#/components/schemas/Uuid'
                reporter_email:
                  type: string
                  description: Staff and administrators only. An address the ticket is for. An account's address files for the account; any other makes a guest ticket and mails the guest link there (guest submission must be on). Not with reporter_user_id.
                guest_name:
                  type: string
                  description: With reporter_email and no account behind it, the guest's name. Required (400 when missing or blank); not used when the address belongs to an account.
                guest_phone:
                  type: string
                  description: With reporter_email and no account behind it, the guest's phone. Optional.
      responses:
        '201':
          description: The ticket as created, before routing assigned it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: |
            `bad_request`, with a message naming the field. Covers invalid JSON,
            subject is required, category_id is required, a category, type or
            item that is archived, for staff, administrators and reporting users
            alike (category_id is not an active category; type_id is not an active
            type; item_id is not an active item, which a reporting user never
            sees because their item_id is dropped first), type_id does not belong to
            category_id, and the domain's own checks (for example priority must
            be one of critical, high, medium, low, or subject is too long). For
            staff and administrators also: both reporter_user_id and
            reporter_email were sent, reporter_user_id is not a live account,
            reporter_email is not a plain address (reporter_email: ...), or
            reporter_email has no account and guest submission is off, or it has
            no account and guest_name is missing or blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `user_identity_required`, for a credential
            that arrives with no user behind it. An OAuth client always has one,
            its service user, so it is not refused this way. Or `forbidden`:
            reporter_user_id or reporter_email was sent by a caller who is not
            staff or an administrator.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/tickets/fields:
    get:
      operationId: resolveFieldsForCTI
      summary: List the custom fields for a category, type and item.
      description: |
        The custom field assignments that apply to a classification, used by the
        new-ticket form. Every signed-in role may call it. category_id is
        required. type_id and item_id are optional, and each must be a UUID when
        it is sent. Answers an empty array when no field applies.
      tags: ['Tickets']
      x-ghd-handler: handleResolveFieldsForCTI
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      parameters:
        - name: category_id
          in: query
          required: true
          description: The category. Required; must be a UUID.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: type_id
          in: query
          required: false
          description: The type. Must be a UUID when sent.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: item_id
          in: query
          required: false
          description: The item. Must be a UUID when sent.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The assignments that apply, as a bare array (never null).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldAssignment'
        '400':
          description: "`bad_request`: category_id is required (missing or not a UUID), or type_id or item_id is not a UUID."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    get:
      operationId: getTicket
      summary: Get one ticket.
      description: |
        Returns one ticket as a TicketView. {id} is a UUID or a
        tracking number (matched case-insensitively), as on every route under
        /tickets/{id}.
        A ticket the caller may not see answers 404 not_found, exactly as a
        ticket that does not exist does. It is never 403, so tracking numbers
        cannot be probed. A reporting user sees only the tickets they
        reported. For them sla is null and can_reopen is false.
        Staff and administrators also receive requester, who the ticket is
        for (the account's name and email, or the guest's), on every ticket. A
        reporting user does not receive it.
      tags: ['Tickets']
      x-ghd-handler: handleGetTicket
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: The ticket, with its live SLA status and can_reopen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
    patch:
      operationId: updateTicket
      summary: Change a ticket's status, assignment, classification or priority.
      description: |
        Applies whichever of status_id, clear_assignee, assignee_user_id,
        assignee_group_id, category_id and priority are sent, and answers 200 with the bare
        Ticket. An empty body is the same as {}: no change, and the response is
        the Ticket. Malformed JSON answers 400 bad_request. The path id is a UUID or a tracking number.
        The changes run in this order: status, then assignment, then
        classification, then priority. Each is saved on its own, with no
        transaction around the four, but every refusal the request can meet is
        decided before the first of them is saved, so a refused request changes
        nothing and writes no audit entry. Decided first: an invalid priority
        value (400), a priority from a caller who may not change priorities
        (403, a reporting user), a classification the caller may not make or
        that is not valid (403, 400), a priority on a request that would leave
        the ticket Resolved or Closed (409 ticket_closed, see below), an
        assignment from a caller who may not assign (403), an assignee that
        cannot be given a ticket (400) and a group that does not exist (400).
        The status change is the first write, so its own refusals (403, 404,
        409) also come before anything is saved. When several apply, the order
        is the invalid value, then the priority role, then the classification,
        then the closed state, then the assignment, then the status.
        What this does not cover: a refusal that can only be known at the
        moment of writing. A concurrent change between the check and the write
        (an assignee account disabled, or the ticket closed, in those few
        milliseconds) is refused by the write's own check, and so is a database
        failure (500), after the changes ahead of it in the order above were
        saved.
        Who may do what:
        - A reporting user cannot change the status (403 forbidden), cannot
          assign (403 forbidden), cannot reclassify (403, "only staff can
          reclassify tickets"), and cannot change the priority (403 forbidden).
        - priority is one of critical, high, medium and low. Anything else
          answers 400 bad_request before any change in the request is saved. A
          Resolved or Closed ticket's priority cannot be changed: 409
          ticket_closed, and the priority and the SLA stay as they were. The
          whole request is refused, nothing in it saved: that covers a request
          that moves the ticket to Resolved or Closed and sends a priority, and
          one that assigns or unassigns a ticket that is already Resolved or
          Closed and sends a priority. A request that moves the ticket out of
          Resolved to an open status is not refused for its priority (moving
          out of Closed is still decided by closed_reopen_policy, with the
          same nothing-saved result when refused). Sending the ticket's current
          priority on an open ticket is accepted and changes nothing: no audit
          entry, no SLA change.
        - Only an administrator may set the status to Closed (403 forbidden for
          anyone else).
        - Leaving Closed needs closed_reopen_policy to allow the caller's role.
          Otherwise the answer is 409 ticket_closed.
        - A status_id that moves a Resolved or Closed ticket to an open status
          is a reopen: the ticket's reopen_count goes up by one, the first
          reopen raises the priority one level (critical stays critical), the
          SLA starts over, and the audit log gets reopened (beside
          status_changed), priority_changed and sla_restarted. All of it is
          written with the status change or not at all. A priority sent in the
          same request is applied after the reopen and wins.
        - An assignee must be an account that exists, is not deleted or disabled,
          and is staff or an administrator (400 bad_request otherwise). A group
          must exist (400 bad_request).
        - An unknown status_id answers 404 not_found, "status not found". This is
          not the ticket 404 documented here.
        - A status_id that names an inactive status answers 409 status_inactive,
          for every role: inactive statuses are retired. A ticket already in an
          inactive status can be moved out of it, and sending it the status it
          already holds is not a move.
        - An OAuth client acts as its service user, which is recorded as the
          actor of the change. It needs the tickets:write scope.
        For status_id, assignee_user_id, assignee_group_id, category_id, type_id
        and item_id, an absent key and a null mean the same thing. clear_assignee
        true unassigns the ticket, and wins over the two assignee fields. Sending
        category_id replaces the whole classification: type_id and item_id are
        written as sent, so an absent one clears that level. type_id and item_id
        have no effect unless category_id is sent too.
        Changing the priority re-matches the ticket's SLA policy for the new
        priority when SLA tracking is on, and never restarts its clock. The
        priority, the SLA rows and the audit entry are written in one
        transaction. A record is never rewritten: a re-match marks the old record
        superseded and starts a new one under the new policy, which keeps the old
        one's clock start and its facts, so elapsed time still counts and a
        target already met stays met. A ticket with no record whose new priority
        matches a policy gets one whose clock started at the ticket's creation,
        which can already be breached. If no policy matches the new priority, the
        old record is superseded and the ticket shows no SLA. The audit entry
        priority_changed records the reason (manual), the SLA outcome and the
        policy and record ids before and after. No notification or webhook event
        is sent for a priority change.
        Reclassifying never moves a ticket INTO an archived category, type or item:
        a level that is archived and different from the ticket's current one answers
        400 bad_request ("type_id is not an active type"), for staff and
        administrators too. A level that is unchanged is not checked, so a ticket
        already in an archived node keeps it through any edit that repeats or leaves
        alone that level. The classification is validated before anything else in
        the request is applied, so a refused classification (400) leaves the status
        and the assignee unchanged too.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. The text/plain 403s from the auth
        middleware are decided before the ticket is looked up and say nothing
        about it.
      tags: ['Tickets']
      x-ghd-handler: handleUpdateTicket
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status_id:
                  description: The status to move the ticket to. Staff and administrators only.
                  $ref: '#/components/schemas/Uuid'
                assignee_user_id:
                  description: Staff or administrator account to assign the ticket to.
                  $ref: '#/components/schemas/Uuid'
                assignee_group_id:
                  description: Group to assign the ticket to.
                  $ref: '#/components/schemas/Uuid'
                clear_assignee:
                  description: When true, unassigns the ticket and ignores assignee_user_id and assignee_group_id.
                  type: boolean
                category_id:
                  description: Replaces the category. Staff and administrators only. Resets type_id and item_id as sent.
                  $ref: '#/components/schemas/Uuid'
                type_id:
                  description: The type to set with category_id. Absent clears it.
                  $ref: '#/components/schemas/Uuid'
                item_id:
                  description: The item to set with category_id. Absent clears it.
                  $ref: '#/components/schemas/Uuid'
                priority:
                  description: |
                    Sets the priority and re-matches the ticket's SLA policy for it,
                    keeping the SLA clock. Staff and administrators only. Absent
                    leaves it unchanged.
                  $ref: '#/components/schemas/Priority'
      responses:
        '200':
          description: The ticket after the changes, as the bare Ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: |
            `bad_request`: invalid JSON; an assignee that is not a user on this
            help desk, deleted, disabled or a reporting user; a classification
            the domain refuses (category_id is not a category on this help desk,
            type_id and item_id do not belong to the category and to each
            other, or a newly chosen category_id, type_id or item_id is archived:
            "... is not an active ..."); or a priority that is not one of
            critical, high, medium and low.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `forbidden` for a reporting user changing the
            status, assigning, reclassifying or changing the priority, and for
            anyone but an administrator setting the status to Closed;
            `user_identity_required` for a credential with no user behind it (not
            an OAuth client, which acts as its service user).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: >-
            `ticket_closed`: the ticket is Closed and the caller's role may not move it
            out of Closed, or a priority change was sent for a Resolved or Closed
            ticket. `status_inactive`: status_id names an inactive status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/audit:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    get:
      operationId: listTicketAudit
      summary: List a ticket's audit trail.
      description: |
        Staff and administrators only (second factor required). The per-ticket
        activity feed: every audit entry recorded against
        the ticket, oldest first, capped at the newest 500 entries. Each entry has
        the action, the actor and the time.
        A reporting user is refused with 403
        forbidden on a ticket they can see (and 404 on one they cannot): requesters
        see the ticket's current state and its conversation, not its history or
        audit trail. Guests have no such route.
        Who sees what:
        - before and after (the field-level diff, redacted) go only to
          administrators, and to staff when the staff change-history setting is
          on. Everyone else gets neither.
        - names, sent with the diff, gives the name of each status and
          assignee id in it (see AuditNames). Where requester-name masking
          applies, a requester is the label Requester there too.
        - Where requester-name masking applies, actor_name is the label
          Requester and actor_masked is true.
        - followed and unfollowed entries (someone started or stopped following
          the ticket) go to administrators, and to staff when the staff
          follow-history setting (staff_can_view_follow_audit) is on. A reporting
          user never gets them. A viewer who gets them also gets their before and
          after (redacted), whether or not they get the diff of other entries:
          an unfollowed entry written by a reassignment has the reassigning actor
          as its actor and carries the assignee whose follow ended in
          before.assignee_user_id (named in names).
        The id is a UUID or a tracking number.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. The text/plain 403s from the auth
        middleware are decided before the ticket is looked up and say nothing
        about it.
      tags: ['Tickets']
      x-ghd-handler: handleListTicketAudit
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      responses:
        '200':
          description: The ticket's audit entries, oldest first, as a bare array (never null).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketAuditEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
  /api/v1/tickets/{id}/follow:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    put:
      operationId: followTicket
      summary: Follow a ticket.
      description: |
        Staff and administrators only, in a signed-in session (second factor required). The caller
        starts following the ticket and is emailed about its activity, the same
        email the assignee gets, under their "activity on tickets I'm assigned
        to or follow" switch and the administrator's override of it. The person
        who made a change is never emailed about it.

        People only: a signed-in session. An API key or OAuth client is refused
        with 403 session_required, because following is a personal choice and a
        script acting for someone is not them. A service user cannot follow
        either.

        Following a ticket already followed answers 204 and changes nothing. A
        first follow is audited as followed. The caller must be able to see the
        ticket. Whether they still can is checked again each time an email is
        sent; one they can no longer see is skipped and the follow is kept.
        The id is a UUID or a tracking number.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. Of the text/plain 403s from the auth
        middleware, mfa_required and insufficient_scope are decided before the
        ticket is looked up and say nothing about it; the role refusal
        (forbidden) is decided after it.
      tags: ['Tickets']
      x-ghd-handler: handleFollowTicket
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
    delete:
      operationId: unfollowTicket
      summary: Stop following a ticket.
      description: |
        Staff and administrators only, in a signed-in session (second factor required).
        As for following, an API key or OAuth client is refused. Answers 204 whether or
        not the caller was following. Stopping is audited as unfollowed when it changed
        something. The id is a UUID or a tracking number.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. Of the text/plain 403s from the auth
        middleware, mfa_required and insufficient_scope are decided before the
        ticket is looked up and say nothing about it; the role refusal
        (forbidden) is decided after it.
      tags: ['Tickets']
      x-ghd-handler: handleUnfollowTicket
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
