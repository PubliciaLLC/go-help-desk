openapi: 3.1.0
info:
  title: Go Help Desk API
  version: 1.3.0-beta
  summary: REST API of Go Help Desk, served under /api/v1 beside the SPA.
  description: |
    Hand-written. backend/internal/server/openapi_spec_test.go walks the real
    chi router and fails when this file and the router disagree on any route,
    on who may call it, or on which handler serves it. When the two disagree,
    the code is the truth and this file is what gets fixed.

    Conventions that hold for every operation, so they are not repeated on each:

    - Every JSON request body is decoded with a 1 MiB cap and unknown fields
      are ignored (server/respond.go DecodeJSON). A body that is not JSON, or
      is over the cap, answers 400.
    - Every error from a handler is the envelope in components.schemas.Error,
      served as application/json. Refusals produced by the authentication
      middleware (401 unauthorized, 403 forbidden / mfa_required /
      insufficient_scope / session_required) carry the same envelope but are
      served as text/plain; charset=utf-8, because they are written with
      net/http's http.Error.
    - Any operation may answer 500 internal_error ("an internal error
      occurred"); it is listed only where a handler has a 5xx of its own.
    - A chi-level miss (unknown path) is 404 with the plain-text body
      "404 page not found"; a known path with the wrong method is 405.
    - Paths are documented without a trailing slash. Routes mounted at a
      sub-router root (for example /api/v1/tickets) also answer with one.

    The MCP server at /mcp/ (GET /mcp/sse, POST /mcp/message) is JSON-RPC over
    Server-Sent Events, authenticated by the same chain as /api/; see
    docs/DESIGN.md, "MCP Interface". It is not described here.
  license:
    name: GNU Affero General Public License v3.0
    url: https://github.com/PubliciaLLC/go-help-desk/blob/main/LICENSE
servers:
  - url: /
    description: Same origin as the SPA (BASE_URL in production, http://localhost:8080 under docker-compose).
tags:
  - name: Health
    description: Liveness probe, outside /api/v1.
  - name: Site
    description: Public branding and logo, read before sign-in.
  - name: Setup
    description: First-run creation of the first administrator.
  - name: Authentication
    description: Password and second-factor sign-in, sign-out, OAuth client-credentials tokens, provider discovery.
  - name: Single sign-on
    description: SAML and OIDC browser flows. Redirects and XML, not JSON, on the happy path.
  - name: Signup
    description: Self-service signup and email verification.
  - name: Account
    description: The signed-in caller's own identity, password, TOTP and passkeys.
  - name: Catalogue
    description: The Category / Type / Item tree for the ticket form.
  - name: Reference data
    description: Lists the ticket screens need - statuses, active tags, assignable staff, groups.
  - name: Tickets
    description: Tickets and everything under /tickets/{id} except attachments.
  - name: Attachments
    description: Ticket attachments - upload, list, download, reputation re-check.
  - name: Guest
    description: Guest submission and the per-ticket link token surface.
  - name: Audit
    description: The admin-wide audit view.
  - name: "Admin: Users"
  - name: "Admin: Groups"
  - name: "Admin: Catalogue"
    description: Categories, types, items, custom-field definitions and their assignments.
  - name: "Admin: SLA"
  - name: "Admin: Statuses"
  - name: "Admin: Settings"
    description: Instance settings, the logo, and security warnings.
  - name: "Admin: Single sign-on"
    description: SAML and OIDC configuration.
  - name: "Admin: Plugins"
  - name: "Admin: Credentials"
    description: The scope catalogue, API keys and OAuth clients.
  - name: "Admin: Webhooks"
  - name: "Admin: Tags"
  - name: "Admin: Canned responses"
paths:
  /api/v1/admin/oidc:
    get:
      operationId: getOIDCConfig
      summary: Read the OIDC sign-in configuration.
      description: >-
        Returns the saved OIDC settings. The client secret is never returned:
        client_secret is always the empty string, and configured reports whether
        the identity provider is live in this process. Requires the settings:read
        scope for an API key.
      tags: ['Admin: Single sign-on']
      x-ghd-handler: handleGetOIDCConfig
      security:
        - sessionCookie: []
        - apiKey: ['settings:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The saved OIDC configuration.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, issuer_url, client_id, client_secret, redirect_url, configured]
                properties:
                  enabled: {type: boolean}
                  issuer_url: {type: string}
                  client_id: {type: string}
                  client_secret:
                    type: string
                    description: Always the empty string. The stored secret is never sent to the browser.
                  redirect_url:
                    type: string
                    description: The callback URL the identity provider is told to return to.
                  configured:
                    type: boolean
                    description: True when the identity provider is loaded and answering in this process.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: saveOIDCConfig
      summary: Save the OIDC sign-in configuration.
      description: >-
        Saves the OIDC settings and, before saving, builds the identity provider
        from the candidate settings so the save can be refused if it would leave
        every active administrator unable to sign in. A blank client_secret keeps
        the stored secret. redirect_url is not accepted from the body: the stored
        value is kept, or the callback URL is derived from the server's base URL.
        Enabling OIDC requires an issuer URL, a client ID and a client secret;
        otherwise the request is refused with 400. A failure to reach the identity
        provider after the save does not fail the request: the settings are saved,
        the live provider is left as it was, and the response carries a warning.
        Requires a session that has passed MFA. API keys and OAuth clients cannot
        call this operation.
      tags: ['Admin: Single sign-on']
      x-ghd-handler: handleSaveOIDCConfig
      security:
        - sessionCookie: []
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether OIDC sign-in is offered. An omitted field is false.
                issuer_url:
                  type: string
                  description: The identity provider's issuer URL.
                client_id:
                  type: string
                client_secret:
                  type: string
                  description: The client secret. Empty or omitted keeps the stored secret.
      responses:
        '200':
          description: >-
            Saved. The body is {ok: true} when nothing needs reporting, {ok: true,
            warning} when saving would strand some administrators, or {warning}
            alone when the identity provider could not be reached after the save.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                    description: Present and true on a plain success.
                  warning:
                    type: string
                    description: A plain-language warning about the save. Present only when there is one.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/saml:
    get:
      operationId: getSAMLConfig
      summary: Read the SAML sign-in configuration.
      description: >-
        Returns the saved SAML settings and the URL of this server's service
        provider metadata, which is what the administrator gives the identity
        provider. The private key is never returned. Requires the settings:read
        scope for an API key.
      tags: ['Admin: Single sign-on']
      x-ghd-handler: handleGetSAMLConfig
      security:
        - sessionCookie: []
        - apiKey: ['settings:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The saved SAML configuration.
          content:
            application/json:
              schema:
                type: object
                required: [configured, metadata_url, cert_pem, sp_metadata_url]
                properties:
                  configured:
                    type: boolean
                    description: True when SAML is loaded and answering in this process.
                  metadata_url:
                    type: string
                    description: The identity provider's metadata URL. Empty when unset.
                  cert_pem:
                    type: string
                    description: The service provider certificate in PEM form. Empty when unset.
                  sp_metadata_url:
                    type: string
                    description: This server's SAML metadata URL, built from the server's base URL.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: saveSAMLConfig
      summary: Save the SAML sign-in configuration.
      description: >-
        Each field may be omitted, which keeps the stored value, or sent. A field
        sent as an empty string clears it, and null is treated the same as an
        omitted field. The certificate and key are checked as a pair before
        anything is saved, and a mismatch is refused with invalid_cert_key. The
        identity provider's metadata is fetched from the candidate settings before
        the save, so a save that would strand administrators is refused, and a
        failed metadata fetch after the save does not fail the request: the
        settings are saved, the live handler is left as it was, and the response
        carries a warning. Returns 204 when nothing needs reporting. Requires a
        session that has passed MFA. API keys and OAuth clients cannot call this
        operation.
      tags: ['Admin: Single sign-on']
      x-ghd-handler: handleSaveSAMLConfig
      security:
        - sessionCookie: []
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata_url:
                  type: [string, 'null']
                  description: The identity provider's metadata URL. Omitted or null keeps the stored value; "" clears it.
                cert_pem:
                  type: [string, 'null']
                  description: The service provider certificate in PEM form. Omitted or null keeps the stored value; "" clears it.
                key_pem:
                  type: [string, 'null']
                  description: The service provider private key in PEM form. Omitted or null keeps the stored value; "" clears it. Never returned by any endpoint.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '200':
          description: >-
            Saved, with a warning. The body is {warning}: either the identity
            provider metadata could not be loaded, or the save would strand some
            administrators (who are named in the warning).
          content:
            application/json:
              schema:
                type: object
                required: [warning]
                properties:
                  warning:
                    type: string
                    description: A plain-language warning about the save.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/local/login:
    post:
      operationId: localLogin
      summary: Sign in with an email address and password.
      description: >-
        Verifies the password, then starts a new session. Only failed attempts
        count against the per-address budget, and a correct password is always
        accepted, even when the budget is spent. The budget is one minute: when it
        is spent, the request is delayed before the password is checked and a
        refused attempt answers 429 with Retry-After: 60. The response says what
        the person must do next: mfa_needed means a TOTP code is owed
        (POST /auth/local/mfa/verify), passkey_needed means a passkey is owed
        (POST /auth/local/passkey/start), and mfa_enrollment_needed means the
        role must enrol a second factor before it is fully signed in. When SAML
        is enabled, only administrators may use this operation.
      tags: ['Authentication']
      x-ghd-handler: handleLocalLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  description: The account's email address. Matched case-insensitively, with surrounding spaces ignored.
                password:
                  type: string
                  description: The account password.
      responses:
        '200':
          description: Signed in. The session cookie is set. The body says which second step is owed, if any.
          content:
            application/json:
              schema:
                type: object
                required: [user, mfa_needed, passkey_needed, mfa_enrollment_needed]
                properties:
                  user: {$ref: '#/components/schemas/User'}
                  mfa_needed:
                    type: boolean
                    description: True when a TOTP code is owed. Answer with POST /auth/local/mfa/verify.
                  passkey_needed:
                    type: boolean
                    description: True when a passkey is owed. Answer with POST /auth/local/passkey/start and /finish.
                  mfa_enrollment_needed:
                    type: boolean
                    description: True when the role must enrol a second factor before it is fully signed in.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The email address and password do not match an account (invalid_credentials). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: >-
            Local sign-in is disabled for this account because SAML is enabled
            (saml_required). Sent as application/json by the handler.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/local/logout:
    post:
      operationId: logout
      summary: End the current browser session.
      description: >-
        Deletes the server-side session row the cookie points at and tells the
        browser to drop the cookie. Needs no credential, and answers 204 whether or
        not a session existed.
      tags: ['Authentication']
      x-ghd-handler: handleLogout
      security: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /api/v1/auth/local/mfa/verify:
    post:
      operationId: mfaVerify
      summary: Complete sign-in with a TOTP code.
      description: >-
        Checks a six-digit TOTP code for the signed-in account and, on success,
        rotates the session with the second factor marked as passed. Attempts are
        counted on the account, not the session, and a spent budget locks the
        account for 15 minutes: the response is 429 with Retry-After: 900. The
        attempt is spent before the code is checked, so a correct code sent during
        a lock is refused. Reachable with a session only, not an API key or OAuth
        client (403 session_required).
      tags: ['Authentication']
      x-ghd-handler: handleMFAVerify
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The current TOTP code.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            Either no session (unauthorized, text/plain, from the auth middleware)
            or a code that does not match (invalid_mfa_code, application/json,
            from the handler).
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/local/passkey/finish:
    post:
      operationId: passkeyLoginFinish
      summary: Complete sign-in with a passkey.
      description: >-
        Verifies the browser's answer to the challenge issued by
        POST /auth/local/passkey/start and, on success, rotates the session with the
        second factor marked as passed. The challenge is consumed on every call,
        whether the answer verifies or not, so a failed attempt must start again.
        A challenge expires five minutes after it was issued. The sign count is
        recorded but not enforced. Reachable with a session only (403
        session_required for an API key or OAuth client).
      tags: ['Authentication']
      x-ghd-handler: handlePasskeyLoginFinish
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      requestBody:
        required: true
        description: The W3C PublicKeyCredential JSON produced by the browser's navigator.credentials.get call.
        content:
          application/json:
            schema:
              type: object
              description: The WebAuthn assertion, in the W3C JSON shape that the go-webauthn library parses. Not modelled field by field.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            No challenge is in progress for this session (no_challenge), the
            challenge is older than five minutes (challenge_expired), or the account
            has no passkey (no_passkey). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: >-
            Either no session (unauthorized, text/plain, from the auth middleware)
            or an answer that did not verify (assertion_refused, application/json,
            from the handler).
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/local/passkey/start:
    post:
      operationId: passkeyLoginStart
      summary: Start a passkey challenge for the signed-in account.
      description: >-
        Issues a WebAuthn assertion challenge for the account in the session and
        stores it in the session until POST /auth/local/passkey/finish consumes it.
        The request needs no body. Reachable with a session only (403
        session_required for an API key or OAuth client).
      tags: ['Authentication']
      x-ghd-handler: handlePasskeyLoginStart
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      responses:
        '200':
          description: The WebAuthn assertion options to pass to navigator.credentials.get.
          content:
            application/json:
              schema:
                type: object
                description: The go-webauthn protocol.CredentialAssertion, the W3C PublicKeyCredentialRequestOptions JSON shape. Not modelled field by field.
        '400':
          description: The account has no passkey registered (no_passkey). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/oauth/token:
    post:
      operationId: oauthToken
      summary: Exchange OAuth client credentials for an access token.
      description: >-
        Issues a JWT access token for an OAuth client using the client_credentials
        grant. The body must be JSON: the form encoding that RFC 6749 specifies is
        refused with 400 bad_request. The token lasts one hour and cannot be
        refreshed. The client acts as staff, so it never reaches an
        administrator-only operation. A wrong secret and an unknown client get the
        same 401 invalid_client.
      tags: ['Authentication']
      x-ghd-handler: handleOAuthToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                  description: Must be client_credentials. Any other value is refused with unsupported_grant_type.
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        '200':
          description: A bearer token for the client.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                    description: 'A signed JWT. Send it as Authorization: Bearer <token>.'
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in:
                    type: integer
                    enum: [3600]
                    description: Lifetime in seconds.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The client ID is unknown or the secret does not match (invalid_client).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: Finish an OIDC sign-in at the identity provider's redirect.
      description: >-
        The identity provider redirects the browser here with a code and the state
        it was given. The state must match the one stored in the session by
        GET /auth/oidc/login, and each state is used once. On success the code is
        exchanged, the ID token is verified against the stored nonce, the account
        is matched or provisioned, a new session is started, and the browser is
        sent to /. A refused sign-in is a redirect to /login?error=<code>, not a
        JSON body, so the login page can show a fixed message. The codes are:
        invalid_session, invalid_state, idp_error, missing_code, internal_error,
        missing_id_token, invalid_id_token, domain_not_allowed, account_disabled,
        account_link_refused, email_not_verified, invalid_email and email_taken.
        The only JSON answer, apart from a rare internal error when the session
        cannot be read or saved, is 503 when OIDC is not configured.
      tags: ['Single sign-on']
      x-ghd-handler: handleOIDCCallback
      security: []
      parameters:
        - name: state
          in: query
          required: true
          description: The state value the identity provider echoed back. Must equal the state stored in the session.
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: The authorization code. Absent when the identity provider reports an error instead.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: The identity provider's refusal code (for example access_denied). Logged, not echoed.
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          description: The identity provider's refusal text. Logged only.
          schema:
            type: string
      responses:
        '303':
          description: >-
            Signed in, Location is /. Or refused, Location is /login?error=<code>
            with one of the codes listed in the description.
          headers:
            Location:
              description: / on success, or /login?error=<code> on refusal.
              schema:
                type: string
        '503':
          description: OIDC is not configured (oidc_not_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/oidc/login:
    get:
      operationId: oidcLogin
      summary: Start an OIDC sign-in at the identity provider.
      description: >-
        Records a fresh state, nonce and PKCE verifier in the visitor's session,
        keeping whatever else the session holds, and redirects the browser to the
        identity provider's authorization endpoint. Requires no credential, and
        carries no CSRF protection, so it never logs anyone out.
      tags: ['Single sign-on']
      x-ghd-handler: handleOIDCLogin
      security: []
      responses:
        '302':
          description: Redirect to the identity provider.
          headers:
            Location:
              description: The identity provider's authorization URL.
              schema:
                type: string
        '503':
          description: OIDC is not configured (oidc_not_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/providers:
    get:
      operationId: authProviders
      summary: List the sign-in methods this server offers.
      description: >-
        Says whether local password sign-in, SAML and OIDC are enabled. The
        handler writes this JSON without setting a Content-Type, so it is served as
        text/plain; charset=utf-8. Clients should parse the body as JSON regardless.
      tags: ['Authentication']
      x-ghd-handler: handleAuthProviders
      security: []
      responses:
        '200':
          description: The sign-in methods.
          content:
            text/plain:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      required: [name, enabled]
                      properties:
                        name:
                          type: string
                          enum: [local, saml, oidc]
                        enabled: {type: boolean}
  /api/v1/auth/saml/acs:
    post:
      operationId: samlAcs
      summary: Receive a SAML assertion from the identity provider.
      description: >-
        The assertion consumer service for the HTTP-POST binding. The identity
        provider posts the signed SAMLResponse and the RelayState it was given. On
        success the library sets a short-lived hand-over cookie and redirects to
        the URL the sign-in began at, normally /api/v1/auth/saml/complete, which
        turns the hand-over into a session. A response that does not verify, an
        IdP-initiated response (this server does not accept one) and any other
        library refusal are answered 403 with the plain body Forbidden. Answers
        503 when SAML is not configured.
      tags: ['Single sign-on']
      x-ghd-handler: handleSAMLACS
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse:
                  type: string
                  description: The base64-encoded, signed SAML response from the identity provider.
                RelayState:
                  type: string
                  description: The relay state that was sent with the sign-in request. Identifies the tracked request.
      responses:
        '302':
          description: The assertion verified. The hand-over cookie is set and the browser is redirected to the URL the sign-in began at.
          headers:
            Location:
              description: Normally /api/v1/auth/saml/complete.
              schema:
                type: string
        '403':
          description: The assertion did not verify, or the sign-in was not started by this server. Plain text body Forbidden.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: SAML is not configured (saml_not_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/saml/complete:
    get:
      operationId: samlComplete
      summary: Turn a SAML hand-over into a session.
      description: >-
        Reads the library's five-minute hand-over cookie, spends it (it is refused
        from then on, in this browser and on the server, even if a copy was kept),
        matches or provisions the account, starts a new session and redirects to
        /. If there is no hand-over cookie, the request starts a fresh SAML sign-in
        instead. A hand-over that was already spent is refused with a redirect to
        /login?error=sso_session_used. Account refusals redirect to
        /login?error=<code>, with the codes domain_not_allowed, account_disabled,
        account_link_refused, email_taken, invalid_assertion, email_not_verified
        and invalid_email. Answers 503 when SAML is not configured.
      tags: ['Single sign-on']
      x-ghd-handler: handleSAMLComplete
      security: []
      responses:
        '200':
          description: >-
            No hand-over cookie was present, and the identity provider's binding is
            HTTP-POST. The body is an HTML form that posts the new SAML request to
            the identity provider.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: No hand-over cookie was present, and the identity provider's binding is HTTP-Redirect. Redirects to the identity provider.
          headers:
            Location:
              description: The identity provider's sign-in URL.
              schema:
                type: string
        '303':
          description: >-
            Signed in, Location is /. Or refused, Location is /login?error=<code>
            with one of the codes listed in the description.
          headers:
            Location:
              description: / on success, or /login?error=<code> on refusal.
              schema:
                type: string
        '500':
          description: The session's identity could not be read as a SAML session (saml_session_invalid). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: SAML is not configured (saml_not_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/saml/login:
    get:
      operationId: samlLogin
      summary: Start a SAML sign-in at the identity provider.
      description: >-
        Starts a fresh SAML sign-in and records where the sign-in should return to:
        /api/v1/auth/saml/complete, whatever the query string says. Nothing from the
        request is used to choose the redirect target. Answers 503 when SAML is not
        configured.
      tags: ['Single sign-on']
      x-ghd-handler: handleSAMLLogin
      security: []
      responses:
        '302':
          description: Redirect to the identity provider, when its SSO endpoint uses the HTTP-Redirect binding.
          headers:
            Location:
              description: The identity provider's sign-in URL.
              schema:
                type: string
        '200':
          description: >-
            The identity provider's SSO endpoint uses the HTTP-POST binding. The
            body is an HTML form that posts the sign-in request.
          content:
            text/html:
              schema:
                type: string
        '500':
          description: The sign-in request could not be built. Plain text body with the library's error text.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: SAML is not configured (saml_not_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/saml/metadata:
    get:
      operationId: samlMetadata
      summary: Fetch this server's SAML service provider metadata.
      description: >-
        The XML an identity provider needs to trust this server. An administrator
        gives this URL to the identity provider. Answers 503 when SAML is not
        configured.
      tags: ['Single sign-on']
      x-ghd-handler: handleSAMLMetadata
      security: []
      responses:
        '200':
          description: The SAML service provider metadata document.
          content:
            application/samlmetadata+xml:
              schema:
                type: string
        '503':
          description: SAML is not configured (saml_not_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/signup:
    post:
      operationId: signup
      summary: Request a self-service account.
      description: >-
        Starts registration for an email address and, when the address is new,
        queues a verification email. The answer is the same whether or not the
        address already has an account, so this cannot be used to find out who has
        one. Refused with 403 signup_disabled when self-service signup is off, and
        with 422 domain_not_allowed when the address's domain is not permitted, or
        when no domains are listed and open registration is off. Each client
        address has a per-minute budget, and a refused attempt answers 429. Public
        and needs no credential.
      tags: ['Signup']
      x-ghd-handler: handleSignup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  description: The address to verify. Any password or display_name sent by an older client is ignored.
      responses:
        '202':
          description: Accepted. A verification email follows if the address is new.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    enum: ['Check your email to complete registration.']
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Self-service signup is disabled (signup_disabled). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: The address's domain is not permitted (domain_not_allowed). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/signup/status:
    get:
      operationId: signupStatus
      summary: Say whether self-service signup is offered.
      description: Public. The sign-in page reads it to decide whether to show the signup link.
      tags: ['Signup']
      x-ghd-handler: handleSignupStatus
      security: []
      responses:
        '200':
          description: The signup settings.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, open_registration, saml_enabled]
                properties:
                  enabled:
                    type: boolean
                    description: Self-service signup is switched on.
                  open_registration:
                    type: boolean
                    description: Any email domain may register, not only the listed ones.
                  saml_enabled:
                    type: boolean
                    description: SAML sign-in is enabled.
  /api/v1/auth/verify-email:
    get:
      operationId: lookupVerification
      summary: Look up the address behind a verification link.
      description: >-
        Shows the address a verification token belongs to, without using the
        token. The token is consumed only by POST /auth/verify-email. A missing or
        malformed token, an unknown or already used token, an expired one, and an
        address that has gained an account since the link was sent are all refused
        with 422. Public.
      tags: ['Signup']
      x-ghd-handler: handleLookupVerification
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: The verification token from the email link.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The address the token was issued for.
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email: {type: string}
        '422':
          description: >-
            The token is invalid (token_invalid) or expired (token_expired). Sent as
            application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      operationId: verifyEmail
      summary: Verify an address and create the account.
      description: >-
        Consumes a verification token, creates the account with the display name
        and password chosen here, and starts a session for it. The session is
        fully signed in unless the role must enrol a second factor, in which case
        mfa_enrollment_needed is true and the session is not yet marked as having
        passed MFA. A blank display name is refused with display_name_required, and a
        password outside 8 to 72 bytes with password_too_short or password_too_long,
        and in each case the link still works. A token that is invalid, expired or
        already used, or an address that has gained an account since, is refused
        with 422. Public.
      tags: ['Signup']
      x-ghd-handler: handleVerifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, display_name, password]
              properties:
                token:
                  type: string
                  format: uuid
                  description: The verification token from the email link.
                display_name:
                  type: string
                  description: The name shown for the account. Trimmed; must not be blank.
                password:
                  type: string
                  description: The password for the new account. Between 8 and 72 bytes.
      responses:
        '200':
          description: The account was created and the session is signed in.
          content:
            application/json:
              schema:
                type: object
                required: [user, mfa_enrollment_needed]
                properties:
                  user: {$ref: '#/components/schemas/User'}
                  mfa_enrollment_needed:
                    type: boolean
                    description: True when the role must enrol a second factor before it is fully signed in.
        '400':
          description: >-
            The body is not JSON (bad_request), the display name is blank
            (display_name_required), or the password is too short (password_too_short)
            or too long (password_too_long). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: >-
            The token is malformed, unknown, used, expired (token_expired), or the
            address has gained an account since the link was sent (token_invalid).
            Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/categories:
    get:
      operationId: listPublicCategories
      summary: List the top-level categories for the ticket form.
      description: >-
        Returns active categories only, for a guest or a reporting user. Staff and
        administrators whose session has passed MFA get archived categories too.
        Open to a signed-in caller of any role, to a key or OAuth client with no
        scopes, and to anyone when guest submission is enabled. Otherwise answers
        401. Returns an empty array, never null.
      tags: ['Catalogue']
      x-ghd-handler: handleListPublicCategories
      security:
        - {}
        - sessionCookie: []
        - apiKey: []
        - oauthClient: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      x-ghd-anonymous-when: guest_submission_enabled
      responses:
        '200':
          description: The categories, ordered by sort_order.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Category'}
        '401':
          description: >-
            Nobody is signed in and guest submission is off (unauthorized). Sent as
            application/json by the handler, not by the auth middleware.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/categories/{id}/types:
    parameters:
      - name: id
        in: path
        required: true
        description: The category's UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: listPublicTypes
      summary: List the types of one category for the ticket form.
      description: >-
        Returns the types of the category, active ones only for a guest or a
        reporting user, and archived ones too for staff and administrators whose
        session has passed MFA. An unknown category gives an empty array. Same
        callers as the category list.
      tags: ['Catalogue']
      x-ghd-handler: handleListPublicTypes
      security:
        - {}
        - sessionCookie: []
        - apiKey: []
        - oauthClient: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      x-ghd-anonymous-when: guest_submission_enabled
      responses:
        '200':
          description: The types, ordered by sort_order.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CategoryType'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            Nobody is signed in and guest submission is off (unauthorized). Sent as
            application/json by the handler.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/categories/{id}/types/{typeId}/items:
    parameters:
      - name: id
        in: path
        required: true
        description: The category's identifier. Not checked by this operation; only typeId selects the items.
        schema:
          type: string
      - name: typeId
        in: path
        required: true
        description: The type's UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: listPublicItems
      summary: List the items of one type for the ticket form.
      description: >-
        Returns the items of the type, active ones only for a guest or a reporting
        user, and archived ones too for staff and administrators whose session has
        passed MFA. The category in the path is not looked up, so an item list is
        returned for any category id that is sent. An unknown type gives an empty
        array. Same callers as the category list.
      tags: ['Catalogue']
      x-ghd-handler: handleListPublicItems
      security:
        - {}
        - sessionCookie: []
        - apiKey: []
        - oauthClient: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      x-ghd-anonymous-when: guest_submission_enabled
      responses:
        '200':
          description: The items, ordered by sort_order.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CategoryItem'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            Nobody is signed in and guest submission is off (unauthorized). Sent as
            application/json by the handler.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/logo:
    get:
      operationId: serveLogo
      summary: Fetch the site logo.
      description: >-
        The stored logo, a PNG no larger than 320 by 64 pixels, served with a
        five-minute public cache and a stricter Content-Security-Policy than the
        rest of the site. Public, so the sign-in page can show it before anyone
        signs in. The server ignores the v query parameter that the SPA appends for
        cache-busting. With no logo stored, the answer is a plain-text 404 from the
        standard library, not the JSON error envelope.
      tags: ['Site']
      x-ghd-handler: handleServeLogo
      security: []
      responses:
        '200':
          description: The logo image.
          headers:
            Cache-Control:
              description: public, max-age=300.
              schema:
                type: string
            Content-Security-Policy:
              description: The logo policy, stricter than the site-wide one.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: No logo is stored. Plain text body 404 page not found.
          content:
            text/plain:
              schema:
                type: string
  /api/v1/setup:
    post:
      operationId: setup
      summary: Create the first administrator account.
      description: >-
        Creates the first administrator and, if no category exists, the first
        category. The category name is taken from the optional category field and
        is called General when the field is blank or absent. Public, and permanently
        refused with 409 once any user exists. The category is created before the
        administrator, so a failure between the two can be retried. Returns the new
        user without its password hash.
      tags: ['Setup']
      x-ghd-handler: handleSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name, password]
              properties:
                email:
                  type: string
                  description: The administrator's email address.
                display_name:
                  type: string
                  description: The administrator's display name. Must not be blank.
                password:
                  type: string
                  description: The administrator's password. Between 8 and 72 bytes.
                category:
                  type: string
                  description: The name of the first category. Optional, used only when no category exists yet.
      responses:
        '201':
          description: The administrator was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Setup has already been completed (already_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/setup/status:
    get:
      operationId: setupStatus
      summary: Say whether first-run setup is still needed.
      description: Public. Answers needed true until the first user exists.
      tags: ['Setup']
      x-ghd-handler: handleSetupStatus
      security: []
      responses:
        '200':
          description: The setup state.
          content:
            application/json:
              schema:
                type: object
                required: [needed]
                properties:
                  needed: {type: boolean}
  /api/v1/site:
    get:
      operationId: getSiteConfig
      summary: Read the public site branding and version.
      description: >-
        The name, logo URL and version shown before sign-in, and whether guests may
        submit tickets. Public.
      tags: ['Site']
      x-ghd-handler: handleGetSiteConfig
      security: []
      responses:
        '200':
          description: The public site settings.
          content:
            application/json:
              schema:
                type: object
                required: [name, logo_url, version, guest_submission_enabled]
                properties:
                  name:
                    type: string
                    description: The site name. Defaults to Go Help Desk.
                  logo_url:
                    type: string
                    description: The URL of the logo, or the empty string when none is stored.
                  version:
                    type: string
                    description: The server version.
                  guest_submission_enabled:
                    type: boolean
  /health:
    get:
      operationId: health
      summary: Liveness probe.
      description: Outside /api/v1. Answers 200 whenever the process is serving requests, and does not check the database.
      tags: ['Health']
      x-ghd-handler: handleHealth
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /api/v1/admin/canned-responses:
    get:
      operationId: adminListCannedResponses
      summary: List every canned response
      description: |
        Returns every canned response, global and scoped alike, ordered by sort_order and then by name.
        The list is not paged. Administrators only.
      tags: ['Admin: Canned responses']
      x-ghd-handler: handleAdminListCannedResponses
      security:
        - sessionCookie: []
        - apiKey: ['canned_responses:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every canned response.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CannedResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The list could not be read (list_failed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      operationId: adminCreateCannedResponse
      summary: Create a canned response
      description: |
        Creates a reusable reply template. Its scope comes from category_id and type_id. When both are
        absent or null the response is global. A category_id alone makes it available on every ticket in
        that category. Both together make it available only on tickets of that category and type. A type_id
        without a category_id is refused with 400.
        name and body are trimmed and must not be blank. sort_order must fit in a 32-bit integer. A
        category_id or type_id that names nothing, or a type_id that does not belong to its category, is
        refused by the database and answered with 500 internal_error, not with 400 or 404.
      tags: ['Admin: Canned responses']
      x-ghd-handler: handleAdminCreateCannedResponse
      security:
        - sessionCookie: []
        - apiKey: ['canned_responses:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, body]
              properties:
                name:
                  type: string
                  description: Short label shown in the reply composer picker.
                body:
                  type: string
                  description: Text inserted verbatim into a reply.
                category_id:
                  description: Category the response is scoped to. Omit or null for a global response.
                  anyOf:
                    - {$ref: '#/components/schemas/Uuid'}
                    - {type: 'null'}
                type_id:
                  description: Type the response is scoped to. Requires category_id. Omit or null for the whole category.
                  anyOf:
                    - {$ref: '#/components/schemas/Uuid'}
                    - {type: 'null'}
                sort_order:
                  type: integer
                  default: 0
                  description: Position in the picker. Lower sorts first. Omitted means 0.
      responses:
        '201':
          description: The response as stored, including its created_at.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CannedResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The database refused the row, for example an unknown category_id or type_id (internal_error).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/canned-responses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The canned response's UUID.
        schema:
          type: string
          format: uuid
    patch:
      operationId: adminUpdateCannedResponse
      summary: Replace a canned response
      description: |
        Replaces every field of the response. Despite the verb this is not a merge. A field left out of the
        body takes its zero value, so an omitted category_id or type_id makes the response global and an
        omitted sort_order sets it to 0. Send the complete record.
        The same rules as create apply to name, body, scope and sort_order. An id that names no response
        answers 404 not_found, and the check happens after the body is validated.
      tags: ['Admin: Canned responses']
      x-ghd-handler: handleAdminUpdateCannedResponse
      security:
        - sessionCookie: []
        - apiKey: ['canned_responses:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, body]
              properties:
                name:
                  type: string
                  description: Short label shown in the reply composer picker.
                body:
                  type: string
                  description: Text inserted verbatim into a reply.
                category_id:
                  description: Category the response is scoped to. Omit or null for a global response.
                  anyOf:
                    - {$ref: '#/components/schemas/Uuid'}
                    - {type: 'null'}
                type_id:
                  description: Type the response is scoped to. Requires category_id. Omit or null for the whole category.
                  anyOf:
                    - {$ref: '#/components/schemas/Uuid'}
                    - {type: 'null'}
                sort_order:
                  type: integer
                  default: 0
                  description: Position in the picker. Lower sorts first. Omitted means 0.
      responses:
        '200':
          description: The response as stored after the update.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CannedResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The database refused the row, for example an unknown category_id or type_id (internal_error).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: adminDeleteCannedResponse
      summary: Delete a canned response
      description: |
        Hard-deletes the response. Replies that already contain its text are not affected, because the body
        was copied into the reply when it was inserted. Deleting an id that does not exist also answers 204.
      tags: ['Admin: Canned responses']
      x-ghd-handler: handleAdminDeleteCannedResponse
      security:
        - sessionCookie: []
        - apiKey: ['canned_responses:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The delete failed in storage (delete_failed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/tags:
    get:
      operationId: adminListTags
      summary: List every tag, including deactivated ones
      description: |
        Returns all tags, active and deactivated, ordered by name. A deactivated tag carries deleted_at.
        The list is not paged. Administrators only.
      tags: ['Admin: Tags']
      x-ghd-handler: handleAdminListTags
      security:
        - sessionCookie: []
        - apiKey: ['tags:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every tag.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Tag'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The list could not be read (list_failed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      operationId: adminCreateTag
      summary: Create a tag by name
      description: |
        The name is trimmed and lowercased. If an active tag already has that name, that tag is returned
        with 201 and nothing new is created, so a repeated name is not a conflict. If the name belongs to a
        deactivated tag, the answer is 409 tag_deleted, and the tag has to be restored instead.
      tags: ['Admin: Tags']
      x-ghd-handler: handleAdminCreateTag
      security:
        - sessionCookie: []
        - apiKey: ['tags:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Tag name. Trimmed and lowercased; must not be blank.
      responses:
        '201':
          description: The tag. Either newly created or the active tag that already had this name.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tag'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A deactivated tag with this name exists. Restore it instead (tag_deleted).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: The tag could not be created or read back (internal_error).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/tags/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The tag's UUID.
        schema:
          type: string
          format: uuid
    delete:
      operationId: adminDeleteTag
      summary: Deactivate a tag
      description: |
        Soft-deletes the tag. It disappears from autocomplete and stays on every ticket that already carries
        it. Deactivating an unknown or already deactivated id also answers 204.
      tags: ['Admin: Tags']
      x-ghd-handler: handleAdminDeleteTag
      security:
        - sessionCookie: []
        - apiKey: ['tags:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The deactivation failed in storage (delete_failed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/tags/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        description: The tag's UUID.
        schema:
          type: string
          format: uuid
    post:
      operationId: adminRestoreTag
      summary: Restore a deactivated tag
      description: |
        Clears the deactivation, so the tag is usable again. Restoring an unknown id, or a tag that is already
        active, also answers 204.
      tags: ['Admin: Tags']
      x-ghd-handler: handleAdminRestoreTag
      security:
        - sessionCookie: []
        - apiKey: ['tags:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The restore failed in storage (restore_failed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/groups:
    get:
      operationId: listGroupsForAssignment
      summary: List groups for ticket assignment
      description: |
        Returns every group with its name and description, so a ticket can be assigned to one. Membership
        and category scopes are not included; those come from the admin group endpoints. Not paged.
        Available to administrators and staff.
      tags: ['Reference data']
      x-ghd-handler: handleListGroups
      security:
        - sessionCookie: []
        - apiKey: ['groups:read']
        - oauthClient: ['groups:read']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every group.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Group'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/guest/follow-up:
    post:
      operationId: guestFollowUp
      summary: Open a follow-up of the closed ticket the link names
      description: |
        Creates a new ticket for the same guest, linked to the closed ticket that the token names, and
        answers with the new tracking number. The new ticket is filed under the same category as the
        original. Its type and item are not copied, and the body is ignored, so there is nothing to send.
        The link for the new ticket goes out by email and is not in the response.
        Only one follow-up can be opened from a closed ticket. Every refusal that would reveal the state of a
        link or a ticket is the same 404 not_found, including a ticket that is still open, a follow-up that
        already exists, and guest submission being switched off. An archived category answers 400 and names
        the reason. The per-address submission budget applies, and it is shared with POST /guest/tickets.
      tags: ['Guest']
      x-ghd-handler: handleGuestFollowUp
      security:
        - guestToken: []
      responses:
        '201':
          description: The new ticket's tracking number.
          content:
            application/json:
              schema:
                type: object
                required: [tracking_number]
                properties:
                  tracking_number: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/GuestNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/guest/replies:
    post:
      operationId: guestAddReply
      summary: Add a reply to the guest's ticket
      description: |
        Adds the guest's reply to the ticket the token names. The body must not be blank. The reply has no
        author, is never internal, and is not mailed back to the guest. Staff see it in the thread.
        A reply to a Resolved ticket inside the reopen window reopens the ticket to the configured reopen
        status. If no valid reopen status is configured, that reply is refused with 400 bad_request. A closed
        ticket answers 404, the same as a bad token. A Resolved ticket past its reopen window answers 409
        reopen_window_closed. This route is not gated by the guest submission setting, so a
        conversation already in progress continues when submission is switched off.
      tags: ['Guest']
      x-ghd-handler: handleGuestAddReply
      security:
        - guestToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  description: The reply text. Must not be blank after trimming.
      responses:
        '201':
          description: The reply as stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountGuestReply'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/GuestNotFound'
        '409':
          description: The ticket is Resolved and its reopen window has closed (reopen_window_closed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/guest/resend:
    post:
      operationId: guestResend
      summary: Ask for a fresh guest link by email
      description: |
        Asks for a new link to a ticket, given its tracking number and the address it was submitted with.
        While guest submission is on, this always answers 202 with an empty body, whether or not anything
        matched, so the answer does not reveal whether a tracking number or an address exists. Matching
        happens later, when the email is prepared. Both fields are needed for any work to be queued.
        On an open ticket the new link replaces the previous one. On a closed ticket it is added beside the
        existing links, and it can only read. The request is charged against a per-address budget. A
        per-ticket budget is charged when the email is prepared, and a request that exceeds it sends nothing.
      tags: ['Guest']
      x-ghd-handler: handleGuestResend
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tracking_number:
                  type: string
                  description: The ticket's tracking number. Trimmed.
                email:
                  type: string
                  description: The address the ticket was submitted with. Trimmed.
      responses:
        '202':
          description: Accepted. The body is empty.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Guest submission is switched off (not_found).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/guest/ticket:
    get:
      operationId: guestGetTicket
      summary: Read the guest's ticket and its replies
      description: |
        Returns the ticket the token names, as the guest may see it. Assignee, group, reporter and resolution
        data are not included. Only replies the guest may see are included, with their author removed.
        from_you is true for the guest's own replies.
        A closed ticket can still be read. Closing stops links being rotated but does not revoke them, so
        the last link sent reads the archive until that link expires.
      tags: ['Guest']
      x-ghd-handler: handleGuestGetTicket
      security:
        - guestToken: []
      responses:
        '200':
          description: The ticket view.
          content:
            application/json:
              schema:
                type: object
                required: [tracking_number, subject, description, status, created_at, updated_at, replies]
                properties:
                  tracking_number: {type: string}
                  subject: {type: string}
                  description: {type: string}
                  status:
                    type: string
                    description: The name of the ticket's current status. Empty if the status cannot be found.
                  created_at: {type: string, format: date-time}
                  updated_at: {type: string, format: date-time}
                  replies:
                    type: array
                    items: {$ref: '#/components/schemas/AccountGuestReply'}
        '404':
          $ref: '#/components/responses/GuestNotFound'
  /api/v1/guest/tickets:
    post:
      operationId: guestCreateTicket
      summary: Submit a ticket without an account
      description: |
        Opens a ticket for a guest. Answers 404 not_found while guest submission is switched off.
        subject is required and is limited to 500 bytes. description is limited to 50,000 bytes. category_id
        must name an active category that is open to guests. guest_email is required and must be a plain
        address without a display name. guest_name is required. guest_phone is optional. Priority is always
        medium and cannot be set by a guest.
        The response carries only the tracking number. The access link is emailed to guest_email, so a guest
        proves ownership of the address by using the link. The per-address budget is shared with
        POST /guest/follow-up.
      tags: ['Guest']
      x-ghd-handler: handleGuestCreateTicket
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, category_id, guest_email, guest_name]
              properties:
                subject:
                  type: string
                  description: One-line summary. Must not be blank; at most 500 bytes.
                description:
                  type: string
                  description: Free text. At most 50,000 bytes.
                category_id: {$ref: '#/components/schemas/Uuid'}
                guest_email:
                  type: string
                  description: Address to send the link to. Must be a valid address and is stored lowercased.
                guest_name:
                  type: string
                  description: The guest's name. Trimmed; must not be blank.
                guest_phone:
                  type: string
                  description: Optional phone number. Trimmed.
      responses:
        '201':
          description: The tracking number of the new ticket.
          content:
            application/json:
              schema:
                type: object
                required: [tracking_number]
                properties:
                  tracking_number: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Guest submission is switched off (not_found).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me:
    get:
      operationId: getMe
      summary: Return the caller's own account
      description: |
        Returns the signed-in account. An API key answers with its owner's account. An OAuth client is not a
        person, so it answers with machine set to true, together with its role and its scopes. A session must
        have passed its second factor.
      tags: ['Account']
      x-ghd-handler: handleGetMe
      security:
        - sessionCookie: []
        - apiKey: []
        - oauthClient: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: The caller's account, or the identity of an OAuth client.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/User'}
                  - type: object
                    required: [machine, role, scopes]
                    properties:
                      machine: {type: boolean, enum: [true]}
                      role: {$ref: '#/components/schemas/Role'}
                      scopes:
                        type: [array, 'null']
                        items: {type: string}
                        description: The scopes the token carries. JSON null when the token has none.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/mfa/enroll:
    post:
      operationId: mfaEnrollStart
      summary: Start TOTP enrolment
      description: |
        Generates a TOTP secret and returns it with its otpauth URL and a QR code as a PNG data URL. The secret
        is staged in this session only. The account's authenticator does not change until
        POST /me/mfa/enroll/confirm accepts a code from it.
        This route does not require a passed second factor, so someone compelled to enrol can finish. If the
        account already has a second factor (TOTP or a passkey), the session must have proved one of them, or
        the answer is 403 mfa_required. Session only: API keys and OAuth clients are refused.
      tags: ['Account']
      x-ghd-handler: handleMFAEnrollStart
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      responses:
        '200':
          description: The staged secret and how to load it into an authenticator.
          content:
            application/json:
              schema:
                type: object
                required: [secret, qr_url, qr_data_url]
                properties:
                  secret:
                    type: string
                    description: The TOTP secret, base32 encoded.
                  qr_url: {type: string, description: The otpauth:// URL the QR code encodes.}
                  qr_data_url: {type: string, description: A data:image/png;base64 URI of the QR code.}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Two sources. The authentication middleware refuses a machine credential with session_required, as
            text/plain. The factor guard refuses with mfa_required when the account already has a second factor
            and this session has not proved one. GenerateMFASecret refuses with mfa_already_enrolled. The last
            two are application/json.
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/mfa/enroll/confirm:
    post:
      operationId: mfaEnrollConfirm
      summary: Confirm TOTP enrolment with a code
      description: |
        Checks a TOTP code against the secret staged in this session by POST /me/mfa/enroll. On success the
        secret becomes the account's TOTP factor, this session counts as having passed its second factor, and
        every other session for the account ends.
        Each attempt, right or wrong, spends one of the account's TOTP attempts. Too many wrong codes lock
        the account for the lock duration, which Retry-After reports (900 seconds). Session only, and the
        factor guard of POST /me/mfa/enroll applies again here.
      tags: ['Account']
      x-ghd-handler: handleMFAEnrollConfirm
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The current code from the authenticator.
      responses:
        '204':
          description: The factor is enrolled. A new session cookie is set and the other sessions have ended.
        '400':
          description: |
            bad_request when the body is not JSON. invalid_code when the code is wrong, or when no enrolment is
            staged in this session. The message says which.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Two sources. The authentication middleware refuses a machine credential with session_required, as
            text/plain. mfa_required is application/json, and comes from the factor guard, or when the account
            gained a second factor while the enrolment was pending.
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/passkeys:
    get:
      operationId: listPasskeys
      summary: List the caller's passkeys
      description: |
        Returns the passkeys registered to this account. Key material and the authenticator's credential id
        are never returned. Session only.
      tags: ['Account']
      x-ghd-handler: handleListPasskeys
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      responses:
        '200':
          description: The account's passkeys. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Passkey'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/passkeys/register/finish:
    post:
      operationId: passkeyRegisterFinish
      summary: Complete passkey registration
      description: |
        Completes the WebAuthn registration that POST /me/passkeys/register/start began. It checks the response
        against the challenge staged in this session and stores the new key on the account. A challenge can be
        used once. A registered passkey counts as a passed second factor for this session, and every other
        session for the account ends.
        The name query parameter labels the key. A name longer than 128 bytes is cut short on a character
        boundary, not refused. Session only. The factor guard of POST /me/mfa/enroll applies.
      tags: ['Account']
      x-ghd-handler: handlePasskeyRegisterFinish
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      parameters:
        - name: name
          in: query
          required: false
          description: Label for the new key. Optional. Truncated to 128 bytes.
          schema:
            type: string
      requestBody:
        required: true
        description: The credential returned by the browser's navigator.credentials.create() call, as JSON.
        content:
          application/json:
            schema:
              type: object
              description: |
                The W3C PublicKeyCredential attestation JSON. It is read by go-webauthn's FinishRegistration and is
                not modelled field by field.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: |
            no_challenge when no registration is in progress in this session. challenge_expired when the challenge
            has timed out. registration_refused when the authenticator's response did not verify.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Two sources. The authentication middleware refuses a machine credential with session_required, as
            text/plain. mfa_required is application/json, and comes from the factor guard.
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That authenticator is already registered (credential_exists).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/me/passkeys/register/start:
    post:
      operationId: passkeyRegisterStart
      summary: Begin passkey registration
      description: |
        Returns the WebAuthn creation options for a new passkey, and stages the challenge in this session so
        that POST /me/passkeys/register/finish can check the answer. The factor guard of POST /me/mfa/enroll
        applies. Session only.
      tags: ['Account']
      x-ghd-handler: handlePasskeyRegisterStart
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      responses:
        '200':
          description: The creation options. This is the JSON that go-webauthn's CredentialCreation serialises to.
          content:
            application/json:
              schema:
                type: object
                description: |
                  The go-webauthn CredentialCreation JSON. Its publicKey member is the W3C
                  PublicKeyCredentialCreationOptions. Not modelled field by field.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Two sources. The authentication middleware refuses a machine credential with session_required, as
            text/plain. mfa_required is application/json, and comes from the factor guard.
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/passkeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The passkey's UUID, as listed by GET /me/passkeys.
        schema:
          type: string
          format: uuid
    delete:
      operationId: deletePasskey
      summary: Remove a passkey
      description: |
        Removes one of the caller's passkeys. An id that belongs to another account answers the same 404 as an
        id that does not exist. The factor guard of POST /me/mfa/enroll applies, so a session that has only
        passed the password cannot remove a factor from an account that already has one. Session only.
      tags: ['Account']
      x-ghd-handler: handleDeletePasskey
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Two sources. The authentication middleware refuses a machine credential with session_required, as
            text/plain. mfa_required is application/json, and comes from the factor guard.
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/password:
    patch:
      operationId: changePassword
      summary: Change the caller's password
      description: |
        Changes the password after checking the current one. The new password must be 8 to 72 bytes long.
        Every other session for the account ends, and this request's session is re-issued with a new cookie,
        so this browser stays signed in. Session only, and the second factor must have passed.
        A wrong current_password answers 401 invalid_credentials as application/json. That is the handler's
        own refusal and is not the Unauthorized response listed below, which the authentication middleware
        writes. The old field name password is still read when new_password is absent. current_password is
        required in either case.
      tags: ['Account']
      x-ghd-handler: handleChangePassword
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password:
                  type: string
                  description: The password the account has now.
                new_password:
                  type: string
                  description: The replacement password. Required unless the deprecated password field is sent instead.
                password:
                  type: string
                  deprecated: true
                  description: The original name of new_password. Read only when new_password is absent.
      responses:
        '204':
          description: The password is changed. A new session cookie is set and the other sessions have ended.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            Either no session (unauthorized, text/plain, from the auth middleware)
            or a wrong current_password (invalid_credentials, application/json,
            from the handler).
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/staff:
    get:
      operationId: listAssignableStaff
      summary: List accounts for the assignee picker
      description: |
        Returns every account that is not deleted, with its id, display name and an assignable flag. The
        name is deliberately not limited to staff: reporting users appear too, with assignable set to false,
        so a ticket already assigned to a colleague who has since been disabled or moved to the reporting role
        can still show their name. Email, role and login state are not included. Not paged. Available to
        administrators and staff.
      tags: ['Reference data']
      x-ghd-handler: handleListAssignableStaff
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every account that is not deleted.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, display_name, assignable]
                  properties:
                    id: {$ref: '#/components/schemas/Uuid'}
                    display_name: {type: string}
                    assignable:
                      type: boolean
                      description: True for an active staff member or administrator. False for a disabled account or one in the reporting role.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/statuses:
    get:
      operationId: listStatuses
      summary: List ticket statuses with counts for the caller
      description: |
        Returns every status, active and inactive, ordered by sort order and then name. ticket_count depends on
        who asks. An administrator sees every ticket. Staff see tickets assigned to them or to one of their
        groups. A reporting user sees tickets they reported. A count that cannot be computed is reported as 0.
      tags: ['Reference data']
      x-ghd-handler: handleListStatuses
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every status.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Status'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tags:
    get:
      operationId: listActiveTags
      summary: Search active tags for autocomplete
      description: |
        Returns active tags only, ordered by name. With q, returns the tags whose names start with q, matched
        case-insensitively after trimming, and at most 20 of them. Without q, returns every active tag. The
        value of q is used as a LIKE prefix, and its % and _ characters are not escaped, so they match as
        wildcards.
      tags: ['Reference data']
      x-ghd-handler: handleListActiveTags
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      parameters:
        - name: q
          in: query
          required: false
          description: Name prefix to match. Optional.
          schema:
            type: string
      responses:
        '200':
          description: Matching active tags.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Tag'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The search failed in storage (list_failed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/audit:
    get:
      operationId: listAdminAudit
      summary: Search the audit log across every entity
      description: |
        The admin-wide half of the audit trail (#129), searchable across every
        entity type. Entries are newest first. Pages are read with limit and
        offset; has_more says whether another page exists.
        Staff are narrowed twice. entity_type is forced to ticket whatever the
        query asks for, and when ticket scope enforcement is on only entries on
        tickets inside the caller's scope are returned. The page, the offset and
        the total all come from the same filtered sequence. Administrators see
        every entity.
        The field-level before and after diff is returned to administrators
        always, and to staff only when the staff change-history setting is on.
        It is redacted by the same rule as the per-ticket feed. Every other
        caller gets no before or after.
        total counts the matching entries the caller may see, up to 10,000.
        When more match, total_capped is true and total is 10000, which means
        at least that many.
      tags: ['Audit']
      x-ghd-handler: handleListAdminAudit
      security:
        - sessionCookie: []
        - apiKey: ['audit:read']
        - oauthClient: ['audit:read']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: entity_type
          in: query
          required: false
          description: Only entries for this entity type (for example ticket or user). Trimmed. Forced to ticket for staff.
          schema:
            type: string
        - name: action
          in: query
          required: false
          description: Only entries with this action name. Trimmed.
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Free-text search over the audit rows. Trimmed. Must be valid UTF-8 without NUL bytes.
          schema:
            type: string
        - name: actor_id
          in: query
          required: false
          description: Only entries by this actor.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: from
          in: query
          required: false
          description: Only entries created at or after this instant (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only entries created at or before this instant (RFC 3339).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One page of audit entries, with the total and the paging flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditPage'
        '400':
          description: |
            `bad_request`. The message names the problem: actor_id must be a UUID,
            from or to must be an RFC 3339 timestamp, or entity_type, action or q
            is not valid UTF-8 or contains a NUL byte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tickets:
    get:
      operationId: listTickets
      summary: List the tickets the caller may work with
      description: |
        Returns the tickets the caller may see, each as a TicketView: the ticket
        plus its live SLA status and can_reopen. Which tickets come back depends
        on the caller.
        - A reporting user (role user) gets the tickets they reported. Their sla
          is always null and can_reopen is always false.
        - Staff and administrators get, by default (scope=mine), the tickets
          assigned to them or to any of their groups. With ticket scope
          enforcement on, staff get every ticket their scope admits instead,
          including unassigned tickets in a category their groups cover.
        - An OAuth client acts as staff and gets the staff listing.
        Four parameters can change the listing. reporter_id (admin only) is
        checked first, then assignee_group_id, then scope=unassigned or
        scope=all (admin only). The first one present wins. Any other scope
        value is ignored and the default listing is used.
        q searches by tracking number prefix, subject and description (full-text
        search). Results are newest first. The response is a bare array with no
        total and no next link, so page with limit and offset.
      tags: ['Tickets']
      x-ghd-handler: handleListTickets
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      parameters:
        - name: q
          in: query
          required: false
          description: Search text (tracking number prefix, subject, description). Trimmed; blank means no search.
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: "mine (the default), unassigned or all. unassigned and all are admin only. Other values are ignored and behave as mine."
          schema:
            type: string
        - name: reporter_id
          in: query
          required: false
          description: Only tickets this account reported. Admin only.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: assignee_group_id
          in: query
          required: false
          description: Only tickets assigned to this group. Staff must belong to the group when ticket scope enforcement is on.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: The caller's tickets, newest first, as a bare array (never null).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketView'
        '400':
          description: |
            `bad_request`: invalid reporter_id or invalid assignee_group_id (not a
            UUID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain): the role or MFA or scope check
            failed. Or refused by the handler (application/json, `forbidden`):
            only admins can filter by reporter; users cannot list group tickets;
            you are not a member of that group (staff, scope enforcement on);
            only admins can use this scope (scope=unassigned or scope=all).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createTicket
      summary: Open a new ticket
      description: |
        Creates a ticket and answers 201 with the new Ticket (the bare ticket,
        not the TicketView). The tracking number uses the instance's ticket
        prefix. The ticket is then routed like any new ticket: a group whose
        category and type rules match takes it first, then the global group, then
        the round-robin users if they are configured.
        What the caller may set depends on the role.
        - Staff and administrators may set every field, including item_id and
          priority.
        - A reporting user has item_id and priority ignored (priority becomes
          medium), must file into an active category, and must use an active
          type when type_id is sent.
        subject is required after trimming. description is optional. subject is
        limited to 500 bytes and description to 50,000 bytes. type_id must belong
        to category_id, and for staff an item_id must belong to type_id.
        custom_fields maps custom field ids to values. Empty values, and ids that
        are not fields of this ticket's classification, are skipped without an
        error. They are written after the ticket exists, so a failure there does
        not fail the request.
        An OAuth client acts with no person behind it, and a ticket needs a
        reporter, so such a credential is refused with 403 user_identity_required.
      tags: ['Tickets']
      x-ghd-handler: handleCreateTicket
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, category_id]
              properties:
                subject:
                  type: string
                  description: Required after trimming. At most 500 bytes.
                description:
                  type: string
                  description: Optional. At most 50,000 bytes.
                category_id:
                  $ref: '#/components/schemas/Uuid'
                type_id:
                  description: Must belong to category_id. A reporting user may only use an active type.
                  $ref: '#/components/schemas/Uuid'
                item_id:
                  description: Ignored for a reporting user. Must belong to type_id.
                  $ref: '#/components/schemas/Uuid'
                priority:
                  description: Ignored for a reporting user, who always gets medium. Defaults to medium when absent.
                  $ref: '#/components/schemas/Priority'
                custom_fields:
                  description: Field id to value. Values are strings. Unknown or empty entries are skipped.
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '201':
          description: The ticket that was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: |
            `bad_request`, with a message naming the field. Covers invalid JSON,
            subject is required, category_id is required, a category or type
            that is not active for a reporting user (category_id is not an active
            category; type_id is not an active type), type_id does not belong to
            category_id, and the domain's own checks (for example priority must
            be one of critical, high, medium, low, or subject is too long).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `user_identity_required`, for an OAuth client
            acting without a person behind it.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/fields:
    get:
      operationId: resolveFieldsForCTI
      summary: List the custom fields for a category, type and item
      description: |
        The custom field assignments that apply to a classification, used by the
        new-ticket form. Every signed-in role may call it. category_id is
        required. type_id and item_id are optional, and each must be a UUID when
        it is sent. Answers an empty array when no field applies.
      tags: ['Tickets']
      x-ghd-handler: handleResolveFieldsForCTI
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      parameters:
        - name: category_id
          in: query
          required: true
          description: The category. Required; must be a UUID.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: type_id
          in: query
          required: false
          description: The type. Must be a UUID when sent.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: item_id
          in: query
          required: false
          description: The item. Must be a UUID when sent.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The assignments that apply, as a bare array (never null).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldAssignment'
        '400':
          description: "`bad_request`: category_id is required (missing or not a UUID), or type_id or item_id is not a UUID."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    get:
      operationId: getTicket
      summary: Get one ticket
      description: |
        Returns one ticket as a TicketView. This is the only route under
        /tickets/{id} that accepts a tracking number as well as a UUID (matched
        case-insensitively). Every other route in this subtree takes a UUID only.
        A ticket the caller may not see answers 404 not_found, exactly as a
        ticket that does not exist does. It is never 403, so tracking numbers
        cannot be probed (#174). A reporting user sees only the tickets they
        reported. For them sla is null and can_reopen is false.
      tags: ['Tickets']
      x-ghd-handler: handleGetTicket
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: The ticket, with its live SLA status and can_reopen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
    patch:
      operationId: updateTicket
      summary: Change a ticket's status, assignment or classification
      description: |
        Applies whichever of status_id, clear_assignee, assignee_user_id,
        assignee_group_id and category_id are sent, and answers 200 with the bare
        Ticket. The path id must be a UUID. A tracking number that the caller can
        see answers 400 bad_request, "invalid ticket ID".
        The changes run in this order: status, then assignment, then
        classification. Each is saved on its own, with no transaction around the
        three. If a later one is refused, the earlier ones have already been
        saved and the response is an error.
        Who may do what:
        - A reporting user cannot change the status (403 forbidden), cannot
          assign (403 forbidden), and cannot reclassify (403, "only staff can
          reclassify tickets").
        - Only an administrator may set the status to Closed (403 forbidden for
          anyone else).
        - Leaving Closed needs closed_reopen_policy to allow the caller's role.
          Otherwise the answer is 409 ticket_closed.
        - An assignee must be an account that exists, is not deleted or disabled,
          and is staff or an administrator (400 bad_request otherwise). A group
          must exist (400 bad_request).
        - An unknown status_id answers 404 not_found, "status not found". This is
          not the ticket 404 documented here.
        - An OAuth client acting without a person behind it is refused with 403
          user_identity_required.
        For status_id, assignee_user_id, assignee_group_id, category_id, type_id
        and item_id, an absent key and a null mean the same thing. clear_assignee
        true unassigns the ticket, and wins over the two assignee fields. Sending
        category_id replaces the whole classification: type_id and item_id are
        written as sent, so an absent one clears that level. type_id and item_id
        have no effect unless category_id is sent too.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleUpdateTicket
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status_id:
                  description: The status to move the ticket to. Staff and administrators only.
                  $ref: '#/components/schemas/Uuid'
                assignee_user_id:
                  description: Staff or administrator account to assign the ticket to.
                  $ref: '#/components/schemas/Uuid'
                assignee_group_id:
                  description: Group to assign the ticket to.
                  $ref: '#/components/schemas/Uuid'
                clear_assignee:
                  description: When true, unassigns the ticket and ignores assignee_user_id and assignee_group_id.
                  type: boolean
                category_id:
                  description: Replaces the category. Staff and administrators only. Resets type_id and item_id as sent.
                  $ref: '#/components/schemas/Uuid'
                type_id:
                  description: The type to set with category_id. Absent clears it.
                  $ref: '#/components/schemas/Uuid'
                item_id:
                  description: The item to set with category_id. Absent clears it.
                  $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The ticket after the changes, as the bare Ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: |
            `bad_request`: invalid JSON; invalid ticket ID (a tracking number, or
            a value that is not a UUID); an assignee that is not a user on this
            help desk, deleted, disabled or a reporting user; or a classification
            the domain refuses (category_id is not a category on this help desk,
            or type_id and item_id do not belong to the category and to each
            other).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `forbidden` for a reporting user changing the
            status, assigning, or reclassifying; `user_identity_required` for an
            OAuth client.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: "`ticket_closed`: the ticket is Closed and the caller's role may not move it out of Closed."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/audit:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    get:
      operationId: listTicketAudit
      summary: List a ticket's audit trail
      description: |
        The per-ticket activity feed (#129): every audit entry recorded against
        the ticket, oldest first, capped at the newest 500 entries. Each entry has
        the action, the actor and the time.
        Who sees what:
        - A reporting user gets no actor for assigned and unassigned entries.
          actor_id is null there, and the actor's name is not sent. Staff and
          administrators are named.
        - before and after (the field-level diff, redacted) go only to
          administrators, and to staff when the staff change-history setting is
          on. Everyone else gets neither.
        - Where requester-name masking applies, actor_name is the label
          Requester and actor_masked is true.
        The id must be a UUID.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleListTicketAudit
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: The ticket's audit entries, oldest first, as a bare array (never null).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketAuditEntry'
        '400':
          description: "`bad_request`: invalid ticket ID (the path id is not a UUID)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
  /api/v1/tickets/{id}/canned-responses:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    get:
      operationId: listTicketCannedResponses
      summary: List the canned responses for this ticket's category and type
      description: |
        The reply-composer picker. Returns the canned responses that apply to the
        ticket's category and type, in sort order and then by name. Staff and
        administrators only. A reporting user gets 403 forbidden for a ticket they
        can see, and 404 for one they cannot. The id must be a UUID.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleListTicketCannedResponses
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      responses:
        '200':
          description: The canned responses that apply, as a bare array (never null).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CannedResponse'
        '400':
          description: "`invalid_id`: invalid ticket id (the path id is not a UUID)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '500':
          description: "`list_failed`: the canned responses could not be read."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/close:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    post:
      operationId: closeTicket
      summary: Close a ticket
      description: |
        Administrators only. Moves the ticket to Closed and answers 200 with the
        Ticket. Closing a ticket that is already Closed succeeds and writes
        nothing. A closed ticket is read-only to its reporter, and a reporter's
        follow-up is the way forward (see the follow-up route).
        Anyone who is not an administrator is refused with 403 forbidden, "only
        admins can close tickets", on a ticket they can see. An OAuth client acting without a person behind it
        is refused with 403 user_identity_required. The path id must be a UUID.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleCloseTicket
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
