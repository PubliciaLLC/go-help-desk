  /api/v1/tickets/{id}/links:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    get:
      operationId: listLinks
      summary: List this ticket's links to other tickets
      description: |
        Every link in which this ticket is the source or the target, in no
        guaranteed order. A link is directional: source_id is the ticket it starts
        from and target_id the ticket it points to. The id must be a UUID.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleListLinks
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: The links, as a bare array (never null).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketLink'
        '400':
          description: "`bad_request`: invalid ticket ID (the path id is not a UUID)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
    post:
      operationId: addLink
      summary: Link this ticket to another ticket
      description: |
        Creates a directed link from this ticket (the source) to target_id. The
        link type is one of related_to, parent_child (the source is the parent),
        caused_by (the source was caused by the target) or duplicate_of. A new
        link answers 204 with no body.
        With resolve_as_duplicate true, which needs link_type duplicate_of, the
        source is also resolved in the same transaction as a duplicate of the
        target. resolution_notes is used as the resolution note, and a blank one
        becomes "Duplicate of" followed by the target's tracking number. That
        answers 200 with the source Ticket. Resolving needs staff or an
        administrator, so a reporting user gets 403 forbidden.
        The target must be a ticket the caller can see. A target they cannot see,
        or one that does not exist, answers 404 not_found with the target's id in
        the message, the same as a missing ticket (#174). A ticket cannot link to
        itself (400 cannot_link_self). The same source, target and type a second
        time is 409 link_already_exists. A reporting user cannot link a Closed
        ticket in either direction (409 ticket_closed). An OAuth client acting
        without a person behind it is refused with 403 user_identity_required.
        The path id must be a UUID. target_id is required. Absent, it is the nil
        UUID, which answers 404 not_found.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleAddLink
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, link_type]
              properties:
                target_id:
                  description: The ticket to link to. Must be visible to the caller.
                  $ref: '#/components/schemas/Uuid'
                link_type:
                  description: One of related_to, parent_child, caused_by, duplicate_of.
                  type: string
                  enum: [related_to, parent_child, caused_by, duplicate_of]
                resolve_as_duplicate:
                  description: When true, link_type must be duplicate_of. Also resolves this ticket as a duplicate of the target (staff and administrators only). Defaults to false.
                  type: boolean
                resolution_notes:
                  description: The resolution note used with resolve_as_duplicate. Blank uses the default note.
                  type: string
      responses:
        '200':
          description: Only with resolve_as_duplicate. The resolved source ticket, as the bare Ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: |
            `bad_request`: invalid JSON; invalid ticket ID (the path id is not a
            UUID); resolve_as_duplicate with a link type other than duplicate_of;
            or an unknown link type (invalid link type). `cannot_link_self`: the
            target is this ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `user_identity_required` for an OAuth client, or
            `forbidden` for a reporting user using resolve_as_duplicate.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            `link_already_exists`: that link is already there. `ticket_closed`: a
            reporting user is linking a Closed ticket, or resolve_as_duplicate is
            applied to a Closed ticket and closed_reopen_policy does not allow the
            caller's role to reopen it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/links/{targetId}/{linkType}:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
      - name: targetId
        in: path
        required: true
        schema:
          type: string
      - name: linkType
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeLink
      summary: Remove a link from this ticket to another
      description: |
        Deletes the link of type linkType that runs from this ticket to targetId.
        Direction matters: a link stored the other way round is not touched.
        Answers 204 with no body.
        Staff and administrators only. A reporting user gets 403 forbidden on a
        ticket they can see. The target must also be visible to the caller,
        otherwise the answer is 404 not_found with the target's id in the message.
        A link that does not exist still answers 204.
        linkType must be one of related_to, parent_child, caused_by or
        duplicate_of. Both ids must be UUIDs.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleRemoveLink
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: |
            `bad_request`: invalid ticket ID; invalid target ID (targetId is not a
            UUID); or invalid link type (linkType is not one of the four types).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json), `forbidden`: only staff can remove a ticket link.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
  /api/v1/tickets/{id}/reopen:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    post:
      operationId: reopenTicket
      summary: Force-reopen a Closed ticket
      description: |
        Moves a Closed ticket back to the reopen target status. That is the
        configured status, falling back to New when it does not resolve. Answers
        200 with the bare Ticket.
        This is off by default. Under the default closed_reopen_policy every
        caller gets 409 ticket_closed, with the reason in the message. The setting
        can allow administrators only, or staff and administrators. A reporting
        user is always refused with 403 forbidden. The ticket must be Closed,
        otherwise the answer is 409 ticket_not_closed. The path id must be a UUID.
        An OAuth client acting without a person behind it is refused with 403
        user_identity_required.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleReopenTicket
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: The reopened ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: "`bad_request`: invalid ticket ID (the path id is not a UUID), or no valid reopen target status is configured."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `forbidden`, "users cannot directly reopen
            tickets", for a reporting user; `user_identity_required` for an OAuth
            client.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            `ticket_closed`: the closed_reopen_policy in force refuses the reopen
            for this caller's role (the message says why). `ticket_not_closed`:
            the ticket is not Closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/replies:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    get:
