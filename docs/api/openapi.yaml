  /api/v1/admin/oauth-clients:
    get:
      operationId: listOAuthClients
      summary: List OAuth clients.
      description: >-
        Administrators only (second factor required).
        Returns every OAuth client, ordered by name. The client secret is kept only
        as a hash and is never returned. Use id to delete a client, and client_id
        as the value a caller presents to the token endpoint. user_id is the
        client's service user, the identity it acts as, and groups are that
        user's groups (an empty array when it has none), which are the client's
        ticket scope.
      tags: ['Admin: Credentials']
      x-ghd-handler: handleListOAuthClients
      security:
        - sessionCookie: []
        - apiKey: ['credentials:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every OAuth client. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OAuthClient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createOAuthClient
      summary: Create an OAuth client.
      description: >-
        Administrators only, in a signed-in session (second factor required).
        Only a signed-in person creates an OAuth client: an API key is refused with 403
        session_required, and an OAuth client by the role check (403 forbidden). A key can
        still list and delete clients. Creates a client that can obtain bearer tokens from POST
        /api/v1/auth/oauth/token. Creating the client also creates its service
        user, in the same statement, named after the client: staff role, no
        password, no second factor, no SSO identity, never able to sign in. The
        client acts as that user, so it never reaches an administrator-only
        route. The user is listed on GET /api/v1/admin/users with service_account
        true, where an administrator can rename it, change its role between
        staff and user, give it groups, and disable it (which stops the client).
        The client_secret is returned once. The response carries the record id
        (the one DELETE uses), client_id, the secret and the service user's
        user_id. scopes is required
        and must be a non-empty list of valid resource:action values.
      tags: ['Admin: Credentials']
      x-ghd-handler: handleCreateOAuthClient
      security:
        - sessionCookie: []
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                name:
                  type: string
                  description: A label for the client. Not validated.
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    pattern: '^[a-z_]+:(read|write)$'
                  description: One or more catalogue scopes from GET /api/v1/admin/scopes.
      responses:
        '201':
          description: >-
            Created. client_secret is shown only in this response.
          content:
            application/json:
              schema:
                type: object
                required: [id, client_id, client_secret, name, user_id]
                properties:
                  user_id:
                    $ref: '#/components/schemas/Uuid'
                  id:
                    $ref: '#/components/schemas/Uuid'
                    description: The record id, as the list and DELETE use it.
                  client_id:
                    type: string
                    description: 16 lowercase hexadecimal characters.
                  client_secret:
                    type: string
                    description: The raw secret, 64 hexadecimal characters with no prefix. Shown once.
                  name: {type: string}
        '400':
          description: >-
            Refused by the handler, as application/json. bad_request ("invalid JSON")
            for a body that does not decode. scopes_required when scopes is empty or
            missing. invalid_scope when an entry is not a catalogue scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Two sources. The authentication middleware refuses with text/plain:
            forbidden (role), mfa_required (second factor not passed) or
            session_required (an API key). Keys cannot create OAuth clients.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
