            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: "`ticket_closed`: a reporting user tried to change a field on a Closed ticket."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/follow-up:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    post:
      operationId: createFollowUp
      summary: Open a follow-up ticket from a closed ticket.
      description: |
        Creates a new ticket that starts open and is linked to the closed one. The
        closed ticket is left as it is. It is created through the same path as any
        new ticket, including the tracking number, the audit entry and routing.
        Answers 201 with the new Ticket.
        Who may follow up, and how often:
        - Staff and administrators may follow up any closed ticket they can see,
          as many times as they like.
        - A reporting user may follow up their own closed ticket once. A second
          attempt is 409 follow_up_exists. Any parent_child link out of the
          closed ticket counts as its follow-up, including one staff added by
          hand, so such a link also uses up the reporter's one follow-up. The
          follow-up keeps the original
          category and type, which must both still be active (400 otherwise).
        The ticket must be Closed (409 ticket_not_closed otherwise). The path id is a UUID
        or a tracking number. An OAuth client opens the follow-up as its service user,
        and needs the tickets:write scope.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. The text/plain 403s from the auth
        middleware are decided before the ticket is looked up and say nothing
        about it.
      tags: ['Tickets']
      x-ghd-handler: handleCreateFollowUp
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '201':
          description: The new follow-up ticket, as the bare Ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: |
            `bad_request`: for a
            reporting user, the original's category or type is no longer active
            (category_id is not an active category; type_id is not an active type).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `user_identity_required` for a credential with no
            user behind it; or `forbidden` for a reporting user who did not report
            the ticket.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            `ticket_not_closed`: the ticket is not Closed. Or `follow_up_exists`: a
            reporting user already has a follow-up of this ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
