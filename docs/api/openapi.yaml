    patch:
      operationId: updateItemFieldAssignment
      summary: Change the order or flags of an item's field assignment.
      description: >-
        Administrators only (second factor required).
        Changes the sort order and the visible_on_new and required_on_new flags of one
        assignment, identified by assignmentId. The field and the scope of an
        assignment cannot be changed here. The ids in the path must name a real chain
        and the assignment must belong to the scope the path ends at; an unknown
        assignment, or one attached to a different scope, is 404 not_found.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleUpdateAssignment
      security:
        - sessionCookie: []
        - apiKey: ['categories:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sort_order:
                  type: integer
                  description: New display order. Absent leaves it unchanged.
                visible_on_new:
                  type: boolean
                  description: Absent leaves it unchanged.
                required_on_new:
                  type: boolean
                  description: Absent leaves it unchanged.
      responses:
        '200':
          description: The assignment as stored after the update. It has no field_def.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldAssignment'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteItemFieldAssignment
      summary: Remove a custom-field assignment from an item.
      description: >-
        Administrators only (second factor required).
        Removes one assignment, identified by assignmentId. The ids in the path must
        name a real chain and the assignment must belong to the scope the path ends
        at. Answers 404 not_found when no assignment has that id, or it is attached to
        a different scope. Ticket values already stored for the field are not
        touched.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleDeleteAssignment
      security:
        - sessionCookie: []
        - apiKey: ['categories:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/custom-fields:
    get:
      operationId: listFieldDefs
      summary: List custom field definitions.
      description: >-
        Administrators only (second factor required).
        Lists every custom field definition as a bare array, including deactivated
        ones. Each entry's active flag says which are active. Definitions are never
        deleted.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleListFieldDefs
      security:
        - sessionCookie: []
        - apiKey: ['categories:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every field definition. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CustomFieldDef'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createFieldDef
      summary: Create a custom field definition.
      description: >-
        Administrators only (second factor required).
        Creates an active field definition. The name is trimmed, must not be empty and
        must be unique across definitions. field_type is one of text, textarea, number
        or select. A select field needs at least one option. options are stored as
        sent for any field type, and only select fields use them. sort_order defaults
        to 0. A value the validation refuses is 400 bad_request, with the reason as the
        message. A name already in use is 409 conflict. Any other failure is a 500
        internal_error. No message carries database text.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleCreateFieldDef
      security:
        - sessionCookie: []
        - apiKey: ['categories:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, field_type]
              properties:
                name:
                  type: string
                  description: Field name, trimmed. Must be unique.
                field_type:
                  type: string
                  enum: [text, textarea, number, select]
                options:
                  type: array
                  items: {type: string}
                  description: Allowed values. Required, at least one, when field_type is select.
                sort_order:
                  type: integer
                  description: Display order. Defaults to 0.
      responses:
        '201':
          description: The created definition, active.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomFieldDef'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: "conflict: a field with this name already exists."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/custom-fields/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Field definition UUID. A malformed value is 400 bad_request.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateFieldDef
      summary: Rename, retype, reorder or deactivate a custom field definition.
      description: >-
        Administrators only (second factor required).
        Partial update. An absent field is unchanged. options, when sent, replaces the
        whole list, and an empty list is refused for a select field. Setting active to
        false deactivates the definition. It is never deleted, and its existing ticket
        values are kept. A refused value is 400 bad_request with the reason as the
        message, a name already in use is 409 conflict, and an unknown id is 404
        not_found. The response is the saved row.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleUpdateFieldDef
      security:
        - sessionCookie: []
        - apiKey: ['categories:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New name, trimmed. Absent leaves it unchanged. An empty value is refused.
                field_type:
                  type: string
                  enum: [text, textarea, number, select]
                  description: New type. Absent leaves it unchanged.
                options:
                  type: array
                  items: {type: string}
                  description: Replacement list of allowed values. Absent leaves the list unchanged.
                sort_order:
                  type: integer
                  description: New display order. Absent leaves it unchanged.
                active:
                  type: boolean
                  description: False deactivates the definition. Absent leaves it unchanged.
      responses:
        '200':
          description: >-
            The definition as stored after the update, so name is the trimmed value
            and created_at is the original.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomFieldDef'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: "conflict: another field already has this name."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/sla/policies:
    get:
      operationId: listSLAPolicies
      summary: List SLA policies.
      description: >-
        Administrators only (second factor required).
        Lists every SLA policy as a bare array, ordered by severity (critical, high,
        medium, low), with policies that have no priority last, then by name.
      tags: ['Admin: SLA']
      x-ghd-handler: handleListSLAPolicies
      security:
        - sessionCookie: []
        - apiKey: ['sla:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every SLA policy. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SlaPolicy'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSLAPolicy
      summary: Create an SLA policy.
      description: >-
        Administrators only (second factor required).
        Creates an SLA policy. Omitting priority, or sending null, makes the policy
        apply to every priority. Omitting category_id, or sending null, makes it apply
        to every category. A policy that narrows neither is the catch-all tier. The two
        targets are minutes and must each be greater than zero and no more than
        2147483647. The name is checked as sent and is not trimmed. A priority outside
        critical, high, medium and low, an empty name, a target out of range, or a
        category that does not exist is 400 bad_request.
      tags: ['Admin: SLA']
      x-ghd-handler: handleCreateSLAPolicy
      security:
        - sessionCookie: []
        - apiKey: ['sla:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, response_target_min, resolution_target_min]
              properties:
                name:
                  type: string
                priority:
                  anyOf:
                    - $ref: '#/components/schemas/Priority'
                    - type: 'null'
                  description: Narrow the policy to one priority. Omitted or null means every priority.
                category_id:
                  anyOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
                  description: Narrow the policy to one category. Omitted or null means every category.
                response_target_min:
                  type: integer
                  description: Minutes of SLA time until the first response is due. Time the ticket spends pending does not count. Must be greater than zero.
                resolution_target_min:
                  type: integer
                  description: Minutes of SLA time until resolution is due. Time the ticket spends pending does not count. Must be greater than zero.
      responses:
        '201':
          description: The created policy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SlaPolicy'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/sla/policies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: SLA policy UUID. A malformed value is 400 bad_request.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateSLAPolicy
      summary: Change an SLA policy.
      description: >-
        Administrators only (second factor required).
        Partial update. An absent field is unchanged. A null priority or category_id is
        treated as absent, so it leaves the value as it is. To clear one, send
        clear_priority or clear_category set to true. Those flags win over a value sent
        in the same request. The same checks as create apply to the values sent, and a
        refusal is 400 bad_request. An unknown id is 404 not_found with the message
        policy not found.
      tags: ['Admin: SLA']
      x-ghd-handler: handleUpdateSLAPolicy
      security:
        - sessionCookie: []
        - apiKey: ['sla:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New name, not trimmed. Absent leaves it unchanged. An empty value is refused.
                priority:
                  anyOf:
                    - $ref: '#/components/schemas/Priority'
                    - type: 'null'
                  description: New priority. Absent or null leaves it unchanged. Use clear_priority to clear it.
                clear_priority:
                  type: boolean
                  description: True makes the policy apply to every priority. Wins over priority.
                category_id:
                  anyOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
                  description: New category. Absent or null leaves it unchanged. Use clear_category to clear it.
                clear_category:
                  type: boolean
                  description: True makes the policy apply to every category. Wins over category_id.
                response_target_min:
                  type: integer
                  description: New first-response target in minutes. Absent leaves it unchanged.
                resolution_target_min:
                  type: integer
                  description: New resolution target in minutes. Absent leaves it unchanged.
      responses:
        '200':
          description: The policy as stored after the update.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SlaPolicy'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteSLAPolicy
      summary: Delete an SLA policy.
      description: >-
        Administrators only (second factor required).
        Deletes the policy. It is refused with 409 policy_in_use while any ticket's SLA
        record is measured against it. An unknown id answers 404 not_found.
      tags: ['Admin: SLA']
      x-ghd-handler: handleDeleteSLAPolicy
      security:
        - sessionCookie: []
        - apiKey: ['sla:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: At least one ticket's SLA record uses this policy. The message gives the number of tickets.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/statuses:
    get:
      operationId: adminListStatuses
      summary: List ticket statuses, with counts across all tickets.
      description: >-
        Administrators only (second factor required).
        Lists every ticket status, system and custom, as a bare array. ticket_count is
        the number of tickets in each status across all tickets, because the caller is
        an administrator. A count that cannot be read fails the request (500
        internal_error); it is never reported as 0. Staff and reporting users get the same list through
        GET /api/v1/statuses, with counts scoped to what they can see.
      tags: ['Admin: Statuses']
      x-ghd-handler: handleListStatuses
      security:
        - sessionCookie: []
        - apiKey: ['settings:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every status, system and custom. The three system statuses are always present.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Status'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createStatus
      summary: Create a custom ticket status.
      description: >-
        Administrators only (second factor required).
        Creates an active custom status. The name is trimmed and must not be empty, and
        it must be unique: a name already in use is 409 status_name_taken. color is free
        text, stored as sent, and the server does not check that it is a colour.
        sort_order defaults to 0. The response carries ticket_count, which is 0 for a
        status that was just created.
      tags: ['Admin: Statuses']
      x-ghd-handler: handleCreateStatus
      security:
        - sessionCookie: []
        - apiKey: ['settings:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Status name, trimmed. Must be non-empty and unique.
                sort_order:
                  type: integer
                  description: Display order. Defaults to 0.
                color:
                  type: string
                  description: Display colour, free text. Stored as sent.
      responses:
        '201':
          description: The created status. Its kind is custom and it is active.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The name is already used by another status. Reported as status_name_taken.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/statuses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Status UUID. A malformed value is 400 bad_request.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateStatus
      summary: Change a ticket status.
      description: >-
        Administrators only (second factor required).
        Partial update. An absent field is unchanged. The system statuses New, Resolved
        and Closed keep their names, because lifecycle rules find them by name. Renaming
        one is 403 forbidden. Sending true or false for active is also 403 forbidden for a
        system status, since system statuses cannot be deactivated. Sending a system
        status its current name is not a rename and is allowed. The name is trimmed. An
        empty name is 400 bad_request, and a name in use is 409 status_name_taken. An
        unknown id is 404 not_found. color and sort_order are stored as sent. The
        response carries the status's ticket_count, computed for the caller as in the
        list.
      tags: ['Admin: Statuses']
      x-ghd-handler: handleUpdateStatus
      security:
        - sessionCookie: []
        - apiKey: ['settings:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New name, trimmed. Absent leaves it unchanged. Refused for a system status unless it is the current name.
                sort_order:
                  type: integer
                  description: New display order. Absent leaves it unchanged.
                color:
                  type: string
                  description: New display colour, free text. Absent leaves it unchanged.
                active:
                  type: boolean
                  description: >-
                    False retires the status for every role: it is still listed by
                    GET /api/v1/statuses (with active false), but the server refuses
                    a move of a ticket into it (409 status_inactive), and the ticket
                    status picker does not offer it. Tickets already in it stay and can
                    be moved out. Refused for a system status when sent as true or
                    false; null is treated as absent.
      responses:
        '200':
          description: >-
            The status as stored after the update. When the status is inactive and is the
            configured reopen target, the body also carries warning, a sentence saying
            reopened tickets are going to New until an active status is picked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Refused in two ways. The auth middleware refuses the caller as text/plain
            with the JSON envelope (forbidden, mfa_required or insufficient_scope). The
            handler refuses a rename, or any active value, of a system status as
            application/json with code forbidden.
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The name is already used by another status. Reported as status_name_taken.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: deleteStatus
      summary: Delete a custom ticket status.
      description: >-
        Administrators only (second factor required).
        Hard delete. The three system statuses cannot be deleted, and a request for one
        is 403 forbidden. A custom status is refused with 409 status_in_use while any
        ticket is in it or any past ticket transition references it. In that case
        deactivate it with PATCH instead. An unknown id is 404 not_found.
      tags: ['Admin: Statuses']
      x-ghd-handler: handleDeleteStatus
      security:
        - sessionCookie: []
        - apiKey: ['settings:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Refused in two ways. The auth middleware refuses the caller as text/plain
            with the JSON envelope (forbidden, mfa_required or insufficient_scope). The
            handler refuses a system status as application/json with code forbidden.
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A ticket is in this status, or a past transition references it. Reported as status_in_use.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ghd_session
      description: |
        Browser session. An opaque id; the session is a server-side row, so
        logout, password change, MFA reset, role change and disabling revoke
        it on the next request. Set by the sign-in routes; HttpOnly,
        SameSite=Lax, 7-day lifetime, and Secure when the instance's BASE_URL
        is https. A session that has passed the password
        but not the second factor is refused by every operation whose
        x-ghd-mfa is true (403 mfa_required).
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Send `Authorization: ApiKey <token>`. Acts at the owning user's role
        and counts as having passed MFA. The values listed in an operation's
        security requirement are the one scope that operation needs; GET
        needs resource:read, every other method resource:write, and write
        implies read. An empty list means the operation reaches a key with no
        scopes at all. An expired key, or one whose owner is disabled, is
        treated as no credential (401).
    oauthClient:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Send `Authorization: Bearer <jwt>` obtained from
        POST /api/v1/auth/oauth/token. Declared as http bearer rather than an
        oauth2 clientCredentials flow because that endpoint takes a JSON body,
        not the form encoding RFC 6749 section 4.4 specifies, so a generic
        OAuth client would be refused. The client acts as its service user (staff
        or user, never admin), so it never reaches an admin-only operation. Deleting the client revokes its
        tokens on the next request. Scope values as for apiKey.
    guestToken:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Send `Authorization: Guest <token>`, the per-ticket token from a guest
        link. It names exactly one ticket; there is no id in any guest path.
        Every failure (missing, malformed, expired, rotated, closed ticket on
        a write route) is the same 404 not_found.
  parameters:
    TicketRef:
      name: id
      in: path
      required: true
      description: >-
        The ticket's UUID or its tracking number (case-insensitive, for example
        GHD-2026-000001), on every route under /tickets/{id}. A value that is not a
        UUID is looked up as a tracking number, so one that names no ticket, or a
        ticket the caller cannot see, answers 404 not_found.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: >-
        Page size, at most 200. A larger value is not refused: the server
        clamps it to 200. Non-numeric or non-positive values are ignored and
        the default is used.
      schema:
        type: integer
        default: 100
    Offset:
      name: offset
      in: query
      required: false
      description: Rows to skip. Non-numeric or negative values are ignored (0 used); values above 2147483647 are clamped.
      schema:
        type: integer
        default: 0
        minimum: 0
  headers:
    RetryAfter:
      description: >-
        Seconds to wait before trying again. On a 429 rate_limited from the
        one-minute budget window it is the time left in that window, rounded up
        and at least 1 (at most 60); before 1.3.0 it was always 60. The MFA lock
        keeps its fixed length. On a 429 checked_recently it is the time until the earliest
        provider's seven-day floor clears. On a 503 it is a fixed 60, a
        suggestion rather than a promise.
      schema:
        type: integer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. bad_request, not_found, forbidden.
            message:
              type: string
              description: Human-readable; not stable, do not branch on it.
    Uuid:
      type: string
      format: uuid
    Role:
      type: string
      enum: [admin, staff, user]
    Priority:
      type: string
      enum: [critical, high, medium, low]
    User:
      description: An account. The password hash, the TOTP secret, single sign-on subjects and the deletion time are never returned. mfa_enabled is the TOTP flag only.
      type: object
      required: [id, email, display_name, role, mfa_enabled, disabled, must_change_password, created_at, updated_at, email_notify_assigned, email_notify_activity, email_notify_group]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email: {type: string}
        display_name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        mfa_enabled: {type: boolean}
        disabled: {type: boolean}
        must_change_password: {type: boolean, description: "Set by /app/server unlock on the server console; cleared when the account holder changes the password."}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        email_notify_assigned: {type: boolean, description: 'Email me when a ticket is assigned to me. Staff email switch, on by default.'}
        email_notify_activity: {type: boolean, description: 'Email me when a requester replies on a ticket assigned to me, or it is reopened. On by default.'}
        email_notify_group: {type: boolean, description: "Email me about my groups' tickets. On by default."}
        api_key_max_lifetime_years:
          type: integer
          enum: [1, 2, 3, 4, 5, -1]
          description: >-
            The longest a new API key may live, in years, or -1 for no limit (the
            api_key_max_lifetime_years setting). Present only on GET /me and PATCH
            /me/email-preferences, beside can_create_api_keys.
        can_create_api_keys:
          type: boolean
          description: >-
            Whether this account may create its own API keys: always for an
            administrator, for staff only while staff_can_create_api_keys is on,
            never for a requester. Present only on GET /me and PATCH
            /me/email-preferences.
        email_notifications:
          type: object
          description: |
            What the three email switches amount to for this person, which is not always what they chose: an
            administrator can force a switch on or off for everyone (the staff_email_*_override settings).
            enabled is whether they get that mail; forced is true when the administrator decided it, so their
            own email_notify_* value is not what applies. Present only on GET /me and PATCH /me/email-preferences,
            and only for staff and administrators.
          required: [assigned, activity, group]
          properties:
            assigned: {$ref: '#/components/schemas/EmailSwitchState'}
            activity: {$ref: '#/components/schemas/EmailSwitchState'}
            group: {$ref: '#/components/schemas/EmailSwitchState'}
    EmailSwitchState:
      type: object
      required: [enabled, forced]
      properties:
        enabled: {type: boolean}
        forced: {type: boolean}
    Category:
      description: A top-level category of the Category / Type / Item tree. active is false once the category is archived.
      type: object
      required: [id, name, sort_order, active]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        sort_order: {type: integer}
        active: {type: boolean}
    CategoryType:
      description: A type within a category. active is false once the type is archived.
      type: object
      required: [id, category_id, name, sort_order, active]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        category_id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        sort_order: {type: integer}
        active: {type: boolean}
    CategoryItem:
      description: An item within a type. active is false once the item is archived.
      type: object
      required: [id, type_id, name, sort_order, active]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        type_id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        sort_order: {type: integer}
        active: {type: boolean}
    Status:
      description: A ticket status. kind system marks the built-in statuses, custom the ones an administrator added. ticket_count is computed for the caller by the two status list operations and by the create and update responses.
      type: object
      required: [id, name, kind, sort_order, color, active, ticket_count]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        kind: {type: string, enum: [system, custom]}
        sort_order: {type: integer}
        color: {type: string}
        active: {type: boolean}
        ticket_count: {type: integer, format: int64}
    Tag:
      description: A ticket tag. Names are stored lowercase and are unique. deleted_at is present only on a deactivated tag.
      type: object
      required: [id, name, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        created_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
    Group:
      description: A named group of staff that tickets can be assigned to.
      type: object
      required: [id, name, description]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        description: {type: string}
    CannedResponse:
      description: A reusable reply template. With neither category_id nor type_id it is global; with category_id alone it applies to that category; with both, to that category and type. Absent ids are omitted, never null.
      type: object
      required: [id, name, body, sort_order, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        body: {type: string}
        category_id: {$ref: '#/components/schemas/Uuid'}
        type_id: {$ref: '#/components/schemas/Uuid'}
        sort_order: {type: integer}
        created_at: {type: string, format: date-time}
    AccountGuestReply:
      description: A reply as a guest sees it. Internal notes are never included and the author is not named. from_you is true for replies the guest wrote.
      type: object
      required: [id, body, created_at, from_you]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        body: {type: string}
        created_at: {type: string, format: date-time}
        from_you: {type: boolean}
    Passkey:
      description: A registered passkey as GET /me/passkeys returns it. The authenticator's credential id, public key, sign count and model identifier are never returned.
      type: object
      required: [id, transports, name, backup_eligible, backup_state, created_at, last_used_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        transports:
          type: array
          items: {type: string}
          description: Transports the authenticator reported, for example usb or internal.
        name:
          type: string
          description: The label the owner gave the key. May be empty.
        backup_eligible:
          type: boolean
          description: True when the key can be synced across devices, as a cloud passkey can.
        backup_state:
          type: boolean
          description: True when the key is currently synced.
        created_at: {type: string, format: date-time}
        last_used_at:
          type: [string, 'null']
          format: date-time
          description: When the key last answered a sign-in. Null if it never has.
    Ticket:
      description: |
        The bare ticket, as POST
        /tickets, PATCH, reopen, resolve, close and follow-up answer it. Optional
        keys are absent when unset, never null.
        A reporting user (any role other than staff or administrator) receives
        only these keys: id, tracking_number, subject, description, status_id,
        priority, category_id, type_id, item_id, created_at, resolved_at,
        assignee_user_id and resolution_notes. Everything else here
        (assignee_group_id, reporter_user_id, guest_email, guest_name,
        guest_phone, closed_at, updated_at, pending_since, sla_paused_seconds,
        reopen_count) is for staff and administrators only. The same list applies to every
        response that carries a ticket, MCP included.
      type: object
      required: [id, tracking_number, subject, description, category_id, priority, status_id, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tracking_number:
          type: string
          description: Human-readable identifier, for example GHD-2026-000001. Unique and never reused.
        subject:
          type: string
        description:
          type: string
        category_id:
          $ref: '#/components/schemas/Uuid'
        type_id:
          $ref: '#/components/schemas/Uuid'
        item_id:
          $ref: '#/components/schemas/Uuid'
        priority:
          $ref: '#/components/schemas/Priority'
        status_id:
          $ref: '#/components/schemas/Uuid'
        assignee_user_id:
          $ref: '#/components/schemas/Uuid'
        assignee_group_id:
          $ref: '#/components/schemas/Uuid'
        reporter_user_id:
          $ref: '#/components/schemas/Uuid'
        guest_email:
          type: string
          description: Present for a ticket a guest submitted.
        guest_name:
          type: string
        guest_phone:
          type: string
        resolution_notes:
          type: string
        resolved_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        pending_since:
          type: string
          format: date-time
          description: When the ticket entered its current Pending interval. Present only while the ticket is Pending, and only for staff and administrators; a requester never receives the key.
        sla_paused_seconds:
          type: integer
          format: int64
          description: Total seconds the ticket has spent Pending, which SLA timing excludes. Staff and administrators only (always present for them, 0 included); a requester never receives the key (Pending times are audit information, not state).
        reopen_count:
          type: integer
          description: How many times the ticket has been moved from Resolved or Closed back to an open status (#464). Never reset. Staff and administrators only, and omitted when 0; a requester never receives the key (see Ticket). The Reopened badge shows while this is above 0 and the ticket is open. 0 for a ticket reopened before 1.3.0.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TicketView:
      description: |
        The ticket plus its live SLA
        status and whether this viewer may force-reopen it. sla is null for a
        reporting user, when SLA tracking is off, and when no policy matches.
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          required: [sla, can_reopen]
          properties:
            sla:
              anyOf:
                - $ref: '#/components/schemas/SlaStatus'
                - type: 'null'
            can_reopen:
              type: boolean
              description: True when the ticket is Closed and closed_reopen_policy allows the viewer's role to force-reopen it. Always false for a reporting user.
            requester:
              description: Who the ticket is for, shown as the Requester line on the staff ticket page (#444). Sent on getTicket only (never on a list row), to staff and administrators only, on every ticket; never to a reporting user. Absent when the reporting account cannot be read. A deleted account is still named.
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                  description: The account's display name, or the guest's name.
                email:
                  type: string
                  description: The account's address, or the guest's.
    SlaStatus:
      description: |
        A ticket's live SLA status. Computed fresh on every read from the
        ticket's SLA record and the policy in force.
      type: object
      required: [policy_id, policy_name, response, resolution]
      properties:
        policy_id:
          $ref: '#/components/schemas/Uuid'
        policy_name:
          type: string
        response:
          $ref: '#/components/schemas/SlaTargetStatus'
        resolution:
          $ref: '#/components/schemas/SlaTargetStatus'
        earlier:
          $ref: '#/components/schemas/SlaEarlierRecord'
    SlaEarlierRecord:
      description: |
        The SLA record a restart replaced, sent on getTicket only (never on a list
        row). A restart is a reopen: staff and admin priority changes re-match the
        SLA and keep its clock, and never produce this. It is the record the "SLA
        restarted" badge on the ticket page links to. Absent when the clock never
        restarted, and when the replaced record had nothing met or breached (no
        outcome to report). Every reopen restarts the clock (#464). The outcome reads
        the record's stored stamps, so a breach the sweep has not stamped yet is
        not reported.
      type: object
      required: [policy_id, policy_name, started_at, superseded_at, outcome]
      properties:
        policy_id:
          $ref: '#/components/schemas/Uuid'
        policy_name:
          type: string
        started_at:
          type: string
          format: date-time
          description: Where the record's clock started; the ticket's creation if it never restarted.
        superseded_at:
          type: string
          format: date-time
          description: When the restart replaced it.
        outcome:
          type: string
          enum: [met, breached]
          description: breached when a breach was stamped on the record, otherwise met.
    SlaTargetStatus:
      description: |
        Where one SLA target stands. Once met_at is set the numbers
        are frozen at the moment the target was met.
      type: object
      required: [color, target_min, elapsed_min, remaining_min, met_at]
      properties:
        color:
          type: string
          enum: [green, amber, red]
        target_min:
          type: integer
          description: Minutes allowed by the policy.
        elapsed_min:
          type: integer
          description: Whole minutes elapsed toward the target, with pause time excluded.
        remaining_min:
          type: integer
          description: target_min minus elapsed_min. Negative when the target is over.
        met_at:
          description: When the target was met, or null while it is outstanding.
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    Reply:
      description: |
        One message on a ticket thread.
      type: object
      required: [id, ticket_id, body, internal, notify_customer, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        ticket_id:
          $ref: '#/components/schemas/Uuid'
        author_id:
          description: Absent for a reply written by a guest, who has no account.
          $ref: '#/components/schemas/Uuid'
        author_name:
          type: string
          description: The author's display name, as listReplies sends it. Absent for a guest reply.
        body:
          type: string
        internal:
          type: boolean
          description: An internal note. Only staff and administrators are sent these.
        notify_customer:
          type: boolean
          description: Whether the reporter was emailed about this reply. Always false for an internal note.
        created_at:
          type: string
          format: date-time
    TicketLink:
      description: |
        A directed link between two tickets. Each
        ticket is named by its UUID only.
      type: object
      required: [source_id, target_id, link_type]
      properties:
        source_id:
          $ref: '#/components/schemas/Uuid'
        target_id:
          $ref: '#/components/schemas/Uuid'
        link_type:
          type: string
          enum: [related_to, parent_child, caused_by, duplicate_of]
    StatusHistoryEntry:
      description: |
        One status
        transition. The from_* fields are empty or null for the opening status.
      type: object
      required: [id, ticket_id, from_status_id, from_status_name, from_status_color, to_status_id, to_status_name, to_status_color, changed_by_user_id, changed_by_name, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        ticket_id:
          $ref: '#/components/schemas/Uuid'
        from_status_id:
          description: The status before the change, or null for the opening status.
          anyOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        from_status_name:
          type: string
        from_status_color:
          type: string
        to_status_id:
          $ref: '#/components/schemas/Uuid'
        to_status_name:
          type: string
        to_status_color:
          type: string
        changed_by_user_id:
          description: The account that made the change, or null for the system.
          anyOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        changed_by_name:
          type: string
        created_at:
          type: string
          format: date-time
    TicketFollower:
      description: Someone following a ticket.
      type: object
      required: [user_id, display_name, created_at]
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
          description: When they started following.
    TicketAuditEntry:
      description: |
        One row of
        a ticket's activity feed.
      type: object
      required: [id, action, actor_id, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        action:
          type: string
          description: The action name, for example created, assigned, unassigned, priority_changed, reopened, sla_restarted (written by a reopen that restarts the SLA clocks) or closed.
        actor_id:
          description: The actor's account, or null when there is none (or when a reporting user is shown an assignment).
          anyOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        actor_name:
          type: string
          description: The actor's display name. Absent when there is no actor, or the account has been deleted.
        actor_masked:
          type: boolean
          description: True when actor_name is the masking label Requester, not the account's own name.
        created_at:
          type: string
          format: date-time
        before:
          type: object
          additionalProperties: true
          description: The redacted field values before the change. Absent unless the caller may see the diff.
        after:
          type: object
          additionalProperties: true
          description: The redacted field values after the change. Absent unless the caller may see the diff.
        names:
          $ref: '#/components/schemas/AuditNames'
    AuditNames:
      description: |
        What the ids in an entry's before and after name now, keyed by the id
        exactly as it appears there. Only the fields status_id (a status) and
        assignee_user_id (a user) are resolved. Resolved when the entry is
        viewed; the stored entry keeps the ids and is not changed.
        An id that is missing from this object no longer resolves (a deleted
        status or account): show the id. Present only when the caller is shown
        the diff, and only for ids in that shown diff, so the staff
        change-history setting, the diff allow-list and staff ticket scope
        apply to it as they do to before and after. A user the viewer may not
        see by name is masked in the same views, by the same
        audit_mask_requester_names setting and the same current-role rule, as
        actor_name: the name is Requester and masked is true.
      type: object
      additionalProperties:
        type: object
        required: [name]
        properties:
          name:
            type: string
          masked:
            type: boolean
            description: True when name is the masking label Requester. Absent when false.
    AdminAuditEntry:
      description: |
        One row of
        the admin-wide audit view. The diff and actor rules are those of
        TicketAuditEntry.
      type: object
      required: [id, entity_type, entity_id, action, actor_id, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        entity_type:
          type: string
          description: What the entry is about, for example ticket or user.
        entity_id:
          $ref: '#/components/schemas/Uuid'
        action:
          type: string
        actor_id:
          description: The actor's account, or null when there is none.
          anyOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        actor_name:
          type: string
          description: The actor's display name. Absent when there is no actor, or the account has been deleted.
        actor_masked:
          type: boolean
          description: True when actor_name is the masking label Requester.
        created_at:
          type: string
          format: date-time
        before:
          type: object
          additionalProperties: true
          description: The redacted field values before the change. Absent unless the caller may see the diff.
        after:
          type: object
          additionalProperties: true
          description: The redacted field values after the change. Absent unless the caller may see the diff.
        names:
          $ref: '#/components/schemas/AuditNames'
    AdminAuditPage:
      description: |
        One page of the admin-wide audit view.
      type: object
      required: [entries, total, total_capped, has_more]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditEntry'
        total:
          type: integer
          description: The number of matching entries the caller may see, up to 10,000. When total_capped is true it means at least this many.
        total_capped:
          type: boolean
          description: True when more than 10,000 entries match. Always sent, so a client can tell this from an older server.
        has_more:
          type: boolean
          description: True when another page exists. Read from the page itself, so it keeps working past the cap.
    TicketsFieldValue:
      description: |
        One
        custom field value stored on a ticket.
      type: object
      required: [ticket_id, field_def_id, field_name, field_type, value, updated_at]
      properties:
        ticket_id:
          $ref: '#/components/schemas/Uuid'
        field_def_id:
          $ref: '#/components/schemas/Uuid'
        field_name:
          type: string
        field_type:
          type: string
          enum: [text, textarea, number, select]
        options:
          type: array
          items:
            type: string
          description: The allowed values. Present only for a select field.
        value:
          type: string
        updated_at:
          type: string
          format: date-time
    Attachment:
      description: |
        One file attached to a ticket. Where the file is stored on the server is
        never sent.
        The nullable fields are null when the file predates inspection, and reputation
        is null unless the caller is staff or admin and the file is quarantined.
      type: object
      required: [id, ticket_id, filename, mime_type, size_bytes, created_at, detected_mime, sha256, virus_name, mismatch, reputation_url, reputation]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        ticket_id:
          $ref: '#/components/schemas/Uuid'
        filename:
          type: string
          description: The stored name. For a quarantined file it is the uploaded name plus .zip. For a file wrapped for a mismatch it is suspicious-<crc32>.zip. Otherwise it is the uploaded name.
        mime_type:
          type: string
          description: The type of the file as stored. A known extension gives its type, an extension the instance adds gets the detected type, a recompressed image takes the type of its new format, and a wrapper is application/zip.
        size_bytes:
          type: integer
          format: int64
          description: The size of the stored file, not of the upload.
        created_at:
          type: string
          format: date-time
        detected_mime:
          type: [string, 'null']
          description: What the bytes as uploaded were detected as, whatever the name says.
        sha256:
          type: [string, 'null']
          description: Hex SHA-256 of the bytes as uploaded. For a recompressed image this is not the hash of the stored file.
        virus_name:
          type: [string, 'null']
          description: The scanner's name for the detection on a quarantined file. null when the file was not identified as malicious.
        mismatch:
          type: [boolean, 'null']
          description: Whether the content contradicted the name it was uploaded under. null when no inspection was made, which is for extensions outside the shipped set.
        reputation_url:
          type: [string, 'null']
          description: A VirusTotal page for the hash, on attachments the scanner named or whose content contradicts the name. null otherwise, and null when there is no hash.
        reputation:
          description: The reputation block. Present for staff and admin on quarantined files whenever at least one provider is enabled, with an unavailable entry for each provider that could not be asked. null otherwise.
          anyOf:
            - $ref: '#/components/schemas/AttachmentsReputation'
            - type: 'null'
    AttachmentsReputation:
      description: |
        What the reputation providers say about a file. The summary repeats
        one provider's verdict, the one whose entry in providers has inline set. When
        no provider answered at all, state is unavailable and the provider fields are
        empty or null.
      type: object
      required: [state, detected, total, threat_name, analysed_at, known_feeds, fetched_at, provider, provider_key, providers]
      properties:
        state:
          type: string
          enum: [detected, unseen, unscanned, clean, known, unavailable]
          description: The worst verdict across the providers, ordered detected, unseen, unscanned, clean, known. unavailable appears only when nothing answered.
        detected:
          type: [integer, 'null']
          description: Engines that flagged the file. Set only for a completed analysis, so null for a catalogue answer or a failed lookup.
        total:
          type: [integer, 'null']
          description: Engines that ran. Set with detected.
        threat_name:
          type: string
          description: The provider's own name for what it found. Often empty. Attacker-influenced text.
        analysed_at:
          type: [string, 'null']
          format: date-time
          description: When the provider last analysed the file.
        known_feeds:
          type: [array, 'null']
          items:
            type: string
          description: The catalogues that hold the file, when state is known. null otherwise.
        fetched_at:
          type: [string, 'null']
          format: date-time
          description: When this instance last asked the provider.
        provider:
          type: string
          description: The provider's display name, for example VirusTotal. Empty when nothing answered.
        provider_key:
          type: string
          enum: [virustotal, metadefender, polyswarm, circl, '']
          description: The provider's machine name. Empty when nothing answered.
        providers:
          type: array
          minItems: 1
          description: Every enabled provider's own answer, one entry each, including the ones that failed.
          items:
            $ref: '#/components/schemas/AttachmentsProviderVerdict'
    AttachmentsProviderVerdict:
      description: One reputation provider's own answer about a file.
      type: object
      required: [provider, provider_key, state, detected, total, threat_name, known_feeds, analysed_at, fetched_at, link_url, recheckable, inline]
      properties:
        provider:
          type: string
          description: The provider's display name.
        provider_key:
          type: string
          enum: [virustotal, metadefender, polyswarm, circl]
        state:
          type: string
          enum: [detected, unseen, unscanned, clean, known, unavailable]
          description: This provider's own verdict. unavailable means the lookup was attempted and did not finish, for example a spent allowance or a rejected key.
        detected:
          type: [integer, 'null']
          description: Set only when state is detected or clean.
        total:
          type: [integer, 'null']
          description: Set only when state is detected or clean.
        threat_name:
          type: string
        known_feeds:
          type: [array, 'null']
          items:
            type: string
          description: The catalogues that hold the file, when state is known. null otherwise.
        analysed_at:
          type: [string, 'null']
          format: date-time
          description: When this provider last analysed the file.
        fetched_at:
          type: string
          format: date-time
          description: When this instance last asked this provider. The re-check control is armed from this time.
        link_url:
          type: [string, 'null']
          description: The provider's own page for the hash. null for CIRCL, which has no per-hash page.
        recheckable:
          type: boolean
          description: Whether the Check again control applies. True when the verdict can still change and the seven-day floor has passed. It does not consult the daily budget.
        inline:
          type: boolean
          description: True on the one entry that the summary repeats. False on every entry when nothing answered.
    SettingsValues:
      description: |
        The setting names this instance reads, with the type each reader expects.
        PATCH /admin/settings refuses a name that is not listed here (400
        unknown_setting). writeOnly marks the seven secrets. They are accepted
        on PATCH and never returned by GET, which reports only their <name>_set flag.
        Every key marked Session only is refused to an API key or OAuth client. See
        updateSettings for the list.
      type: object
      additionalProperties: true
      properties:
        saml_enabled:
          type: boolean
          description: Whether SAML sign-in is offered. Session only.
        saml_metadata_url:
          type: string
          description: SAML identity provider metadata URL. Session only.
        saml_metadata_xml:
          type: string
          description: SAML identity provider metadata XML, as pasted. Readable. Session only.
        saml_cert_pem:
          type: string
          description: SAML certificate, PEM. Session only.
        saml_key_pem:
          type: string
          writeOnly: true
          description: SAML private key, PEM. Write-only. Session only.
        oidc_enabled:
          type: boolean
          description: Whether OIDC sign-in is offered. Session only.
        oidc_issuer_url:
          type: string
          description: OIDC issuer URL. Session only.
        oidc_client_id:
          type: string
          description: OIDC client id. Session only.
        oidc_client_secret:
          type: string
          writeOnly: true
          description: OIDC client secret. Write-only. Session only.
        oidc_redirect_url:
          type: string
          description: OIDC redirect URL. Session only.
        guest_submission_enabled:
          type: boolean
          description: Whether anonymous guests may submit tickets. Session only.
        sla_enabled:
          type: boolean
          description: Whether SLA tracking is on.
        mfa_enabled:
          type: boolean
          description: Whether multi-factor authentication is on for the instance. Session only.
        mfa_enforced_roles:
          type: array
          items:
            type: string
          description: Role names that must enrol a second factor, from admin, staff and user. Session only.
        reopen_window_days:
          type: integer
          description: Days after resolution during which a reporter may still reply to a Resolved ticket.
        reopen_target_status_name:
          type: string
          description: Name of the status a reopened ticket is moved to. If that status is inactive, reopened tickets go to New instead and GET /admin/security-warnings says so.
        closed_reopen_policy:
          type: string
          enum: [off, admin, staff_admin]
          description: Who may force-reopen a Closed ticket. Anything unrecognised reads as off. Session only.
        audit_mask_requester_names:
          type: string
          enum: [admin_log, ticket_log, everywhere]
          description: Where requester names are masked in the audit views. Anything unrecognised reads as everywhere. Session only.
        attachment_scan_policy:
          type: string
          enum: [off, required, permissive]
          description: Whether uploads are scanned, and what happens when the scanner cannot be reached. Session only.
        attachment_scan_address:
          type: string
          description: Empty, tcp://host:port or unix:///path. Session only.
        attachment_allowed_types:
          type: array
          items:
            type: string
            pattern: '^\.[a-z0-9]{1,16}$'
          description: The extensions this instance accepts, each with its leading dot. An empty array means no attachments. Session only.
        attachment_infected_handling:
          type: string
          enum: [refuse, quarantine]
          description: What happens to a file the scanner calls infected. Anything unrecognised reads as refuse. Session only.
        attachment_mismatch_handling:
          type: string
          enum: [refuse, wrap]
          description: What happens to a file whose content contradicts its name, when its type is not allowed. Anything unrecognised reads as refuse. Session only.
        staff_email_assigned_override:
          type: string
          enum: [user, 'on', 'off']
          description: Whether every staff member is emailed when a ticket is assigned to them, whatever they chose on their profile. user (the default) leaves it to each person. Anything unrecognised reads as user.
        staff_email_activity_override:
          type: string
          enum: [user, 'on', 'off']
          description: The same for a requester's reply on a ticket assigned to them.
        staff_email_group_override:
          type: string
          enum: [user, 'on', 'off']
          description: The same for a group's tickets, for every member of the group.
        audit_retention_days:
          type: integer
          maximum: 36525
          description: How long audit entries are kept. Zero or less keeps them forever. Session only.
        staff_can_view_ticket_change_history:
          type: boolean
          description: Whether staff may see the field-level change history of tickets. Session only.
        staff_can_view_follow_audit:
          type: boolean
          description: >-
            Whether staff may see the followed and unfollowed entries in a
            ticket's audit trail and in the admin-wide audit view.
            Administrators always can and requesters never can. Off by default.
            Session only.
        staff_can_create_api_keys:
          type: boolean
          description: >-
            Whether staff may create their own API keys (POST /me/api-keys).
            Administrators always can and requesters never can. Off by default.
            It governs creating a key only: turning it off does not revoke keys
            that exist, and staff can still list and revoke their own. Session
            only.
        api_key_max_lifetime_years:
          type: integer
          enum: [1, 2, 3, 4, 5, -1]
          description: >-
            The longest a new API key may live, in years: 1 to 5, or -1 for no limit
            (the Never stop on the admin slider). Default 2 when unset. While there is
            a limit every new key must have an expiry no later than this; with -1 an
            expiry is optional. Checked when a key is created, never when one is used.
            Session only.
        password_rehash_grace_days:
          type: integer
          minimum: 1
          maximum: 365
          description: >-
            Days after 1.3.0 first ran before an account still on a password hash
            made below bcrypt cost 12 must reset its password to sign in. Unset reads
            as 30. Administrators are exempt. Session only.
        site_name:
          type: string
          description: The site name shown in the interface.
        site_logo_url:
          type: string
          description: The logo URL, set by the logo upload and cleared by its delete.
        ticket_prefix:
          type: string
          pattern: '^[A-Z0-9]{1,8}$'
          description: The prefix of tracking numbers.
        ticket_scope_enforced:
          type: boolean
          description: Whether staff visibility is limited to the tickets their groups cover.
        auto_assign_group_id:
          type: string
          description: UUID of the group that new tickets are assigned to. Must name an existing group; empty or null turns it off.
        auto_assign_user_ids:
          type: array
          items:
            type: string
          description: UUIDs of the staff or administrators to assign new tickets to, in turn. Each must name an existing staff or administrator account; an empty list or null turns it off.
        allowed_email_domains:
          type: array
          items:
            type: string
          description: Email domains allowed for SAML accounts created on first sign-in. Empty means no restriction. Session only.
        self_signup_enabled:
          type: boolean
          description: Whether people may sign themselves up. Session only.
        open_registration_enabled:
          type: boolean
          description: Whether sign-up is allowed without a domain restriction. Session only.
        attachment_vt_lookup:
          description: Deprecated and unused. Still accepted and stored. Session only.
        attachment_vt_api_key:
          type: string
          writeOnly: true
          description: Deprecated and unused. Write-only. Session only.
        attachment_reputation_provider:
          description: Deprecated and unused. Still accepted and stored. Session only.
        attachment_reputation_api_key:
          type: string
          writeOnly: true
          description: Deprecated and unused. Write-only. Session only.
        attachment_reputation_virustotal_enabled:
          type: boolean
          description: Whether VirusTotal is asked about quarantined files. Session only.
        attachment_reputation_virustotal_key:
          type: string
          writeOnly: true
          description: The VirusTotal API key. Write-only. Session only.
        attachment_reputation_metadefender_enabled:
          type: boolean
          description: Whether MetaDefender is asked about quarantined files. Session only.
        attachment_reputation_metadefender_key:
          type: string
          writeOnly: true
          description: The MetaDefender API key. Write-only. Session only.
        attachment_reputation_polyswarm_enabled:
          type: boolean
          description: Whether PolySwarm is asked about quarantined files. Session only.
        attachment_reputation_polyswarm_key:
          type: string
          writeOnly: true
          description: The PolySwarm API key. Write-only. Session only.
        attachment_reputation_circl_enabled:
          type: boolean
          description: Whether CIRCL hashlookup is asked about quarantined files. CIRCL needs no key. Session only.
        attachment_reputation_refresh:
          type: string
          enum: [weekly, biweekly, monthly, quarterly, never]
          description: How often stored verdicts are refreshed automatically. Anything unrecognised reads as biweekly. Session only.
    ApiKey:
      description: >-
        An API key. The token hash is never returned. A
        key that has never been used omits last_used_at, and a key with no expiry omits
        expires_at.
      type: object
      required: [id, name, user_id, created_by, beyond_limit, owner_name, owner_email, scopes, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        user_id:
          $ref: '#/components/schemas/Uuid'
          description: The account the key belongs to and acts as.
        beyond_limit:
          type: boolean
          description: >-
            True when the key outlives the current maximum lifetime: it has no expiry, or
            expires later than api_key_max_lifetime_years from now. It still works; the
            flag is for finding keys to rotate. Always false when the setting is Never.
        created_by:
          description: >-
            Who issued the key. Equal to user_id when the owner made it, different when
            an administrator issued it on their behalf, null when not known (made
            before 1.3, or the issuer has since been deleted).
          oneOf:
            - {$ref: '#/components/schemas/Uuid'}
            - {type: 'null'}
        owner_name:
          type: string
          description: The owner's display name.
        owner_email:
          type: string
          description: The owner's email address.
        scopes:
          type: array
          items:
            type: string
            pattern: '^[a-z_]+:(read|write)$'
        last_used_at:
          type: string
          format: date-time
          description: When the key last authenticated a request. Absent until then.
        expires_at:
          type: string
          format: date-time
          description: When the key stops being accepted. Absent when it never expires.
        created_at:
          type: string
          format: date-time
    MyApiKey:
      description: >-
        One of the caller's own API keys. The token hash is never returned. A key that has
        never been used omits last_used_at, and a key with no expiry omits expires_at.
      type: object
      required: [id, name, user_id, created_by, beyond_limit, scopes, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        user_id: {$ref: '#/components/schemas/Uuid'}
        beyond_limit:
          type: boolean
          description: >-
            True when the key outlives the current maximum lifetime (no expiry, or one
            further off than the limit). It still works; it is marked so it can be rotated.
        created_by:
          description: >-
            Who issued the key: the caller when they made it, an administrator when one issued
            it for them, null when not known.
          oneOf:
            - {$ref: '#/components/schemas/Uuid'}
            - {type: 'null'}
        scopes:
          type: array
          items: {type: string, pattern: '^[a-z_]+:(read|write)$'}
        last_used_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    OAuthClient:
      description: >-
        An OAuth client as the list returns it. The secret hash is never returned,
        and the record id is not returned by create.
      type: object
      required: [id, client_id, name, scopes, created_at, user_id, groups]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        user_id:
          $ref: '#/components/schemas/Uuid'
        groups:
          type: array
          description: >-
            The groups the client's service user belongs to, by name. They are the
            client's ticket scope once ticket scope enforcement is on. An empty
            array when there are none.
          items:
            type: object
            required: [id, name]
            properties:
              id: {$ref: '#/components/schemas/Uuid'}
              name: {type: string}
        client_id:
          type: string
          description: 16 lowercase hexadecimal characters. Sent as client_id to the token endpoint.
        name: {type: string}
        scopes:
          type: array
          items:
            type: string
            pattern: '^[a-z_]+:(read|write)$'
        created_at:
          type: string
          format: date-time
    WebhookEvent:
      description: >-
        An event name a webhook can subscribe to. The wildcard "*" subscribes to all
        eleven. guest.link_resent is never sent to a webhook.
        ticket.replied is a customer-visible reply only; a staff-only note is ticket.note_added.
      type: string
      enum: ['*', ticket.created, ticket.assigned, ticket.status_changed, ticket.replied, ticket.note_added, ticket.resolved, ticket.closed, ticket.reopened, ticket.linked, ticket.priority_changed, ticket.classified]
    WebhookPayloadFormat:
      description: >-
        The body shape a delivery uses.
        raw sends the event as ids-only JSON (no subject, tracking number, address or
        text; see createWebhook). The other four are chat or ITSM shapes and keep their
        subject, tracking number, status and public reply text. An omitted or empty
        payload_format is stored as raw.
      type: string
      enum: [raw, slack, teams, discord, jira]
    WebhookFilter:
      description: >-
        Which tickets the hook fires for. Each list is one condition, and an empty or absent
        list is no condition. A ticket matches a list when its value is any entry. All
        conditions must match. invert fires for the tickets that do not match. A queued
        delivery is tested against the ticket as it was when the event happened; a Redeliver,
        which has no stored classification, against the ticket as it is now. category matches
        the ticket's category, so all its types and items are included. group is the group the
        ticket is assigned to; an unassigned ticket never matches it. Responses always carry
        all four keys.
        The filter is read as it is now, not once: when the event is fanned out to the hooks,
        at every attempt of a queued delivery (retries included) and at Redeliver. An event
        it filters out at the fan-out creates no delivery: no X-GHD-Delivery, no retry and no
        history entry. If an administrator tightens it, deliveries already queued that it no
        longer admits are dropped at their next attempt, with no send and no history entry,
        as for a disabled, unsubscribed or re-addressed hook; Redeliver of such an entry is
        refused with 409 webhook_filter_excludes. A queued delivery with no stored
        classification (queued before the filter existed) is sent.
      type: object
      additionalProperties: false
      properties:
        category_ids:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
        priorities:
          type: array
          items: {$ref: '#/components/schemas/Priority'}
        group_ids:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
        invert:
          type: boolean
    Webhook:
      description: >-
        An outbound webhook subscription. The secret is write-only and is never
        returned.
      type: object
      required: [id, url, events, enabled, created_at, payload_format, last_delivery, paused, filter]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        url: {type: string}
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
        enabled: {type: boolean}
        created_at:
          type: string
          format: date-time
        payload_format:
          $ref: '#/components/schemas/WebhookPayloadFormat'
        last_delivery:
          description: >-
            The latest delivery attempt, identified by when it started. Null until a
            delivery has been attempted since the hook was created or its url last
            changed. Only the latest attempt is kept here; the last 25 deliveries are at
            GET /api/v1/admin/webhooks/{id}/deliveries.
          anyOf:
            - $ref: '#/components/schemas/WebhookDelivery'
            - type: 'null'
        paused:
          type: boolean
          description: >-
            True when the API key that created the hook, or last changed its url, has
            been revoked or has expired. A paused hook receives nothing, whether or not it
            is enabled, until a signed-in administrator re-approves it
            (POST /admin/webhooks/{id}/reapprove). Worked out on every read, not stored.
        paused_reason:
          type: string
          description: Why it is paused. Present only when paused is true.
        filter: {$ref: '#/components/schemas/WebhookFilter'}
    WebhookDelivery:
      description: >-
        The result of one delivery attempt. No message or response body is stored. Error text goes to the server log only, because a
        URL can carry a token.
      type: object
      required: [at, status, error]
      properties:
        at:
          type: string
          format: date-time
          description: When the attempt started, in UTC.
        status:
          type: integer
          minimum: 0
          maximum: 999
          description: >-
            The HTTP status. The 2xx code on success. The non-2xx code for http_status.
            0 for every other class, and for a status outside 100 to 999.
        error:
          type: string
          enum: ['', http_status, timeout, dns, tls, blocked_address, connection, other]
          description: >-
            Empty on success. http_status: a response came back that was not 2xx. timeout:
            the attempt ran out of time. dns: the host did not resolve. tls: the handshake
            failed. blocked_address: the target is an internal address, refused by the
            guarded dialer. connection: refused, reset, or closed without a response. other:
            anything else.
    WebhookDeliveryRecord:
      description: >-
        One delivery of one event to one hook, as the history shows it. The id is the
        X-GHD-Delivery header the receiver saw, and is the same on every retry. No
        payload, response body or error text is stored.
      type: object
      required: [id, event, started_at, last_attempt_at, status, result, attempts, retrying]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        event:
          type: string
          description: The event name, as sent in X-GHD-Event.
        started_at:
          type: string
          format: date-time
          description: When the first attempt started, in UTC.
        last_attempt_at:
          type: string
          format: date-time
          description: When the latest attempt started, in UTC.
        status:
          type: integer
          minimum: 0
          maximum: 999
          description: The HTTP status of the latest attempt. 0 when no response came back.
        result:
          type: string
          enum: [ok, http_status, timeout, dns, tls, blocked_address, connection, other]
          description: >-
            The latest attempt's outcome: ok, or a failure class as in WebhookDelivery.error.
        attempts:
          type: integer
          minimum: 1
          description: How many attempts have been made. At most 8.
        retrying:
          type: boolean
          description: >-
            True while the latest attempt failed in a way that will be tried again.
            Connection errors, DNS, TLS, timeouts, 5xx and 429 are retried, 30 seconds
            doubling to an hour, 8 attempts in all; a Retry-After from the receiver
            delays the next attempt, up to an hour. blocked_address and other statuses
            are never retried.
    Plugin:
      description: >-
        An installed plugin. The WASM file path is never returned. In v1 no plugin is registered, so no instance of this schema is
        returned yet.
      type: object
      required: [manifest, enabled, installed_at]
      properties:
        manifest:
          type: object
          required: [id, name, version, description, author, hooks, runtime]
          properties:
            id:
              type: string
              description: Reverse-DNS identifier, for example com.example.slack-notifier.
            name: {type: string}
            version: {type: string}
            description: {type: string}
            author: {type: string}
            hooks:
              type: array
              items: {type: string}
              description: The event types the plugin subscribes to.
            runtime:
              type: string
              enum: [native, wasm]
        enabled: {type: boolean}
        installed_at:
          type: string
          format: date-time
          description: >-
            Not set by the registry in v1, so it reads as 0001-01-01T00:00:00Z.
    AdminUserSummary:
      description: >-
        An account as the administrator list shows it. Password hash, MFA
        secret, SSO subjects and deletion time are never returned.
      type: object
      required: [id, email, display_name, role, disabled, auth_type, service_account, mfa_enabled, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email: {type: string}
        display_name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        disabled: {type: boolean}
        service_account:
          type: boolean
          description: >-
            True for the identity an OAuth client acts as. It is made with the
            client, named after it, and can be renamed, given groups, set to staff
            or user, and disabled (which stops the client). It can never be an
            administrator and can never sign in: no password, second factor,
            passkey or SSO identity. It is not counted as an administrator by the
            last-administrator guard, and it is left out of assignee pickers and
            round-robin. It is never mailed.
        auth_type:
          type: string
          enum: [local, saml, oidc, both, local+oidc, saml+oidc, local+saml+oidc, service]
          description: >-
            How the account signs in, derived from what it holds: a password, a SAML
            subject, an OIDC subject. local is a password and nothing else; an account
            with no credential yet (has_password false) also reads local. saml and oidc
            are that subject alone. both is a password plus SAML, and keeps that
            meaning. The other combinations are joined with +, always in the order
            local, saml, oidc. Before 1.3 an account that signed in only through OIDC,
            or a password plus OIDC, read local. service is a service account (the
            identity an OAuth client acts as), which never signs in.
        mfa_enabled:
          type: boolean
          description: The TOTP flag only. A passkey-only account reads false here.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminUserDetail:
      description: >-
        One account in detail: the summary fields, flattened into the same object,
        plus the fields below.
      allOf:
        - $ref: '#/components/schemas/AdminUserSummary'
        - type: object
          required: [has_password, passkey_count, groups]
          properties:
            has_password:
              type: boolean
              description: True when a local password is set.
            passkey_count:
              type: integer
              minimum: 0
              description: The number of registered passkeys. The same on GET and PATCH.
            groups:
              type: array
              items:
                $ref: '#/components/schemas/Group'
              description: The groups the user is a member of. An empty array when there are none.
    GroupScope:
      description: >-
        One category, or one type of it, that routes tickets to a group. type_id is omitted for an
        entry that covers the whole category.
      type: object
      required: [group_id, category_id]
      properties:
        group_id: {$ref: '#/components/schemas/Uuid'}
        category_id: {$ref: '#/components/schemas/Uuid'}
        type_id:
          $ref: '#/components/schemas/Uuid'
          description: The type this entry covers. Absent when the entry covers every type in the category.
    CustomFieldDef:
      description: >-
        A custom field definition. options is present
        only when the definition has options. The server stores options as sent for any
        field type, and only select fields use them.
      type: object
      required: [id, name, field_type, sort_order, active, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        field_type: {type: string, enum: [text, textarea, number, select]}
        options:
          type: array
          items: {type: string}
        sort_order: {type: integer}
        active:
          type: boolean
          description: False once the definition is deactivated.
        created_at: {type: string, format: date-time}
    FieldAssignment:
      description: >-
        A custom field attached to a category, type or item. field_def is
        present only in list responses. There it carries id, name, field_type, options
        and active, and its sort_order is 0 and created_at is the zero time. It is absent
        from create and update responses.
      type: object
      required: [id, field_def_id, scope_type, scope_id, sort_order, visible_on_new, required_on_new]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        field_def_id: {$ref: '#/components/schemas/Uuid'}
        field_def: {$ref: '#/components/schemas/CustomFieldDef'}
        scope_type:
          type: string
          enum: [category, type, item]
          description: The CTI level the assignment is attached to.
        scope_id: {$ref: '#/components/schemas/Uuid'}
        sort_order: {type: integer}
        visible_on_new: {type: boolean}
        required_on_new: {type: boolean}
    SlaPolicy:
      description: >-
        An SLA policy. priority and category_id are absent when the
        policy applies to all priorities or all categories.
      type: object
      required: [id, name, response_target_min, resolution_target_min]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        priority: {$ref: '#/components/schemas/Priority'}
        category_id: {$ref: '#/components/schemas/Uuid'}
        response_target_min:
          type: integer
          description: Minutes of SLA time until a first response is due. Time the ticket spends pending does not count.
        resolution_target_min:
          type: integer
          description: Minutes of SLA time until resolution is due. Time the ticket spends pending does not count.
  responses:
    NoContent:
      description: Done; no body.
    Unauthorized:
      description: |
        No credential, or one that did not authenticate (unknown, expired,
        owner disabled): `unauthorized`. Written by the auth middleware, so
        served as text/plain with the JSON envelope as its body.
      content:
        text/plain:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: |
        Refused by the auth middleware, as text/plain with the JSON envelope:
        `forbidden` (role not in x-ghd-roles), `mfa_required` (session has not
        passed its second factor; only when x-ghd-mfa is true),
        `insufficient_scope` (machine credential lacks the scope in this
        operation's security requirement), `session_required` (machine
        credential on a session-only operation).
      content:
        text/plain:
          schema: {$ref: '#/components/schemas/Error'}
    BadRequest:
      description: Malformed body, path id or query value (`bad_request`, `invalid_id`, `invalid_body` and similar).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: The addressed record does not exist (`not_found`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TicketNotFound:
      description: |
        `not_found`, message `not found: ticket <id>`, where <id> is the UUID
        in its canonical lower-case form, or the tracking number upper-cased.
        Answered identically for a ticket that does not exist and one the
        caller may not see, so tracking numbers cannot be probed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    GuestNotFound:
      description: |
        The single guest refusal, byte-identical for every cause:
        `{"error":{"code":"not_found","message":"not found"}}` plus a newline.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: Credential or submission budget spent (`rate_limited`, same message for every budget).
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
