          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `forbidden`, "only staff can post internal notes",
            for a reporting user; `user_identity_required` for an OAuth client.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            `ticket_closed`: a reporting user is replying to a Closed ticket.
            `reopen_window_closed`: a reporting user is replying to a Resolved
            ticket after the reopen window has ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    post:
      operationId: resolveTicket
      summary: Mark a ticket Resolved
      description: |
        Sets the ticket to Resolved, stores the optional notes as its resolution
        notes, and answers 200 with the bare Ticket. Staff and administrators
        only: a reporting user gets 403 forbidden.
        The body is optional. A body that is not valid JSON is not refused: it is
        ignored, and the notes are empty. Resolving a Closed ticket is a way out
        of Closed, so it answers 409 ticket_closed unless closed_reopen_policy
        allows the caller's role. The path id must be a UUID. An OAuth client
        acting without a person behind it is refused with 403
        user_identity_required.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleResolveTicket
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  description: The resolution notes. Optional.
                  type: string
      responses:
        '200':
          description: The resolved ticket, as the bare Ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: "`bad_request`: invalid ticket ID (the path id is not a UUID)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `forbidden` for a reporting user (cannot resolve
            ticket); `user_identity_required` for an OAuth client.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: "`ticket_closed`: the ticket is Closed and closed_reopen_policy does not allow the caller's role to reopen it."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/tags:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    get:
      operationId: listTicketTags
      summary: List the tags on a ticket
      description: |
        Staff and administrators only. A reporting user gets 403 forbidden on a
        ticket they can see, and 404 on one they cannot. Tags come back ordered by
        name. A tag that has since been deactivated still appears, with deleted_at
        set. The id must be a UUID.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleListTicketTags
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      responses:
        '200':
          description: The tags on the ticket, as a bare array (never null).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        '400':
          description: "`invalid_id`: invalid ticket id (the path id is not a UUID)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '500':
          description: "`list_failed`: the tags could not be read."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: addTicketTag
      summary: Add a tag to a ticket
      description: |
        Staff and administrators only. The name is trimmed and lower-cased. If no
        tag has that name it is created, and then attached to the ticket. Adding a
        tag that is already on the ticket succeeds and changes nothing. Answers
        201 with the Tag.
        A tag that has been deactivated cannot be used by staff. The answer is 403
        tag_deleted, and only an administrator can restore the tag. An empty name
        is refused by the domain but answers 500 add_failed in this route, not
        400. The path id must be a UUID.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleAddTicketTag
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  description: The tag name. Trimmed and lower-cased.
                  type: string
      responses:
        '201':
          description: The tag that is now on the ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          description: "`invalid_id`: invalid ticket id (the path id is not a UUID). `invalid_body`: the body is not valid JSON."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json), `tag_deleted`: the named tag has been deactivated.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '500':
          description: "`add_failed`: the tag could not be attached. Also the answer for an empty name, whose message says the name must not be empty."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
      - name: tagId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeTicketTag
      summary: Remove a tag from a ticket
      description: |
        Staff and administrators only. Detaches the tag from the ticket and answers
        204. The tag itself is kept. Removing a tag that is not on the ticket also
        answers 204. Both the path id and tagId must be UUIDs.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleRemoveTicketTag
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: "`invalid_id`: invalid ticket id, or invalid tag id (tagId is not a UUID)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '500':
          description: "`remove_failed`: the tag could not be detached."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/security-warnings:
    get:
      operationId: getSecurityWarnings
      summary: Report insecure secrets and whether attachment scanning works now
      description: |
        Administrator only, and deliberately not part of the public site payload.
        Lists the environment secrets still set to the example value the project
        ships with (names only, never values). It also pings the configured virus
        scanner at request time, so the answer reflects whether scanning works now
        rather than what the settings say. The response waits for the scanner's
        answer, so a slow scanner makes this slow.
      tags: ['Admin: Settings']
      x-ghd-handler: handleGetSecurityWarnings
      security:
        - sessionCookie: []
        - apiKey: ['settings:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The current warnings.
          content:
            application/json:
              schema:
                type: object
                required: [insecure_secrets, attachment_scanning]
                properties:
                  insecure_secrets:
                    type: [array, 'null']
                    description: |
                      Names of the environment variables still at their shipped
                      example value. null when there are none, because the list is
                      built with var and a nil slice encodes as null.
                    items:
                      type: string
                      enum: [SESSION_SECRET, JWT_SECRET]
                  attachment_scanning:
                    type: object
                    required: [policy, configured, reachable, effect]
                    properties:
                      policy:
                        type: string
                        enum: [off, required, permissive]
                        description: |
                          The scan policy in force. An unrecognised stored value
                          falls back to required when a scanner address is set and
                          to off when none is.
                      configured:
                        type: boolean
                        description: Whether a scanner address is set, from the environment or from the attachment_scan_address setting.
                      reachable:
                        type: boolean
                        description: Whether a live ping to the scanner succeeded. Always false when no address is set.
                      effect:
                        type: string
                        description: One sentence, in plain words, saying what happens to uploads right now.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/settings:
    get:
      operationId: getSettings
      summary: Read the stored instance settings
      description: |
        Administrator only. Returns every stored setting keyed by name, with each
        value as stored, except the choice-list settings, which report the value in
        force (see updateSettings). The seven write-only secrets are never returned.
        In their place the response carries a boolean <name>_set for each one,
        saying whether a non-blank value is stored. Those seven flags are always
        present, false when the secret is unset. Other unset settings are absent
        from the response.
      tags: ['Admin: Settings']
      x-ghd-handler: handleGetSettings
      security:
        - sessionCookie: []
        - apiKey: ['settings:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every stored setting, with the secret presence flags.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SettingsValues'
                  - type: object
                    required:
                      - oidc_client_secret_set
                      - saml_key_pem_set
                      - attachment_vt_api_key_set
                      - attachment_reputation_api_key_set
                      - attachment_reputation_virustotal_key_set
                      - attachment_reputation_metadefender_key_set
                      - attachment_reputation_polyswarm_key_set
                    properties:
                      oidc_client_secret_set:
                        type: boolean
                        description: Whether oidc_client_secret holds a non-blank value.
                      saml_key_pem_set:
                        type: boolean
                        description: Whether saml_key_pem holds a non-blank value.
                      attachment_vt_api_key_set:
                        type: boolean
                        description: Deprecated. Whether attachment_vt_api_key holds a non-blank value.
                      attachment_reputation_api_key_set:
                        type: boolean
                        description: Deprecated. Whether attachment_reputation_api_key holds a non-blank value.
                      attachment_reputation_virustotal_key_set:
                        type: boolean
                        description: Whether the VirusTotal key holds a non-blank value.
                      attachment_reputation_metadefender_key_set:
                        type: boolean
                        description: Whether the MetaDefender key holds a non-blank value.
                      attachment_reputation_polyswarm_key_set:
                        type: boolean
                        description: Whether the PolySwarm key holds a non-blank value.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: updateSettings
      summary: Change one or more instance settings
      description: |
        Administrator only. The body is a JSON object that maps setting names to
        values. This is a patch: a name left out keeps its stored value. Each name
        is written as sent, and the writes happen one key at a time, not in one
        transaction, so a store failure partway through leaves the keys already
        written in place and answers 500.
        Names are not checked against a list. Any name is stored, and GET returns
        it again (discrepancy D16). A name ending in _set is refused with 400
        readonly_setting, because that suffix belongs to the presence flags GET
        returns.
        These keys are validated. If one of them is wrong, the whole write is
        refused and nothing in the body is stored. Keys not listed here are stored
        as sent, without a type check:
        - closed_reopen_policy, audit_mask_requester_names, attachment_scan_policy,
          attachment_infected_handling, attachment_mismatch_handling and
          attachment_reputation_refresh take only the listed values. Any other
          value, null, and a non-string are each refused with a named code.
        - ticket_prefix is 1 to 8 uppercase letters or digits (invalid_ticket_prefix).
        - audit_retention_days must be an integer of at most 36525. Zero or less
          keeps entries forever.
        - guest_submission_enabled and staff_can_view_ticket_change_history must be
          JSON booleans. null is refused.
        - attachment_scan_address is empty, tcp://host:port or unix:///path
          (invalid_scanner_address).
        - attachment_allowed_types is an array of extensions that each match the
          pattern. An empty array is valid and means the instance takes no
          attachments (invalid_allowed_types).
        - Each reputation provider's enabled setting must be a boolean. Enabling
          VirusTotal, MetaDefender or PolySwarm needs a key, either stored already
          or sent in the same request (invalid_reputation_config). CIRCL needs no
          key.
        - The SAML and OIDC keys must be of the right JSON type, and null is refused.
          Enabling OIDC needs an issuer URL, a client id and a client secret.
        - If the write leaves some administrators unable to sign in by any method,
          it is applied and the answer is 200 with a warning that names them. If it
          would leave no administrator able to sign in, it is refused with 400.
        Session only: an API key or OAuth client that sends any of the keys below,
        anywhere in the body, is refused with 403 session_required, and nothing is
        written. Every other key is open to a machine credential that has
        settings:write.
        saml_enabled, saml_metadata_url, saml_cert_pem, saml_key_pem,
        oidc_enabled, oidc_issuer_url, oidc_client_id, oidc_client_secret,
        oidc_redirect_url, mfa_enabled, mfa_enforced_roles, allowed_email_domains,
        self_signup_enabled, open_registration_enabled, closed_reopen_policy,
        audit_mask_requester_names, guest_submission_enabled,
        attachment_scan_address, attachment_scan_policy, attachment_allowed_types,
        attachment_infected_handling, attachment_mismatch_handling,
        audit_retention_days, staff_can_view_ticket_change_history,
        attachment_vt_lookup, attachment_vt_api_key, attachment_reputation_provider,
        attachment_reputation_api_key, attachment_reputation_virustotal_enabled,
        attachment_reputation_virustotal_key, attachment_reputation_metadefender_enabled,
        attachment_reputation_metadefender_key, attachment_reputation_polyswarm_enabled,
        attachment_reputation_polyswarm_key, attachment_reputation_circl_enabled,
        attachment_reputation_refresh.
      tags: ['Admin: Settings']
      x-ghd-handler: handleUpdateSettings
      security:
        - sessionCookie: []
        - apiKey: ['settings:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsValues'
      responses:
        '200':
          description: |
            The write was applied, but it leaves some administrators unable to sign
            in. The warning names them.
          content:
            application/json:
              schema:
                type: object
                required: [warning]
                properties:
                  warning:
                    type: string
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: |
            The body is not a JSON object, a value is of the wrong type or outside
            its list, or the write would strand every administrator. Codes:
            bad_request (invalid JSON, a wrong type, an audit retention above the
            maximum, or a refusal from the SSO guard), readonly_setting,
            invalid_closed_reopen_policy, invalid_audit_mask_requester_names,
            invalid_scan_policy, invalid_infected_handling,
            invalid_mismatch_handling, invalid_reputation_refresh,
            invalid_ticket_prefix, invalid_scanner_address, invalid_allowed_types,
            invalid_reputation_config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the authentication middleware (text/plain): forbidden (role),
            mfa_required (session without its second factor), insufficient_scope
            (the key lacks settings:write). Or refused by the handler (JSON):
            session_required, when a machine credential sends a session-only key.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/settings/logo:
    post:
      operationId: uploadLogo
      summary: Upload the site logo
      description: |
        Administrator only. Accepts one PNG, JPEG or GIF of at most 2 MB in the
        multipart field logo. SVG is refused. The image is scaled to fit within 320
        by 64 pixels with its aspect ratio kept, then stored as PNG, which also
        strips its metadata. A new logo replaces the old one and sets the
        site_logo_url setting, which GET /api/v1/site reports. The logo route serves
        it from a 5-minute cache. A body over the cap is refused as 400
        invalid_form, not 413.
      tags: ['Admin: Settings']
      x-ghd-handler: handleUploadLogo
      security:
        - sessionCookie: []
        - apiKey: ['settings:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
                  description: The image file. Exactly one.
      responses:
        '200':
          description: The logo is stored.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    description: The logo URL with a cache-busting query, for example /api/v1/logo?v=1767225600.
        '400':
          description: |
            Refused before anything is stored. Codes: invalid_form (not multipart,
            or over the body cap), missing_field (no logo field), file_too_large
            (over 2 MB), invalid_type (not PNG, JPEG or GIF), invalid_image (the
            image does not decode, or its decoded size is over the limit).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The file could not be read, the storage directory or file could not be written, or the logo setting could not be saved (read_error, storage_error, settings_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteLogo
      summary: Remove the site logo
      description: |
        Administrator only. Deletes the stored logo file and clears the
        site_logo_url setting. With no logo stored it still answers 204.
      tags: ['Admin: Settings']
      x-ghd-handler: handleDeleteLogo
      security:
        - sessionCookie: []
        - apiKey: ['settings:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The logo setting could not be cleared (settings_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/guest/attachments:
    post:
      operationId: guestUploadAttachment
      summary: Attach a file to the ticket a guest link names
      description: |
        Authenticated by the guest token alone. The token names the ticket, so no
        ticket id appears in the path. The request is the same multipart upload as
        uploadAttachment, with the same checks, scanning, quarantine and wrapping,
        and the same 25 MB cap. Two things differ. Submission being switched off
        does not stop a guest who already holds a working link. A Closed ticket
        answers 404 not_found, the same as a bad link, and a Resolved ticket past
        its reopen window answers 409 reopen_window_closed.
        The response is the stored attachment. Its reputation block is null, since
        only staff and admin reads fill that in.
      tags: ['Guest']
      x-ghd-handler: handleGuestUploadAttachment
      security:
        - guestToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file. One per request.
      responses:
        '201':
          description: The attachment is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          description: |
            No file field, or a body that is not multipart (bad_request), or a
            filename that is not valid UTF-8, contains a NUL, is longer than 255
            bytes, or contains a control or text-direction character
            (invalid_filename).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/GuestNotFound'
        '409':
          description: The ticket is Resolved and its reopen window has closed (reopen_window_closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The file is over 25 MB (too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: |
            The extension is not in the instance's allowed list (unsupported_type),
            or the content contradicts the name and the operator chose to refuse
            such files (invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            The scanner found malware and the operator chose to refuse it (infected),
            or the image could not be decoded for recompression (invalid_image).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The upload could not be read, stored on disk, or recorded (read_error, storage_error, db_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            The scanner is unavailable and the scan policy is required, so the file
            is refused until the scanner returns (scanner_unavailable).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    get:
      operationId: listAttachments
      summary: List the attachments on a ticket
      description: |
        Anyone who may see the ticket may list its attachments. A reporting user
        sees only their own tickets, and a ticket that is not theirs answers 404.
        The list is not paged.
        Each entry carries the hash of the upload, the detected type and the
        scanner's result. reputation_url is set on the attachments the instance
        found worth a second opinion: the scanner named the file, or its content
        contradicts its name.
        reputation is filled in for staff and admin only, and only for a
        quarantined file (one the scanner named). For each enabled provider, a
        verdict already cached is used. Otherwise the file's hash is sent to that
        provider now, which is a live lookup to a third party. A reporting user
        never causes a lookup. The lookup shares a five-second budget across the
        request, and a provider that did not answer shows as unavailable rather than
        failing the response.
        Takes the ticket UUID. Unlike other ticket routes, a tracking number is
        refused with 400 invalid_id here, even though the access check accepts it
        (discrepancy D15).
      tags: ['Attachments']
      x-ghd-handler: handleListAttachments
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: The attachments on the ticket, in the order the store returns them. A ticket with none gives an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
        '400':
          description: The ticket id is not a UUID (invalid_id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
    post:
      operationId: uploadAttachment
      summary: Upload a file to a ticket
      description: |
        Multipart upload of one file in the field file, up to 25 MB. The checks run
        in this order.
        1. The name must be valid UTF-8, contain no NUL, no control or
           text-direction characters, and be at most 255 bytes (400 invalid_filename).
        2. The extension must be in the instance's allowed list
           (attachment_allowed_types). The default is .pdf, .docx, .xlsx, .txt, .log,
           .jpg, .jpeg, .png and .bmp (415 unsupported_type).
        3. The size is checked against 25 MB (413 too_large).
        4. The bytes are hashed (SHA-256) and their type is detected. A content
           that contradicts the name is recorded as a mismatch. Under the default
           refuse setting it is refused with 415 invalid_file. Under wrap it is stored
           as suspicious-<crc32>.zip with no password.
        5. The scanner runs unless the scan policy is off. An infected file is
           refused with 422 infected by default. Under quarantine it is stored as the
           uploaded name plus .zip, inside an archive whose password is the published
           word "infected", and the scanner's name is recorded in virus_name. If the
           scanner cannot be reached, the file is refused with 503 under the required
           policy and accepted unscanned under permissive.
        6. Images (JPEG, PNG, BMP) are re-encoded as whichever of JPEG (quality 85)
           or PNG is smaller, or as PNG when they have transparency (422
           invalid_image if they cannot be decoded). The stored size and file differ
           from the upload, but sha256 is the hash of the bytes as uploaded.
        A reporting user may upload only to their own ticket. A Closed ticket answers
        409 ticket_closed. A Resolved ticket past its reopen window answers 409
        reopen_window_closed. Staff and admin are not limited by the ticket's state.
        The response is the stored attachment. Its reputation block is null, since
        only listAttachments and the re-check fill it in.
        Takes the ticket UUID. A tracking number is refused with 400 invalid_id
        (discrepancy D15).
      tags: ['Attachments']
      x-ghd-handler: handleUploadAttachment
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file. One per request.
      responses:
        '201':
          description: The attachment is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          description: |
            No file field, or a body that is not multipart (bad_request), a filename
            refused by the name checks (invalid_filename), or a ticket id that is not
            a UUID (invalid_id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            ticket_closed: the reporter's ticket is Closed. reopen_window_closed: the
            ticket is Resolved and the reopen window has passed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The file is over 25 MB, or the body is over the cap that includes multipart framing (too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: |
            The extension is not allowed on this instance (unsupported_type), or the
            content contradicts the name and the operator chose to refuse such files
            (invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            The scanner found malware and the operator chose to refuse it (infected),
            or an image could not be decoded for recompression (invalid_image).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The upload could not be read, stored on disk, or recorded (read_error, storage_error, db_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The scanner is unavailable and the scan policy is required (scanner_unavailable).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/attachments/{attachId}:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
      - name: attachId
        in: path
        required: true
        description: The attachment's UUID, as listed by listAttachments.
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadAttachment
      summary: Download an attachment
      description: |
        Streams the stored file as a download. The response is always
        application/octet-stream with Content-Disposition: attachment, whatever the
        file is, so a browser saves it rather than rendering it. The filename is sent
        twice, as a plain quoted name and as an RFC 5987 UTF-8 name. A quarantined
        file comes back as the ZIP archive it was stored as, whose password is the
        published word "infected". A file wrapped for its contents comes back as its
        .zip.
        Rendering is refused. A request whose Sec-Fetch-Dest header is anything other
        than document or empty gets 403 not_downloadable. A request with no
        Sec-Fetch-Dest header (curl, and browsers older than Chrome 80, Firefox 90
        and Safari 16.4) is allowed, since the check cannot apply to it. Vary:
        Sec-Fetch-Dest keeps a cache from answering a rendering request with a
        response that was fetched for a download.
        Range and conditional requests are supported. The Last-Modified time is the
        upload time. A request for several ranges gets multipart/byteranges, with
        the same blob type on each part.
        Answers 404 not_found when the attachment does not belong to this ticket or
        its file is missing from disk. A reporting user asking for a ticket that is
        not theirs gets the ticket 404 instead.
        Takes the ticket UUID. A tracking number is refused with 400 invalid_id
        (discrepancy D15).
      tags: ['Attachments']
      x-ghd-handler: handleDownloadAttachment
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      parameters:
        - name: Sec-Fetch-Dest
          in: header
          required: false
          description: Sent by browsers. Only document and empty are served. Absent is served too.
          schema:
            type: string
            enum: [document, empty]
        - name: Range
          in: header
          required: false
          description: A byte range, for example bytes=0-1023. Multiple ranges are allowed.
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          description: A date or ETag that decides whether the Range applies.
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
        - name: If-Unmodified-Since
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The whole file.
          headers:
            Content-Disposition:
              description: attachment with the stored filename, in both the plain and the RFC 5987 forms.
              schema:
                type: string
            Cache-Control:
              description: Always private, max-age=3600.
              schema:
                type: string
            Vary:
              description: Always Sec-Fetch-Dest.
              schema:
                type: string
            Last-Modified:
              description: The upload time.
              schema:
                type: string
            Accept-Ranges:
              description: Always bytes.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Part of the file, for a single Range. Content-Range says which bytes.
          headers:
            Content-Range:
              description: The bytes sent, as bytes start-end/total.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: The client's copy is current. No body.
        '400':
          description: The ticket or attachment id is not a UUID (invalid_id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the authentication middleware (text/plain): mfa_required,
            insufficient_scope. Or refused by the handler (JSON): not_downloadable,
            when Sec-Fetch-Dest asks for a rendering context.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '412':
          description: An If-Match, If-Unmodified-Since or If-Range precondition failed. No body.
        '416':
          description: The Range cannot be satisfied. Content-Range gives the file's size.
          headers:
            Content-Range:
              description: bytes */total.
              schema:
                type: string
  /api/v1/tickets/{id}/attachments/{attachId}/reputation:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
      - name: attachId
        in: path
        required: true
        description: The attachment's UUID, as listed by listAttachments.
        schema:
          type: string
          format: uuid
    post:
      operationId: recheckAttachmentReputation
      summary: Ask the reputation providers about a file again
      description: |
        Staff and admin only. Re-checks the verdict on one quarantined file with each
        enabled provider, or with only the provider named in the provider query
        parameter. A person asked for this, so a page render never does it.
        Each provider's verdict has its own clock. For each file, a provider can be
        re-checked once every seven days, whatever the automatic refresh interval is
        set to. A re-check inside that week is refused with 429 checked_recently and
        the date it clears. The daily budget still applies. A verdict that cannot
        change any more (a detection, or a known catalogue entry) is refused with 409
        detection_is_final. A file no provider has looked up yet is refused with 409
        no_verdict, because a re-check is never a first lookup.
        When at least one provider refreshed its verdict, the answer is 200 with the
        attachment and a rebuilt reputation block. A provider that refused is logged,
        not returned. When none refreshed, the refusal code is the one that holds for
        every provider asked: detection_is_final if all of them are final, no_verdict
        if none has a stored verdict, otherwise checked_recently if any is inside its
        week. Any other mix, or a provider that failed, is 503 reputation_unavailable.
        A file with no hash cannot be checked, and is refused with 409 no_verdict.
        Takes the ticket UUID. A tracking number is refused with 400 invalid_id
        (discrepancy D15). A missing attachment, or one that belongs to another
        ticket, is 404 not_found with its own message.
      tags: ['Attachments']
      x-ghd-handler: handleRecheckAttachmentReputation
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      parameters:
        - name: provider
          in: query
          required: false
          description: Re-check only this provider. Omit to re-check every enabled provider. A name that is not enabled on this instance is 400 invalid_provider.
          schema:
            type: string
            enum: [virustotal, metadefender, polyswarm, circl]
      responses:
        '200':
          description: The re-check ran, and the attachment carries the rebuilt reputation block.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          description: |
            The ticket or attachment id is not a UUID (invalid_id), or the provider
            named is not enabled (invalid_provider).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            detection_is_final: the verdict cannot change any more. no_verdict: no
            provider has looked the file up yet, or it has no hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: No provider refreshed and at least one is inside its seven-day floor (checked_recently). Retry-After is the seconds until the earliest one clears.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No provider is enabled, a provider failed or ran out of time, or the answers were a mix that no single refusal describes (reputation_unavailable). Retry-After is 60.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/api-keys:
    get:
      operationId: listAPIKeys
      summary: List the caller's API keys
      description: >-
        Returns the API keys owned by the signed-in administrator, newest first.
        Only the caller's own keys are listed, whichever administrator created
        them. The token and its hash are never returned, so a key's secret cannot
        be read back after creation.
      tags: ['Admin: Credentials']
      x-ghd-handler: handleListAPIKeys
      security:
        - sessionCookie: []
        - apiKey: ['credentials:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The caller's keys, newest first. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAPIKey
      summary: Create an API key
      description: >-
        Creates an API key that acts at the caller's role and counts as having
        passed MFA. The raw token is returned once, in this response, and cannot
        be shown again. It has the form GHD_ followed by 64 hexadecimal
        characters. scopes is required: a non-empty list of resource:action
        values from GET /api/v1/admin/scopes. A machine credential can grant only
        scopes it holds itself. expires_at is optional; when given it must be a
        future RFC 3339 timestamp. An expired key is refused as if it were
        unknown. name is not validated and may be empty.
      tags: ['Admin: Credentials']
      x-ghd-handler: handleCreateAPIKey
      security:
        - sessionCookie: []
        - apiKey: ['credentials:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                name:
                  type: string
                  description: A label for the key. Not validated.
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    pattern: '^[a-z_]+:(read|write)$'
                  description: >-
                    One or more resource:action scopes. Each must be in the catalogue
                    from GET /api/v1/admin/scopes. Write implies read on the same
                    resource.
                expires_at:
                  type: [string, 'null']
                  format: date-time
                  description: >-
                    RFC 3339 expiry, for example 2027-01-31T00:00:00Z. Empty or null
                    means the key never expires.
      responses:
        '201':
          description: >-
            Created. The token is shown only in this response. expires_at is null
            when the key never expires.
          content:
            application/json:
              schema:
                type: object
                required: [id, token, name, expires_at]
                properties:
                  id: {$ref: '#/components/schemas/Uuid'}
                  token:
                    type: string
                    description: The raw key, GHD_ followed by 64 hexadecimal characters. Shown once.
                  name: {type: string}
                  expires_at:
                    type: [string, 'null']
                    format: date-time
        '400':
          description: >-
            Refused by the handler, as application/json. bad_request ("invalid
            JSON") for a body that does not decode. scopes_required when scopes is
            empty or missing. invalid_scope when an entry is not a catalogue scope
            (for example a write scope on audit). invalid_expires_at when expires_at
            is not RFC 3339 or is not in the future.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Two sources. The authentication middleware refuses with text/plain:
            forbidden (role), mfa_required (second factor not passed) or
            insufficient_scope (the API key lacks credentials:write). The handler
            refuses with application/json: insufficient_scope when a machine
            credential asks to grant a scope it does not hold itself.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/api-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The API key's id.
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteAPIKey
      summary: Delete an API key
      description: >-
        Deletes the key with this id, whoever owns it, so the key stops working on
        the next request. An unknown id also answers 204, because nothing checks
        that a row was removed.
      tags: ['Admin: Credentials']
      x-ghd-handler: handleDeleteAPIKey
      security:
        - sessionCookie: []
        - apiKey: ['credentials:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request, message "invalid ID", when the path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/categories/{id}/groups:
    parameters:
      - name: id
        in: path
        required: true
        description: The category's UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: listGroupsForCategory
      summary: List groups scoped to a whole category
      description: >-
        Returns the groups that hold a category-level scope entry, meaning one
        with no type_id. The category editor uses this to show which groups handle
        the category. Groups that cover only one type of the category are not
        included. An unknown category id answers 200 with an empty array.
      tags: ['Admin: Groups']
      x-ghd-handler: handleListGroupsForCategory
      security:
        - sessionCookie: []
        - apiKey: ['categories:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The matching groups, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '400':
          description: >-
            bad_request, message "invalid category id", when the path id is not a
            UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/categories/{id}/types/{typeId}/groups:
    parameters:
      - name: id
        in: path
        required: true
        description: The category's UUID.
        schema:
          type: string
          format: uuid
      - name: typeId
        in: path
        required: true
        description: The type's UUID, which must belong to the category.
        schema:
          type: string
          format: uuid
    get:
      operationId: listGroupsForType
      summary: List groups scoped to one category type
      description: >-
        Returns the groups with a scope entry for exactly this category and type,
        which the type editor shows. Groups scoped to the whole category are not
        included. An unknown id answers 200 with an empty array.
      tags: ['Admin: Groups']
      x-ghd-handler: handleListGroupsForType
      security:
        - sessionCookie: []
        - apiKey: ['categories:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The matching groups, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '400':
          description: >-
            bad_request, message "invalid category id" or "invalid type id", when a
            path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/groups:
    get:
      operationId: listGroups
      summary: List groups
      description: Returns every group, ordered by name.
      tags: ['Admin: Groups']
      x-ghd-handler: handleListGroups
      security:
        - sessionCookie: []
        - apiKey: ['groups:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every group. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createGroup
      summary: Create a group
      description: >-
        Creates a group with no members and no scopes. name is required and is
        trimmed of surrounding spaces. A blank name, and a name already held by
        another group, both answer 500 internal_error rather than 400 or 409,
        because the refusal is not mapped to a status (discrepancy F5-3).
      tags: ['Admin: Groups']
      x-ghd-handler: handleCreateGroup
      security:
        - sessionCookie: []
        - apiKey: ['groups:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Unique across groups. Blank is refused (see the description above).
                description:
                  type: string
                  description: Free text. Optional.
      responses:
        '201':
          description: The created group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: >-
            bad_request, message "invalid JSON", when the body does not decode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >-
            internal_error, for a blank name and for a duplicate name. Both are
            refused by the group store or by the database, and neither is mapped
            to a 4xx (discrepancy F5-3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The group's UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getGroup
      summary: Get a group
      description: >-
        Returns one group. An unknown id answers 500 internal_error, not 404,
        because the store's not-found error is not mapped (discrepancy F5-2).
      tags: ['Admin: Groups']
      x-ghd-handler: handleGetGroup
      security:
        - sessionCookie: []
        - apiKey: ['groups:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: >-
            bad_request, message "invalid group ID", when the path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >-
            internal_error, for an id that names no group (discrepancy F5-2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateGroup
      summary: Update a group
      description: >-
        Changes the fields that are sent. Absent fields keep their value. The group
        is read before the body is decoded, so an unknown id answers 500 whatever
        the body holds. A blank or taken name answers 500 (discrepancy F5-3).
      tags: ['Admin: Groups']
      x-ghd-handler: handleUpdateGroup
      security:
        - sessionCookie: []
        - apiKey: ['groups:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New name. Blank is refused with 500. Omit to keep the current name.
                description:
                  type: string
                  description: New description. Omit to keep the current one.
      responses:
        '200':
          description: The group after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: >-
            bad_request, with message "invalid group ID" for a path id that is not a
            UUID, or "invalid JSON" for a body that does not decode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >-
            internal_error, for an unknown group id, a blank name or a name held by
            another group (discrepancy F5-2 and F5-3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteGroup
      summary: Delete a group
      description: >-
        Deletes the group together with its memberships and scopes. An unknown id
        also answers 204.
      tags: ['Admin: Groups']
      x-ghd-handler: handleDeleteGroup
      security:
        - sessionCookie: []
        - apiKey: ['groups:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request, message "invalid group ID", when the path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/groups/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        description: The group's UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: listGroupMembers
      summary: List a group's members
      description: >-
        Returns the members as user objects, with password and MFA secrets never
        included. Disabled members are listed. Soft-deleted members are left out.
        An unknown group id answers 200 with an empty array.
      tags: ['Admin: Groups']
      x-ghd-handler: handleListGroupMembers
      security:
        - sessionCookie: []
        - apiKey: ['groups:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The members. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: >-
            bad_request, message "invalid group ID", when the path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: addGroupMember
      summary: Add a member to a group
      description: >-
        Adds a user to the group. Adding someone who is already a member answers
        204 and changes nothing. A user_id that names no account answers 500
        internal_error, as does a missing user_id, because the foreign key refusal
        is not mapped (discrepancy F5-4). A soft-deleted account is accepted, and
        is then left out of the member list.
      tags: ['Admin: Groups']
      x-ghd-handler: handleAddGroupMember
      security:
        - sessionCookie: []
        - apiKey: ['groups:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request, with message "invalid group ID" for a bad path id, or
            "invalid JSON" for a body that does not decode, including a user_id that
            is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >-
            internal_error, for an unknown group id, an unknown or missing user_id
            (discrepancy F5-4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/groups/{id}/members/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        description: The group's UUID.
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        description: The member's user UUID.
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeGroupMember
      summary: Remove a member from a group
      description: >-
        Removes the user from the group. Removing someone who is not a member also
        answers 204.
      tags: ['Admin: Groups']
      x-ghd-handler: handleRemoveGroupMember
      security:
        - sessionCookie: []
        - apiKey: ['groups:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request, with message "invalid group ID" or "invalid user ID", when a
            path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/groups/{id}/scopes:
    parameters:
      - name: id
        in: path
        required: true
        description: The group's UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: listGroupScopes
      summary: List a group's scopes
      description: >-
        Returns the category and type entries that route tickets to this group. An
        entry with no type_id covers every type in the category. An unknown group
        id answers 200 with an empty array.
      tags: ['Admin: Groups']
      x-ghd-handler: handleListGroupScopes
      security:
        - sessionCookie: []
        - apiKey: ['groups:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The group's scope entries. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupScope'
        '400':
          description: >-
            bad_request, message "invalid group ID", when the path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: addGroupScope
      summary: Add a category or type scope to a group
      description: >-
        Routes tickets in a category, or in one type of it, to this group. Omit
        type_id, or send null, to cover the whole category. Adding an entry that
        already exists answers 204. A category that does not exist, a type that
        does not belong to the category, and an unknown group id each answer 500
        internal_error, because the foreign key refusal is not mapped (discrepancy
        F5-4).
      tags: ['Admin: Groups']
      x-ghd-handler: handleAddGroupScope
      security:
        - sessionCookie: []
        - apiKey: ['groups:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id]
              properties:
                category_id:
                  $ref: '#/components/schemas/Uuid'
                type_id:
                  description: The type to scope to, or null for the whole category.
                  anyOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request, with message "invalid group ID" for a bad path id, or
            "invalid JSON" for a body that does not decode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >-
            internal_error, for an unknown group, an unknown category, or a type that
            does not belong to the category (discrepancy F5-4). A missing category_id
            is also refused this way, because the zero UUID names no category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: removeGroupScope
      summary: Remove a category or type scope from a group
      description: >-
        Removes the entry that matches category_id and type_id. A missing or null
        type_id matches the whole-category entry. The entry is named by the body,
        not by a path segment. Matching nothing answers 204.
      tags: ['Admin: Groups']
      x-ghd-handler: handleRemoveGroupScope
      security:
        - sessionCookie: []
        - apiKey: ['groups:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id]
              properties:
                category_id:
                  $ref: '#/components/schemas/Uuid'
                type_id:
                  description: The type of the entry to remove, or null for the whole-category entry.
                  anyOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request, with message "invalid group ID" for a bad path id, or
            "invalid JSON" for a body that does not decode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/oauth-clients:
    get:
      operationId: listOAuthClients
      summary: List OAuth clients
      description: >-
        Returns every OAuth client, ordered by name. The client secret is kept only
        as a hash and is never returned. Use id to delete a client, and client_id
        as the value a caller presents to the token endpoint.
      tags: ['Admin: Credentials']
      x-ghd-handler: handleListOAuthClients
      security:
        - sessionCookie: []
        - apiKey: ['credentials:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every OAuth client. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OAuthClient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createOAuthClient
      summary: Create an OAuth client
      description: >-
        Creates a client that can obtain bearer tokens from POST
        /api/v1/auth/oauth/token. The client acts as staff, so it never reaches an
        administrator-only route. The client_secret is returned once. The response
        carries client_id and the secret but not the record id, so read the id from
        the list when you need to delete the client. scopes is required and must be
        a non-empty list of valid resource:action values. A machine credential can
        grant only scopes it holds itself.
      tags: ['Admin: Credentials']
      x-ghd-handler: handleCreateOAuthClient
      security:
        - sessionCookie: []
        - apiKey: ['credentials:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                name:
                  type: string
                  description: A label for the client. Not validated.
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    pattern: '^[a-z_]+:(read|write)$'
                  description: One or more catalogue scopes from GET /api/v1/admin/scopes.
      responses:
        '201':
          description: >-
            Created. client_secret is shown only in this response.
          content:
            application/json:
              schema:
                type: object
                required: [client_id, client_secret, name]
                properties:
                  client_id:
                    type: string
                    description: 16 lowercase hexadecimal characters.
                  client_secret:
                    type: string
                    description: The raw secret, 64 hexadecimal characters with no prefix. Shown once.
                  name: {type: string}
        '400':
          description: >-
            Refused by the handler, as application/json. bad_request ("invalid JSON")
            for a body that does not decode. scopes_required when scopes is empty or
            missing. invalid_scope when an entry is not a catalogue scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Two sources. The authentication middleware refuses with text/plain:
            forbidden (role), mfa_required (second factor not passed) or
            insufficient_scope (the API key lacks credentials:write). The handler
            refuses with application/json: insufficient_scope when a machine
            credential asks to grant a scope it does not hold itself.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/oauth-clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The OAuth client's id, as listed by GET /api/v1/admin/oauth-clients.
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteOAuthClient
      summary: Delete an OAuth client
      description: >-
        Deletes the client. Its tokens stop being accepted on the next request,
        because the client is looked up again on every request. An unknown id also
        answers 204.
      tags: ['Admin: Credentials']
      x-ghd-handler: handleDeleteOAuthClient
      security:
        - sessionCookie: []
        - apiKey: ['credentials:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request, message "invalid ID", when the path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/plugins:
    get:
      operationId: listPlugins
      summary: List plugins
      description: >-
        Returns the plugins registered with the running server. In v1 no plugin is
        registered at startup, so the array is always empty. The registry is held in
        memory and enabled state is not stored. Installing a plugin is not
        implemented (see POST).
      tags: ['Admin: Plugins']
      x-ghd-handler: handleListPlugins
      security:
        - sessionCookie: []
        - apiKey: ['plugins:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The registered plugins. Always an empty array in v1.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plugin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: installPlugin
      summary: Install a plugin (not implemented)
      description: >-
        Always answers 501 not_implemented. WASM plugin upload is not implemented in
        v1. This route is documented as a stub so that its status is not mistaken for
        a working endpoint.
      tags: ['Admin: Plugins']
      x-ghd-handler: handleInstallPlugin
      x-ghd-stub: true
      security:
        - sessionCookie: []
        - apiKey: ['plugins:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          description: >-
            not_implemented, message "WASM plugin upload not yet implemented". The
            only response this operation ever gives once authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/plugins/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The plugin's id, a reverse-DNS string such as com.example.slack-notifier. Not a UUID.
        schema:
          type: string
    patch:
      operationId: updatePlugin
      summary: Enable or disable a plugin
      description: >-
        Sets the plugin's enabled state. The enabled field is a plain boolean, so an
        absent field counts as false: a body of {} disables the plugin. An empty
        body is refused with 400. In v1 no plugin is registered, so every id answers
        500 internal_error, not 404, because the registry's not-found error is not
        mapped (discrepancy F5-1). The enabled state is held in memory and is lost on
        restart.
      tags: ['Admin: Plugins']
      x-ghd-handler: handleUpdatePlugin
      security:
        - sessionCookie: []
        - apiKey: ['plugins:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: true enables the plugin. Absent or false disables it.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request, message "invalid JSON", when the body is empty or does not
            decode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >-
            internal_error for any id, because no plugin is registered in v1 and the
            not-found error is not mapped (discrepancy F5-1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: uninstallPlugin
      summary: Uninstall a plugin (not implemented)
      description: >-
        Always answers 501 not_implemented. Plugin uninstall is not implemented in
        v1. This route is documented as a stub.
      tags: ['Admin: Plugins']
      x-ghd-handler: handleUninstallPlugin
      x-ghd-stub: true
      security:
        - sessionCookie: []
        - apiKey: ['plugins:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          description: >-
            not_implemented, message "plugin uninstall not yet implemented". The only
            response this operation ever gives once authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/scopes:
    get:
      operationId: listScopes
      summary: List the scope catalogue
      description: >-
        Returns every scope a credential can hold, as resource:action pairs. Write
        implies read on the same resource, and the audit resource has only read.
        There is no wildcard scope. The admin UI builds its picker from this list,
        so it cannot drift from what the server enforces.
      tags: ['Admin: Credentials']
      x-ghd-handler: handleListScopes
      security:
        - sessionCookie: []
        - apiKey: ['credentials:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every scope, in catalogue order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [scope, resource, action]
                  properties:
                    scope:
                      type: string
                      pattern: '^[a-z_]+:(read|write)$'
                      description: The scope as sent in a request, resource:action.
                    resource:
                      type: string
                      description: The resource, such as tickets or credentials.
                    action:
                      type: string
                      enum: [read, write]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List users
      description: >-
        Returns up to 200 accounts, newest first. Disabled accounts are included and
        soft-deleted accounts are left out. There are no paging parameters, so an
        instance with more than 200 accounts shows only the first 200 here, as the
        admin page does. auth_type says how an account signs in. An account that
        signs in only through OIDC is reported as local (discrepancy F5-6).
      tags: ['Admin: Users']
      x-ghd-handler: handleListUsers
      security:
        - sessionCookie: []
        - apiKey: ['users:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Up to 200 accounts. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/AdminUserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createUser
      summary: Create a user
      description: >-
        Creates an account with the given role. The account has no second factor.
        password is optional. When present it must be 8 to 72 bytes. An account
        created without a password has no local sign-in until one is set with
        POST /api/v1/admin/users/{id}/password. The email address is trimmed and
        lowercased. An address that any account holds, deleted accounts included,
        answers 409 email_taken. A machine credential cannot create an administrator.
      tags: ['Admin: Users']
      x-ghd-handler: handleCreateUser
      security:
        - sessionCookie: []
        - apiKey: ['users:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name, role]
              properties:
                email:
                  type: string
                  description: A bare address with no display name. Refused when empty or malformed.
                display_name:
                  type: string
                  description: Required. Surrounding spaces are trimmed.
                role:
                  $ref: '#/components/schemas/Role'
                password:
                  type: string
                  description: >-
                    Optional. When sent, 8 to 72 bytes, counted in bytes rather than
                    characters. Omit for an account with no password yet.
      responses:
        '201':
          description: The created account, with no password or secret fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: >-
            Refused by the handler or the user service, as application/json. bad_request
            with message "invalid JSON" for a body that does not decode. bad_request
            with a message beginning "invalid input:" for an empty or malformed email,
            a blank display name, an invalid role, or a password shorter than 8 or
            longer than 72 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Two sources. The authentication middleware refuses with text/plain:
            forbidden (role), mfa_required (second factor not passed) or
            insufficient_scope (the API key lacks users:write). The handler refuses
            with application/json: session_required when an API key or OAuth client
            asks to create an administrator, which needs a signed-in session.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            email_taken, with message "that email address is already in use, possibly
            by a deleted account".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The user's UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getUser
      summary: Get a user
      description: >-
        Returns one account with its groups and passkey count. Soft-deleted accounts
        are still returned here, so a deleted account can be inspected by id. The
        has_password field says whether a local password is set.
      tags: ['Admin: Users']
      x-ghd-handler: handleGetUser
      security:
        - sessionCookie: []
        - apiKey: ['users:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '400':
          description: >-
            bad_request, message "invalid user ID", when the path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            not_found, when no account has this id. The message is not stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateUser
      summary: Update a user
      description: >-
        Applies the fields that are sent, in this order: disabled (disabling also
        ends the account's sessions), reset_mfa (clears the authenticator and every
        passkey, and ends sessions), role (ends sessions), then display_name and
        email. Absent fields are unchanged. The steps are not one transaction. When a
        later field is refused, the earlier ones are already written: disabled true
        with an invalid email leaves the account disabled and answers 400. The last
        active administrator cannot be disabled or demoted, and that answers 400. A
        machine credential cannot change an administrator's account or promote a user
        to administrator; that answers 403 session_required. The response carries
        passkey_count as 0 (discrepancy F5-7), so read GET for the real count.
      tags: ['Admin: Users']
      x-ghd-handler: handleUpdateUser
      security:
        - sessionCookie: []
        - apiKey: ['users:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: New display name. Blank is refused. Omit to keep the current one.
                email:
                  type: string
                  description: New address, trimmed and lowercased. Refused when empty or malformed. Omit to keep the current one.
                role:
                  $ref: '#/components/schemas/Role'
                disabled:
                  type: boolean
                  description: true disables the account and ends its sessions. false re-enables it. Omit to leave it as it is.
                reset_mfa:
                  type: boolean
                  description: true clears the TOTP secret and every passkey, and ends the account's sessions. Absent means false.
      responses:
        '200':
          description: The account after the changes, in the detail shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '400':
          description: >-
            Refused by the handler or the user service, as application/json. bad_request
            with message "invalid JSON" or "invalid user ID". bad_request with a message
            beginning "invalid input:" for an invalid email, a blank display name, an
            invalid role, or a change that would leave no active administrator (for
            example disabling or demoting the last one).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Two sources. The authentication middleware refuses with text/plain:
            forbidden (role), mfa_required (second factor not passed) or
            insufficient_scope (the API key lacks users:write). The handler refuses with
            application/json: session_required when an API key or OAuth client targets an
            administrator, or asks to promote a user to administrator.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            not_found, when no account has this id. Every change that needs the account
            either looks it up first or finds no row to write, so an unknown id answers 404
            for any body that decodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            email_taken, when the new address belongs to another account, deleted accounts
            included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteUser
      summary: Delete a user
      description: >-
        Soft-deletes the account. It is hidden from lists, its sign-in is refused, its
        sessions end, and its open tickets return to the unassigned queue. A failure to
        return the tickets is logged and does not change the answer. The row is kept,
        so the email address stays taken. The last active administrator cannot be
        deleted, and that answers 400. A machine credential cannot delete an
        administrator; that answers 403 session_required.
      tags: ['Admin: Users']
      x-ghd-handler: handleDeleteUser
      security:
        - sessionCookie: []
        - apiKey: ['users:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request. "invalid user ID" for a path id that is not a UUID. An
            invalid input message beginning "invalid input:" when the account is the
            last active administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Two sources. The authentication middleware refuses with text/plain:
            forbidden (role), mfa_required (second factor not passed) or
            insufficient_scope (the API key lacks users:write). The handler refuses with
            application/json: session_required when an API key or OAuth client targets an
            administrator.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            not_found, when no live account has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/users/{id}/password:
    parameters:
      - name: id
        in: path
        required: true
        description: The user's UUID.
        schema:
          type: string
          format: uuid
    post:
      operationId: adminResetPassword
      summary: Set a user's password
      description: >-
        Sets a new local password without asking for the old one, and ends all of the
        account's sessions, since a reset usually answers a compromise. The password
        is checked before the account is looked up, so an unknown id with a short
        password answers 400, not 404. The reset is recorded in the audit log on a
        best-effort basis. A machine credential cannot reset an administrator's
        password.
      tags: ['Admin: Users']
      x-ghd-handler: handleAdminResetPassword
      security:
        - sessionCookie: []
        - apiKey: ['users:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
                  description: Required. 8 to 72 bytes, counted in bytes rather than characters.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request. "invalid user ID" for a path id that is not a UUID, "invalid
            JSON" for a body that does not decode, and a message beginning "invalid input:"
            when the password is blank, shorter than 8 bytes or longer than 72 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Two sources. The authentication middleware refuses with text/plain:
            forbidden (role), mfa_required (second factor not passed) or
            insufficient_scope (the API key lacks users:write). The handler refuses with
            application/json: session_required when an API key or OAuth client targets an
            administrator.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            not_found, when no account has this id. Reached only after the password has
            passed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/webhooks:
    get:
      operationId: listWebhooks
      summary: List webhooks
      description: >-
        Returns every webhook subscription, enabled or not, oldest first. A disabled
        hook stays listed so that it can be switched back on. The secret is never
        returned. last_delivery shows the latest delivery attempt only.
      tags: ['Admin: Webhooks']
      x-ghd-handler: handleListWebhooks
      security:
        - sessionCookie: []
        - apiKey: ['webhooks:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every subscription. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createWebhook
      summary: Create a webhook
      description: >-
        Creates a subscription that receives a POST for each matching event. url and
        events are required. events must list one or more event names from
        IdentityWebhookEvent, and "*" subscribes to every ticket event. The checks run
        in this order: the body, then events, then the url, which must use http or
        https, name a host, and resolve to an address that is not internal, then
        payload_format. Deliveries are not retried. A failed attempt is recorded on the
        hook and not repeated. The secret is write-only. When it is set, each delivery
        carries sha256=<hex HMAC-SHA256 of the body> in the X-GHD-Signature header, and the
        same value in X-OHD-Signature for older consumers. An empty secret means deliveries
        are not signed. enabled defaults to true.
      tags: ['Admin: Webhooks']
      x-ghd-handler: handleCreateWebhook
      security:
        - sessionCookie: []
        - apiKey: ['webhooks:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  description: The target. Checked on save, and checked again at the moment of each connection.
                events:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/IdentityWebhookEvent'
                secret:
                  type: string
                  description: Write-only. Optional. Signs each delivery. Never returned.
                payload_format:
                  $ref: '#/components/schemas/IdentityPayloadFormat'
                enabled:
                  type: boolean
                  description: Defaults to true. A hook can be saved disabled before its receiver is ready.
      responses:
        '201':
          description: The created subscription. last_delivery is null, and the secret is not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: >-
            Refused by the handler, as application/json. bad_request ("invalid JSON") for a
            body that does not decode. missing_events when events is empty or absent.
            invalid_event_name when an entry is neither "*" nor a webhook event, with the
            list of valid names in the message. invalid_url when the scheme is not http or
            https, the host is missing, or the host does not resolve or resolves to an
            internal address. invalid_payload_format when payload_format is not one of the
            five.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The webhook's UUID.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateWebhook
      summary: Update a webhook
      description: >-
        Changes the fields that are sent. Absent fields keep their stored value. url,
        events and payload_format are validated only when sent, so a request that sets
        only enabled is never refused for a field it does not touch. A changed url clears
        last_delivery in the database, because the old result described a different
        target. events, when sent, must be non-empty and valid. secret: absent or null keeps
        the stored secret, but an empty string clears it, and deliveries then stop being
        signed. payload_format: an empty string means raw. The response is built from the
        record read before the update, so its last_delivery can still show the result for
        the previous url (discrepancy F5-8). An unknown id answers 500, not 404
        (discrepancy F5-2).
      tags: ['Admin: Webhooks']
      x-ghd-handler: handleUpdateWebhook
      security:
        - sessionCookie: []
        - apiKey: ['webhooks:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: New target, checked as on create. Omit to keep the current one.
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/IdentityWebhookEvent'
                  description: Replaces the subscription. Must be non-empty when sent. Omit to keep the current list.
                secret:
                  type: [string, 'null']
                  description: >-
                    Write-only. Absent or null keeps the stored secret. An empty string
                    clears it.
                enabled:
                  type: boolean
                  description: Omit to keep the current state.
                payload_format:
                  $ref: '#/components/schemas/IdentityPayloadFormat'
      responses:
        '200':
          description: >-
            The subscription after the change. last_delivery here is the value read before
            the update (discrepancy F5-8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: >-
            Refused by the handler, as application/json. bad_request with message "invalid
            ID" for a path id that is not a UUID, or "invalid JSON" for a body that does not
            decode. missing_events, invalid_event_name, invalid_url and
            invalid_payload_format are as for create, and apply only when the field is sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >-
            internal_error for an id that names no webhook, because the store's not-found
            error is not mapped (discrepancy F5-2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook
      description: >-
        Deletes the subscription and its last_delivery. A delivery already in flight
        finishes, but its result is discarded because the record is gone. An unknown id
        also answers 204.
      tags: ['Admin: Webhooks']
      x-ghd-handler: handleDeleteWebhook
      security:
        - sessionCookie: []
        - apiKey: ['webhooks:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request, message "invalid ID", when the path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/categories:
    get:
      operationId: listCategories
      summary: List all categories, including archived ones.
      description: >-
        Returns every category as a bare array, active and inactive. This is the
        administrator's view. The catalogue that guests and reporting users see
        (GET /api/v1/categories) serves only the active categories.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleListCategories
      security:
        - sessionCookie: []
        - apiKey: ['categories:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every category. An empty catalogue is an empty array.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Category'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCategory
      summary: Create a category.
      description: >-
        Creates an active category. The name is trimmed and must not be empty.
        An empty name is refused, but with 500 internal_error rather than 400,
        because the service returns an untyped error that the error mapper does
        not recognise (discrepancy F6-2). sort_order defaults to 0.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleCreateCategory
      security:
        - sessionCookie: []
        - apiKey: ['categories:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Category name. Trimmed before it is checked.
                sort_order:
                  type: integer
                  description: Display order among categories. Defaults to 0.
      responses:
        '201':
          description: The created category, active.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >-
            Returned for an empty name after trimming. Reported as internal_error,
            not bad_request (F6-2).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Category UUID. A malformed value is 400 bad_request.
        schema:
          type: string
          format: uuid
    get:
      operationId: getCategory
      summary: Get one category.
      description: >-
        Looks the category up by its UUID. An id that does not exist is answered
        500 internal_error, not 404, because the lookup's not-found error is not
        mapped to 404 (F6-3). The field-definition and assignment update routes do
        map their misses to 404.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleGetCategory
      security:
        - sessionCookie: []
        - apiKey: ['categories:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The category.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >-
            Also returned when no category has this id (F6-3). The body is
            internal_error, not not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    patch:
      operationId: updateCategory
      summary: Rename, reorder or archive a category.
      description: >-
        Partial update. An absent field is unchanged. Setting active to false
        archives the category: the catalogue that guests and reporting users see
        stops listing it, and tickets that already use it keep it. An empty name
        is refused with 500 internal_error (F6-2), and so is an unknown id (F6-3).
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleUpdateCategory
      security:
        - sessionCookie: []
        - apiKey: ['categories:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New name, trimmed. Absent leaves the name unchanged. An empty value is refused.
                sort_order:
                  type: integer
                  description: New display order. Absent leaves it unchanged.
                active:
                  type: boolean
                  description: False archives the category. Absent leaves it unchanged.
      responses:
        '200':
          description: The category as stored after the update.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >-
            Returned for an unknown category id (F6-3) and for an empty name after
            trimming (F6-2). Both are reported as internal_error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: deleteCategory
      summary: Delete a category.
      description: >-
        Hard delete. The category's types and, through them, its items are removed
        by cascade, and so are the SLA policies scoped to it, the group scopes that
        name it and the canned responses scoped to it. A category that a ticket uses,
        or whose type or item a ticket uses, is refused by a foreign key that the
        server does not map, so the answer is 500 internal_error (F6-1). Custom-field
        assignments made to the category or its descendants are not removed (F6-6).
        An unknown id answers 204 (F6-4). To retire a category that is in use, archive
        it with active set to false instead.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleDeleteCategory
      security:
        - sessionCookie: []
        - apiKey: ['categories:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >-
            A ticket uses this category, or a type or item under it (F6-1). Reported
            as internal_error, not as a conflict.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/categories/{id}/fields:
    parameters:
      - name: id
        in: path
        required: true
        description: Category UUID, used as the scope of the assignments listed or created here. A malformed value is 400 bad_request.
        schema:
          type: string
          format: uuid
    get:
      operationId: listCategoryFieldAssignments
      summary: List custom-field assignments on a category.
      description: >-
        Lists the custom-field assignments whose scope is this category, identified
        by {id}. Only {id} is read. The other ids in the path are not checked against
        it (F6-5). Each entry carries its field definition under field_def, filled
        with id, name, field_type, options and active only. In that embedded copy
        sort_order is 0 and created_at is the zero time. An unknown category returns
        an empty array.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleListAssignments
      security:
        - sessionCookie: []
        - apiKey: ['categories:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The assignments on this category. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FieldAssignment'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCategoryFieldAssignment
      summary: Assign a custom field to a category.
      description: >-
        Assigns the field definition field_def_id to this category, identified by
        {id}, and answers 201 with the new assignment. Only {id} is read, as the scope.
        The other ids in the path are not checked (F6-5), and the category is not
        confirmed to exist. visible_on_new and required_on_new default to false when
        omitted (F6-7). The field definition must exist, and the same field cannot be
        assigned to the same category twice. Either refusal is 400 bad_request, with
        the database message as the text.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleCreateAssignment
      security:
        - sessionCookie: []
        - apiKey: ['categories:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field_def_id]
              properties:
                field_def_id:
                  $ref: '#/components/schemas/Uuid'
                sort_order:
                  type: integer
                  description: Display order within this category. Defaults to 0.
                visible_on_new:
                  type: boolean
                  description: Whether the field appears on the new-ticket form. Defaults to false when omitted.
                required_on_new:
                  type: boolean
                  description: Whether the field must be filled in on the new-ticket form. Defaults to false when omitted.
      responses:
        '201':
          description: The created assignment. It has no field_def.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldAssignment'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/categories/{id}/fields/{assignmentId}:
    parameters:
      - name: id
        in: path
        required: true
        description: Category UUID. Not read by these operations, so it is not checked against the assignment (F6-5).
