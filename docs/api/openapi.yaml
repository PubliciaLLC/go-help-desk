  /api/v1/tickets/{id}/links:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    get:
      operationId: listLinks
      summary: List this ticket's links to other tickets.
      description: |
        Every link in which this ticket is the source or the target, in no
        guaranteed order. A link is directional: source_id is the ticket it starts
        from and target_id the ticket it points to. The id is a UUID or a tracking number.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. The text/plain 403s from the auth
        middleware are decided before the ticket is looked up and say nothing
        about it.
      tags: ['Tickets']
      x-ghd-handler: handleListLinks
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: The links, as a bare array (never null).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
    post:
      operationId: addLink
      summary: Link this ticket to another ticket.
      description: |
        Creates a directed link from this ticket (the source) to target_id. The
        link type is one of related_to, parent_child (the source is the parent),
        caused_by (the source was caused by the target) or duplicate_of. A new
        link answers 204 with no body.
        With resolve_as_duplicate true, which needs link_type duplicate_of, the
        source is also resolved in the same transaction as a duplicate of the
        target. resolution_notes is used as the resolution note, and a blank one
        becomes "Duplicate of" followed by the target's tracking number. That
        answers 200 with the source Ticket. Resolving needs staff or an
        administrator, so a reporting user gets 403 forbidden.
        The target must be a ticket the caller can see. A target they cannot see,
        or one that does not exist, answers 404 not_found with the target's id in
        the message, the same as a missing ticket. A ticket cannot link to
        itself (400 cannot_link_self). The same source, target and type a second
        time is 409 link_already_exists. A reporting user cannot link a Closed
        ticket in either direction (409 ticket_closed). An OAuth client links as its
        service user, and needs the tickets:write scope.
        The path id is a UUID or a tracking number. target_id is required. Absent, it is the nil
        UUID, which answers 404 not_found.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. The text/plain 403s from the auth
        middleware are decided before the ticket is looked up and say nothing
        about it.
      tags: ['Tickets']
      x-ghd-handler: handleAddLink
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, link_type]
              properties:
                target_id:
                  description: The ticket to link to. Must be visible to the caller.
                  $ref: '#/components/schemas/Uuid'
                link_type:
                  description: One of related_to, parent_child, caused_by, duplicate_of.
                  type: string
                  enum: [related_to, parent_child, caused_by, duplicate_of]
                resolve_as_duplicate:
                  description: When true, link_type must be duplicate_of. Also resolves this ticket as a duplicate of the target (staff and administrators only). Defaults to false.
                  type: boolean
                resolution_notes:
                  description: The resolution note used with resolve_as_duplicate. Blank uses the default note.
                  type: string
      responses:
        '200':
          description: Only with resolve_as_duplicate. The resolved source ticket, as the bare Ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: |
            `bad_request`: invalid JSON; resolve_as_duplicate with a link type other than duplicate_of;
            or an unknown link type (invalid link type). `cannot_link_self`: the
            target is this ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `user_identity_required` for a credential with no
            user behind it, or `forbidden` for a reporting user using
            resolve_as_duplicate.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            `link_already_exists`: that link is already there. `ticket_closed`: a
            reporting user is linking a Closed ticket, or resolve_as_duplicate is
            applied to a Closed ticket and closed_reopen_policy does not allow the
            caller's role to reopen it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/links/{targetId}/{linkType}:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
      - name: targetId
        in: path
        required: true
        schema:
          type: string
      - name: linkType
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeLink
      summary: Remove a link from this ticket to another.
      description: |
        Deletes the link of type linkType that runs from this ticket to targetId.
        Direction matters: a link stored the other way round is not touched.
        Answers 204 with no body.
        Staff and administrators only. A reporting user gets 403 forbidden on a
        ticket they can see. The target must also be visible to the caller,
        otherwise the answer is 404 not_found with the target's id in the message.
        A link that does not exist still answers 204.
        linkType must be one of related_to, parent_child, caused_by or
        duplicate_of. Both ids must be UUIDs.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. The text/plain 403s from the auth
        middleware are decided before the ticket is looked up and say nothing
        about it.
      tags: ['Tickets']
      x-ghd-handler: handleRemoveLink
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: |
            `bad_request`: invalid target ID (targetId is not a
            UUID); or invalid link type (linkType is not one of the four types).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json), `forbidden`: only staff can remove a ticket link.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
  /api/v1/tickets/{id}/reopen:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    post:
      operationId: reopenTicket
      summary: Force-reopen a Closed ticket.
      description: |
        Moves a Closed ticket back to the reopen target status. That is the
        configured status, falling back to New when it does not resolve or is
        inactive. Answers
        200 with the bare Ticket.
        This is off by default. Under the default closed_reopen_policy every
        caller gets 409 ticket_closed, with the reason in the message. The setting
        can allow administrators only, or staff and administrators. A reporting
        user is always refused with 403 forbidden. The ticket must be Closed,
        otherwise the answer is 409 ticket_not_closed. A reopen increments
        reopen_count, raises the priority one level on the first reopen, and
        starts the SLA over, in the same transaction. The path id is a UUID or a tracking number.
        An OAuth client reopens as its service user, which needs the role this
        route allows.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. The text/plain 403s from the auth
        middleware are decided before the ticket is looked up and say nothing
        about it.
      tags: ['Tickets']
      x-ghd-handler: handleReopenTicket
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: The reopened ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: "`bad_request`: no valid reopen target status is configured."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `forbidden`, "users cannot directly reopen
            tickets", for a reporting user; `user_identity_required` for a
            credential with no user behind it.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            `ticket_closed`: the closed_reopen_policy in force refuses the reopen
            for this caller's role (the message says why). `ticket_not_closed`:
            the ticket is not Closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/replies:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    get:
      operationId: listReplies
      summary: List the reply thread.
      description: |
        The reply thread, oldest first. Internal notes are left out for a
        reporting user, and staff and administrators see them. A reply written by
        a guest has no author_id. The id is a UUID or a tracking number.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. The text/plain 403s from the auth
        middleware are decided before the ticket is looked up and say nothing
        about it.
      tags: ['Tickets']
      x-ghd-handler: handleListReplies
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: The replies the caller may see, oldest first, as a bare array (never null).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reply'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
    post:
      operationId: addReply
      summary: Post a reply to a ticket.
      description: |
        Adds a reply and answers 201 with the Reply, including author_name
        as listReplies sends it. body is required after
        trimming. notify_customer defaults to true, and is forced to false for an
        internal note. Internal notes are for staff and administrators only.
        When notify_customer is true and the reporter has an address, the reporter
        is sent the update, except when the author is a staff member or
        administrator replying on a ticket they filed themselves: they are not
        sent a copy of their own reply. A reporting user replying on their own
        ticket is still sent one. A failure to look up that address does not fail
        the reply.
        A reporting user's reply to a Resolved ticket inside the reopen window
        reopens the ticket to the reopen target status (New when that status is
        inactive). That is a reopen: reopen_count goes up by one, the first reopen
        raises the priority one level, and the SLA starts over. A reporting user cannot
        reply to a Closed ticket (409 ticket_closed), or to a Resolved ticket
        after the reopen window (409 reopen_window_closed). Staff and
        administrators can still post to a Closed ticket.
        The path id is a UUID or a tracking number. An OAuth client posts as its service user, so
        the reply's author is the client's user, which carries the client's name.
        It needs the tickets:write scope. A service user is never mailed, so
        notify_customer on a ticket it reported queues no email.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. The text/plain 403s from the auth
        middleware are decided before the ticket is looked up and say nothing
        about it.
      tags: ['Tickets']
      x-ghd-handler: handleAddReply
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  description: The reply text. Required after trimming.
                  type: string
                internal:
                  description: Internal note, seen by staff only. Defaults to false. Staff and administrators only.
                  type: boolean
                notify_customer:
                  description: Whether the reporter is emailed. Defaults to true. Forced to false for an internal note.
                  type: boolean
      responses:
        '201':
          description: The reply that was posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reply'
        '400':
          description: |
            `bad_request`: invalid JSON; body is required; or no valid reopen target status is configured
            (on the reopen path).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `forbidden`, "only staff can post internal notes",
            for a reporting user; `user_identity_required` for a credential with
            no user behind it.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            `ticket_closed`: a reporting user is replying to a Closed ticket.
            `reopen_window_closed`: a reporting user is replying to a Resolved
            ticket after the reopen window has ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    post:
      operationId: resolveTicket
      summary: Mark a ticket Resolved.
      description: |
        Sets the ticket to Resolved, stores the optional notes as its resolution
        notes, and answers 200 with the bare Ticket. Staff and administrators
        only: a reporting user gets 403 forbidden.
        The body is optional: an empty body resolves with no notes. A body that is
        present but not valid JSON is refused with 400 bad_request and the ticket
        is left as it was. Resolving a Closed ticket is a way out
        of Closed, so it answers 409 ticket_closed unless closed_reopen_policy
        allows the caller's role. The path id is a UUID or a tracking number. An OAuth client
        acts as its service user.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. The text/plain 403s from the auth
        middleware are decided before the ticket is looked up and say nothing
        about it.
      tags: ['Tickets']
      x-ghd-handler: handleResolveTicket
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  description: The resolution notes. Optional.
                  type: string
      responses:
        '200':
          description: The resolved ticket, as the bare Ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: "`bad_request`: the body is present but is not valid JSON."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `forbidden` for a reporting user (message "you do
            not have permission to perform this action"); `user_identity_required`
            for a credential with no user behind it.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: "`ticket_closed`: the ticket is Closed and closed_reopen_policy does not allow the caller's role to reopen it."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/tags:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
