openapi: 3.1.0
info:
  title: Go Help Desk API
  version: 1.3.0-beta
  summary: REST API of Go Help Desk, served under /api/v1 beside the SPA.
  description: |
    Every endpoint under /api/v1, written by hand and checked in the project's
    test suite against the server's real routes, so no route is missing or
    stale. Where this file and the server's behaviour disagree on anything
    else, the server is right and the file has a bug; please report it.

    Conventions that hold for every operation except where an operation says
    otherwise, so they are not repeated on each:

    - Every JSON request body is read with a 1 MiB cap, and unknown fields are
      ignored. A body that is not JSON, or is over the cap, answers 400.
    - Every error from a handler is the envelope in components.schemas.Error,
      served as application/json. Refusals produced by the authentication
      middleware (401 unauthorized, 403 forbidden / mfa_required /
      password_change_required / insufficient_scope / session_required) carry the same envelope but are
      served as text/plain; charset=utf-8.
    - Any operation may answer 500 internal_error ("an internal error
      occurred"); it is listed only where a handler has a 5xx of its own. A
      handler that panics is answered the same way (the panic is logged, never
      sent), unless the response had already begun.
    - An unknown path is 404 with the plain-text body "404 page not found",
      and a known path with the wrong method is 405, but only for a caller
      that the enclosing group of routes admits. Under /api/v1/admin,
      /api/v1/tickets, /api/v1/me and /api/v1/groups the group's own checks
      run first, so a caller it does not admit gets that group's 401 or 403
      instead. A 405 names the methods the path does offer in its Allow header,
      one line per method (a client must read every Allow line, not just the
      first: DELETE /api/v1/tickets answers two lines, GET and POST).
    - Paths are documented without a trailing slash. Routes mounted at a
      sub-router root (for example /api/v1/tickets) also answer with one.

    Who may call an operation is stated by its security requirements and by
    three extensions on the operation:

    - x-ghd-roles: the roles a signed-in session may have (admin, staff,
      user). A machine credential acts at a role too: an API key at its
      owner's, an OAuth client at its service user's (staff or user, never
      admin). A role outside the list is refused
      with 403 forbidden. Absent on public and guest-token operations.
    - x-ghd-mfa: true when a session must have passed its second factor;
      one that has not is refused with 403 mfa_required. API keys and OAuth
      clients count as having passed it. Present wherever x-ghd-roles is.
    - x-ghd-anonymous-when: guest_submission_enabled marks an operation that
      also admits a caller with no credential, but only while the instance
      accepts guest submissions.

    An operation open to some roles only says so in the first sentence of its
    description.

    The MCP server is JSON-RPC authenticated by the same chain as /api/: the
    Streamable HTTP transport at /mcp (POST; /mcp/ answers the same), and the
    older HTTP+SSE transport at GET /mcp/sse and POST /mcp/message. Every
    MCP route (/mcp, /mcp/, /mcp/sse, /mcp/message and any unknown path
    under /mcp/) answers 403 (code origin_not_allowed) to a request whose
    Origin header is present and is not the origin of BASE_URL; a request
    with no Origin header is not affected. A POST body on any MCP route is
    capped at 1 MiB (413, code request_too_large), and a POST to
    /mcp/message is processed only for the user and credential that opened
    the stream for its sessionId (403, code forbidden, otherwise). See
    docs/DESIGN.md, "MCP Interface". It is not described here.
  license:
    name: GNU Affero General Public License v3.0
    url: https://github.com/PubliciaLLC/go-help-desk/blob/main/LICENSE
servers:
  - url: /
    description: Same origin as the SPA (BASE_URL in production, http://localhost:8080 under docker-compose).
tags:
  - name: Health
    description: Liveness probe, outside /api/v1.
  - name: Site
    description: Public branding and logo, read before sign-in.
  - name: Setup
    description: First-run creation of the first administrator.
  - name: Authentication
    description: Password and second-factor sign-in, sign-out, OAuth client-credentials tokens, provider discovery.
  - name: Single sign-on
    description: SAML and OIDC browser flows. Redirects and XML, not JSON, on the happy path.
  - name: Signup
    description: Self-service signup and email verification.
  - name: Account
    description: The signed-in caller's own identity, password, TOTP and passkeys.
  - name: Catalogue
    description: The Category / Type / Item tree for the ticket form.
  - name: Reference data
    description: Lists the ticket screens need - statuses, active tags, assignable staff, groups.
  - name: Tickets
    description: Tickets and everything under /tickets/{id} except attachments.
  - name: Attachments
    description: Ticket attachments - upload, list, download, reputation re-check.
  - name: Guest
    description: Guest submission and the per-ticket link token surface.
  - name: Audit
    description: The admin-wide audit view.
  - name: "Admin: Users"
    description: Accounts, their roles and passwords, and disabling or deleting them.
  - name: "Admin: Groups"
    description: Groups, their members, and the categories and types each group is scoped to.
  - name: "Admin: Catalogue"
    description: Categories, types, items, custom-field definitions and their assignments.
  - name: "Admin: SLA"
    description: SLA policies, the response and resolution targets tickets are measured against.
  - name: "Admin: Statuses"
    description: The system and custom ticket statuses.
  - name: "Admin: Settings"
    description: Instance settings, the logo, and security warnings.
  - name: "Admin: Single sign-on"
    description: SAML and OIDC configuration.
  - name: "Admin: Plugins"
    description: Installed plugins and whether each is enabled. Installing and uninstalling are not implemented.
  - name: "Admin: Credentials"
    description: The scope catalogue, API keys and OAuth clients.
  - name: "Admin: Webhooks"
    description: Outgoing webhook subscriptions.
  - name: "Admin: Tags"
    description: The tag list, including deactivating and restoring tags.
  - name: "Admin: Canned responses"
    description: Reusable reply texts, global or scoped to a category and type.
paths:
  /api/v1/admin/oidc:
    get:
      operationId: getOIDCConfig
      summary: Read the OIDC sign-in configuration.
      description: >-
        Administrators only (second factor required).
        Returns the saved OIDC settings. The client secret is never returned:
        client_secret is always the empty string. configured reports only whether
        an issuer URL, client ID and client secret are stored, not whether OIDC is
        enabled or the identity provider answered. Requires the settings:read
        scope for an API key.
      tags: ['Admin: Single sign-on']
      x-ghd-handler: handleGetOIDCConfig
      security:
        - sessionCookie: []
        - apiKey: ['settings:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The saved OIDC configuration.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, issuer_url, client_id, client_secret, redirect_url, configured, live]
                properties:
                  enabled: {type: boolean}
                  issuer_url: {type: string}
                  client_id: {type: string}
                  client_secret:
                    type: string
                    description: Always the empty string. The stored secret is never sent to the browser.
                  redirect_url:
                    type: string
                    description: >-
                      The stored callback URL. The empty string until the configuration is first
                      saved; the callback then used is the server's base URL followed by
                      /api/v1/auth/oidc/callback.
                  configured:
                    type: boolean
                    description: >-
                      True when an issuer URL, a client ID and a client secret are all stored.
                      It does not say whether OIDC is enabled or whether the identity provider
                      could be reached.
                  live:
                    type: boolean
                    description: >-
                      True when the OIDC provider is loaded in the running server, so a sign-in
                      can start now. False when nothing is saved, OIDC is off, or the identity
                      provider did not answer when the settings were last loaded or saved.
                      "configured" true with "live" false is "saved, not working".
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: saveOIDCConfig
      summary: Save the OIDC sign-in configuration.
      description: >-
        Administrators only, in a signed-in session (second factor required).
        Saves the OIDC settings. A blank client_secret keeps the stored secret.
        redirect_url is not accepted from the body: the stored value is kept, or
        the callback URL is derived from the server's base URL. Enabling OIDC
        requires an issuer URL, a client ID and a client secret; otherwise the
        request is refused with 400 bad_request. Before anything is saved, the
        server contacts the identity provider using the candidate settings, once.
        If no active administrator could sign in afterwards (an unreachable
        provider counts as unusable), the save is refused with 400 bad_request. If
        only some administrators would be stranded, the save goes ahead and the
        response names them in a warning. If the identity provider could not be
        reached and the save is not refused, the settings are still saved, the
        provider already in use is left as it was, and the response carries a
        warning.
        Requires a session that has passed MFA. API keys and OAuth clients cannot
        call this operation.
      tags: ['Admin: Single sign-on']
      x-ghd-handler: handleSaveOIDCConfig
      security:
        - sessionCookie: []
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether OIDC sign-in is offered. An omitted field is false.
                issuer_url:
                  type: string
                  description: The identity provider's issuer URL.
                client_id:
                  type: string
                client_secret:
                  type: string
                  description: The client secret. Empty or omitted keeps the stored secret.
      responses:
        '200':
          description: >-
            Saved. The body is {ok: true} when nothing needs reporting, {ok: true,
            warning} when saving would strand some administrators, or {warning}
            alone when the identity provider could not be reached after the save.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                    description: Present and true on a plain success.
                  warning:
                    type: string
                    description: A plain-language warning about the save. Present only when there is one.
        '400':
          description: >-
            bad_request: the body is not JSON, OIDC is being enabled without an
            issuer URL, client ID and client secret, or the save would leave no
            active administrator able to sign in. The message says which.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/saml:
    get:
      operationId: getSAMLConfig
      summary: Read the SAML sign-in configuration.
      description: >-
        Administrators only (second factor required).
        Returns the saved SAML settings, including pasted metadata XML, and the
        URL of this server's service provider metadata, which is what the
        administrator gives the identity provider. The private key is never
        returned. Requires the settings:read
        scope for an API key.
      tags: ['Admin: Single sign-on']
      x-ghd-handler: handleGetSAMLConfig
      security:
        - sessionCookie: []
        - apiKey: ['settings:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The saved SAML configuration.
          content:
            application/json:
              schema:
                type: object
                required: [configured, live, metadata_url, metadata_xml, cert_pem, sp_metadata_url]
                properties:
                  configured:
                    type: boolean
                    description: >-
                      True when IdP metadata (a URL or XML), a certificate and a private key
                      are all stored. It does not say whether SAML sign-in is in use or whether the identity
                      provider's metadata could be loaded.
                  live:
                    type: boolean
                    description: >-
                      True when the SAML middleware is loaded in the running server, so a sign-in
                      can start now. False when its metadata could not be loaded. "configured"
                      true with "live" false is "saved, not working".
                  metadata_url:
                    type: string
                    description: The identity provider's metadata URL. Empty when unset.
                  metadata_xml:
                    type: string
                    description: >-
                      The identity provider's metadata XML as saved, returned as stored. Empty
                      when unset or when the metadata is given by URL. It is public data; the
                      private key is never returned.
                  cert_pem:
                    type: string
                    description: The service provider certificate in PEM form. Empty when unset.
                  sp_metadata_url:
                    type: string
                    description: This server's SAML metadata URL, built from the server's base URL.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: saveSAMLConfig
      summary: Save the SAML sign-in configuration.
      description: >-
        Administrators only, in a signed-in session (second factor required).
        Each field may be omitted, which keeps the stored value, or sent. A field
        sent as an empty string clears it, and null is treated the same as an
        omitted field. The certificate and key are checked as a pair before
        anything is saved, and a mismatch is refused with invalid_cert_key.
        metadata_url and metadata_xml are alternatives. A save that would leave
        both non-empty, counting stored values the request does not clear, is
        refused with saml_metadata_conflict. metadata_xml is parsed before
        anything is saved, with the same parser a fetched URL goes through. A
        document that is not SAML metadata, has no IDPSSODescriptor, or has no
        signing certificate that parses as X.509 is refused with
        invalid_saml_metadata, and one over 262144 bytes with
        saml_metadata_too_large. With metadata_xml nothing is fetched. The
        identity provider's metadata is then loaded once (fetched, for a URL),
        from the candidate settings, before anything is saved. If no active administrator could sign
        in afterwards (a failed fetch counts as SAML being unusable), the save is
        refused with 400 bad_request. If only some administrators would be
        stranded, or the fetch failed without stranding everyone, the settings are
        saved, the SAML configuration already in use is left as it was when the
        fetch failed, and the response is 200 with a warning. Returns 204 when
        nothing needs reporting. Requires a
        session that has passed MFA. API keys and OAuth clients cannot call this
        operation.
      tags: ['Admin: Single sign-on']
      x-ghd-handler: handleSaveSAMLConfig
      security:
        - sessionCookie: []
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata_url:
                  type: [string, 'null']
                  description: The identity provider's metadata URL. Omitted or null keeps the stored value; "" clears it.
                metadata_xml:
                  type: [string, 'null']
                  maxLength: 262144
                  description: The identity provider's metadata XML. Omitted or null keeps the stored value; "" clears it. Returned by GET.
                cert_pem:
                  type: [string, 'null']
                  description: The service provider certificate in PEM form. Omitted or null keeps the stored value; "" clears it.
                key_pem:
                  type: [string, 'null']
                  description: The service provider private key in PEM form. Omitted or null keeps the stored value; "" clears it. Never returned by any endpoint.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '200':
          description: >-
            Saved, with a warning. The body is {warning}: either the identity
            provider metadata could not be loaded, or the save would strand some
            administrators (who are named in the warning).
          content:
            application/json:
              schema:
                type: object
                required: [warning]
                properties:
                  warning:
                    type: string
                    description: A plain-language warning about the save.
        '400':
          description: >-
            bad_request: the body is not JSON, or the save would leave no active
            administrator able to sign in. invalid_cert_key: the certificate and
            private key are invalid or do not match. saml_metadata_conflict: the
            save would leave both metadata_url and metadata_xml set.
            invalid_saml_metadata: metadata_xml does not parse, is not SAML
            metadata, has no IDPSSODescriptor, or has no signing certificate
            that parses as X.509. saml_metadata_too_large:
            metadata_xml is over 262144 bytes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Ask for a link to choose a new password.
      description: >-
        Queues a request to email the address a link to choose a new password and
        always answers 202 to a well-formed request, whether or not the address has
        an account: the request looks nothing up and writes nothing but one
        queued row, so neither the answer nor the time it takes says who has an
        account. Whether anything is mailed is decided when the mail would be sent,
        off the request. Nothing is sent for an address with no account, a disabled
        or deleted account, an account with no password (an identity-provider account, or a local account
        created without one), or an account that cannot use a password because
        saml_enabled limits password sign-in to administrators; and an account is
        mailed at most once per five minutes however many requests arrive. A string
        that is not an email address is answered 202 and queues nothing. The link
        works once, for 30 minutes, and a newer link replaces an older one. The
        link never signs anybody in. Needs email: answers 503 email_not_configured
        while the server cannot send it (see password_reset on GET /auth/providers).
        Each client address has a per-minute budget (AUTH_RATE_LIMIT_PER_MINUTE),
        and a refused attempt answers 429. Public and needs no credential.
      tags: ['Authentication']
      x-ghd-handler: handleForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  description: The address of the account. Matched without regard to case.
      responses:
        '202':
          description: Accepted. A link follows if the address has an account that may use it.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    enum: ['If that address has an account, we have emailed it a link to choose a new password.']
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: The server cannot send email (email_not_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Choose a new password with a mailed link.
      description: >-
        Spends a link from POST /auth/forgot-password and sets the password. In
        one step it uses up the link, stores the new password, clears a pending
        forced password change and ends every session the account holds. It
        starts no session: the person goes back to the sign-in page and signs in
        with the new password and, if the account has one, a second factor. A
        password outside 8 to 72 bytes is refused (password_too_short or
        password_too_long) before the link is touched, so it still works. A link
        that is unknown, already used, replaced by a newer one, expired, or for an
        account that has since been disabled, deleted or left with no password is refused with 422
        token_invalid, the same answer for each. An audit entry
        password_reset_by_email is written for the account, with no actor. Works
        with email switched off, for a link already mailed. Each client address has
        a per-minute budget, and a refused attempt answers 429. Public and needs no
        credential.
      tags: ['Authentication']
      x-ghd-handler: handleResetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: The token from the email link (the token query parameter of /reset-password).
                password:
                  type: string
                  description: The new password. Between 8 and 72 bytes.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            The body is not JSON (bad_request), or the password is too short
            (password_too_short) or too long (password_too_long). The link still
            works after the last two. Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: The link does not work (token_invalid). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Password reset is not set up on this server (email_not_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/local/login:
    post:
      operationId: localLogin
      summary: Sign in with an email address and password.
      description: >-
        Verifies the password, then starts a new session. Only failed attempts
        count against the per-email-address budget, and a correct password is always
        accepted, even when the budget is spent. The budget is one minute: when it
        is spent, the request is delayed before the password is checked and a
        refused attempt answers 429 with Retry-After set to the seconds left in
        that minute (at most 60). A correct password on a hash made below cost 12
        is upgraded at this sign-in. From password_rehash_grace_days after 1.3.0
        first ran, it is refused instead (403 password_reset_required).
        The response says what
        the person must do next: mfa_needed means a TOTP code is owed
        (POST /auth/local/mfa/verify), passkey_needed means a passkey is owed
        (POST /auth/local/passkey/start), and mfa_enrollment_needed means the
        role must enrol a second factor before it is fully signed in.
        password_change_required means the account was unlocked from the server
        console (/app/server unlock) and still holds the password it was handed:
        the session may only change the password (PATCH /me/password) and every
        other route answers 403 password_change_required until it has. Until the
        second-factor step is done the session is only half signed in, and it expires: after
        5 minutes when a code or passkey is owed, after 15 minutes when the
        person must enrol. After that, every route answers 401 as if there were
        no session (the session is deleted), and the person signs in again with
        their password. When SAML is enabled, only administrators may use this
        operation.
      tags: ['Authentication']
      x-ghd-handler: handleLocalLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  description: The account's email address. Matched case-insensitively, with surrounding spaces ignored.
                password:
                  type: string
                  description: The account password.
      responses:
        '200':
          description: Signed in. The session cookie is set. The body says which second step is owed, if any.
          content:
            application/json:
              schema:
                type: object
                required: [user, mfa_needed, passkey_needed, mfa_enrollment_needed, password_change_required]
                properties:
                  user: {$ref: '#/components/schemas/User'}
                  password_change_required:
                    type: boolean
                    description: True when the password must be changed before anything else is allowed (see the operation description).
                  mfa_needed:
                    type: boolean
                    description: True when a TOTP code is owed. Answer with POST /auth/local/mfa/verify.
                  passkey_needed:
                    type: boolean
                    description: True when a passkey is owed. Answer with POST /auth/local/passkey/start and /finish.
                  mfa_enrollment_needed:
                    type: boolean
                    description: True when the role must enrol a second factor before it is fully signed in.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The email address and password do not match an account (invalid_credentials). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: >-
            Local sign-in is disabled for this account because SAML is enabled
            (saml_required, checked first), or the account's only second factor
            is a passkey and passkeys are unavailable on this instance
            (passkey_unavailable; an administrator's MFA reset clears it), or
            the password was right but is still stored in the older, weaker form
            (cost below 12) after the grace period (password_reset_required).
            No session is created and none of these counts as a failed attempt.
            passkey_unavailable applies to every such account, administrators
            included. password_reset_required is only given for a correct
            password (a wrong one still answers 401 invalid_credentials and takes
            as long to refuse), leaves the hash as it is, and does not apply to
            administrators. Its message points at "Forgot password" (POST
            /auth/forgot-password) when the server can send email, and at an
            administrator when it cannot; nothing is sent by the refusal itself.
            Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/local/logout:
    post:
      operationId: logout
      summary: End the current browser session.
      description: >-
        Deletes the server-side session row the cookie points at and tells the
        browser to drop the cookie. Needs no credential, and answers 204 whether or
        not a session existed.
      tags: ['Authentication']
      x-ghd-handler: handleLogout
      security: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /api/v1/auth/local/mfa/verify:
    post:
      operationId: mfaVerify
      summary: Complete sign-in with a TOTP code.
      description: >-
        Checks a six-digit TOTP code for the signed-in account and, on success,
        rotates the session with the second factor marked as passed. Attempts are
        counted on the account, not the session, and a spent budget locks the
        account for 15 minutes: the response is 429 with Retry-After: 900. The
        attempt is spent before the code is checked, so a correct code sent during
        a lock is refused. Reachable with a session only, not an API key or OAuth
        client (403 session_required).
      tags: ['Authentication']
      x-ghd-handler: handleMFAVerify
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The current TOTP code.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            Either no session (unauthorized, text/plain, from the auth middleware)
            or a code that does not match (invalid_mfa_code, application/json,
            from the handler).
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/local/passkey/finish:
    post:
      operationId: passkeyLoginFinish
      summary: Complete sign-in with a passkey.
      description: >-
        Verifies the browser's answer to the challenge issued by
        POST /auth/local/passkey/start and, on success, rotates the session with the
        second factor marked as passed. The challenge is consumed on every call,
        whether the answer verifies or not, so a failed attempt must start again.
        A challenge expires five minutes after it was issued. The sign count is
        recorded but not enforced. Reachable with a session only (403
        session_required for an API key or OAuth client). The body is read by
        the WebAuthn library, not by the server's JSON decoder, and is capped at
        64 KiB (413 too_large above that, before the challenge is touched). A body
        that is not JSON is not a 400: once a challenge is in progress it answers
        401 assertion_refused. A fault writing the session is 500 internal_error,
        not no_challenge.
      tags: ['Authentication']
      x-ghd-handler: handlePasskeyLoginFinish
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      requestBody:
        required: true
        description: The W3C PublicKeyCredential JSON produced by the browser's navigator.credentials.get call.
        content:
          application/json:
            schema:
              type: object
              description: The W3C PublicKeyCredential JSON for an assertion, with binary members base64url-encoded. Not modelled field by field.
      responses:
        '503':
          description: Passkeys are unavailable on this instance (passkeys_unavailable), because BASE_URL cannot be a passkey domain. Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            No challenge is in progress for this session (no_challenge), the
            challenge is older than five minutes (challenge_expired), or the account
            has no passkey (no_passkey). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: >-
            Either no session (unauthorized, text/plain, from the auth middleware)
            or an answer that did not verify, including a body that is not JSON
            (assertion_refused, application/json, from the handler).
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Error'}
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: The body is over 64 KiB (too_large). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/local/passkey/start:
    post:
      operationId: passkeyLoginStart
      summary: Start a passkey challenge for the signed-in account.
      description: >-
        Issues a WebAuthn assertion challenge for the account in the session and
        stores it in the session until POST /auth/local/passkey/finish consumes it.
        The request needs no body. Reachable with a session only (403
        session_required for an API key or OAuth client).
      tags: ['Authentication']
      x-ghd-handler: handlePasskeyLoginStart
      security:
        - sessionCookie: []
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: false
      responses:
        '503':
          description: Passkeys are unavailable on this instance (passkeys_unavailable), because BASE_URL cannot be a passkey domain. Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '200':
          description: The WebAuthn assertion options to pass to navigator.credentials.get.
          content:
            application/json:
              schema:
                type: object
                description: An object whose publicKey member is the W3C PublicKeyCredentialRequestOptions, with binary members base64url-encoded. Not modelled field by field.
        '400':
          description: The account has no passkey registered (no_passkey). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/oauth/token:
    post:
      operationId: oauthToken
      summary: Exchange OAuth client credentials for an access token.
      description: >-
        Issues a JWT access token for an OAuth client using the client_credentials
        grant. The body must be JSON: the form encoding that RFC 6749 specifies is
        refused with 400 bad_request. The token lasts one hour and cannot be
        refreshed. The client acts through its service user, at that user's role
        (staff or user, never admin), so it never reaches an administrator-only
        operation. A wrong secret and an unknown client get the same 401
        invalid_client. The token stops working when the client is deleted or its
        service user is disabled or deleted.
      tags: ['Authentication']
      x-ghd-handler: handleOAuthToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                  description: Must be client_credentials. Any other value is refused with unsupported_grant_type.
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        '200':
          description: A bearer token for the client.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                    description: 'A signed JWT. Send it as Authorization: Bearer <token>.'
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in:
                    type: integer
                    enum: [3600]
                    description: Lifetime in seconds.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The client ID is unknown or the secret does not match (invalid_client).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: Finish an OIDC sign-in at the identity provider's redirect.
      description: >-
        The identity provider redirects the browser here with a code and the state
        it was given. The state must match the one stored in the session by
        GET /auth/oidc/login, and each state is used once. On success the code is
        exchanged, the ID token is verified against the stored nonce, the account
        is matched or provisioned, a new session is started, and the browser is
        sent to /. A refused sign-in is a redirect to /login?error=<code>, not a
        JSON body, so the login page can show a fixed message. The codes are:
        invalid_session, invalid_state, idp_error, missing_code, internal_error,
        missing_id_token, invalid_id_token, domain_not_allowed, account_disabled,
        account_link_refused, email_not_verified, invalid_email and email_taken.
        The only JSON answer, apart from a rare internal error when the session
        cannot be read or saved, is 503 when OIDC is not configured.
      tags: ['Single sign-on']
      x-ghd-handler: handleOIDCCallback
      security: []
      parameters:
        - name: state
          in: query
          required: true
          description: The state value the identity provider echoed back. Must equal the state stored in the session.
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: The authorization code. Absent when the identity provider reports an error instead.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: The identity provider's refusal code (for example access_denied). Logged, not echoed.
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          description: The identity provider's refusal text. Logged only.
          schema:
            type: string
      responses:
        '303':
          description: >-
            Signed in, Location is /. Or refused, Location is /login?error=<code>
            with one of the codes listed in the description.
          headers:
            Location:
              description: / on success, or /login?error=<code> on refusal.
              schema:
                type: string
        '503':
          description: OIDC is not configured (oidc_not_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/oidc/login:
    get:
      operationId: oidcLogin
      summary: Start an OIDC sign-in at the identity provider.
      description: >-
        Records a fresh state, nonce and PKCE verifier in the visitor's session,
        keeping whatever else the session holds, and redirects the browser to the
        identity provider's authorization endpoint. Requires no credential, and
        carries no CSRF protection, so it never logs anyone out.
      tags: ['Single sign-on']
      x-ghd-handler: handleOIDCLogin
      security: []
      responses:
        '302':
          description: Redirect to the identity provider.
          headers:
            Location:
              description: The identity provider's authorization URL.
              schema:
                type: string
        '503':
          description: OIDC is not configured (oidc_not_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/providers:
    get:
      operationId: authProviders
      summary: List the sign-in methods this server offers.
      description: >-
        Lists the sign-in methods and whether each can be used right now. local
        is always true, even when the saml_enabled setting limits password
        sign-in to administrators; local_admin_only says so (true exactly when
        saml_enabled is on, which is the test local login applies). saml is true
        when the SAML middleware is loaded, whatever saml_enabled says, because
        GET /auth/saml/login works whenever it loaded. oidc is true when the OIDC
        provider is loaded, so it is false when the identity provider could not
        be reached, where GET /auth/oidc/login would answer 503. Before 1.3.0
        the body was sent without a Content-Type header and oidc echoed the
        oidc_enabled setting.
      tags: ['Authentication']
      x-ghd-handler: handleAuthProviders
      security: []
      responses:
        '200':
          description: The sign-in methods.
          content:
            application/json:
              schema:
                type: object
                required: [providers, local_admin_only, passkeys, password_reset]
                properties:
                  password_reset:
                    type: boolean
                    description: >-
                      True when "Forgot password" can work: the server can send
                      email and the feature is wired. The sign-in page shows its
                      Forgot password link only then. POST /auth/forgot-password
                      answers 503 email_not_configured when this is false. It does not
                      say whether a given account may use it (SAML can exclude
                      non-administrators), which the endpoint never reveals. Added in
                      1.3.0 (#451).
                  passkeys:
                    type: boolean
                    description: >-
                      False when passkeys are unavailable because BASE_URL cannot
                      be a passkey domain (an IP address, a single-label host or
                      a non-ASCII host; localhost works). The /auth/local/passkey/*
                      and /me/passkeys routes then answer 503 passkeys_unavailable.
                      Added in 1.3.0; absent from older servers, which had passkeys
                      on or did not start.
                  providers:
                    type: array
                    items:
                      type: object
                      required: [name, enabled]
                      properties:
                        name:
                          type: string
                          enum: [local, saml, oidc]
                        enabled: {type: boolean}
                  local_admin_only:
                    type: boolean
                    description: >-
                      True when password sign-in is limited to administrators
                      (saml_enabled is on). Non-administrators then get 403 saml_required.
  /api/v1/auth/saml/acs:
    post:
      operationId: samlAcs
      summary: Receive a SAML assertion from the identity provider.
      description: >-
        The assertion consumer service for the HTTP-POST binding. The identity
        provider posts the signed SAMLResponse and the RelayState it was given. On
        success the server sets a short-lived hand-over cookie and redirects to
        the URL the sign-in began at, normally /api/v1/auth/saml/complete, which
        turns the hand-over into a session. A response that does not verify, an
        IdP-initiated response (this server does not accept one) and any other
        refusal are answered 403 with the plain body Forbidden. Answers
        503 when SAML is not configured.
      tags: ['Single sign-on']
      x-ghd-handler: handleSAMLACS
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse:
                  type: string
                  description: The base64-encoded, signed SAML response from the identity provider.
                RelayState:
                  type: string
                  description: The relay state that was sent with the sign-in request. Identifies the tracked request.
      responses:
        '302':
          description: The assertion verified. The hand-over cookie is set and the browser is redirected to the URL the sign-in began at.
          headers:
            Location:
              description: Normally /api/v1/auth/saml/complete.
              schema:
                type: string
        '403':
          description: The assertion did not verify, or the sign-in was not started by this server. Plain text body Forbidden.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: SAML is not configured (saml_not_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/saml/complete:
    get:
      operationId: samlComplete
      summary: Turn a SAML hand-over into a session.
      description: >-
        Reads the five-minute hand-over cookie set by POST /auth/saml/acs, spends
        it (it is refused from then on, in this browser and on the server, even if
        a copy was kept), matches or provisions the account, starts a new session
        and redirects to /. If the hand-over cookie is missing, expired or does not
        verify, the request starts a fresh SAML sign-in instead. A hand-over that was already spent is refused with a redirect to
        /login?error=sso_session_used. Account refusals redirect to
        /login?error=<code>, with the codes domain_not_allowed, account_disabled,
        account_link_refused, email_taken, invalid_assertion, email_not_verified
        and invalid_email. Answers 503 when SAML is not configured.
      tags: ['Single sign-on']
      x-ghd-handler: handleSAMLComplete
      security: []
      responses:
        '200':
          description: >-
            No usable hand-over cookie was present, and the identity provider's binding is
            HTTP-POST. The body is an HTML form that posts the new SAML request to
            the identity provider.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: No usable hand-over cookie was present, and the identity provider's binding is HTTP-Redirect. Redirects to the identity provider.
          headers:
            Location:
              description: The identity provider's sign-in URL.
              schema:
                type: string
        '303':
          description: >-
            Signed in, Location is /. Or refused, Location is /login?error=<code>
            with one of the codes listed in the description.
          headers:
            Location:
              description: / on success, or /login?error=<code> on refusal.
              schema:
                type: string
        '500':
          description: >-
            When a fresh sign-in is started and the request to the identity provider
            cannot be built, a plain-text body describing the error. Otherwise the JSON
            envelope: saml_session_invalid when the hand-over could not be read as a
            SAML session, or internal_error.
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: SAML is not configured (saml_not_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/saml/login:
    get:
      operationId: samlLogin
      summary: Start a SAML sign-in at the identity provider.
      description: >-
        Starts a fresh SAML sign-in and records where the sign-in should return to:
        /api/v1/auth/saml/complete, whatever the query string says. Nothing from the
        request is used to choose the redirect target. Answers 503 when SAML is not
        configured.
      tags: ['Single sign-on']
      x-ghd-handler: handleSAMLLogin
      security: []
      responses:
        '302':
          description: Redirect to the identity provider, when its SSO endpoint uses the HTTP-Redirect binding.
          headers:
            Location:
              description: The identity provider's sign-in URL.
              schema:
                type: string
        '200':
          description: >-
            The identity provider's SSO endpoint uses the HTTP-POST binding. The
            body is an HTML form that posts the sign-in request.
          content:
            text/html:
              schema:
                type: string
        '500':
          description: The sign-in request could not be built. Plain-text body describing the error.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: SAML is not configured (saml_not_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/saml/metadata:
    get:
      operationId: samlMetadata
      summary: Fetch this server's SAML service provider metadata.
      description: >-
        The XML an identity provider needs to trust this server. An administrator
        gives this URL to the identity provider. Answers 503 when SAML is not
        configured.
      tags: ['Single sign-on']
      x-ghd-handler: handleSAMLMetadata
      security: []
      responses:
        '200':
          description: The SAML service provider metadata document.
          content:
            application/samlmetadata+xml:
              schema:
                type: string
        '503':
          description: SAML is not configured (saml_not_configured). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/auth/signup:
    post:
      operationId: signup
      summary: Request a self-service account.
      description: >-
        Starts registration for an email address and, when the address is new,
        queues a verification email. The answer is the same whether or not the
        address already has an account, so this cannot be used to find out who has
        one. Refused with 403 signup_disabled when self-service signup is off, and
        with 422 domain_not_allowed when the address's domain is not permitted, or
        when no domains are listed and open registration is off. Each client
        address has a per-minute budget, and a refused attempt answers 429. Public
        and needs no credential.
      tags: ['Signup']
      x-ghd-handler: handleSignup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  description: The address to verify. Any password or display_name sent by an older client is ignored.
      responses:
        '202':
          description: Accepted. A verification email follows if the address is new.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    enum: ['Check your email to complete registration.']
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Self-service signup is disabled (signup_disabled). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: The address's domain is not permitted (domain_not_allowed). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/signup/status:
    get:
      operationId: signupStatus
      summary: Say whether self-service signup is offered.
      description: Public. The sign-in page reads it to decide whether to show the signup link.
      tags: ['Signup']
      x-ghd-handler: handleSignupStatus
      security: []
      responses:
        '200':
          description: The signup settings.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, open_registration, restricted_by_domain_list, saml_enabled]
                properties:
                  enabled:
                    type: boolean
                    description: Self-service signup is switched on.
                  open_registration:
                    type: boolean
                    description: >-
                      Any email domain may sign up, as in force: the open_registration_enabled
                      setting AND no allowed email domains listed. A non-empty list always
                      limits signup to those domains, so this is false then, whatever the
                      setting says (before 1.3.0 it echoed the setting).
                  restricted_by_domain_list:
                    type: boolean
                    description: >-
                      True when a non-empty allowed email domain list limits signup to those
                      domains. It is why open_registration can be false while the setting is on.
                  saml_enabled:
                    type: boolean
                    description: >-
                      The saml_enabled setting, which limits password sign-in to administrators.
                      It does not say whether SAML sign-in is available.
  /api/v1/auth/verify-email:
    get:
      operationId: lookupVerification
      summary: Look up the address behind a verification link.
      description: >-
        Shows the address a verification token belongs to, without using the
        token. The token is consumed only by POST /auth/verify-email. A missing,
        malformed, unknown or already used token is refused with 422
        token_invalid, and an expired one with 422 token_expired. An address that
        has gained an account since the link was sent is refused with 422
        token_invalid, the same answer POST /auth/verify-email gives (before
        1.3.0 this answered 200). A fault while checking the address is a 500, not
        a 422. Public.
      tags: ['Signup']
      x-ghd-handler: handleLookupVerification
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: The verification token from the email link.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The address the token was issued for.
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email: {type: string}
        '422':
          description: >-
            The token is invalid (token_invalid) or expired (token_expired). Sent as
            application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      operationId: verifyEmail
      summary: Verify an address and create the account.
      description: >-
        Consumes a verification token, creates the account with the display name
        and password chosen here, and starts a session for it. The session is
        fully signed in unless the role must enrol a second factor, in which case
        mfa_enrollment_needed is true and the session is not yet marked as having
        passed MFA. A blank display name is refused with display_name_required, and a
        password outside 8 to 72 bytes with password_too_short or password_too_long,
        and in each case the link still works. A token that is invalid, expired or
        already used, or an address that has gained an account since, is refused
        with 422. Public.
      tags: ['Signup']
      x-ghd-handler: handleVerifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, display_name, password]
              properties:
                token:
                  type: string
                  format: uuid
                  description: The verification token from the email link.
                display_name:
                  type: string
                  description: The name shown for the account. Trimmed; must not be blank.
                password:
                  type: string
                  description: The password for the new account. Between 8 and 72 bytes.
      responses:
        '200':
          description: The account was created and the session is signed in.
          content:
            application/json:
              schema:
                type: object
                required: [user, mfa_enrollment_needed]
                properties:
                  user: {$ref: '#/components/schemas/User'}
                  mfa_enrollment_needed:
                    type: boolean
                    description: True when the role must enrol a second factor before it is fully signed in.
        '400':
          description: >-
            The body is not JSON (bad_request), the display name is blank
            (display_name_required), or the password is too short (password_too_short)
            or too long (password_too_long). Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: >-
            token_expired when the token has expired. token_invalid when the token is
            malformed, unknown or already used, or the address has gained an account
            since the link was sent. Sent as application/json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/categories:
    get:
      operationId: listPublicCategories
      summary: List the top-level categories for the ticket form.
      description: >-
        Returns active categories only to an anonymous guest, a reporting user, a
        session that has not passed MFA, and an API key owned by a reporting user.
        Archived categories are included for a staff or administrator session that
        has passed MFA, an API key owned by staff or an administrator, and any OAuth
        client. Open to a signed-in caller of any role, to a key or OAuth client with no
        scopes, and to anyone when guest submission is enabled. Otherwise answers
        401. Returns an empty array, never null.
      tags: ['Catalogue']
      x-ghd-handler: handleListPublicCategories
