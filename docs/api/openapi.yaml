    put:
      operationId: putTicketCustomFields
      summary: Set custom field values on a ticket.
      description: |
        The body maps custom field definition ids to values. Each key must be a
        field this ticket has through its classification, and a select field's
        value must be one of its options. An empty string clears that value.
        Answers 204 with no body. The id is a UUID or a tracking number.
        The entries are written one at a time, in no particular order, with no
        transaction around them. If one entry is refused, the entries written
        before it stay saved, and the response is 400.
        A reporting user cannot change a Closed ticket (409 ticket_closed). Staff
        and administrators can.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. The text/plain 403s from the auth
        middleware are decided before the ticket is looked up and say nothing
        about it.
      tags: ['Tickets']
      x-ghd-handler: handlePutTicketCustomFields
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
