              schema:
                type: object
                required: [insecure_secrets, attachment_scanning, attachment_storage, oauth_clients_without_groups, passkeys, email, reopen_target]
                properties:
                  oauth_clients_without_groups:
                    type: array
                    items: {type: string}
                    description: |
                      Names of the switched-on OAuth clients that see no tickets
                      because ticket scope enforcement is on and the client's
                      service user is in no group. Always an array, and empty
                      while enforcement is off. It stays until each client has
                      a group or is disabled.
                  passkeys:
                    type: object
                    required: [available, reason]
                    description: |
                      Whether passkeys can be used. They cannot when BASE_URL is
                      an IP address, a single-label host or a non-ASCII host,
                      because a passkey is bound to a domain name (localhost is
                      accepted). The server starts anyway, with passkeys off.
                      The admin UI shows a banner while available is false.
                    properties:
                      available:
                        type: boolean
                      reason:
                        type: string
                        description: Why not, as the passkey library words it. Empty when available.
                  reopen_target:
                    type: object
                    required: [inactive]
                    description: |
                      Whether the configured reopen target status has been
                      deactivated. While it is, every reopen (a forced reopen, and
                      a requester's or guest's reply to a Resolved ticket) goes to
                      New instead. The admin UI shows a banner asking for an
                      active status.
                    properties:
                      inactive:
                        type: boolean
                        description: True when the setting names an existing status that is inactive.
                      name:
                        type: string
                        description: The configured status name. Present only when inactive is true.
                  insecure_secrets:
                    type: [array, 'null']
                    description: |
                      Names of the environment variables whose value looks
                      insecure (see above). null, not an empty array, when there
                      are none.
                    items:
                      type: string
                      enum: [SESSION_SECRET, JWT_SECRET]
                  attachment_scanning:
                    type: object
                    required: [policy, configured, reachable, effect, policy_explicit, stale_off]
                    properties:
                      policy:
                        type: string
                        enum: [off, required, permissive]
                        description: |
                          The scan policy in force. An unrecognised stored value
                          falls back to required when a scanner address is set and
                          to off when none is.
                      configured:
                        type: boolean
                        description: Whether a scanner address is set, from the environment or from the attachment_scan_address setting.
                      reachable:
                        type: boolean
                        description: Whether a live ping to the scanner succeeded. Always false when no address is set.
                      effect:
                        type: string
                        description: One sentence, in plain words, saying what happens to uploads right now.
                      policy_explicit:
                        type: boolean
                        description: |
                          True when an administrator has saved a valid
                          attachment_scan_policy. False when the policy shown is
                          only a default derived from whether a scanner address
                          is set. Saving "off" explicitly makes this true.
                      stale_off:
                        type: boolean
                        description: |
                          True when scanning is off by default rather than by
                          choice: the effective policy is off, policy_explicit is
                          false, no scanner address is set in the setting or the
                          environment, and at least one attachment is stored.
                          The admin UI shows a banner with the fix while this is
                          true.
                  attachment_storage:
                    type: object
                    required: [writable, problem]
                    description: |
                      Whether uploads can be stored. Probed on every request (a
                      scratch file is written and removed in ATTACHMENT_DIR), so
                      it clears as soon as the directory is fixed. While
                      writable is false, every upload route answers 503
                      attachments_unavailable; downloads of stored files are not
                      affected.
                    properties:
                      writable:
                        type: boolean
                      problem:
                        type: string
                        description: The operating system's reason, without the path. Empty when writable.
                  email:
                    type: object
                    required: [enabled, missing, signup_without_email, guest_submission_without_email, failing, failing_count, last_error]
                    description: |
                      Whether email can be sent and whether it is being
                      delivered. Never carries a credential or an address.
                    properties:
                      enabled:
                        type: boolean
                        description: False until both SMTP_HOST and SMTP_FROM are set.
                      missing:
                        type: array
                        description: The unset variables, SMTP_HOST and SMTP_FROM, while enabled is false. Empty otherwise.
                        items:
                          type: string
                          enum: [SMTP_HOST, SMTP_FROM]
                      signup_without_email:
                        type: boolean
                        description: |
                          True when self_signup_enabled is on although email is not
                          configured. Turning it on in that state is refused
                          (email_required); an install that already had it on is
                          reported here and left as it was.
                      guest_submission_without_email:
                        type: boolean
                        description: The same, for guest_submission_enabled.
                      failing:
                        type: boolean
                        description: |
                          True while email rows (including signup verification mail) in the notification outbox are
                          retrying after an error, or gave up within the last 24
                          hours. A row is delivered and removed, so a working
                          mailer reports false.
                      failing_count:
                        type: integer
                        description: How many such rows there are. Zero when failing is false.
                      last_error:
                        type: string
                        description: |
                          The newest error text, with email addresses replaced by
                          [address]. For example "SMTP server does not offer AUTH
                          but SMTP_USER is set" or "SMTP server does not offer
                          STARTTLS, and SMTP_PASSWORD is set: refusing to send
                          the password unencrypted". Empty when failing is false.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/settings:
    get:
      operationId: getSettings
      summary: Read the stored instance settings.
      description: |
        Administrators only (second factor required).
        Returns every stored setting keyed by name, with each
        value as stored, except the choice-list settings, which report the value in
        force (see updateSettings). attachment_scan_policy is the exception among
        those: a stored value that is not off, required or permissive is left out
        of the response, because the policy in force then depends on whether a
        scanner address is set (see getSecurityWarnings). The seven write-only
        secrets are never returned.
        In their place the response carries a boolean <name>_set for each one,
        saying whether a non-blank value is stored. Those seven flags are always
        present, false when the secret is unset. Other unset settings are absent
        from the response.
      tags: ['Admin: Settings']
      x-ghd-handler: handleGetSettings
      security:
        - sessionCookie: []
        - apiKey: ['settings:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every stored setting, with the secret presence flags.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SettingsValues'
                  - type: object
                    required:
                      - oidc_client_secret_set
                      - saml_key_pem_set
                      - attachment_vt_api_key_set
                      - attachment_reputation_api_key_set
                      - attachment_reputation_virustotal_key_set
                      - attachment_reputation_metadefender_key_set
                      - attachment_reputation_polyswarm_key_set
                    properties:
                      oidc_client_secret_set:
                        type: boolean
                        description: Whether oidc_client_secret holds a non-blank value.
                      saml_key_pem_set:
                        type: boolean
                        description: Whether saml_key_pem holds a non-blank value.
                      attachment_vt_api_key_set:
                        type: boolean
                        description: Deprecated. Whether attachment_vt_api_key holds a non-blank value.
                      attachment_reputation_api_key_set:
                        type: boolean
                        description: Deprecated. Whether attachment_reputation_api_key holds a non-blank value.
                      attachment_reputation_virustotal_key_set:
                        type: boolean
                        description: Whether the VirusTotal key holds a non-blank value.
                      attachment_reputation_metadefender_key_set:
                        type: boolean
                        description: Whether the MetaDefender key holds a non-blank value.
                      attachment_reputation_polyswarm_key_set:
                        type: boolean
                        description: Whether the PolySwarm key holds a non-blank value.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: updateSettings
      summary: Change one or more instance settings.
      description: |
        Administrators only (second factor required).
        The body is a JSON object that maps setting names to
        values. This is a patch: a name left out keeps its stored value. Each name
        is written as sent, and the writes happen one key at a time, not in one
        transaction, so a store failure partway through leaves the keys already
        written in place and answers 500.
        Names are checked against the settings this server knows (those in
        SettingsValues). A name that is not one of them refuses the whole body
        with 400 unknown_setting, the message names the first such name (sorted),
        and nothing is written, not even the valid names beside it. Before 1.3.0
        any name was stored. A name ending in _set is refused with 400
        readonly_setting, because that suffix belongs to the presence flags GET
        returns.
        These keys are validated. If one of them is wrong, the whole write is
        refused and nothing in the body is stored. Known keys not listed here are
        stored as sent, without a type check:
        - closed_reopen_policy, audit_mask_requester_names, attachment_scan_policy,
          attachment_infected_handling, attachment_mismatch_handling and
          attachment_reputation_refresh take only the listed values. Every
          refusal (null, a non-string, an empty string, or a string outside the
          list) carries the setting's own code (invalid_closed_reopen_policy,
          invalid_audit_mask_requester_names, invalid_scan_policy,
          invalid_infected_handling, invalid_mismatch_handling,
          invalid_reputation_refresh). Before v1.3.0, null and a non-string were
          refused with bad_request for some of these.
        - staff_email_assigned_override, staff_email_activity_override and
          staff_email_group_override take user, on or off; a string outside the list
          is refused with invalid_staff_email_override, as are null and a non-string.
        - ticket_prefix is 1 to 8 uppercase letters or digits (invalid_ticket_prefix).
        - audit_retention_days must be an integer of at most 36525. Zero or less
          keeps entries forever.
        - password_rehash_grace_days must be an integer from 1 to 365 (default 30).
          Zero, negative, larger, null and non-integers are refused with bad_request.
          password_rehash_started_at is recorded by the server when 1.3.0 first
          runs and is refused with 400 readonly_setting; it is left out of GET.
        - guest_submission_enabled, staff_can_view_ticket_change_history,
          staff_can_view_follow_audit and staff_can_create_api_keys must be JSON
          booleans. null is refused.
        - api_key_max_lifetime_years must be the integer 1, 2, 3, 4 or 5 (years), or
          -1 for no limit ("Never"). 0, 6 or more, anything below -1, a fraction, a
          string and null are refused with bad_request, and nothing is stored. Unset
          reads as 2.
        - guest_submission_enabled and self_signup_enabled cannot be turned from
          off to on while email is not configured (SMTP_HOST and SMTP_FROM): 400
          email_required, and nothing in the body is stored. Both send an email
          the person needs (the guest's ticket link, the signup verification
          link). Only a change from off to on is refused, judged against the
          stored value, so a settings page that sends the whole object back with
          one of them already on is not refused. An install that already has
          either on with email off keeps it and is warned in
          getSecurityWarnings. Turning either off is always allowed.
        - attachment_scan_address is empty, tcp://host:port or unix:///path
          (invalid_scanner_address). null is refused (bad_request). An empty string leaves it unset.
        - attachment_allowed_types is an array of extensions that each match the
          pattern. An empty array is valid and means the instance takes no
          attachments (invalid_allowed_types). null is refused (bad_request).
        - Each reputation provider's enabled setting must be a boolean; null is
          refused (invalid_reputation_config). Enabling
          VirusTotal, MetaDefender or PolySwarm needs a key, either stored already
          or sent in the same request (invalid_reputation_config). Only a
          provider the request names (its enabled setting or its key) is checked;
          the stored state of the others is not this request's to judge. CIRCL
          needs no key.
        - auto_assign_group_id is the id of an existing group, or empty or null to
          turn the catch-all off. auto_assign_user_ids is an array of ids of
          existing staff or administrator accounts, or empty or null to turn the
          round-robin off. Anything else is refused with 400 invalid_auto_assign.
          Before this check an id that did not parse, or named nobody, was saved
          and then skipped when a ticket was routed.
        - saml_metadata_url, saml_metadata_xml, saml_cert_pem, saml_key_pem,
          oidc_issuer_url, oidc_client_id and oidc_client_secret must be strings
          and oidc_enabled a boolean; null is refused (bad_request). saml_enabled and
          oidc_redirect_url are not type-checked. Enabling OIDC needs an issuer
          URL, a client id and a client secret.
        - saml_metadata_url and saml_metadata_xml cannot both be non-empty after
          the write, and saml_metadata_xml must be SAML IdP metadata of at most
          262144 bytes; either refusal is 400 bad_request.
        - If the write leaves some administrators unable to sign in by any method,
          it is applied and the answer is 200 with a warning that names them. If it
          would leave no administrator able to sign in, it is refused with 400.
        Session only: an API key or OAuth client that sends any of the keys below,
        anywhere in the body, is refused with 403 session_required, and nothing is
        written. Every other key is open to a machine credential that has
        settings:write.
        saml_enabled, saml_metadata_url, saml_metadata_xml, saml_cert_pem,
        saml_key_pem, oidc_enabled, oidc_issuer_url, oidc_client_id, oidc_client_secret,
        oidc_redirect_url, mfa_enabled, mfa_enforced_roles, allowed_email_domains,
        self_signup_enabled, open_registration_enabled, closed_reopen_policy,
        audit_mask_requester_names, guest_submission_enabled,
        attachment_scan_address, attachment_scan_policy, attachment_allowed_types,
        attachment_infected_handling, attachment_mismatch_handling,
        audit_retention_days, staff_can_view_ticket_change_history,
        staff_can_view_follow_audit, staff_can_create_api_keys,
        api_key_max_lifetime_years, ticket_scope_enforced, auto_assign_group_id,
        auto_assign_user_ids, password_rehash_grace_days, password_rehash_started_at,
        attachment_vt_lookup, attachment_vt_api_key, attachment_reputation_provider,
        attachment_reputation_api_key, attachment_reputation_virustotal_enabled,
        attachment_reputation_virustotal_key, attachment_reputation_metadefender_enabled,
        attachment_reputation_metadefender_key, attachment_reputation_polyswarm_enabled,
        attachment_reputation_polyswarm_key, attachment_reputation_circl_enabled,
        attachment_reputation_refresh.
      tags: ['Admin: Settings']
      x-ghd-handler: handleUpdateSettings
      security:
        - sessionCookie: []
        - apiKey: ['settings:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsValues'
      responses:
        '200':
          description: |
            The write was applied, with a warning. It is one or both of: the write
            leaves some administrators unable to sign in (the warning names them),
            or it turned ticket_scope_enforced from off to on while some
            OAuth clients have a service user in no group (the warning names the
            clients, which will see no tickets). Nothing is refused for either.
          content:
            application/json:
              schema:
                type: object
                required: [warning]
                properties:
                  warning:
                    type: string
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: |
            The body is not a JSON object, a value is of the wrong type or outside
            its list, or the write would strand every administrator. Codes:
            bad_request (invalid JSON, a wrong type, an audit retention above the
            maximum, or a refusal from the SSO guard), readonly_setting, unknown_setting,
            invalid_closed_reopen_policy, invalid_audit_mask_requester_names,
            invalid_scan_policy, invalid_infected_handling,
            invalid_mismatch_handling, invalid_reputation_refresh,
            invalid_ticket_prefix, invalid_scanner_address, invalid_allowed_types,
            invalid_reputation_config, invalid_staff_email_override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the authentication middleware (text/plain): forbidden (role),
            mfa_required (session without its second factor), insufficient_scope
            (the key lacks settings:write). Or refused by the handler (JSON):
            session_required, when a machine credential sends a session-only key.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/settings/logo:
    post:
      operationId: uploadLogo
      summary: Upload the site logo.
      description: |
        Administrators only (second factor required).
        Accepts one PNG, JPEG or GIF of at most 2 MB in the
        multipart field logo. SVG is refused. The image is scaled to fit within 320
        by 64 pixels with its aspect ratio kept, then stored as PNG, which also
        strips its metadata. A new logo replaces the old one and sets the
        site_logo_url setting, which GET /api/v1/site reports. The logo route serves
        it from a 5-minute cache. A body over the cap is refused as 400
        invalid_form, not 413.
      tags: ['Admin: Settings']
      x-ghd-handler: handleUploadLogo
      security:
        - sessionCookie: []
        - apiKey: ['settings:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
                  description: The image file. Exactly one.
      responses:
        '200':
          description: The logo is stored.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    description: The logo URL with a cache-busting query, for example /api/v1/logo?v=1767225600.
        '400':
          description: |
            Refused before anything is stored. Codes: invalid_form (not multipart,
            or over the body cap), missing_field (no logo field), file_too_large
            (over 2 MB), invalid_type (not PNG, JPEG or GIF), invalid_image (the
            image does not decode, or its decoded size is over the limit).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The file could not be read, the storage directory or file could not be written, or the logo setting could not be saved (read_error, storage_error, settings_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteLogo
      summary: Remove the site logo.
      description: |
        Administrators only (second factor required).
        Deletes the stored logo file and clears the
        site_logo_url setting. With no logo stored it still answers 204.
      tags: ['Admin: Settings']
      x-ghd-handler: handleDeleteLogo
      security:
        - sessionCookie: []
        - apiKey: ['settings:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The logo setting could not be cleared (settings_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/guest/attachments:
    post:
      operationId: guestUploadAttachment
      summary: Attach a file to the ticket a guest link names.
      description: |
        Authenticated by the guest token alone. The token names the ticket, so no
        ticket id appears in the path. The request is the same multipart upload as
        uploadAttachment, with the same checks, scanning, quarantine and wrapping,
        and the same 25 MB cap. Two things are specific to guests. Submission
        being switched off suspends guest links and answers 404 until the setting
        is enabled again. A Closed ticket answers 404 not_found, the same as a bad link, where
        uploadAttachment answers 409. As there, a Resolved ticket past its reopen
        window answers 409 reopen_window_closed.
        The response is the stored attachment. Its reputation block is null, since
        only staff and admin reads fill that in.
      tags: ['Guest']
      x-ghd-handler: handleGuestUploadAttachment
      security:
        - guestToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file. One per request.
      responses:
        '201':
          description: The attachment is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          description: |
            No file field, or a body that is not multipart (bad_request), or a
            filename that is not valid UTF-8, contains a NUL, is longer than 255
            bytes, or contains a control or text-direction character
            (invalid_filename).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/GuestNotFound'
        '409':
          description: The ticket is Resolved and its reopen window has closed (reopen_window_closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The file is over 25 MB (too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: |
            The extension is not in the instance's allowed list (unsupported_type),
            or the content contradicts the name and the operator chose to refuse
            such files (invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            The scanner found malware and the operator chose to refuse it (infected),
            or the image could not be decoded for recompression (invalid_image).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The upload could not be read, stored on disk, or recorded (read_error, storage_error, db_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            Uploads cannot be taken right now. Either the attachment directory
            cannot be written to (attachments_unavailable), or the scanner is
            unavailable and the scan policy is required, so the file is refused
            until the scanner returns (scanner_unavailable).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    get:
      operationId: listAttachments
      summary: List the attachments on a ticket.
      description: |
        Anyone who may see the ticket may list its attachments. A reporting user
        sees only their own tickets, and a ticket that is not theirs answers 404.
        The list is not paged.
        Each entry carries the hash of the upload, the detected type and the
        scanner's result. reputation_url is set on the attachments the instance
        found worth a second opinion: the scanner named the file, or its content
        contradicts its name.
        reputation is filled in for staff and admin only, and only for a
        quarantined file (one the scanner named). For each enabled provider, a
        verdict already cached is used. Otherwise the file's hash is sent to that
        provider now, which is a live lookup to a third party. A reporting user
        never causes a lookup. The lookup shares a five-second budget across the
        request, and a provider that did not answer shows as unavailable rather than
        failing the response.
        The path id is a UUID or a tracking number.
      tags: ['Attachments']
      x-ghd-handler: handleListAttachments
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: The attachments on the ticket, oldest first. A ticket with none gives an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
    post:
      operationId: uploadAttachment
      summary: Upload a file to a ticket.
      description: |
        Multipart upload of one file in the field file, up to 25 MB. The checks run
        in this order.
        1. The body is capped at 25 MB plus 1 MB for the multipart framing, and a
           file part that declares more than 25 MB is refused (413 too_large). A body
           that is not multipart, or has no file field, is 400 bad_request.
        2. The name must be valid UTF-8, contain no NUL, no control or
           text-direction characters, and be at most 255 bytes (400 invalid_filename).
        3. The extension must be in the instance's allowed list
           (attachment_allowed_types). The default is .pdf, .docx, .xlsx, .txt, .log,
           .jpg, .jpeg, .png and .bmp (415 unsupported_type).
        4. The bytes are read (413 too_large over 25 MB), hashed (SHA-256) and their
           type is detected. For an extension in that default set, content that
           contradicts the name is recorded as a mismatch (mismatch true).
        5. The scanner runs unless the scan policy is off. An infected file is
           refused with 422 infected by default. Under quarantine it is stored as the
           uploaded name plus .zip, inside an archive whose password is the published
           word "infected", and the scanner's name is recorded in virus_name. If the
           scanner cannot be reached, the file is refused with 503 under the required
           policy and accepted unscanned under permissive. A file the scanner named
           never reaches step 6.
        6. A mismatch is acted on only when the extension is in the default set,
           is not a text extension (.txt, .log, .csv, .md), and the detected type is
           not on the allowed list. Under the default refuse setting such a file is
           refused with 415 invalid_file; under wrap it is stored as
           suspicious-<crc32>.zip with no password. Any other mismatch is stored
           under its own name with mismatch true.
        7. Images (JPEG, PNG, BMP) are re-encoded as whichever of JPEG (quality 85)
           or PNG is smaller, or as PNG when they have transparency (422
           invalid_image if they cannot be decoded). The stored size and file differ
           from the upload, but sha256 is the hash of the bytes as uploaded.
        A reporting user may upload only to their own ticket. A Closed ticket answers
        409 ticket_closed. A Resolved ticket past its reopen window answers 409
        reopen_window_closed. Staff and admin are not limited by the ticket's state.
        The response is the stored attachment. Its reputation block is null, since
        only listAttachments and the re-check fill it in.
        The ticket checks run before the body is read, so a 409 is answered before
        any 400, 413 or 415 about the file.
        The path id is a UUID or a tracking number.
      tags: ['Attachments']
      x-ghd-handler: handleUploadAttachment
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file. One per request.
      responses:
        '201':
          description: The attachment is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          description: |
            No file field, or a body that is not multipart (bad_request), or a filename
            refused by the name checks (invalid_filename).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            ticket_closed: the reporter's ticket is Closed. reopen_window_closed: the
            ticket is Resolved and the reopen window has passed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The file is over 25 MB, or the body is over the cap that includes multipart framing (too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: |
            The extension is not allowed on this instance (unsupported_type), or the
            content contradicts the name and the operator chose to refuse such files
            (invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            The scanner found malware and the operator chose to refuse it (infected),
            or an image could not be decoded for recompression (invalid_image).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The upload could not be read, stored on disk, or recorded (read_error, storage_error, db_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            Uploads cannot be taken right now: the attachment directory cannot be written to
            (attachments_unavailable), or the scanner is unavailable and the scan policy is
            required (scanner_unavailable).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/attachments/{attachId}:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
      - name: attachId
        in: path
        required: true
        description: The attachment's UUID, as listed by listAttachments.
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadAttachment
      summary: Download an attachment.
      description: |
        Streams the stored file as a download. The response is always
        application/octet-stream with Content-Disposition: attachment, whatever the
        file is, so a browser saves it rather than rendering it. The filename is sent
        twice, as a plain quoted name and as an RFC 5987 UTF-8 name. A quarantined
        file comes back as the ZIP archive it was stored as, whose password is the
        published word "infected". A file wrapped for its contents comes back as its
        .zip.
        Rendering is refused. A request whose Sec-Fetch-Dest header is anything other
        than document or empty gets 403 not_downloadable. A request with no
        Sec-Fetch-Dest header (curl, and browsers older than Chrome 80, Firefox 90
        and Safari 16.4) is allowed, since the check cannot apply to it. Vary:
        Sec-Fetch-Dest keeps a cache from answering a rendering request with a
        response that was fetched for a download.
        Range and conditional requests are supported. The Last-Modified time is the
        upload time. A request for several ranges gets multipart/byteranges, with
        the same blob type on each part.
        Answers 404 not_found ("attachment not found on this ticket") when the
        attachment belongs to another ticket, 404 not_found when the attachId names
        no attachment at all, and 404 not_found ("file not found on disk") when its
        file is missing. A reporting user asking for a ticket that is not theirs gets
        the ticket 404 instead.
        The filename in Content-Disposition is the stored name made safe for a
        header: control characters and path separators are removed, it is cut to
        200 bytes keeping the extension, and the plain form replaces every
        non-ASCII character with an underscore.
        The path id is a UUID or a tracking number.
      tags: ['Attachments']
      x-ghd-handler: handleDownloadAttachment
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      parameters:
        - name: Sec-Fetch-Dest
          in: header
          required: false
          description: Sent by browsers. Only document and empty are served. Absent is served too.
          schema:
            type: string
            enum: [document, empty]
        - name: Range
          in: header
          required: false
          description: A byte range, for example bytes=0-1023. Multiple ranges are allowed.
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          description: A date or ETag that decides whether the Range applies.
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
        - name: If-Unmodified-Since
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The whole file.
          headers:
            Content-Disposition:
              description: attachment, with the stored filename made header-safe (see above), in both the plain and the RFC 5987 forms.
              schema:
                type: string
            Cache-Control:
              description: Always private, max-age=3600.
              schema:
                type: string
            Vary:
              description: Always Sec-Fetch-Dest.
              schema:
                type: string
            Last-Modified:
              description: The upload time.
              schema:
                type: string
            Accept-Ranges:
              description: Always bytes.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Part of the file. For a single Range the body is those bytes and Content-Range says which. For several ranges the body is multipart/byteranges, each part carrying application/octet-stream and its own Content-Range.
          headers:
            Content-Range:
              description: The bytes sent, as bytes start-end/total. Single range only.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            multipart/byteranges:
              schema:
                type: string
                format: binary
        '304':
          description: The client's copy is current. No body.
        '400':
          description: attachId is not a UUID (invalid_id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the authentication middleware (text/plain): mfa_required,
            insufficient_scope. Or refused by the handler (JSON): not_downloadable,
            when Sec-Fetch-Dest asks for a rendering context.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '412':
          description: An If-Match or If-Unmodified-Since precondition failed. No body.
        '416':
          description: The Range cannot be satisfied. Content-Range gives the file's size.
          headers:
            Content-Range:
              description: bytes */total.
              schema:
                type: string
  /api/v1/tickets/{id}/attachments/{attachId}/reputation:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
      - name: attachId
        in: path
        required: true
        description: The attachment's UUID, as listed by listAttachments.
        schema:
          type: string
          format: uuid
    post:
      operationId: recheckAttachmentReputation
      summary: Ask the reputation providers about a file again.
      description: |
        Staff and administrators only (second factor required).
        Re-checks the verdict on one file with each
        enabled provider, or with only the provider named in the provider query
        parameter. A person asked for this, so a page render never does it.
        Each provider's verdict has its own clock. For each file, a provider can be
        re-checked once every seven days, whatever the automatic refresh interval is
        set to. A re-check inside that week is refused with 429 checked_recently and
        the date it clears. The daily budget still applies. A verdict that cannot
        change any more (a detection, or a known catalogue entry) is refused with 409
        detection_is_final. A file no provider has looked up yet is refused with 409
        no_verdict, because a re-check is never a first lookup.
        When at least one provider refreshed its verdict, the answer is 200 with the
        attachment and a rebuilt reputation block. A provider that refused is logged,
        not returned. When none refreshed, the refusal code is the one that holds for
        every provider asked: detection_is_final if all of them are final, no_verdict
        if none has a stored verdict, otherwise checked_recently if any is inside its
        week, even when another provider failed. Otherwise (a provider failed and
        none is inside its week) the answer is 503 reputation_unavailable.
        A file with no hash cannot be checked, and is refused with 409 no_verdict.
        The file need not be quarantined, but only a quarantined file is looked up
        automatically, so any other file normally answers 409 no_verdict.
        The path id is a UUID or a tracking number. An attachment that belongs to another
        ticket is 404 not_found ("attachment not found on this ticket"). An
        attachId that names no attachment at all is 404 not_found.
      tags: ['Attachments']
      x-ghd-handler: handleRecheckAttachmentReputation
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      parameters:
        - name: provider
          in: query
          required: false
          description: Re-check only this provider. Omit to re-check every enabled provider. A name that is not enabled on this instance is 400 invalid_provider.
          schema:
            type: string
            enum: [virustotal, metadefender, polyswarm, circl]
      responses:
        '200':
          description: The re-check ran, and the attachment carries the rebuilt reputation block.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          description: |
            attachId is not a UUID (invalid_id), or the provider
            named is not enabled (invalid_provider).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            detection_is_final: the verdict cannot change any more. no_verdict: no
            provider has looked the file up yet, or it has no hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: No provider refreshed and at least one is inside its seven-day floor (checked_recently), whatever the others answered. Retry-After is the seconds until the earliest one clears.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No provider is enabled, or no provider refreshed, none is inside its seven-day floor, and not every one is final or unlooked-up (for example one failed or ran out of time) (reputation_unavailable). Retry-After is 60.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/lookup:
    get:
      operationId: lookupUsers
      summary: Find accounts to file a ticket for.
      description: |
        Staff and administrators only (second factor required). A machine
        credential (an API key, or an OAuth client acting as a staff service
        user) needs users:read. The New ticket page's requester picker.
        Returns accounts whose display name or email contains q, ignoring case
        (% and _ match themselves), as a bare array of id, display_name and
        email, ordered by display name (then id), at most 10. The disabled, deleted
        and service accounts are left out by the query itself, so a search whose
        matches are mostly disabled still answers up to 10 of the rest. Any role of account is
        returned; deleted accounts, disabled accounts and service accounts (an
        OAuth client's identity) are not. q must be at least 2 characters after trimming; a
        shorter or missing q is 400, so the endpoint cannot list the directory.
        Not paged.
      tags: ['Reference data']
      x-ghd-handler: handleLookupUsers
      security:
        - sessionCookie: []
        - apiKey: ['users:read']
        - oauthClient: ['users:read']
      x-ghd-roles: [admin, staff]
      x-ghd-mfa: true
      parameters:
        - name: q
          in: query
          required: true
          description: What to look for. At least 2 characters after trimming.
          schema:
            type: string
            minLength: 2
      responses:
        '200':
          description: The matching accounts, up to 10, as a bare array (never null).
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  type: object
                  required: [id, display_name, email]
                  properties:
                    id: {$ref: '#/components/schemas/Uuid'}
                    display_name: {type: string}
                    email: {type: string}
        '400':
          description: "`bad_request`: q is missing or shorter than 2 characters."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/api-keys:
    get:
      operationId: listAPIKeys
      summary: List API keys.
      description: >-
        Administrators only (second factor required).
        An administrator signed in through the browser gets every API key, newest
        first, each with its owner (owner_name, owner_email). An API key gets only
        itself: not its owner's other keys, and not anyone else's. The token and its hash are never returned, so a key's
        secret cannot be read back after creation. Before 1.3 a signed-in administrator
        was shown only their own keys.
      tags: ['Admin: Credentials']
      x-ghd-handler: handleListAPIKeys
      security:
        - sessionCookie: []
        - apiKey: ['credentials:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The keys the caller may see, newest first. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAPIKey
      summary: Create an API key.
      description: >-
        Administrators only, in a signed-in session (second factor required).
        Only a signed-in person creates an API key: an API key is refused with 403
        session_required, so a key cannot mint a successor before it expires (an OAuth
        client is a staff identity and is refused by the role check, 403 forbidden). A key can still list
        and revoke keys. Creates an API key that acts at its owner's role and counts
        as having passed MFA. The owner is the caller, or the staff member named by
        user_id: an administrator can issue a key on behalf of a live staff member, or
        for themselves. A requester, another administrator and a service account (an
        OAuth client's identity) cannot own a key. The key belongs to that account and
        acts as it; created_by records the administrator. Either way the key is audited
        (entity_type api_key, action api_key_issued). The raw token is returned once, in
        this response, and cannot be shown again. It has the form GHD_ followed by 64
        hexadecimal characters. scopes is required: a non-empty list of
        resource:action values from GET /api/v1/admin/scopes, and none may exceed
        the owner's role (for staff, tickets, groups:read, audit:read and users:read; for
        an administrator, any): invalid_scope otherwise. expires_at is required unless
        the api_key_max_lifetime_years setting is Never (-1): 400 expires_at_required
        without it, and it must be a future RFC 3339 timestamp no later than that many
        years from now (400 expires_at_too_far). Only with Never may it be omitted, for a
        key that never expires. An expired key is refused as if it were unknown. name is
        not validated and may be empty.
      tags: ['Admin: Credentials']
      x-ghd-handler: handleCreateAPIKey
      security:
        - sessionCookie: []
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                name:
                  type: string
                  description: A label for the key. Not validated.
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    pattern: '^[a-z_]+:(read|write)$'
                  description: >-
                    One or more resource:action scopes. Each must be in the catalogue
                    from GET /api/v1/admin/scopes. Write implies read on the same
                    resource.
                expires_at:
                  type: [string, 'null']
                  description: >-
                    RFC 3339 expiry in the future, for example 2027-01-31T00:00:00Z, and
                    no later than api_key_max_lifetime_years from now (2 years by default).
                    Required while there is a limit: 400 expires_at_required, or 400
                    expires_at_too_far naming the limit. Omitted, null, an empty string or
                    only spaces means the key never expires, and is accepted only when the
                    setting is Never (-1). The limit applies when the key is made, not
                    when it is used.
                user_id:
                  $ref: '#/components/schemas/Uuid'
                  description: >-
                    Issue the key for this account instead of the caller. Administrator
                    sessions only. The account must exist and not be deleted or disabled.
      responses:
        '201':
          description: >-
            Created. The token is shown only in this response. expires_at is null
            when the key never expires.
          content:
            application/json:
              schema:
                type: object
                required: [id, token, name, expires_at, user_id, created_by]
                properties:
                  id: {$ref: '#/components/schemas/Uuid'}
                  token:
                    type: string
                    description: The raw key, GHD_ followed by 64 hexadecimal characters. Shown once.
                  name: {type: string}
                  expires_at:
                    type: [string, 'null']
                    format: date-time
                  user_id:
                    $ref: '#/components/schemas/Uuid'
                    description: The account the key belongs to.
                  created_by:
                    $ref: '#/components/schemas/Uuid'
                    description: The caller.
        '400':
          description: >-
            Refused by the handler, as application/json. bad_request ("invalid
            JSON") for a body that does not decode. scopes_required when scopes is
            empty or missing. invalid_scope when an entry is not a catalogue scope
            (for example a write scope on audit) or is one the owner's role cannot
            use. invalid_expires_at when expires_at is not RFC 3339 or is not in
            the future. expires_at_required and expires_at_too_far for the lifetime
            limit. user_disabled when user_id names a disabled account.
            requester_cannot_own_key, cannot_issue_for_administrator (an account
            other than the caller that is an administrator) and
            service_account_cannot_own_key when user_id names an account that may not
            own a key: a key can be issued for a staff member or for yourself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Two sources. The authentication middleware refuses with text/plain:
            forbidden (role), mfa_required (second factor not passed) or
            session_required (an API key). Keys cannot create keys.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found, when user_id names no account or a deleted one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/api-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The API key's id.
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteAPIKey
      summary: Delete an API key.
      description: >-
        Administrators only (second factor required).
        An administrator signed in through the browser deletes any key, whoever owns
        it. An API key can delete only itself; any other id, its owner's other keys
        included, answers 404 not_found, the same as an id that does not exist.
        Either way the deleted key stops working on the next request. Before 1.3 an
        API key could delete another administrator's key if it knew the id. Revoking
        is audited (entity_type api_key, action api_key_revoked); on_behalf says the
        key was someone else's.
      tags: ['Admin: Credentials']
      x-ghd-handler: handleDeleteAPIKey
      security:
        - sessionCookie: []
        - apiKey: ['credentials:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request, message "invalid ID", when the path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            not_found, for an id that names no API key the caller may delete (an API key may delete only itself).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/categories/{id}/groups:
    parameters:
      - name: id
        in: path
        required: true
        description: The category's UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: listGroupsForCategory
      summary: List groups scoped to a whole category.
      description: >-
        Administrators only (second factor required).
        Returns the groups that hold a category-level scope entry, meaning one
        with no type_id. The category editor uses this to show which groups handle
        the category. Groups that cover only one type of the category are not
        included. An unknown category id answers 200 with an empty array.
      tags: ['Admin: Groups']
      x-ghd-handler: handleListGroupsForCategory
      security:
        - sessionCookie: []
        - apiKey: ['categories:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The matching groups, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '400':
          description: >-
            bad_request, message "invalid category id", when the path id is not a
            UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/categories/{id}/types/{typeId}/groups:
    parameters:
      - name: id
        in: path
        required: true
        description: The category's UUID.
        schema:
          type: string
          format: uuid
      - name: typeId
        in: path
        required: true
        description: >-
          The type's UUID. It is not checked against the category; a type from
          another category answers 200 with an empty array.
        schema:
          type: string
          format: uuid
    get:
      operationId: listGroupsForType
      summary: List groups scoped to one category type.
      description: >-
        Administrators only (second factor required).
        Returns the groups with a scope entry for exactly this category and type,
        which the type editor shows. Groups scoped to the whole category are not
        included. An unknown id answers 200 with an empty array.
