          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          description: >-
            not_implemented, message "WASM plugin upload not yet implemented". The
            only response this operation ever gives once authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/plugins/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The plugin's id, a reverse-DNS string such as com.example.slack-notifier. Not a UUID.
        schema:
          type: string
    patch:
      operationId: updatePlugin
      summary: Enable or disable a plugin.
      description: >-
        Administrators only (second factor required).
        Sets the plugin's enabled state. The enabled field is a plain boolean, so an
        absent field counts as false: a body of {} disables the plugin. An empty
        body is refused with 400. In v1 no plugin is registered, so every id answers
        404 not_found. The enabled state is held in memory and is lost on
        restart.
      tags: ['Admin: Plugins']
      x-ghd-handler: handleUpdatePlugin
      security:
        - sessionCookie: []
        - apiKey: ['plugins:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: true enables the plugin. Absent or false disables it.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request, message "invalid JSON", when the body is empty or does not
            decode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            not_found, for any id, because no plugin is registered in v1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: uninstallPlugin
      summary: Uninstall a plugin (not implemented).
      description: >-
        Administrators only (second factor required).
        Always answers 501 not_implemented. Plugin uninstall is not implemented in
        v1. This route is documented as a stub.
      tags: ['Admin: Plugins']
      x-ghd-handler: handleUninstallPlugin
      x-ghd-stub: true
      security:
        - sessionCookie: []
        - apiKey: ['plugins:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          description: >-
            not_implemented, message "plugin uninstall not yet implemented". The only
            response this operation ever gives once authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/scopes:
    get:
      operationId: listScopes
      summary: List the scope catalogue.
      description: >-
        Administrators only (second factor required).
        Returns every scope a credential can hold, as resource:action pairs. Write
        implies read on the same resource, and the audit resource has only read.
        There is no wildcard scope. The admin UI builds its picker from this list,
        so it cannot drift from what the server enforces. With ?role=staff or
        ?role=admin the list is only what a key owned by that role may carry
        (the same table POST /admin/api-keys checks); any other role is 400
        bad_request, because no other role can own a key.
      tags: ['Admin: Credentials']
      parameters:
        - name: role
          in: query
          required: false
          schema: {type: string, enum: [admin, staff]}
          description: Narrow the list to what a key owned by this role may carry.
      x-ghd-handler: handleListScopes
      security:
        - sessionCookie: []
        - apiKey: ['credentials:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every scope, in catalogue order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [scope, resource, action]
                  properties:
                    scope:
                      type: string
                      pattern: '^[a-z_]+:(read|write)$'
                      description: The scope as sent in a request, resource:action.
                    resource:
                      type: string
                      description: The resource, such as tickets or credentials.
                    action:
                      type: string
                      enum: [read, write]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List users.
      description: >-
        Administrators only (second factor required).
        Disabled accounts are included and soft-deleted accounts are left out.
        auth_type says how an account signs in, read off the credentials it
        holds (see AdminUserSummary).

        Without page, the answer is the newest 200 accounts, newest first, and
        nothing else changes it. limit, offset, q, role and service_account are ignored in that
        mode, as they always were, so an instance with more than 200 accounts
        shows only the first 200.

        With page (1-based) the list is paged: per_page accounts (default 50, at
        most 200; a larger value is clamped), newest first. q keeps accounts
        whose email or display name contains it, ignoring case; % and _ match
        themselves. role keeps one role. service_account=true keeps only service
        accounts and service_account=false only people. The body is still a bare
        array, and X-Total-Count holds the number of accounts that match q, role
        and service_account, so a client can show how many pages there are. A page
        past the end is an empty array. A page or per_page that is not a whole
        number of 1 or more, a role that is not admin, staff or user, or a
        service_account that is not true or false, is refused with 400 bad_request.
      tags: ['Admin: Users']
      x-ghd-handler: handleListUsers
      security:
        - sessionCookie: []
        - apiKey: ['users:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      parameters:
        - name: page
          in: query
          required: false
          description: Turns paging on. 1-based.
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          description: Accounts per page. Only read when page is sent.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: q
          in: query
          required: false
          description: Substring of email or display name. Only read when page is sent.
          schema:
            type: string
        - name: role
          in: query
          required: false
          description: Only this role. Only read when page is sent.
          schema:
            type: string
            enum: [admin, staff, user]
        - name: service_account
          in: query
          required: false
          description: >-
            true keeps only service accounts (the identities OAuth clients act as),
            false keeps only people, absent or empty keeps everyone. X-Total-Count
            counts the filtered list. Any other value is refused with 400
            bad_request. Only read when page is sent.
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: >-
            Up to 200 accounts (unpaged) or one page. An empty array when there
            are none.
          headers:
            X-Total-Count:
              description: >-
                Paged mode only. How many accounts match q and role, across all
                pages.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/AdminUserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createUser
      summary: Create a user.
      description: >-
        Administrators only, in a signed-in session (second factor required). Keys can't write users: an API key is refused with 403 session_required (an OAuth client, which is a staff identity, with 403 forbidden), whatever the body. A key may read.
        Creates an account with the given role. The account has no second factor.
        password is optional. When present it must be 8 to 72 bytes. An account
        created without a password has no local sign-in until one is set with
        POST /api/v1/admin/users/{id}/password. The email address is trimmed and
        lowercased. An address that any account holds, deleted accounts included,
        answers 409 email_taken.
      tags: ['Admin: Users']
      x-ghd-handler: handleCreateUser
      security:
        - sessionCookie: []
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name, role]
              properties:
                email:
                  type: string
                  description: A bare address with no display name. Refused when empty or malformed.
                display_name:
                  type: string
                  description: Required. Surrounding spaces are trimmed.
                role:
                  $ref: '#/components/schemas/Role'
                password:
                  type: string
                  description: >-
                    Optional. When sent, 8 to 72 bytes, counted in bytes rather than
                    characters. Omit for an account with no password yet.
      responses:
        '201':
          description: The created account, with no password or secret fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: >-
            Refused by the handler or the user service, as application/json. bad_request
            with message "invalid JSON" for a body that does not decode. bad_request
            with a message beginning "invalid input:" for an empty or malformed email,
            a blank display name, an invalid role, or a password shorter than 8 or
            longer than 72 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            The authentication middleware refuses with text/plain: forbidden (role),
            mfa_required (second factor not passed), insufficient_scope (an API key without the
            route's scope, which is checked first) or session_required (an API key).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            email_taken, with message "that email address is already in use, possibly
            by a deleted account".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The user's UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getUser
      summary: Get a user.
      description: >-
        Administrators only (second factor required).
        Returns one account with its groups and passkey count. Soft-deleted accounts
        are still returned here, so a deleted account can be inspected by id. The
        has_password field says whether a local password is set.
      tags: ['Admin: Users']
      x-ghd-handler: handleGetUser
      security:
        - sessionCookie: []
        - apiKey: ['users:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '400':
          description: >-
            bad_request, message "invalid user ID", when the path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            not_found, when no account has this id. The message is not stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateUser
      summary: Update a user.
      description: >-
        Administrators only, in a signed-in session (second factor required). Keys can't write users: an API key is refused with 403 session_required (an OAuth client, which is a staff identity, with 403 forbidden), whatever the body. A key may read.
        Applies the fields that are sent, in this order: disabled (disabling also
        ends the account's sessions), reset_mfa (clears the authenticator and every
        passkey, and ends sessions), role (ends sessions), then display_name and
        email. Absent fields are unchanged. Every field is checked before the first
        one is written, in this order: the body (an invalid role, an invalid email
        or a blank display name answers 400), then the
        account (an unknown or soft-deleted id answers 404, for every body, an empty
        one included). Two refusals that depend on the database are also checked
        first: a disable or demotion that would leave no active administrator
        answers 400, and an email address another account holds answers 409
        email_taken. A refused request changes nothing: disabled true with an
        invalid or taken email leaves the account enabled, and reset_mfa with a
        refused demotion leaves the factors in place. The writes themselves are
        still separate steps, so a request that loses a race with another
        administrator, or a failure of the database partway through, can leave the
        earlier ones applied. The last
        active administrator cannot be disabled or demoted. The
        response is the same detail view GET returns, passkey_count included.
      tags: ['Admin: Users']
      x-ghd-handler: handleUpdateUser
      security:
        - sessionCookie: []
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: New display name. Blank is refused. Omit to keep the current one.
                email:
                  type: string
                  description: New address, trimmed and lowercased. Refused when empty or malformed. Omit to keep the current one.
                role:
                  $ref: '#/components/schemas/Role'
                disabled:
                  type: boolean
                  description: true disables the account and ends its sessions. false re-enables it. Omit to leave it as it is.
                reset_mfa:
                  type: boolean
                  description: true clears the TOTP secret and every passkey, and ends the account's sessions. Absent means false.
      responses:
        '200':
          description: The account after the changes, in the detail shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '400':
          description: >-
            Refused by the handler or the user service, as application/json. bad_request
            with message "invalid JSON" or "invalid user ID". bad_request with a message
            beginning "invalid input:" for an invalid email, a blank display name, an
            invalid role, or a change that would leave no active administrator (for
            example disabling or demoting the last one).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            The authentication middleware refuses with text/plain: forbidden (role),
            mfa_required (second factor not passed), insufficient_scope (an API key without the
            route's scope, which is checked first) or session_required (an API key).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            not_found, when no account has this id or the account is soft-deleted. A
            body that fails validation answers 400 first, to a session and to an API key
            alike.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            email_taken, when the new address belongs to another account, deleted accounts
            included. service_account, when the account is a service account and the
            change would give it a way to sign in: reset_mfa, or a role of admin. A
            service account can be renamed, set to staff or user, given groups, and
            disabled. Renaming it (display_name) also renames its OAuth client, in
            the same statement. It cannot be deleted here (DELETE answers 409).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteUser
      summary: Delete a user.
      description: >-
        Administrators only, in a signed-in session (second factor required). Keys can't write users: an API key is refused with 403 session_required (an OAuth client, which is a staff identity, with 403 forbidden), whatever the body. A key may read.
        Soft-deletes the account. It is hidden from lists, its sign-in is refused, its
        sessions end, and its open tickets return to the unassigned queue. A failure to
        return the tickets is logged and does not change the answer. The row is kept,
        so the email address stays taken. The last active administrator cannot be
        deleted, and that answers 400.
      tags: ['Admin: Users']
      x-ghd-handler: handleDeleteUser
      security:
        - sessionCookie: []
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request. "invalid user ID" for a path id that is not a UUID. An
            invalid input message beginning "invalid input:" when the account is the
            last active administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            The authentication middleware refuses with text/plain: forbidden (role),
            mfa_required (second factor not passed), insufficient_scope (an API key without the
            route's scope, which is checked first) or session_required (an API key).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            not_found, when no live account has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            service_account, when the account is a service account (the identity
            an OAuth client acts as). It is deleted only by deleting its client
            (DELETE /api/v1/admin/oauth-clients/{id}). The message is exactly
            "This is the service account for OAuth client <name>. Delete the
            client instead." and an interface should show it as written. Nothing
            is changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/users/{id}/password:
    parameters:
      - name: id
        in: path
        required: true
        description: The user's UUID.
        schema:
          type: string
          format: uuid
    post:
      operationId: adminResetPassword
      summary: Set a user's password.
      description: >-
        Administrators only, in a signed-in session (second factor required).
        Keys can't set passwords: an API key is refused with 403 session_required
        (an OAuth client by the role check, 403 forbidden), whatever the account and
        whatever the body. Sets a new local password without asking for the old one,
        and ends all of the account's sessions, since a reset usually answers a
        compromise. The body and the password are checked first (400), then the
        account itself. An unknown or soft-deleted id answers 404; a soft-deleted account's password is not
        set. The reset is recorded in the audit log on a best-effort basis.
        revoke_api_keys, when true, also deletes every API key the account owns,
        after the password is set and the sessions ended, and records
        api_keys_revoked on the account's audit entries with keys_revoked, the
        number removed. It is false when omitted: a routine reset leaves keys alone.
        A person changing their own password (PATCH /me/password) never revokes keys,
        and neither does the server unlock or reset-factors console command.
      tags: ['Admin: Users']
      x-ghd-handler: handleAdminResetPassword
      security:
        - sessionCookie: []
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
                  description: Required. 8 to 72 bytes, counted in bytes rather than characters.
                revoke_api_keys:
                  type: boolean
                  default: false
                  description: Also delete every API key the account owns. Audited with the count.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request. "invalid user ID" for a path id that is not a UUID, "invalid
            JSON" for a body that does not decode, and a message beginning "invalid input:"
            when the password is blank, shorter than 8 bytes or longer than 72 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            The authentication middleware refuses with text/plain: forbidden (role),
            mfa_required (second factor not passed), insufficient_scope (an API key without the
            route's scope, which is checked first) or session_required (an API key).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            not_found, when no account has this id, or the account is soft-deleted.
            Reached only after the password has passed validation, whoever the caller is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            service_account, when the account is a service account (the identity
            an OAuth client acts as). It never has a password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            sessions_not_ended: the password was reset but the account's sessions could not be
            ended (message "The password was reset, but existing sessions were NOT ended.", and
            "... and API keys were NOT revoked." when revoke_api_keys was true). Or
            keys_not_revoked, only when revoke_api_keys was true: the password was
            reset and the sessions ended, but the API keys could not be deleted. The
            message is "The password was reset, but the API keys were NOT revoked.
            Revoke them from Admin → API Keys." Any other 500 is internal_error and
            means the password may not have been set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/webhooks:
    get:
      operationId: listWebhooks
      summary: List webhooks.
      description: >-
        Administrators only (second factor required).
        Returns every webhook subscription, enabled or not, oldest first. A disabled
        hook stays listed so that it can be switched back on. The secret is never
        returned. last_delivery shows the latest delivery attempt only.
      tags: ['Admin: Webhooks']
      x-ghd-handler: handleListWebhooks
      security:
        - sessionCookie: []
        - apiKey: ['webhooks:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every subscription. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createWebhook
      summary: Create a webhook.
      description: >-
        Administrators only (second factor required).
        Creates a subscription that receives a POST for each matching event. url and
        events are required. events must list one or more of the event names in the
        WebhookEvent schema, and "*" subscribes to every ticket event. The checks run
        in this order: the body, then events, then the url, which must use http or
        https, name a host, and resolve to an address that is not internal, then
        payload_format, then filter. A failed delivery is retried: connection errors, DNS, TLS,
        timeouts, 5xx and 429 are tried again, 30 seconds doubling to an hour, 8 attempts
        in all (a Retry-After from the receiver delays the next one, up to an hour), so a
        receiver can see the same event more than once. A refused internal address and any
        other status are never retried. Each result is recorded on the hook
        (last_delivery) and in its history
        (GET /api/v1/admin/webhooks/{id}/deliveries). Every request a receiver gets carries
        X-GHD-Delivery, a UUID that is the same on every retry of one delivery, so it can
        drop a repeat, and X-GHD-Event, the event name (for example ticket.replied). The
        raw body is ids only: Type (the event name), TicketID, ActorID, OccurredAt and,
        where the event has them, a Payload of new_status_id and target_id, and nothing
        else The secret is write-only. When it is set, each delivery
        carries sha256=<hex HMAC-SHA256 of the body> in the X-GHD-Signature header, and the
        same value in X-OHD-Signature for older consumers. An empty secret means deliveries
        are not signed. enabled defaults to true.
      tags: ['Admin: Webhooks']
      x-ghd-handler: handleCreateWebhook
      security:
        - sessionCookie: []
        - apiKey: ['webhooks:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  description: The target. Checked on save, and checked again at the moment of each connection.
                events:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/WebhookEvent'
                secret:
                  type: string
                  description: Write-only. Optional. Signs each delivery. Never returned.
                payload_format:
                  $ref: '#/components/schemas/WebhookPayloadFormat'
                enabled:
                  type: boolean
                  description: Defaults to true. A hook can be saved disabled before its receiver is ready.
                filter:
                  description: Optional. Absent, null or {} means every ticket.
                  anyOf:
                    - $ref: '#/components/schemas/WebhookFilter'
                    - type: 'null'
      responses:
        '201':
          description: The created subscription. last_delivery is null, and the secret is not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: >-
            Refused by the handler, as application/json. bad_request ("invalid JSON") for a
            body that does not decode. missing_events when events is empty or absent.
            invalid_event_name when an entry is neither "*" nor a webhook event, with the
            list of valid names in the message. invalid_url when the scheme is not http or
            https, the host is missing, or the host does not resolve or resolves to an
            internal address. invalid_payload_format when payload_format is not one of the
            five. invalid_filter when filter is not an object of those four keys or an id is not
            a UUID. invalid_filter_priority for a priority that is not critical, high, medium or
            low. unknown_filter_category or unknown_filter_group for an id that names no category
            (inactive ones are accepted) or no group. empty_inverted_filter when invert is true
            with no condition, which would match no ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The webhook's UUID.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateWebhook
      summary: Update a webhook.
      description: >-
        Administrators only (second factor required).
        Changes the fields that are sent. Absent fields keep their stored value. url,
        events, payload_format and filter are validated only when sent, so a request that sets
        only enabled is never refused for a field it does not touch. A changed url clears
        last_delivery in the database, because the old result described a different
        target. events, when sent, must be non-empty and valid. secret: absent or null keeps
        the stored secret, but an empty string clears it, and deliveries then stop being
        signed. Clearing the secret this way is a deliberate choice, not an oversight:
        the route is administrator-only (the administrator role and a second factor are
        required, and an OAuth client carries the staff role, so it cannot reach it).
        payload_format: an empty string means raw. The response is the record read back
        after the update, so after a url change last_delivery is null. An unknown id
        answers 404 not_found. A webhook an API key created, or last re-pointed, is tied to that
        key: a url change by a key ties the hook to it, a url change in a session clears the
        link, and any other edit leaves it. While the hook is paused (its key revoked, expired,
        or its owner disabled or deleted) an API key cannot edit it: 403 webhook_paused, until a
        signed-in administrator re-approves it (POST /admin/webhooks/{id}/reapprove).
      tags: ['Admin: Webhooks']
      x-ghd-handler: handleUpdateWebhook
      security:
        - sessionCookie: []
        - apiKey: ['webhooks:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: New target, checked as on create. Omit to keep the current one.
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/WebhookEvent'
                  description: Replaces the subscription. Must be non-empty when sent. Omit to keep the current list.
                secret:
                  type: [string, 'null']
                  description: >-
                    Write-only. Absent or null keeps the stored secret. An empty string
                    clears it, and deliveries then stop being signed. Deliberate, and
                    administrator-only.
                enabled:
                  type: boolean
                  description: Omit to keep the current state.
                payload_format:
                  $ref: '#/components/schemas/WebhookPayloadFormat'
                filter:
                  description: >-
                    Replaces the whole filter. null or {} removes it. Omit to keep the current one.
                    Validated only when sent.
                  anyOf:
                    - $ref: '#/components/schemas/WebhookFilter'
                    - type: 'null'
      responses:
        '200':
          description: >-
            The subscription as stored after the change. When the url changed,
            last_delivery is null: the old result described a different target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: >-
            Refused by the handler, as application/json. bad_request with message "invalid
            ID" for a path id that is not a UUID, or "invalid JSON" for a body that does not
            decode. missing_events, invalid_event_name, invalid_url and
            invalid_payload_format are as for create, and apply only when the field is sent. The
            filter codes, as for create, apply only when filter is sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            not_found, for an id that names no webhook. The id is looked up before the
            body is read, so this holds whatever the body contains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook.
      description: >-
        Administrators only (second factor required).
        Deletes the subscription, its last_delivery and its delivery history. A delivery already in flight
        finishes, but its result is discarded because the record is gone. An unknown id
        answers 404 not_found.
      tags: ['Admin: Webhooks']
      x-ghd-handler: handleDeleteWebhook
      security:
        - sessionCookie: []
        - apiKey: ['webhooks:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request, message "invalid ID", when the path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            not_found, for an id that names no webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/webhooks/{id}/reapprove:
    parameters:
      - name: id
        in: path
        required: true
        description: The webhook's id.
        schema:
          type: string
          format: uuid
    post:
      operationId: reapproveWebhook
      summary: Re-approve a webhook paused because its API key is gone.
      description: >-
        Administrators only, in a signed-in session (second factor required).
        A webhook that an API key created, or last re-pointed the URL of, is
        paused (paused true, with a paused_reason) once that key is revoked or has
        expired, and nothing is sent to it. This clears the link to the key: the
        administrator vouches for the destination, and the hook fires again and no
        longer depends on any key. An API key is refused with 403 session_required
        (an OAuth client with 403 forbidden). Calling it on a hook that is not
        paused simply clears the link. An unknown id answers 404 not_found.
      tags: ['Admin: Webhooks']
      x-ghd-handler: handleReapproveWebhook
      security:
        - sessionCookie: []
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: >-
            bad_request, message "invalid ID", when the path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: not_found, for an id that names no webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List a webhook's recent deliveries.
      description: >-
        Administrators only (second factor required).
        Returns the last 25 deliveries to this hook, newest first. A delivery is one
        event sent to one hook; its retries update the same entry. Each entry has the
        outcome only: no payload, no response body and no error text, because a URL can
        carry a token. Changing the hook's url clears the history.
      tags: ['Admin: Webhooks']
      x-ghd-handler: handleListWebhookDeliveries
      security:
        - sessionCookie: []
        - apiKey: ['webhooks:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      parameters:
        - name: id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Uuid'}
      responses:
        '200':
          description: The deliveries, newest first. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                maxItems: 25
                items:
                  $ref: '#/components/schemas/WebhookDeliveryRecord'
        '400':
          description: bad_request, message "invalid ID", when the path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: not_found, when no webhook has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/webhooks/{id}/deliveries/{delivery}/redeliver:
    post:
      operationId: redeliverWebhook
      summary: Send an earlier delivery's event to the hook again.
      description: >-
        Administrators only (second factor required).
        Queues the stored event of one of the hook's recent deliveries as a new delivery,
        with a new X-GHD-Delivery id, so a receiver that de-duplicates by id does not
        drop it. It is sent by the background worker, not during this request, and
        retried like any delivery. It appears in the history once it has been
        attempted. Only ids are kept from the original, so a raw hook gets the same body as
        the original. A Slack, Teams, Discord or JIRA hook gets its message rebuilt from
        the ticket as it is now: current subject, tracking number and status name, and a
        reply's text only if that reply still exists and is public (never a note's). If
        the ticket is gone, the headline only. The hook's ticket filter is evaluated as it
        is now, against the ticket's current category, priority and assigned group (the
        history keeps none). If the filter does not admit the ticket the request is refused
        with 409 webhook_filter_excludes and nothing is queued. If the hook has a filter and
        the ticket cannot be read (it was deleted) the filter cannot be checked and the request is
        refused with 409 webhook_filter_unverifiable, with nothing queued. A hook with no
        filter is sent whether or not the ticket exists.
      tags: ['Admin: Webhooks']
      x-ghd-handler: handleRedeliverWebhook
      security:
        - sessionCookie: []
        - apiKey: ['webhooks:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      parameters:
        - name: id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Uuid'}
        - name: delivery
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Uuid'}
      responses:
        '202':
          description: Queued. No body.
        '400':
          description: >-
            bad_request, message "invalid ID" or "invalid delivery ID", when a path id is
            not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            not_found, when the webhook does not exist, or has no such delivery in its
            history (a delivery of another hook counts as not found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            webhook_disabled, when the webhook is disabled (enable it first); or
            webhook_not_subscribed, when the webhook no longer lists the delivery's event
            (add it to the webhook's events first); or webhook_filter_excludes, when the
            webhook's ticket filter, as it is now, does not admit the ticket the delivery was
            about (change the filter first); or webhook_filter_unverifiable, when the webhook has a
            ticket filter and the ticket the delivery was about no longer exists, so the filter
            cannot be checked (a webhook with no filter is not refused for this).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: unavailable, when the server was started without a delivery queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/categories:
    get:
      operationId: listCategories
      summary: List all categories, including archived ones.
      description: >-
        Administrators only (second factor required).
        Returns every category as a bare array, active and inactive. This is the
        administrator's view. The catalogue that guests and reporting users see
        (GET /api/v1/categories) serves only the active categories.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleListCategories
      security:
        - sessionCookie: []
        - apiKey: ['categories:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: Every category. An empty catalogue is an empty array.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Category'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCategory
      summary: Create a category.
      description: >-
        Administrators only (second factor required).
        Creates an active category. The name is trimmed and must not be empty.
        An empty name is refused with 400 bad_request.
        sort_order defaults to 0.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleCreateCategory
      security:
        - sessionCookie: []
        - apiKey: ['categories:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Category name. Trimmed before it is checked.
                sort_order:
                  type: integer
                  description: Display order among categories. Defaults to 0.
      responses:
        '201':
          description: The created category, active.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Category UUID. A malformed value is 400 bad_request.
        schema:
          type: string
          format: uuid
    get:
      operationId: getCategory
      summary: Get one category.
      description: >-
        Administrators only (second factor required).
        Looks the category up by its UUID. An id that does not exist is answered
        404 not_found.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleGetCategory
      security:
        - sessionCookie: []
        - apiKey: ['categories:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The category.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            not_found, when no category has this id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    patch:
      operationId: updateCategory
      summary: Rename, reorder or archive a category.
      description: >-
        Administrators only (second factor required).
        Partial update. An absent field is unchanged. Setting active to false
        archives the category: the catalogue that guests and reporting users see
        stops listing it, and tickets that already use it keep it. The name is
        trimmed, as on create, and the response is the saved row. An empty or
        whitespace-only name is refused with 400 bad_request, and an unknown id with
        404 not_found.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleUpdateCategory
      security:
        - sessionCookie: []
        - apiKey: ['categories:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New name, trimmed. Absent leaves the name unchanged. An empty or whitespace-only value is refused with 400.
                sort_order:
                  type: integer
                  description: New display order. Absent leaves it unchanged.
                active:
                  type: boolean
                  description: False archives the category. Absent leaves it unchanged.
      responses:
        '200':
          description: The category as stored after the update.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            not_found, for an unknown category id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: deleteCategory
      summary: Delete a category.
      description: >-
        Administrators only (second factor required).
        Hard delete. The category's types and, through them, its items are removed
        by cascade, and so are the SLA policies scoped to it, the group scopes that
        name it and the canned responses scoped to it. A category that a ticket uses,
        or whose type or item a ticket uses, is refused with 409 category_in_use. So is a category with an SLA policy
        that a ticket's SLA record uses. The message gives the counts.
        Custom-field assignments made to the category, its types or their items are
        removed in the same statement, so a refused delete leaves them in place. An
        unknown id answers 404 not_found.
        To retire a category that is in use, archive
        it with active set to false instead.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleDeleteCategory
      security:
        - sessionCookie: []
        - apiKey: ['categories:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            not_found, for an unknown category id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: >-
            category_in_use. A ticket uses this category, or a type or item under it,
            or an SLA policy scoped to this category is attached to a ticket's SLA record.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/categories/{id}/fields:
    parameters:
      - name: id
        in: path
        required: true
        description: Category UUID, used as the scope of the assignments listed or created here. A malformed value is 400 bad_request.
        schema:
          type: string
          format: uuid
    get:
      operationId: listCategoryFieldAssignments
      summary: List custom-field assignments on a category.
      description: >-
        Administrators only (second factor required).
        Lists the custom-field assignments whose scope is this category, identified
        by {id}. Each entry carries its field definition under field_def, filled
        with id, name, field_type, options and active only. In that embedded copy
        sort_order is 0 and created_at is the zero time. An unknown category answers
        404 not_found.
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleListAssignments
      security:
        - sessionCookie: []
        - apiKey: ['categories:read']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      responses:
        '200':
          description: The assignments on this category. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FieldAssignment'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createCategoryFieldAssignment
      summary: Assign a custom field to a category.
      description: >-
        Administrators only (second factor required).
        Assigns the field definition field_def_id to this category, identified by
        {id}, and answers 201 with the new assignment. A category that does not exist
        answers 404 not_found. visible_on_new and required_on_new default to false when omitted.
        The field definition must exist (400 invalid_reference otherwise), and the same
        field cannot be assigned to the same category twice (409 conflict). The messages
        are written for the caller and never carry database text. visible_on_new is
        decoded as an optional boolean, so absent and false are the same, and the
        database column defaults to false to match (migration 000040).
      tags: ['Admin: Catalogue']
      x-ghd-handler: handleCreateAssignment
      security:
        - sessionCookie: []
        - apiKey: ['categories:write']
      x-ghd-roles: [admin]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field_def_id]
              properties:
                field_def_id:
                  $ref: '#/components/schemas/Uuid'
                sort_order:
                  type: integer
                  description: Display order within this category. Defaults to 0.
                visible_on_new:
                  type: boolean
                  description: Whether the field appears on the new-ticket form. Defaults to false when omitted.
                required_on_new:
                  type: boolean
                  description: Whether the field must be filled in on the new-ticket form. Defaults to false when omitted.
      responses:
        '201':
          description: The created assignment. It has no field_def.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldAssignment'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: "conflict: this field is already assigned to this category."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/categories/{id}/fields/{assignmentId}:
    parameters:
      - name: id
        in: path
        required: true
        description: Category UUID. Must exist; otherwise 404 not_found.
        schema:
          type: string
      - name: assignmentId
        in: path
        required: true
        description: Field assignment UUID. A malformed value is 400 bad_request. It must be attached to the scope the path ends at; otherwise 404 not_found.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCategoryFieldAssignment
