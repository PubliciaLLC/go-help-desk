          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reply'
        '400':
          description: "`bad_request`: invalid ticket ID (the path id is not a UUID)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
    post:
      operationId: addReply
      summary: Post a reply to a ticket
      description: |
        Adds a reply and answers 201 with the Reply. body is required after
        trimming. notify_customer defaults to true, and is forced to false for an
        internal note. Internal notes are for staff and administrators only.
        When notify_customer is true and the reporter has an address, the reporter
        is sent the update. A failure to look up that address does not fail the
        reply.
        A reporting user's reply to a Resolved ticket inside the reopen window
        reopens the ticket to the reopen target status. A reporting user cannot
        reply to a Closed ticket (409 ticket_closed), or to a Resolved ticket
        after the reopen window (409 reopen_window_closed). Staff and
        administrators can still post to a Closed ticket.
        The path id must be a UUID. An OAuth client acting without a person behind
        it is refused with 403 user_identity_required.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleAddReply
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
