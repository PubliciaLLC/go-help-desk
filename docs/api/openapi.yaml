        Administrators only. Moves the ticket to Closed and answers 200 with the
        Ticket. Closing a ticket that is already Closed succeeds and writes
        nothing. A closed ticket is read-only to its reporter, and a reporter's
        follow-up is the way forward (see the follow-up route).
        Anyone who is not an administrator is refused with 403 forbidden, "only
        admins can close tickets", on a ticket they can see. An OAuth client acts as its service user
        (staff or user, never admin), so it is refused with that 403 forbidden. The path id is a UUID or a tracking number.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. The text/plain 403s from the auth
        middleware are decided before the ticket is looked up and say nothing
        about it.
      tags: ['Tickets']
      x-ghd-handler: handleCloseTicket
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: The closed ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `forbidden`, "only admins can close tickets", for
            anyone who is not an administrator, an OAuth client included;
            `user_identity_required` for a credential with no user behind it.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
