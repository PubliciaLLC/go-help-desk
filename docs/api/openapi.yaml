        tag has that name it is created, and then attached to the ticket. Adding a
        tag that is already on the ticket succeeds and changes nothing. Answers
        201 with the Tag.
        A tag that has been deactivated cannot be added by anyone, administrators
        included. The answer is 403 tag_deleted; an administrator must restore
        the tag first. An empty name
        is refused by the domain but answers 500 add_failed in this route, not
        400. The path id is a UUID or a tracking number.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. Of the text/plain 403s from the auth
        middleware, mfa_required and insufficient_scope are decided before the
