        probed. A 403 from the handler (application/json) means the ticket is
        visible but the action is refused. Of the text/plain 403s from the auth
        middleware, mfa_required and insufficient_scope are decided before the
        ticket is looked up and say nothing about it; the role refusal
        (forbidden) is decided after it.
      tags: ['Tickets']
      x-ghd-handler: handleListTicketTags
