        '401':
          description: >-
            Nobody is signed in and guest submission is off (unauthorized). Sent as
            application/json, unlike the text/plain 401 of other operations.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/categories/{id}/types:
