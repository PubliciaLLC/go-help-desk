          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `forbidden`, "only admins can close tickets", for
            anyone who is not an administrator; `user_identity_required` for an
            OAuth client.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
  /api/v1/tickets/{id}/custom-fields:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    get:
      operationId: listTicketCustomFields
      summary: List the custom field values on a ticket
      description: |
        The custom field values stored on the ticket, as a bare array (empty when
        none are set). The id must be a UUID.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleListTicketCustomFields
      security:
        - sessionCookie: []
        - apiKey: ['tickets:read']
        - oauthClient: ['tickets:read']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '200':
          description: The stored values, as a bare array (never null).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketsFieldValue'
        '400':
          description: "`bad_request`: invalid ticket id (the path id is not a UUID)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
    put:
      operationId: putTicketCustomFields
      summary: Set custom field values on a ticket
      description: |
        The body maps custom field definition ids to values. Each key must be a
        field this ticket has through its classification, and a select field's
        value must be one of its options. An empty string clears that value.
        Answers 204 with no body. The id must be a UUID.
        The entries are written one at a time, in no particular order, with no
        transaction around them. If one entry is refused, the entries written
        before it stay saved, and the response is 400.
        A reporting user cannot change a Closed ticket (409 ticket_closed). Staff
        and administrators can.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handlePutTicketCustomFields
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Custom field definition id to value.
              additionalProperties:
                type: string
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: |
            `bad_request`: invalid JSON (for example a value that is not a
            string); invalid field_def_id (a key that is not a UUID); a field that
            is not on this ticket; or a value the field refuses (not one of a
            select field's options, or the field is deactivated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: "`ticket_closed`: a reporting user tried to change a field on a Closed ticket."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tickets/{id}/follow-up:
    parameters:
      - $ref: '#/components/parameters/TicketRef'
    post:
      operationId: createFollowUp
      summary: Open a follow-up ticket from a closed ticket
      description: |
        Creates a new ticket that starts open and is linked to the closed one. The
        closed ticket is left as it is. It is created through the same path as any
        new ticket, including the tracking number, the audit entry and routing.
        Answers 201 with the new Ticket.
        Who may follow up, and how often:
        - Staff and administrators may follow up any closed ticket they can see,
          as many times as they like.
        - A reporting user may follow up their own closed ticket once. A second
          attempt is 409 follow_up_exists. The follow-up keeps the original
          category and type, which must both still be active (400 otherwise).
        The ticket must be Closed (409 ticket_not_closed otherwise). The path id
        must be a UUID. An OAuth client acting without a person behind it is
        refused with 403 user_identity_required.
        A ticket the caller may not see answers 404 not_found, the same answer as a
        ticket that does not exist, and never 403, so tracking numbers cannot be
        probed (#174). A 403 on this route means the ticket is visible but the
        action is refused.
      tags: ['Tickets']
      x-ghd-handler: handleCreateFollowUp
      security:
        - sessionCookie: []
        - apiKey: ['tickets:write']
        - oauthClient: ['tickets:write']
      x-ghd-roles: [admin, staff, user]
      x-ghd-mfa: true
      responses:
        '201':
          description: The new follow-up ticket, as the bare Ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: |
            `bad_request`: invalid ticket ID (the path id is not a UUID), or, for a
            reporting user, the original's category or type is no longer active
            (category_id is not an active category; type_id is not an active type).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused by the middleware (text/plain). Or, from the handler
            (application/json): `user_identity_required` for an OAuth client; or
            `forbidden` for a reporting user who did not report the ticket.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            `ticket_not_closed`: the ticket is not Closed. Or `follow_up_exists`: a
            reporting user already has a follow-up of this ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
