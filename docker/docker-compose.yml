networks:
  backend:
    driver: bridge
  antivirus:
    driver: bridge  # separate from backend so clamav cannot reach the database

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    # Loopback only. Published as "5432:5432" this binds every interface, and
    # a published Docker port is handled before the host firewall sees it — so
    # on a machine with a public address, ufw or firewalld closed and this
    # database still answered the internet, with the password three lines
    # above. The port is here so the suite can run from the host; that works
    # over loopback, and nothing else needs it.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  clamav:
    # Opt-in — see #297. `app` only `depends_on` `db`, and an unset
    # CLAMAV_ADDR below means scanning is simply off, a supported
    # configuration — so the default `docker compose up` brings up the app
    # and nothing else, and skips a ~300 MB signature download it may never
    # need. To turn scanning on, see docker/.env.example.
    profiles:
      - antivirus
    image: clamav/clamav:stable
    # clamav/clamav publishes linux/amd64 only. Pinned rather than left to
    # the host, so enabling this on an arm64 machine (Apple Silicon) runs it
    # under emulation instead of failing the image pull outright — a signature
    # scan of an upload is not a hot path, so the emulation cost is one
    # this profile can afford.
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - ./data/clamav:/var/lib/clamav  # persist signature database across restarts
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s  # freshclam downloads the full signature DB on first run (~300 MB)
    networks:
      - antivirus

  attachments-init:
    # Makes ./data/attachments writable by the app. Nothing else.
    #
    # A bind mount does not take the image's ownership the way a named volume
    # does. On a fresh Linux host Docker creates the missing host directory as
    # root:root, and `app` below runs as uid 100 / gid 101 (`ghd`, pinned in
    # backend/Dockerfile), so it could not write there: uploads refused, with
    # the banner "Attachment uploads are disabled ... permission denied". Docker
    # Desktop on macOS hides this, and an install upgraded from 1.2 keeps the
    # owner it already had, which is why only a fresh Linux install met it.
    #
    # A named volume would not have this problem, and would strand the
    # attachments of every existing install, so the directory stays a bind
    # mount and is fixed here instead.
    #
    # The same image as `app`, so nothing extra is pulled and a build with
    # docker-compose.build.yml gets this too. Run as root with the entrypoint
    # replaced, since the image's own is the server.
    #
    # 100:101 must match backend/Dockerfile. scripts/check-compose-attachments.sh
    # fails if it does not, and runs this command against root-owned,
    # missing and already-owned directories.
    #
    # The recursive part runs only when the top directory is not already owned
    # by 100:101, so a restart on a large store does not walk every file again.
    # Children are changed before the directory itself, so a run that is
    # interrupted is not mistaken for a finished one on the next start. `-h`
    # changes a symlink itself, never what it points at.
    image: ghcr.io/publiciallc/go-help-desk:${GHD_VERSION:-1.3.0}
    user: root
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /data/attachments
        if [ "$$(stat -c %u:%g /data/attachments)" != 100:101 ]; then
          find /data/attachments -depth -exec chown -h 100:101 {} +
        fi
    restart: "no"
    network_mode: none  # needs no network, and has none
    cap_drop:
      - ALL
    # CHOWN to change owners. DAC_READ_SEARCH to walk a directory somebody made
    # with `mkdir -m 700` as themselves: root without it cannot enter that, and
    # `find` fails on the first entry. Neither gives write access to anything;
    # a directory root owns, which is what Docker creates, needs neither.
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    volumes:
      - ./data/attachments:/data/attachments

  app:
    # Pulled, not built. Postgres and ClamAV above arrive as finished images
    # and nobody compiles those to try this; there is no reason our own should
    # be different. Building here is what put a Go toolchain, Node and the
    # buildx plugin in the path of anyone evaluating the product, and it is
    # why the quick start failed outright on Apple Silicon (#297).
    #
    # One name serves both architectures — the client picks — so there is
    # nothing here about platforms.
    #
    # Building from source is still fully supported and is not a legacy path:
    #
    #     docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    #
    # That needs Docker's buildx plugin. See docker-compose.build.yml.
    image: ghcr.io/publiciallc/go-help-desk:${GHD_VERSION:-1.3.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      attachments-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://helpdesk:helpdesk@db:5432/helpdesk?sslmode=disable
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # ${VAR:?msg} makes compose refuse to start and print msg. Plain
      # ${VAR} substitutes an empty string with only a warning, so a fresh
      # clone with no .env started the app, failed the 32-character minimum,
      # and — because this service restarts unless stopped — crash-looped with
      # the reason buried in container logs. Fail before anything starts.
      #
      # Deliberately NOT given a default. A working out-of-the-box secret is a
      # shared secret, and every deployment that forgot to change it would be
      # forgeable by anyone who read this file.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in docker/.env (min 32 chars) — copy docker/.env.example}
      # JWT_SECRET is optional: if unset or under 32 bytes, a key is generated
      # once and stored in the database. A long env value still wins.
      JWT_SECRET: ${JWT_SECRET:-}
      HTTP_PORT: 8080
      # ClamAV — opt-in (see #297 and the `clamav` service's own `profiles`
      # above): unset by default, since the `clamav` service does not start
      # unless that profile is enabled, and pointing at it regardless would
      # mean uploads refused with 503 forever rather than the brief window
      # this was written for. Set CLAMAV_ADDR=tcp://clamav:3310 in .env, along
      # with COMPOSE_PROFILES=antivirus, to turn scanning on.
      #
      # NOT non-fatal once set: with an address configured, the scan policy
      # defaults to "required", so uploads are refused with 503 while the
      # scanner is unreachable rather than being accepted unscanned. That
      # covers the first few minutes here, where clamav is still downloading
      # its signature database while the app is already serving. Everything
      # other than attachment upload works throughout.
      # Rate limiting (optional — defaults to 10 per minute and 1 second delay)
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      AUTH_THROTTLE_DELAY: ${AUTH_THROTTLE_DELAY:-1s}
      CLAMAV_ADDR: ${CLAMAV_ADDR:-}
      # Optional — set in .env to enable email notifications
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Optional — set in .env to enable features
      SLA_ENABLED: ${SLA_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data/attachments:/data/attachments
    networks:
      - backend
      - antivirus
