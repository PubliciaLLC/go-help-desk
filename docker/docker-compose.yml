networks:
  backend:
    driver: bridge
  antivirus:
    driver: bridge  # separate from backend so clamav cannot reach the database

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    # Loopback only. Published as "5432:5432" this binds every interface, and
    # a published Docker port is handled before the host firewall sees it — so
    # on a machine with a public address, ufw or firewalld closed and this
    # database still answered the internet, with the password three lines
    # above. The port is here so the suite can run from the host; that works
    # over loopback, and nothing else needs it.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  clamav:
    # Opt-in — see #297. `app` only `depends_on` `db`, and an unset
    # CLAMAV_ADDR below means scanning is simply off, a supported
    # configuration — so the default `docker compose up` brings up the app
    # and nothing else, and skips a ~300 MB signature download it may never
    # need. To turn scanning on, see docker/.env.example.
    profiles:
      - antivirus
    image: clamav/clamav:stable
    # clamav/clamav publishes linux/amd64 only. Pinned rather than left to
    # the host, so enabling this on an arm64 machine (Apple Silicon) runs it
    # under emulation instead of failing the image pull outright — a signature
    # scan of a 25 MB upload is not a hot path, so the emulation cost is one
    # this profile can afford.
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - ./data/clamav:/var/lib/clamav  # persist signature database across restarts
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s  # freshclam downloads the full signature DB on first run (~300 MB)
    networks:
      - antivirus

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://helpdesk:helpdesk@db:5432/helpdesk?sslmode=disable
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # ${VAR:?msg} makes compose refuse to start and print msg. Plain
      # ${VAR} substitutes an empty string with only a warning, so a fresh
      # clone with no .env started the app, failed the 32-character minimum,
      # and — because this service restarts unless stopped — crash-looped with
      # the reason buried in container logs. Fail before anything starts.
      #
      # Deliberately NOT given a default. A working out-of-the-box secret is a
      # shared secret, and every deployment that forgot to change it would be
      # forgeable by anyone who read this file.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in docker/.env (min 32 chars) — copy docker/.env.example}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in docker/.env — copy docker/.env.example}
      HTTP_PORT: 8080
      # ClamAV — opt-in (see #297 and the `clamav` service's own `profiles`
      # above): unset by default, since the `clamav` service does not start
      # unless that profile is enabled, and pointing at it regardless would
      # mean uploads refused with 503 forever rather than the brief window
      # this was written for. Set CLAMAV_ADDR=tcp://clamav:3310 in .env, along
      # with COMPOSE_PROFILES=antivirus, to turn scanning on.
      #
      # NOT non-fatal once set: with an address configured, the scan policy
      # defaults to "required", so uploads are refused with 503 while the
      # scanner is unreachable rather than being accepted unscanned. That
      # covers the first few minutes here, where clamav is still downloading
      # its signature database while the app is already serving. Everything
      # other than attachment upload works throughout.
      CLAMAV_ADDR: ${CLAMAV_ADDR:-}
      # Optional — set in .env to enable email notifications
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Optional — set in .env to enable features
      SLA_ENABLED: ${SLA_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data/attachments:/data/attachments
    networks:
      - backend
      - antivirus
