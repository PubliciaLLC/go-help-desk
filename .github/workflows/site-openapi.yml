name: site-openapi

# Keeps the website's copy of the API description current. docs/api/openapi.yaml
# here is the source; the site branch serves a byte-identical copy at
# docs/openapi/openapi.yaml, pinned by docs/openapi/SOURCE (first line: the app
# commit). Before this workflow, that copy was refreshed by hand at release time.
#
# Which site branch, fed from which code branch, is configuration, not code:
#   vars.SITE_OPENAPI_SOURCE  code branch that feeds the site, e.g. v1.3.0-beta
#   vars.SITE_OPENAPI_BRANCH  site branch to write,           e.g. v1.3.0-beta-web
# Unset either and nothing is written: the `gate` job says so in the run summary
# and the rest is skipped. Pushes to any other branch are ignored, so the 1.2
# line on main cannot overwrite the 1.3 site.
#
# Release tags follow a rule, not ancestry. This repository merges main forward
# into the release branch, so every older release tag is an ancestor of it and
# "is the tag on the branch" cannot tell a v1.2.x hotfix from a 1.3 release. A tag
# counts only when it is v<line>.<n> with no suffix, where <line> is the
# major.minor of SITE_OPENAPI_SOURCE (v1.3.0-beta -> 1.3), and its commit is on
# that branch. It then pins only if the commit is a fast-forward of the current
# pin, so a late or re-run tag cannot move the site back.
#
#   event                                     gate     publish
#   push to SITE_OPENAPI_SOURCE               run      pins the pushed commit (skipped if the pin is newer)
#   push to any other branch                  skip     -
#   tag v<line>.<n>, commit on the source     run      pins the tag's commit if it descends from the pin
#   tag of another line (v1.2.1, v2.0.0)      skip     -
#   pre-release tag (v1.3.0-rc.1)             skip     -
#   either variable unset                     skip     -
#
# It commits straight to the site branch with GITHUB_TOKEN. That branch is a
# staging branch (production is promoted by a human PR), and a commit made with
# GITHUB_TOKEN starts no workflow, so the site's own openapi-sync check does not
# run on it. This workflow runs that same check before it pushes instead.
#
# Pushes run it from any branch that has this file. workflow_dispatch works only
# once the file is on the default branch (main). Tag pushes ignore the `paths`
# filter, so every release tag runs it.
#
# Untrusted input: none. It runs on push to branches and tags maintainers
# control, never on pull_request, and passes every ${{ }} value to the shell
# through env rather than into the script text.
on:
  push:
    branches: [main, 'v[0-9]*-beta']
    # No pre-release tags: the gate would only skip them, and a skipped run
    # still costs a runner.
    tags: ['v[0-9]*', '!v*-*']
    paths:
      - docs/api/openapi.yaml
      - .github/workflows/site-openapi.yml
  workflow_dispatch:

# There is deliberately NO concurrency group, here or on the publish job. GitHub
# keeps one running and one pending run per group and cancels an older pending
# one, and runs queue in the order their verify jobs finish, not in commit order:
# a newer pending run, or a tag run on an older commit, could cancel the run that
# carries a spec change, and that change would not reach the site until the next
# spec push. Racing publishes are safe without a group: each resets to the site
# branch, retries a rejected push from a fresh reset, skips when the site is
# already pinned to a newer commit, and a tag only fast-forwards the pin, so
# overlapping runs converge on the newest commit and nothing is cancelled.

permissions:
  contents: read

jobs:
  # Decides whether this push is one the site follows, and says why when it is
  # not. A skipped job says nothing, so "variables unset" would otherwise be
  # indistinguishable from "the workflow is broken".
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    env:
      SOURCE: ${{ vars.SITE_OPENAPI_SOURCE }}
      SITE_BRANCH: ${{ vars.SITE_OPENAPI_BRANCH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tag check needs origin/<source branch>
      - name: Is this a push the site follows?
        id: decide
        run: |
          set -eu
          skip() {
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::site-openapi: nothing to do. $1"
            echo "site-openapi did nothing: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ -n "$SOURCE" ] && [ -n "$SITE_BRANCH" ] ||
            skip "repository variables SITE_OPENAPI_SOURCE and SITE_OPENAPI_BRANCH are not both set."
          case "$GITHUB_REF_TYPE" in
            branch)
              [ "$GITHUB_REF_NAME" = "$SOURCE" ] ||
                skip "$GITHUB_REF_NAME is not the source branch ($SOURCE)."
              ;;
            tag)
              case "$GITHUB_REF_NAME" in
                *-*) skip "$GITHUB_REF_NAME is a pre-release tag; only release tags re-pin the site." ;;
              esac
              # The release line is the major.minor of the source branch:
              # v1.3.0-beta -> 1.3. Only v1.3.<n> is this site's release.
              line=$(printf '%s' "$SOURCE" | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\)\..*/\1/p')
              [ -n "$line" ] ||
                skip "cannot read a release line (v<major>.<minor>.*) from SITE_OPENAPI_SOURCE=$SOURCE, so no tag can pin the site."
              prefix="v$line."
              case "$GITHUB_REF_NAME" in
                "$prefix"*) ;;
                *) skip "$GITHUB_REF_NAME is not a $prefix<n> release; the site follows the $line line." ;;
              esac
              printf '%s' "${GITHUB_REF_NAME#"$prefix"}" | grep -Eq '^[0-9]+$' ||
                skip "$GITHUB_REF_NAME is not a $prefix<n> release tag."
              # Ancestry alone cannot separate lines, because main is merged
              # forward into the source branch, but it still keeps a tag that was
              # cut somewhere else out.
              git merge-base --is-ancestor "$GITHUB_SHA" "origin/$SOURCE" 2>/dev/null ||
                skip "$GITHUB_REF_NAME is not on $SOURCE; cut release tags on the release branch."
              ;;
            *)
              skip "unsupported ref type $GITHUB_REF_TYPE."
              ;;
          esac
          echo "publish=true" >> "$GITHUB_OUTPUT"

  # Never publish a spec that fails its own tests. No database and no frontend
  # build are needed: internal/ui/dist/index.html is tracked, so the server
  # package builds from a plain checkout.
  verify:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Spec tests
        working-directory: backend
        run: go test -count=1 -run 'TestOpenAPISpec|TestDiffRoutes|TestCallerSentence' ./internal/server

  publish:
    needs: [gate, verify]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SITE_BRANCH: ${{ vars.SITE_OPENAPI_BRANCH }}
    steps:
      # Credentials stay persisted: the push below needs them. What runs with
      # them is this repository's own site-branch script, not the source commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.SITE_OPENAPI_BRANCH }}
          fetch-depth: 0 # check needs the pinned commit and the release refs
      - name: Pull the spec into the site branch and push
        run: |
          set -eu
          [ -x scripts/openapi-sync.sh ] || {
            echo "::error::$SITE_BRANCH has no scripts/openapi-sync.sh; is SITE_OPENAPI_BRANCH a site branch?"
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # A fresh reset on every attempt, so a lost race is never a rebase
            # conflict. The bot writes only the two files in docs/openapi/.
            git fetch -q origin "+refs/heads/$SITE_BRANCH:refs/remotes/origin/$SITE_BRANCH"
            git reset -q --hard "origin/$SITE_BRANCH"
            cur=$(sed -n 1p docs/openapi/SOURCE 2>/dev/null || true)
            # Re-running an old run must not roll the site back to an older spec.
            if [ "$cur" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$cur" 2>/dev/null; then
              echo "::notice::$SITE_BRANCH is already pinned to $cur, which is newer than $GITHUB_SHA; nothing to do"
              exit 0
            fi
            # A tag pins only a fast-forward of the current pin. Otherwise a tag
            # cut on a commit that predates the pin, or a re-run of an old tag run,
            # would move the site back to an older spec.
            if [ "$GITHUB_REF_TYPE" = tag ] && git cat-file -e "$cur^{commit}" 2>/dev/null &&
              ! git merge-base --is-ancestor "$cur" "$GITHUB_SHA"; then
              echo "::notice::$GITHUB_REF_NAME ($GITHUB_SHA) does not descend from the current pin $cur; nothing to do"
              exit 0
            fi
            scripts/openapi-sync.sh pull "$GITHUB_SHA" "$GITHUB_REF_NAME"
            scripts/openapi-sync.sh check
            if git diff --quiet -- docs/openapi; then
              echo "::notice::$SITE_BRANCH already serves the spec at $GITHUB_SHA"
              exit 0
            fi
            # A branch push that left the spec alone (the workflow file changed, or
            # main was merged in) is not worth a commit that only moves the pin.
            # A release tag is: it records that the site is pinned to the release.
            if [ "$GITHUB_REF_TYPE" != tag ] && git diff --quiet -- docs/openapi/openapi.yaml; then
              echo "::notice::the spec is unchanged since the pin at $cur; leaving $SITE_BRANCH as it is"
              git checkout -q -- docs/openapi
              exit 0
            fi
            git add docs/openapi
            git commit -q \
              -m "API reference: spec from $GITHUB_REF_NAME ${GITHUB_SHA:0:8}" \
              -m "Written by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if git push -q origin "HEAD:refs/heads/$SITE_BRANCH"; then
              {
                echo "Pinned \`$SITE_BRANCH\` to \`$GITHUB_SHA\` ($GITHUB_REF_NAME):"
                echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$(git rev-parse HEAD)"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push to $SITE_BRANCH failed (attempt $attempt), retrying. A lost race is the usual cause; if it repeats, look at git's message above for a permission or branch-rule rejection."
            sleep $((attempt * 5))
          done
          echo "::error::could not push to $SITE_BRANCH after 3 attempts"
          exit 1
