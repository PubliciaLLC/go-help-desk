name: CI

# Runs on pushes to the long-lived branches and on every pull request.
#
# Note the deliberate use of `pull_request` rather than `pull_request_target`:
# PRs from forks therefore run with a read-only GITHUB_TOKEN and no access to
# secrets. That is the point — this workflow executes contributor code, so it
# must not hold credentials a malicious PR could use.
#
# Job order mirrors the Dockerfile: the frontend is built first, and its dist/
# output is embedded into the Go binary by internal/ui (`//go:embed dist`).
# Without that directory present, `go build ./...` fails outright — so the
# backend job consumes the frontend's build artifact rather than guessing.

on:
  push:
    branches: [main, development]
  pull_request:

# Cancel superseded runs on the same ref, so a fast follow-up push doesn't
# queue behind the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (runs tsc -b, so this is also the type-check)
        run: npm run build

      - name: Upload dist for the backend embed
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  backend:
    name: Backend (build, vet, test)
    runs-on: ubuntu-latest
    needs: frontend

    # No `services:` block. The test database comes from
    # docker/docker-compose.test.yml, the same file developers run locally, so
    # the two cannot drift and a test run can never reach the dev database.
    # A service container could not express that file anyway: GitHub Actions
    # provides no way to override a service's command, and its settings are
    # command flags.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth for the toolchain version.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Fetch frontend dist for //go:embed
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/internal/ui/dist

      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: Verify go.mod and go.sum are tidy
        working-directory: backend
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' in backend/ and commit the result."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Unit tests
        working-directory: backend
        # Integration tests skip themselves when TEST_DATABASE_URL is unset, so
        # this step exercises pure logic only — and fails fast if that breaks.
        # Deliberately without -race: the integration step below runs the same
        # packages with it. The race detector costs roughly 8x on this suite
        # (16.9s vs 142.4s for internal/server), so running it twice doubled the
        # job for no extra coverage. What this step uniquely proves is that the
        # suite passes with no database configured.
        run: go test ./...

      - name: Start test database
        run: docker compose -f docker/docker-compose.test.yml up -d --wait

      - name: Integration tests (Postgres)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://helpdesk:helpdesk@127.0.0.1:5433/helpdesk_test?sslmode=disable
        run: go test -race ./...

      - name: Coverage report
        working-directory: backend
        # Advisory only: surfaces per-package coverage so a reviewer can see
        # whether a change moved the needle. Never gates the build.
        env:
          TEST_DATABASE_URL: postgres://helpdesk:helpdesk@127.0.0.1:5433/helpdesk_test?sslmode=disable
        run: |
          if go test -coverprofile=coverage.out ./... >/dev/null 2>&1 && [ -f coverage.out ]; then
            {
              echo "### Backend coverage (total and least-covered packages)"
              echo ""
              echo '```'
              go tool cover -func=coverage.out | tail -1
              echo ""
              go tool cover -func=coverage.out | sort -t$'\t' -k3 -n | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage profile unavailable; skipping report." >> "$GITHUB_STEP_SUMMARY"
          fi

  formatting:
    name: gofmt (changed files)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base commit to diff against.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Check formatting of changed Go files
        # Scoped to files this change touches. A repo-wide gate would fail on
        # pre-existing unformatted files unrelated to the PR; this keeps new
        # code clean without demanding a tree-wide cleanup first.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "Cannot resolve base ref '$base'; skipping."
            exit 0
          fi

          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.go' \
            | grep -v '^backend/internal/dbgen/' || true)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No Go files changed."
            exit 0
          fi

          unformatted="$(gofmt -l "${files[@]}" 2>/dev/null || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::These changed files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w $unformatted"
            exit 1
          fi
          echo "All ${#files[@]} changed Go file(s) are gofmt-clean."

  image:
    name: Docker image (build + run)
    runs-on: ubuntu-latest

    # Builds the runtime image the way docker-compose does: context at the repo
    # root, Dockerfile at backend/Dockerfile. Nothing else in CI exercises the
    # Dockerfile, which is how PR #55 shipped a `COPY certs/*` for a directory
    # that does not exist in the repo — every `docker build` failed from that
    # merge until it was reverted, and no check noticed.
    #
    # Build only; the image is not pushed anywhere.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          # load so the smoke test below can actually run the thing. Without
          # it buildx leaves the image in its own cache and `docker run` fails.
          load: true
          tags: ghd:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building an image proves it compiles, not that it starts. Issue #43 was
      # a build failure; the class of problem it belongs to — a container that
      # builds and then dies, or starts and serves nothing — was invisible to
      # CI until here.
      - name: Start Postgres for the smoke test
        run: |
          set -euo pipefail
          docker network create ghd-ci
          docker run -d --name ghd-ci-db --network ghd-ci \
            -e POSTGRES_DB=helpdesk -e POSTGRES_USER=helpdesk -e POSTGRES_PASSWORD=helpdesk \
            postgres:17-alpine

          # pg_isready alone is not enough. The postgres image runs a temporary
          # server during initdb, and pg_isready answers for THAT one — so a
          # single success can be followed by the real server restarting and
          # refusing connections. The app then dies on "failed to open
          # database" and the job fails for a reason that has nothing to do
          # with the change under test.
          #
          # Requiring a real query to succeed three times in a row, one second
          # apart, outlasts the restart.
          ok=0
          for i in $(seq 1 90); do
            if docker exec ghd-ci-db psql -U helpdesk -d helpdesk -c 'SELECT 1' >/dev/null 2>&1; then
              ok=$((ok + 1))
              if [ "$ok" -ge 3 ]; then
                echo "postgres ready after ${i}s"
                break
              fi
            else
              ok=0   # a refusal resets the streak; the restart is what we are waiting out
            fi
            sleep 1
          done
          if [ "$ok" -lt 3 ]; then
            echo "::error::postgres never became reliably ready"
            docker logs ghd-ci-db
            exit 1
          fi

      - name: Run the image and smoke-test it
        run: |
          set -euo pipefail

          docker run -d --name ghd-ci-app --network ghd-ci -p 8088:8080 \
            -e DATABASE_URL="postgres://helpdesk:helpdesk@ghd-ci-db:5432/helpdesk?sslmode=disable" \
            -e BASE_URL="http://localhost:8088" \
            -e SESSION_SECRET="ci-smoke-test-session-secret-32-chars" \
            -e JWT_SECRET="ci-smoke-test-jwt-secret-32-characters" \
            ghd:ci

          # Wait for it to serve, and fail with logs rather than a bare timeout.
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:8088/health >/dev/null 2>&1; then
              ready=1; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' ghd-ci-app)" != "true" ]; then
              echo "::error::the container exited before serving"
              docker logs ghd-ci-app
              exit 1
            fi
            sleep 1
          done
          if [ "${ready:-0}" != "1" ]; then
            echo "::error::/health never responded"
            docker logs ghd-ci-app
            exit 1
          fi

          check() { # path, expected status, description
            actual="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:8088$1")"
            if [ "$actual" != "$2" ]; then
              echo "::error::$3: GET $1 returned $actual, expected $2"
              docker logs ghd-ci-app
              exit 1
            fi
            echo "ok  $1 -> $actual  ($3)"
          }

          check /health          200 "health endpoint"
          check /api/v1/site     200 "public site config"
          check /                200 "SPA shell"

          # Regression guard on the fix in #80, asserted against the artifact
          # that actually ships. /mcp/ was mounted outside the auth chain and
          # served every tool to anyone who could reach the port.
          check /mcp/sse         401 "MCP must reject unauthenticated callers"

          # The embedded SPA must be the real build, not the placeholder that
          # exists so //go:embed resolves in a fresh checkout.
          #
          # Fetch to a file first. Piping curl into grep passes when curl
          # FAILS — grep finds nothing in an empty stream and the check reads
          # as success — so a dead server would have looked like a good SPA.
          curl -fsS --max-time 5 http://127.0.0.1:8088/ -o /tmp/spa.html || {
            echo "::error::could not fetch the SPA shell"
            docker logs ghd-ci-app
            exit 1
          }
          if grep -q "Frontend not built" /tmp/spa.html; then
            echo "::error::the image embeds the placeholder, not the built SPA"
            exit 1
          fi
          grep -qi "<div id=\"root\"" /tmp/spa.html || {
            echo "::error::the SPA shell has no mount point; embedded assets look wrong"
            head -40 /tmp/spa.html
            exit 1
          }
          echo "ok  /  serves the built SPA"

      # A misconfigured instance must fail loudly at startup rather than come
      # up half-working. SESSION_SECRET under 32 characters is the likeliest
      # upgrade failure, since the pre-1.1.1 example value was 24.
      - name: Reject a short SESSION_SECRET
        run: |
          set -uo pipefail
          out="$(docker run --rm --network ghd-ci \
            -e DATABASE_URL="postgres://helpdesk:helpdesk@ghd-ci-db:5432/helpdesk?sslmode=disable" \
            -e BASE_URL="http://localhost:8088" \
            -e SESSION_SECRET="too-short" \
            -e JWT_SECRET="ci-smoke-test-jwt-secret-32-characters" \
            ghd:ci 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "SESSION_SECRET must be at least 32 characters" || {
            echo "::error::a short SESSION_SECRET did not produce the documented error"
            exit 1
          }
          echo "$out" | grep -q '"level":"ERROR"' || {
            echo "::error::a fatal startup failure was not logged at ERROR level"
            exit 1
          }

      # Starting is not running. A container can serve one request and then die
      # on a background goroutine, a nil map, a closed pool — so the image is
      # held under load for 30 seconds and exercised rather than left idle.
      #
      # This is the only place anything drives the shipped artifact end to end:
      # real migrations, real auth, real ticket write, against the binary and
      # the embedded SPA that actually ship.
      - name: Exercise the running container for 30 seconds
        run: |
          set -euo pipefail
          B=http://127.0.0.1:8088

          fail() { echo "::error::$1"; docker logs ghd-ci-app; exit 1; }
          status() { curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$B$1"; }

          # ── a real flow, not just liveness ──────────────────────────────────
          # First-run setup is open only until a user exists, so this also
          # proves migrations ran and the schema is usable.
          setup=$(curl -s --max-time 10 -X POST "$B/api/v1/setup" \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.test","display_name":"CI Admin","password":"ci-smoke-password-1"}')
          echo "$setup" | grep -q '"role":"admin"' || fail "first-run setup did not create an admin: $setup"

          # Setup must then be closed.
          [ "$(status /api/v1/setup/status)" = "200" ] || fail "setup status endpoint unavailable"
          curl -s --max-time 5 "$B/api/v1/setup/status" | grep -q '"needed":false' \
            || fail "setup stayed open after an admin existed"

          # Log in and keep the session.
          code=$(curl -s -o /tmp/login.json -w '%{http_code}' --max-time 10 \
            -c /tmp/ci-cookies.txt -X POST "$B/api/v1/auth/local/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.test","password":"ci-smoke-password-1"}')
          [ "$code" = "200" ] || fail "login returned $code: $(cat /tmp/login.json)"

          # Write something. Exercises the transaction path from #86.
          cat=$(curl -s --max-time 10 -b /tmp/ci-cookies.txt -X POST "$B/api/v1/admin/categories" \
            -H 'Content-Type: application/json' -d '{"name":"CI Smoke"}')
          cat_id=$(echo "$cat" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          [ -n "$cat_id" ] || fail "could not create a category: $cat"

          ticket=$(curl -s --max-time 10 -b /tmp/ci-cookies.txt -X POST "$B/api/v1/tickets" \
            -H 'Content-Type: application/json' \
            -d "{\"subject\":\"CI smoke ticket\",\"description\":\"created by CI\",\"category_id\":\"$cat_id\",\"priority\":\"low\"}")
          tn=$(echo "$ticket" | sed -n 's/.*"tracking_number":"\([^"]*\)".*/\1/p')
          [ -n "$tn" ] || fail "could not create a ticket: $ticket"
          echo "ok  created $tn through the shipped image"

          # Read it back, which proves the write committed rather than merely
          # returning 200.
          tid=$(echo "$ticket" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          curl -s --max-time 10 -b /tmp/ci-cookies.txt "$B/api/v1/tickets/$tid" \
            | grep -q "CI smoke ticket" || fail "the ticket did not read back"

          # The admin-only warnings endpoint must answer. CI's own secrets
          # contain no placeholder marker, so the list comes back empty here;
          # the populated case is asserted in the example-env step below.
          curl -s --max-time 5 -b /tmp/ci-cookies.txt "$B/api/v1/admin/security-warnings" \
            | grep -q "insecure_secrets" || fail "security-warnings endpoint missing"

          # ── hold it under load for the rest of the window ──────────────────
          for i in $(seq 1 30); do
            st="$(docker inspect -f '{{.State.Status}}' ghd-ci-app)"
            [ "$st" = "running" ] || {
              docker inspect -f 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' ghd-ci-app
              fail "container left the running state after ${i}s (now: $st)"
            }
            [ "$(status /health)" = "200" ]      || fail "/health stopped responding at ${i}s"
            [ "$(status /api/v1/tickets)" = "401" ] || fail "/api/v1/tickets stopped requiring auth at ${i}s"
            [ "$(status /mcp/sse)" = "401" ]     || fail "/mcp/sse stopped requiring auth at ${i}s"
            sleep 1
          done

          # Still serving authenticated traffic at the end, not just liveness.
          curl -fsS --max-time 5 -b /tmp/ci-cookies.txt "$B/api/v1/me" >/dev/null \
            || fail "the session stopped working over the window"
          echo "ok  ran 30s under load, still serving authenticated requests"

      # The realistic first run: an operator copies the example env file. Its
      # SESSION_SECRET is 47 characters, so it clears the 32-character minimum
      # and the instance comes up — signed with a key published in this repo.
      # Assert the app says so loudly rather than starting quietly.
      - name: Warn when running on the example env file
        run: |
          set -euo pipefail

          if [ ! -f docker/.env ]; then
            echo "::warning::docker/.env absent — using docker/.env.example. An instance started this way is signed with PUBLISHED secrets and is forgeable by anyone who reads the repo."
            cp docker/.env.example docker/.env
          fi

          docker run -d --name ghd-ci-example --network ghd-ci \
            -e DATABASE_URL="postgres://helpdesk:helpdesk@ghd-ci-db:5432/helpdesk?sslmode=disable" \
            -e BASE_URL="http://localhost:8099" \
            -e SESSION_SECRET="$(grep '^SESSION_SECRET=' docker/.env | cut -d= -f2-)" \
            -e JWT_SECRET="$(grep '^JWT_SECRET=' docker/.env | cut -d= -f2-)" \
            ghd:ci
          sleep 10
          logs="$(docker logs ghd-ci-example 2>&1)"
          echo "$logs"

          # It must start — refusing to boot would be hostile to anyone trying
          # the project out — and it must complain at ERROR while doing so.
          [ "$(docker inspect -f '{{.State.Status}}' ghd-ci-example)" = "running" ] || {
            echo "::error::the example env file must still produce a running instance"
            exit 1
          }
          echo "$logs" | grep -q "INSECURE CONFIGURATION" || {
            echo "::error::started on the example env file with no insecure-configuration warning"
            exit 1
          }
          echo "$logs" | grep -q '"level":"ERROR"' || {
            echo "::error::the insecure-configuration warning was not logged at ERROR"
            exit 1
          }
          echo "ok  the example env file starts, and says it is insecure at ERROR"

      - name: Container logs
        if: always()
        run: docker logs ghd-ci-app 2>&1 | tail -40 || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f ghd-ci-app ghd-ci-db ghd-ci-example >/dev/null 2>&1 || true
          docker network rm ghd-ci >/dev/null 2>&1 || true
