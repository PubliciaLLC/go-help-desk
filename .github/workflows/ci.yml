name: CI

# Runs on pushes to the long-lived branches and on every pull request.
#
# Note the deliberate use of `pull_request` rather than `pull_request_target`:
# PRs from forks therefore run with a read-only GITHUB_TOKEN and no access to
# secrets. That is the point — this workflow executes contributor code, so it
# must not hold credentials a malicious PR could use.
#
# Job order mirrors the Dockerfile: the frontend is built first, and its dist/
# output is embedded into the Go binary by internal/ui (`//go:embed dist`).
# Without that directory present, `go build ./...` fails outright — so the
# backend job consumes the frontend's build artifact rather than guessing.

on:
  push:
    branches: [main, development]
  pull_request:

# Cancel superseded runs on the same ref, so a fast follow-up push doesn't
# queue behind the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (runs tsc -b, so this is also the type-check)
        run: npm run build

      - name: Upload dist for the backend embed
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  backend:
    name: Backend (build, vet, test)
    runs-on: ubuntu-latest
    needs: frontend

    # No `services:` block. The test database comes from
    # docker/docker-compose.test.yml, the same file developers run locally, so
    # the two cannot drift and a test run can never reach the dev database.
    # A service container could not express that file anyway: GitHub Actions
    # provides no way to override a service's command, and its settings are
    # command flags.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth for the toolchain version.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Fetch frontend dist for //go:embed
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/internal/ui/dist

      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: Verify go.mod and go.sum are tidy
        working-directory: backend
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' in backend/ and commit the result."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Unit tests
        working-directory: backend
        # Integration tests skip themselves when TEST_DATABASE_URL is unset, so
        # this step exercises pure logic only — and fails fast if that breaks.
        # Deliberately without -race: the integration step below runs the same
        # packages with it. The race detector costs roughly 8x on this suite
        # (16.9s vs 142.4s for internal/server), so running it twice doubled the
        # job for no extra coverage. What this step uniquely proves is that the
        # suite passes with no database configured.
        run: go test ./...

      - name: Start test database
        run: docker compose -f docker/docker-compose.test.yml up -d --wait

      - name: Integration tests (Postgres)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://helpdesk:helpdesk@127.0.0.1:5433/helpdesk_test?sslmode=disable
        run: go test -race ./...

      - name: Coverage report
        working-directory: backend
        # Advisory only: surfaces per-package coverage so a reviewer can see
        # whether a change moved the needle. Never gates the build.
        env:
          TEST_DATABASE_URL: postgres://helpdesk:helpdesk@127.0.0.1:5433/helpdesk_test?sslmode=disable
        run: |
          if go test -coverprofile=coverage.out ./... >/dev/null 2>&1 && [ -f coverage.out ]; then
            {
              echo "### Backend coverage (total and least-covered packages)"
              echo ""
              echo '```'
              go tool cover -func=coverage.out | tail -1
              echo ""
              go tool cover -func=coverage.out | sort -t$'\t' -k3 -n | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage profile unavailable; skipping report." >> "$GITHUB_STEP_SUMMARY"
          fi

  formatting:
    name: gofmt (changed files)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base commit to diff against.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Check formatting of changed Go files
        # Scoped to files this change touches. A repo-wide gate would fail on
        # pre-existing unformatted files unrelated to the PR; this keeps new
        # code clean without demanding a tree-wide cleanup first.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "Cannot resolve base ref '$base'; skipping."
            exit 0
          fi

          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.go' \
            | grep -v '^backend/internal/dbgen/' || true)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No Go files changed."
            exit 0
          fi

          unformatted="$(gofmt -l "${files[@]}" 2>/dev/null || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::These changed files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w $unformatted"
            exit 1
          fi
          echo "All ${#files[@]} changed Go file(s) are gofmt-clean."

  image:
    name: Docker image (build)
    runs-on: ubuntu-latest

    # Builds the runtime image the way docker-compose does: context at the repo
    # root, Dockerfile at backend/Dockerfile. Nothing else in CI exercises the
    # Dockerfile, which is how PR #55 shipped a `COPY certs/*` for a directory
    # that does not exist in the repo — every `docker build` failed from that
    # merge until it was reverted, and no check noticed.
    #
    # Build only; the image is not pushed anywhere.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
