name: CI

# Runs on pushes to the long-lived branches and on every pull request.
#
# Note the deliberate use of `pull_request` rather than `pull_request_target`:
# PRs from forks therefore run with a read-only GITHUB_TOKEN and no access to
# secrets. That is the point — this workflow executes contributor code, so it
# must not hold credentials a malicious PR could use.
#
# Job order mirrors the Dockerfile: the frontend is built first, and its dist/
# output is embedded into the Go binary by internal/ui (`//go:embed dist`).
# Without that directory present, `go build ./...` fails outright — so the
# backend job consumes the frontend's build artifact rather than guessing.

on:
  push:
    branches: [main, development]
  pull_request:

# Cancel superseded runs on the same ref, so a fast follow-up push doesn't
# queue behind the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (runs tsc -b, so this is also the type-check)
        run: npm run build

      - name: Upload dist for the backend embed
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  backend:
    name: Backend (build, vet, test)
    runs-on: ubuntu-latest
    needs: frontend

    # No `services:` block. The test database comes from
    # docker/docker-compose.test.yml, the same file developers run locally, so
    # the two cannot drift and a test run can never reach the dev database.
    # A service container could not express that file anyway: GitHub Actions
    # provides no way to override a service's command, and its settings are
    # command flags.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth for the toolchain version.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Fetch frontend dist for //go:embed
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/internal/ui/dist

      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: Verify go.mod and go.sum are tidy
        working-directory: backend
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' in backend/ and commit the result."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Unit tests
        working-directory: backend
        # Integration tests skip themselves when TEST_DATABASE_URL is unset, so
        # this step exercises pure logic only — and fails fast if that breaks.
        # Deliberately without -race: the integration step below runs the same
        # packages with it. The race detector costs roughly 8x on this suite
        # (16.9s vs 142.4s for internal/server), so running it twice doubled the
        # job for no extra coverage. What this step uniquely proves is that the
        # suite passes with no database configured.
        run: go test ./...

      - name: Start test database
        run: docker compose -f docker/docker-compose.test.yml up -d --wait

      - name: Integration tests (Postgres)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://helpdesk:helpdesk@127.0.0.1:5433/helpdesk_test?sslmode=disable
        run: go test -race ./...

      - name: Coverage report
        working-directory: backend
        # Advisory only: surfaces per-package coverage so a reviewer can see
        # whether a change moved the needle. Never gates the build.
        env:
          TEST_DATABASE_URL: postgres://helpdesk:helpdesk@127.0.0.1:5433/helpdesk_test?sslmode=disable
        run: |
          if go test -coverprofile=coverage.out ./... >/dev/null 2>&1 && [ -f coverage.out ]; then
            {
              echo "### Backend coverage (total and least-covered packages)"
              echo ""
              echo '```'
              go tool cover -func=coverage.out | tail -1
              echo ""
              go tool cover -func=coverage.out | sort -t$'\t' -k3 -n | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage profile unavailable; skipping report." >> "$GITHUB_STEP_SUMMARY"
          fi

  formatting:
    name: gofmt (changed files)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base commit to diff against.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Check formatting of changed Go files
        # Scoped to files this change touches. A repo-wide gate would fail on
        # pre-existing unformatted files unrelated to the PR; this keeps new
        # code clean without demanding a tree-wide cleanup first.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "Cannot resolve base ref '$base'; skipping."
            exit 0
          fi

          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.go' \
            | grep -v '^backend/internal/dbgen/' || true)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No Go files changed."
            exit 0
          fi

          unformatted="$(gofmt -l "${files[@]}" 2>/dev/null || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::These changed files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w $unformatted"
            exit 1
          fi
          echo "All ${#files[@]} changed Go file(s) are gofmt-clean."

  image:
    name: Docker image (build + run)
    runs-on: ubuntu-latest

    # Builds the runtime image the way docker-compose does: context at the repo
    # root, Dockerfile at backend/Dockerfile. Nothing else in CI exercises the
    # Dockerfile, which is how PR #55 shipped a `COPY certs/*` for a directory
    # that does not exist in the repo — every `docker build` failed from that
    # merge until it was reverted, and no check noticed.
    #
    # Build only; the image is not pushed anywhere.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          # load so the smoke test below can actually run the thing. Without
          # it buildx leaves the image in its own cache and `docker run` fails.
          load: true
          tags: ghd:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building an image proves it compiles, not that it starts. Issue #43 was
      # a build failure; the class of problem it belongs to — a container that
      # builds and then dies, or starts and serves nothing — was invisible to
      # CI until here.
      - name: Start Postgres for the smoke test
        run: |
          docker network create ghd-ci
          docker run -d --name ghd-ci-db --network ghd-ci \
            -e POSTGRES_DB=helpdesk -e POSTGRES_USER=helpdesk -e POSTGRES_PASSWORD=helpdesk \
            postgres:17-alpine
          for i in $(seq 1 60); do
            docker exec ghd-ci-db pg_isready -U helpdesk >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Run the image and smoke-test it
        run: |
          set -euo pipefail

          docker run -d --name ghd-ci-app --network ghd-ci -p 8088:8080 \
            -e DATABASE_URL="postgres://helpdesk:helpdesk@ghd-ci-db:5432/helpdesk?sslmode=disable" \
            -e BASE_URL="http://localhost:8088" \
            -e SESSION_SECRET="ci-smoke-test-session-secret-32-chars" \
            -e JWT_SECRET="ci-smoke-test-jwt-secret-32-characters" \
            ghd:ci

          # Wait for it to serve, and fail with logs rather than a bare timeout.
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:8088/health >/dev/null 2>&1; then
              ready=1; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' ghd-ci-app)" != "true" ]; then
              echo "::error::the container exited before serving"
              docker logs ghd-ci-app
              exit 1
            fi
            sleep 1
          done
          if [ "${ready:-0}" != "1" ]; then
            echo "::error::/health never responded"
            docker logs ghd-ci-app
            exit 1
          fi

          check() { # path, expected status, description
            actual="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:8088$1")"
            if [ "$actual" != "$2" ]; then
              echo "::error::$3: GET $1 returned $actual, expected $2"
              docker logs ghd-ci-app
              exit 1
            fi
            echo "ok  $1 -> $actual  ($3)"
          }

          check /health          200 "health endpoint"
          check /api/v1/site     200 "public site config"
          check /                200 "SPA shell"

          # Regression guard on the fix in #80, asserted against the artifact
          # that actually ships. /mcp/ was mounted outside the auth chain and
          # served every tool to anyone who could reach the port.
          check /mcp/sse         401 "MCP must reject unauthenticated callers"

          # The embedded SPA must be the real build, not the placeholder that
          # exists so //go:embed resolves in a fresh checkout.
          #
          # Fetch to a file first. Piping curl into grep passes when curl
          # FAILS — grep finds nothing in an empty stream and the check reads
          # as success — so a dead server would have looked like a good SPA.
          curl -fsS --max-time 5 http://127.0.0.1:8088/ -o /tmp/spa.html || {
            echo "::error::could not fetch the SPA shell"
            docker logs ghd-ci-app
            exit 1
          }
          if grep -q "Frontend not built" /tmp/spa.html; then
            echo "::error::the image embeds the placeholder, not the built SPA"
            exit 1
          fi
          grep -qi "<div id=\"root\"" /tmp/spa.html || {
            echo "::error::the SPA shell has no mount point; embedded assets look wrong"
            head -40 /tmp/spa.html
            exit 1
          }
          echo "ok  /  serves the built SPA"

      # A misconfigured instance must fail loudly at startup rather than come
      # up half-working. SESSION_SECRET under 32 characters is the likeliest
      # upgrade failure, since the pre-1.1.1 example value was 24.
      - name: Reject a short SESSION_SECRET
        run: |
          set -uo pipefail
          out="$(docker run --rm --network ghd-ci \
            -e DATABASE_URL="postgres://helpdesk:helpdesk@ghd-ci-db:5432/helpdesk?sslmode=disable" \
            -e BASE_URL="http://localhost:8088" \
            -e SESSION_SECRET="too-short" \
            -e JWT_SECRET="ci-smoke-test-jwt-secret-32-characters" \
            ghd:ci 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "SESSION_SECRET must be at least 32 characters" || {
            echo "::error::a short SESSION_SECRET did not produce the documented error"
            exit 1
          }
          echo "$out" | grep -q '"level":"ERROR"' || {
            echo "::error::a fatal startup failure was not logged at ERROR level"
            exit 1
          }

      - name: Container logs
        if: always()
        run: docker logs ghd-ci-app 2>&1 | tail -40 || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f ghd-ci-app ghd-ci-db >/dev/null 2>&1 || true
          docker network rm ghd-ci >/dev/null 2>&1 || true
