name: Deploy to vinnie

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - docker/**
      - go.mod
      - go.sum

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VINNIE_HOST }}
          username: ${{ secrets.VINNIE_USER }}
          key: ${{ secrets.VINNIE_SSH_KEY }}
          script: |
            cd ~/docker/gohelpdesk/docker
            git -C ~/docker/gohelpdesk pull
            docker compose up -d --build
